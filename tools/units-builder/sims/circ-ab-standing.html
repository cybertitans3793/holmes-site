<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standing Waves</title>
<!-- Standing Waves: original Holmes Sims, built from frame.html + standing.js. g = 10 m/s². -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Space Grotesk",system-ui,sans-serif;color:#111}
#app{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0;padding:10px 14px 12px;box-sizing:border-box;
  display:grid;grid-template-columns:600px 1fr;grid-template-rows:34px 330px 1fr;gap:10px 14px}
#bar{grid-column:1/-1;display:flex;gap:16px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.seg{display:flex;align-items:center}
.seg .lab{font:700 12px "IBM Plex Mono",monospace;margin-right:8px;text-transform:uppercase}
.seg button{white-space:nowrap;font:700 14px "Space Grotesk",sans-serif;padding:6px 11px;border:2px solid #111;background:#fff;color:#111;cursor:pointer}
.seg button+button{margin-left:-2px}
.seg button[aria-pressed="true"]{background:#111;color:#fff}
.seg button:hover:not([aria-pressed="true"]){background:#ffe2d3}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ff6a2b;outline-offset:2px;position:relative;z-index:1}
#cv{border:2px solid #111;background:#fbfbfb;width:600px;height:330px;box-sizing:border-box;display:block}
#work{border:2px solid #111;padding:8px 12px 10px;overflow:auto;font-size:14px;line-height:1.55;box-sizing:border-box}
#work .wt{font:700 12px "IBM Plex Mono",monospace;text-transform:uppercase;margin:0 0 4px;display:flex;justify-content:space-between}
#work .wt .hint{text-transform:none}
#work h4{margin:9px 0 1px;font-size:13px;font-weight:700;color:#4a4a4a}
#work h4:first-of-type{margin-top:2px}
#work .eq{font-variant-numeric:tabular-nums}
#work .n{font-family:"IBM Plex Mono",monospace;font-size:13px}
#work b .n,#work .ans{font-weight:700}
#work .note{font-size:12.5px;color:#4a4a4a;margin:2px 0 0}
#work .ok{background:#e5f4ea;border-left:4px solid #1e7d45;padding:3px 8px;margin-top:4px}
#work .bad{background:#fde7df;border-left:4px solid #c43a00;padding:3px 8px;margin-top:4px}
.ivv{border-radius:2px;padding:0 2px;transition:background .25s}
.ivv.gx{background:#ffe2d3}
.ivv.hot{background:#ff6a2b;color:#fff}
#ctl{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;align-content:start}
.iv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:6px}
.iv .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iv .val{font:700 13px "IBM Plex Mono",monospace;white-space:nowrap}
.iv input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:#111;height:22px}
.iv input[type=radio]{accent-color:#ff6a2b;margin:0}
#presets{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
#presets .lab{font:700 12px "IBM Plex Mono",monospace}
#presets button{font:600 12.5px "Space Grotesk",sans-serif;padding:3px 8px;border:2px solid #111;background:#fff;cursor:pointer}
#presets button:hover{background:#ffe2d3}
#gcard{border:2px solid #111;padding:5px 8px 6px;display:flex;flex-direction:column;box-sizing:border-box;min-height:0}
.ghead{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.ghead select{font:600 13px "Space Grotesk",sans-serif;border:2px solid #111;padding:1px 4px;max-width:200px}
#gv{width:340px;height:150px;flex:none;display:block;margin-top:3px}
#dbl{font-size:12.5px;line-height:1.35;margin-top:2px}
#dbl b{font-weight:700}
.hint{font:500 11px "IBM Plex Mono",monospace;color:#4a4a4a}
</style></head><body>
<div id="app">
  <div id="bar"></div>
  <canvas id="cv" width="1200" height="660" aria-label="Animation of the situation with force arrows"></canvas>
  <div id="work" aria-live="polite"></div>
  <div id="ctl"></div>
  <div id="gcard">
    <div class="ghead"><span>Graph</span><select id="dvsel" aria-label="Quantity to graph"></select><span>vs <b id="ivname"></b></span></div>
    <canvas id="gv" width="680" height="300" aria-label="Graph of the chosen quantity against the chosen variable"></canvas>
    <div id="dbl"></div>
  </div>
</div>
<script>
// ---------------- shared frame ----------------
const $ = id => document.getElementById(id);
const G10 = 10, PI = Math.PI, DEG = PI / 180;
function fit(){ const s = Math.min(innerWidth / 1000, innerHeight / 640); $('app').style.transform = 'scale(' + s + ')'; }
addEventListener('resize', fit); fit();

function fnum(x){ const r = fnum0(x); return typeof r === 'string' ? r.replace(/^-/, '−') : r; }
function fnum0(x){
  if (x === null || x === undefined || !isFinite(x)) return '—';
  const a = Math.abs(x);
  if (a === 0) return '0';
  if (a >= 1e5 || a < 1e-3){
    const e = Math.floor(Math.log10(a)); let m = x / Math.pow(10, e);
    let ms = m.toFixed(2); if (Math.abs(+ms) >= 10){ m /= 10; ms = m.toFixed(2); return ms + '×10<sup>' + (e + 1) + '</sup>'; }
    return ms + '×10<sup>' + e + '</sup>';
  }
  if (a >= 1000) return String(Math.round(x));
  return x.toPrecision(3);
}
function fplain(x){ return fnum(x).replace(/<sup>(.*?)<\/sup>/g, (m, e) => '^' + e).replace('×10^', 'e'); }
const H = {
  n: (x, u) => '<span class="n">' + fnum(x) + (u ? '&nbsp;' + u : '') + '</span>',
  iv: id => { const d = S.def[id]; const val = S.v[id]; const txt = (d.show ? d.show(val) : fnum(val) + (d.unit ? '&nbsp;' + d.unit : ''));
              return '<span class="ivv n' + (S.gx === id ? ' gx' : '') + (S.hot === id ? ' hot' : '') + '" data-iv="' + id + '">' + txt + '</span>'; },
  g: () => '<span class="n">10&nbsp;m/s²</span>',
  p: (x, u) => x < 0 ? '(' + H.n(x, u) + ')' : H.n(x, u)
};

const S = { mode: null, opt: {}, v: {}, store: {}, def: {}, ivs: [], gx: null, dv: null, hot: null, t: 0, anim: {} };

function bar(){
  const b = $('bar'); b.innerHTML = '';
  const group = (label, items, cur, onpick) => {
    const g = document.createElement('div'); g.className = 'seg'; g.setAttribute('role', 'group');
    if (label){ const l = document.createElement('span'); l.className = 'lab'; l.textContent = label; g.appendChild(l); }
    items.forEach(([id, txt]) => { const bt = document.createElement('button'); bt.textContent = txt; bt.setAttribute('aria-pressed', String(id === cur)); bt.onclick = () => onpick(id); g.appendChild(bt); });
    b.appendChild(g);
  };
  const tip = document.createElement('span'); tip.className = 'hint'; tip.style.marginLeft = 'auto'; tip.style.whiteSpace = 'nowrap'; tip.innerHTML = '● = the variable on the graph’s x-axis · drag any slider';
  if (SIM.modes && SIM.modes.length > 1) group(null, SIM.modes.map(m => [m.id, m.label]), S.mode, id => { S.mode = id; S.anim = {}; setup(); });
  (SIM.opts || []).filter(o => !o.modes || o.modes.includes(S.mode)).forEach(o => {
    if (!(o.id in S.opt)) S.opt[o.id] = o.choices[0][0];
    group(o.label, o.choices, S.opt[o.id], id => { S.opt[o.id] = id; S.anim = {}; setup(); });
  });
  if (!SIM.noGraph) b.appendChild(tip);
  if (b.scrollWidth > b.clientWidth + 1) tip.remove();
  if (b.scrollWidth > b.clientWidth + 1) b.querySelectorAll('.seg button').forEach(x => { x.style.fontSize = '13px'; x.style.padding = '6px 8px'; });
}

function setup(){
  if (SIM.noGraph){ $('gcard').style.display = 'none'; $('cv').style.gridArea = '2 / 1 / 3 / 2'; $('work').style.gridArea = '2 / 2 / 4 / 3'; $('ctl').style.gridArea = '3 / 1 / 4 / 2'; }
  bar();
  S.ivs = SIM.ivs(S.mode, S.opt); S.def = {}; S.v = {};
  S.ivs.forEach(d => { S.def[d.id] = d; const k = S.mode + ':' + d.id; S.v[d.id] = (k in S.store) ? S.store[k] : d.val; });
  if (!S.gx || !S.def[S.gx]) S.gx = S.ivs.find(d => d.graph) ? S.ivs.find(d => d.graph).id : S.ivs[1] ? S.ivs[1].id : S.ivs[0].id;
  const c = $('ctl'); c.innerHTML = '';
  S.ivs.forEach(d => {
    const w = document.createElement('div'); w.className = 'iv';
    w.innerHTML = '<input type="radio" name="gx"' + (SIM.noGraph ? ' style="display:none"' : '') + ' value="' + d.id + '" aria-label="Graph against ' + d.label + '" title="Put this on the graph’s x-axis"' + (S.gx === d.id ? ' checked' : '') + '>' +
      '<span class="nm">' + d.label + ' <i>' + d.sym + '</i></span><span class="val" id="val-' + d.id + '"></span>' +
      '<input type="range" id="r-' + d.id + '" min="' + d.min + '" max="' + d.max + '" step="' + d.step + '" value="' + S.v[d.id] + '" aria-label="' + d.label + '">';
    c.appendChild(w);
    const r = w.querySelector('input[type=range]');
    r.oninput = () => { S.v[d.id] = +r.value; S.store[S.mode + ':' + d.id] = +r.value; S.hot = d.id; clearTimeout(S.hotT); S.hotT = setTimeout(() => { S.hot = null; update(); }, 700); S.anim.reset = true; update(); };
    w.querySelector('input[type=radio]').onchange = () => { S.gx = d.id; update(); };
  });
  if (SIM.presets){
    const p = document.createElement('div'); p.id = 'presets'; p.innerHTML = '<span class="lab">Try:</span>';
    SIM.presets.forEach(ps => { const bt = document.createElement('button'); bt.textContent = ps.label; bt.onclick = () => { if (ps.mode && ps.mode !== S.mode){ S.mode = ps.mode; } Object.entries(ps.v).forEach(([k, val]) => S.store[(ps.mode || S.mode) + ':' + k] = val); S.anim = {}; setup(); }; p.appendChild(bt); });
    c.appendChild(p);
  }
  const dvs = SIM.dvs(S.mode, S.opt), sel = $('dvsel');
  if (!S.dv || !dvs.find(d => d.id === S.dv)) S.dv = dvs[0].id;
  sel.innerHTML = dvs.map(d => '<option value="' + d.id + '"' + (d.id === S.dv ? ' selected' : '') + '>' + d.name + '</option>').join('');
  sel.onchange = () => { S.dv = sel.value; update(); };
  update();
}

function calcWith(over){ const v = Object.assign({}, S.v, over || {}); return SIM.calc(v, S.mode, S.opt); }

function update(){
  S.ivs.forEach(d => { $('val-' + d.id).innerHTML = d.show ? d.show(S.v[d.id]) : fnum(S.v[d.id]) + (d.unit ? '&nbsp;' + d.unit : ''); });
  S.d = calcWith();
  $('work').innerHTML = '<div class="wt"><span>Show the work</span><span class="hint">' + (SIM.hint || 'g = 10 m/s²') + '</span></div>' + (SIM.strip ? SIM.strip(SIM.work(S.v, S.d, S.mode, S.opt)) : SIM.work(S.v, S.d, S.mode, S.opt));
  document.querySelectorAll('input[name=gx]').forEach(r => r.checked = (r.value === S.gx));
  graph();
}

function graph(){
  if (SIM.noGraph) return;
  const cv = $('gv'), g = cv.getContext('2d'), W = 340, Hh = 150; g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, W, Hh);
  const dvs = SIM.dvs(S.mode, S.opt), dv = dvs.find(d => d.id === S.dv), ref = dv.vs ? dvs.find(d => d.id === dv.vs) : null;
  const x = S.def[S.gx]; $('ivname').innerHTML = '<i>' + x.sym + '</i>' + (x.unit && !x.show ? ' (' + x.unit + ')' : '');
  const N = 160, xs = [], ys = [], rs = [];
  for (let i = 0; i <= N; i++){ const xv = x.min + (x.max - x.min) * i / N; const d = calcWith({ [S.gx]: xv }); xs.push(xv); ys.push(dv.f(d)); rs.push(ref ? ref.f(d) : null); }
  const all = ys.concat(ref ? rs : []).filter(isFinite);
  let ymin = Math.min(0, ...all), ymax = Math.max(...all, 0); if (ymax === ymin) ymax = ymin + 1; const pad = (ymax - ymin) * 0.08; ymax += pad; if (ymin < 0) ymin -= pad;
  const L = 46, R = 8, T = 8, B = 22, X = v => L + (v - x.min) / (x.max - x.min) * (W - L - R), Y = v => T + (ymax - v) / (ymax - ymin) * (Hh - T - B);
  g.strokeStyle = '#111'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(L, T); g.lineTo(L, Hh - B); g.lineTo(W - R, Hh - B); g.stroke();
  if (ymin < 0){ g.strokeStyle = '#999'; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(W - R, Y(0)); g.stroke(); g.setLineDash([]);
    if (dv.negNote){ g.fillStyle = 'rgba(196,58,0,0.08)'; g.fillRect(L, Y(0), W - R - L, Hh - B - Y(0)); g.fillStyle = '#c43a00'; g.font = '600 10px "Space Grotesk",sans-serif'; g.textAlign = 'left'; g.fillText(dv.negNote, L + 4, Hh - B - 4); } }
  g.font = '500 10px "IBM Plex Mono",monospace'; g.fillStyle = '#4a4a4a'; g.textAlign = 'right';
  g.fillText(fplain(ymax), L - 4, T + 8); g.fillText(fplain(ymin < 0 ? ymin : 0), L - 4, Hh - B); if (ymin < 0) g.fillText('0', L - 4, Y(0) + 3);
  g.textAlign = 'center'; g.fillText(fplain(x.min), L, Hh - 8); g.fillText(fplain(x.max), W - R - 10, Hh - 8);
  g.fillText((x.symText || x.id) + (x.unit ? ' (' + x.unit + ')' : ''), (L + W) / 2, Hh - 8);
  g.save(); g.translate(10, (T + Hh - B) / 2); g.rotate(-PI / 2); g.textAlign = 'center'; g.fillText(dv.short + (dv.unit ? ' (' + dv.unit + ')' : ''), 0, 0); g.restore();
  const line = (arr, col, dash) => { g.strokeStyle = col; g.lineWidth = 2.2; g.setLineDash(dash || []); g.beginPath(); let on = false; arr.forEach((y, i) => { if (!isFinite(y)){ on = false; return; } const px = X(xs[i]), py = Math.max(T - 4, Math.min(Hh - B + 4, Y(y))); on ? g.lineTo(px, py) : g.moveTo(px, py); on = true; }); g.stroke(); g.setLineDash([]); };
  if (ref){ line(rs, '#4a4a4a', [5, 4]); g.fillStyle = '#4a4a4a'; g.textAlign = 'right'; g.font = '600 10px "Space Grotesk",sans-serif'; const lastY = rs.filter(isFinite).pop(); if (isFinite(lastY)) g.fillText(ref.short, W - R - 2, Math.max(T + 9, Y(lastY) - 4)); }
  line(ys, '#1546d6');
  const cx = S.v[S.gx], cy = dv.f(S.d);
  if (isFinite(cy)){ g.strokeStyle = '#ff6a2b'; g.setLineDash([2, 3]); g.lineWidth = 1; g.beginPath(); g.moveTo(X(cx), Hh - B); g.lineTo(X(cx), Y(cy)); g.lineTo(L, Y(cy)); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#ff6a2b'; g.strokeStyle = '#111'; g.lineWidth = 1.5; g.beginPath(); g.arc(X(cx), Math.max(T, Math.min(Hh - B, Y(cy))), 4.5, 0, 7); g.fill(); g.stroke(); }
  // doubling readout
  const d2 = calcWith({ [S.gx]: cx * 2 }), y1 = dv.f(S.d), y2 = dv.f(d2);
  let msg = '';
  if (cx === 0 || Math.abs(y1) < 1e-12) msg = '<span class="hint">Move off zero to see the ×2 test.</span>';
  else if (!isFinite(y1) || !isFinite(y2)) msg = '<span class="hint">The ×2 test doesn’t apply here (doubling takes it outside what this quantity covers).</span>';
  else {
    const k = y2 / y1;
    if (k < 0){ $('dbl').innerHTML = 'If <b>' + x.sym + '</b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '</b> goes from ' + fnum(y1) + ' to ' + fnum(y2) + (dv.unit ? ' ' + dv.unit : '') + (dv.signOK ? ': it changes sign. ' + dv.signOK : ': it changes sign, so that can’t really happen.'); return; }
    const tags = [[1, 'doesn’t depend on it'], [2, 'proportional'], [4, 'goes as the square'], [0.5, 'inversely proportional'], [0.25, 'inverse square'], [Math.SQRT2, 'goes as the square root'], [Math.SQRT1_2, 'goes as 1/√'], [8, 'goes as the cube'], [2 * Math.SQRT2, 'goes as the 3/2 power']];
    const tag = tags.find(([v]) => Math.abs(k - v) < 0.004 * v);
    msg = 'If <b>' + x.sym + '</b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '</b> becomes <b>×' + (Math.abs(k) >= 100 ? fnum(k) : k.toFixed(2)) + '</b>' + (tag && !dv.noTag ? ' — ' + tag[1] : '') + '.' + (dv.dblNote ? ' <span class="hint">' + dv.dblNote + '</span>' : '');
  }
  $('dbl').innerHTML = msg;
}

// drawing helpers (canvas is drawn in 600×330 units)
const cv = $('cv'), ctx = cv.getContext('2d');
function arrow(x1, y1, x2, y2, col, label, opts){
  opts = opts || {}; const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy); if (len < 2) return;
  const ux = dx / len, uy = dy / len, hw = opts.head || 9;
  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = opts.w || 3.5; ctx.lineCap = 'round';
  if (opts.dash) ctx.setLineDash(opts.dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hw * 0.8, y2 - uy * hw * 0.8); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - ux * hw - uy * hw * 0.55, y2 - uy * hw + ux * hw * 0.55); ctx.lineTo(x2 - ux * hw + uy * hw * 0.55, y2 - uy * hw - ux * hw * 0.55); ctx.closePath(); ctx.fill();
  if (label){ ctx.font = '700 13px "Space Grotesk",sans-serif'; ctx.textAlign = opts.align || 'left'; ctx.textBaseline = 'middle';
    const lx = x2 + (opts.lx !== undefined ? opts.lx : (ux >= 0 ? 6 : -6)), ly = y2 + (opts.ly !== undefined ? opts.ly : (uy >= 0 ? 10 : -10));
    if (opts.align === undefined) ctx.textAlign = ux >= -0.2 ? 'left' : 'right';
    ctx.fillText(label, lx, ly); }
  ctx.restore();
}
function text(s, x, y, o){ o = o || {}; ctx.save(); ctx.font = (o.font || '600 13px "Space Grotesk",sans-serif'); ctx.fillStyle = o.col || '#111'; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic'; ctx.fillText(s, x, y); ctx.restore(); }
function panelTitle(s, x, y){ text(s, x, y, { font: '700 11px "IBM Plex Mono",monospace', col: '#4a4a4a' }); }
const COL = { F: '#c43a00', W: '#111', N: '#1e7d45', V: '#1546d6', T: '#7a3fb0', comp: '#8a8a8a' };

let last = 0;
function loop(ts){ const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts; S.t += dt;
  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, 600, 330);
  SIM.draw(S.v, S.d, S.mode, S.opt, S.t, dt, S.anim); S.anim.reset = false;
  requestAnimationFrame(loop); }

// ---------------- this sim ----------------
// Standing Waves (AP 14.6, IB C.4): strings and pipes with every pair of boundary conditions, harmonics, nodes and antinodes, and the resonance-tube lab (find the speed of sound).
const SIM = {
  title: 'Standing Waves',
  hint: 'v = fλ · N = node, A = antinode',
  modes: [{ id: 'string', label: 'Strings' }, { id: 'pipe', label: 'Pipes' }, { id: 'tube', label: 'Resonance tube lab' }, { id: 'micro', label: 'Microwave oven' }],
  opts: [{ id: 'se', label: 'Ends', modes: ['string'], choices: [['ff', 'Fixed–fixed'], ['fr', 'Fixed–free'], ['rr', 'Free–free']] },
    { id: 'pe', label: 'Ends', modes: ['pipe'], choices: [['oo', 'Open–open'], ['co', 'Closed–open'], ['cc', 'Closed–closed']] }],
  ivs(mode){
    if (mode === 'micro') return [
      { id: 'fg', sym: 'f', symText: 'f', label: 'Oven frequency (on the label)', unit: 'GHz', min: 2.4, max: 2.5, step: 0.005, val: 2.45 },
      { id: 'g', sym: 'Δx', symText: 'Δx', label: 'Your measured gap between melted spots', unit: 'cm', min: 4, max: 8, step: 0.1, val: 6.0, graph: true }];
    if (mode === 'tube') return [
      { id: 'f', sym: 'f', symText: 'f', label: 'Tuning fork', unit: 'Hz', min: 256, max: 1024, step: 1, val: 512 },
      { id: 'La', sym: 'L', symText: 'L', label: 'Length of air column (raise or lower the tube)', unit: 'cm', min: 5, max: 100, step: 0.2, val: 20, graph: true },
      { id: 'vs', sym: 'v', symText: 'v', label: 'Speed of sound (the answer!)', unit: 'm/s', min: 320, max: 360, step: 1, val: 343 }];
    return [
      { id: 'm', sym: 'm', symText: 'm', label: 'Mode (1st, 2nd, 3rd possible pattern)', unit: '', min: 1, max: 5, step: 1, val: 1, show: x => String(x) },
      { id: 'L', sym: 'L', symText: 'L', label: mode === 'pipe' ? 'Pipe length' : 'String length', unit: 'm', min: 0.2, max: 2, step: 0.01, val: mode === 'pipe' ? 0.5 : 0.65, graph: true },
      { id: 'v', sym: 'v', symText: 'v', label: mode === 'pipe' ? 'Speed of sound' : 'Wave speed on the string', unit: 'm/s', min: mode === 'pipe' ? 300 : 50, max: mode === 'pipe' ? 400 : 500, step: 1, val: mode === 'pipe' ? 340 : 250 }];
  },
  presets: [{ label: 'Guitar string', mode: 'string', v: { m: 1, L: 0.65, v: 285 } }, { label: 'Next harmonic', mode: 'string', v: { m: 2 } }, { label: 'Clarinet (closed–open)', mode: 'pipe', v: { m: 1, L: 0.6, v: 340 } }, { label: 'First resonance', mode: 'tube', v: { La: 16.7 } }],
  calc(v, mode, opt){
    if (mode === 'micro'){ const lam = 3e8 / (v.fg * 1e9); return { lam, gapTrue: lam / 2, c: 2 * (v.g / 100) * v.fg * 1e9 }; }
    if (mode === 'tube'){ const lam = v.vs / v.f, L = v.La / 100, ns = [1, 3, 5, 7].map(k => k * lam / 4), near = ns.reduce((a, b) => Math.abs(b - L) < Math.abs(a - L) ? b : a), off = (L - near) / lam;
      const loud = 1 / (1 + Math.pow(off / 0.03, 2)); return { lam, ns, near, loud, k: Math.round(4 * near / lam) }; }
    const ends = mode === 'pipe' ? (opt.pe || 'oo') : (opt.se || 'ff'), asym = ends === 'fr' || ends === 'co';
    const n = asym ? 2 * v.m - 1 : v.m, lam = asym ? 4 * v.L / n : 2 * v.L / n, f = v.v / lam, f1 = asym ? v.v / (4 * v.L) : v.v / (2 * v.L);
    // displacement node at fixed string end / closed pipe end
    const nodeAt0 = ends === 'ff' || ends === 'fr' || ends === 'cc' || ends === 'co';
    return { ends, asym, n, lam, f, f1, nodeAt0 };
  },
  dvs(mode){
    if (mode === 'micro') return [{ id: 'c', name: 'Speed of light from your measurement', short: 'c', sym: 'c', unit: 'm/s', f: d => d.c }];
    if (mode === 'tube') return [{ id: 'loud', name: 'Loudness (resonance)', short: 'loud', sym: 'loudness', unit: '', f: d => d.loud }];
    return [{ id: 'f', name: 'Frequency', short: 'f', sym: 'f', unit: 'Hz', f: d => d.f }, { id: 'lam', name: 'Wavelength', short: 'λ', sym: 'λ', unit: 'm', f: d => d.lam }];
  },
  work(v, d, mode){
    if (mode === 'micro') return '<h4>1 · A standing wave inside the oven</h4><div class="eq">Microwaves reflect off the metal walls. The waves going each way make a standing wave: hot spots (antinodes) and cold spots (nodes). Take the turntable out so the food stays still.</div>' +
      '<h4>2 · Hot spots are half a wavelength apart</h4><div class="eq">Each wavelength has two antinodes, so the gap between melted spots is λ/2. Measure it on the ruler: Δx = ' + H.iv('g') + ' → λ = 2Δx = ' + H.n(2 * v.g, 'cm') + '</div>' +
      '<h4>3 · Speed of light</h4><div class="eq">c = fλ = (' + H.iv('fg') + ')(' + fnum(2 * v.g / 100) + ' m) = <b>' + H.n(d.c, 'm/s') + '</b> (accepted 3.00×10⁸ m/s, ' + fnum(Math.abs(d.c - 3e8) / 3e8 * 100) + '% off)</div>' +
      '<p class="note">Read the real gap off the ruler under the bar, then set the slider to it. Lab tip: measure across several spots and divide, and use chocolate, cheese or marshmallows on a plate for about 20 s. The turntable is there to move food through the hot spots so it heats evenly.</p>';
    if (mode === 'tube') return '<h4>1 · The set-up</h4><div class="eq">A tube in water: closed at the water surface, open at the top. Closed end = displacement node; open end = antinode. So resonance needs L = λ/4, 3λ/4, 5λ/4, …</div>' +
      '<h4>2 · Where it should be loud</h4><div class="eq">λ = v/f = ' + H.iv('vs') + '/' + H.iv('f') + ' = ' + H.n(d.lam * 100, 'cm') + ' → L = ' + d.ns.slice(0, 3).map(x => fnum(x * 100) + ' cm').join(', ') + ' …</div>' +
      '<h4>3 · The lab trick</h4><div class="eq">Successive loud lengths differ by <b>λ/2 = ' + H.n(d.lam * 50, 'cm') + '</b>. Measure two of them, double the gap to get λ, then v = fλ. No end correction needed!</div>' +
      '<p class="note">Right now: ' + (d.loud > 0.6 ? '<b>resonance!</b> L ≈ ' + d.k + 'λ/4.' : 'quiet. Move the tube until it gets loud.') + ' Pretend v is unknown: hide the value and find it from your two lengths.</p>';
    const what = mode === 'pipe' ? { oo: 'Open end = displacement <b>antinode</b> at both ends.', co: 'Closed end = displacement <b>node</b>; open end = <b>antinode</b>.', cc: 'Closed end = displacement <b>node</b> at both ends.' }[d.ends]
      : { ff: 'Fixed end = <b>node</b> at both ends.', fr: 'Fixed end = <b>node</b>; free end = <b>antinode</b>.', rr: 'Free end = <b>antinode</b> at both ends.' }[d.ends];
    return '<h4>1 · Boundary conditions</h4><div class="eq">' + what + '</div>' +
      '<h4>2 · Fit the wave in</h4><div class="eq">' + (d.asym ? 'One node and one antinode: L = nλ/4 with n odd only (1, 3, 5, …).' : 'Same kind at both ends: L = nλ/2 with n = 1, 2, 3, …') + '<br>Harmonic n = <b>' + d.n + '</b>: λ = ' + (d.asym ? '4L/n' : '2L/n') + ' = <b>' + H.n(d.lam, 'm') + '</b></div>' +
      '<h4>3 · Frequency</h4><div class="eq">f = v/λ = ' + H.iv('v') + '/' + fnum(d.lam) + ' m = <b>' + H.n(d.f, 'Hz') + '</b> = ' + d.n + ' × f₁ (f₁ = ' + fnum(d.f1) + ' Hz)</div>' +
      '<p class="note">' + (d.asym ? 'Only odd harmonics exist, so this ' + (mode === 'pipe' ? 'pipe' : 'string') + ' has no 2nd harmonic. ' : '') + 'Points between neighbouring nodes move in phase; points on either side of a node are in antiphase. ' + (mode === 'pipe' ? 'For pipes the pattern shows how far the air moves (displacement).' : 'Tighter string → faster wave → higher pitch.') + '</p>';
  },
  draw(v, d, mode, opt, t){
    if (mode === 'micro'){
      panelTitle('CHOCOLATE BAR IN A MICROWAVE (TURNTABLE REMOVED)', 10, 18);
      const x0 = 30, x1 = 370, pxcm = (x1 - x0) / 30, y0 = 130, k = 2 * PI / (d.lam * 100), off = 1.7;
      ctx.fillStyle = '#e9e9e9'; ctx.fillRect(14, 40, 372, 200); ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.strokeRect(14, 40, 372, 200);
      ctx.fillStyle = '#5a3a22'; ctx.fillRect(x0, y0 - 26, x1 - x0, 52);
      for (let i = 0; i <= 300; i++){ const xc = 30 * i / 300, e = Math.abs(Math.sin(k * xc + off)); if (e > 0.93){ ctx.fillStyle = 'rgba(160,110,70,' + (e - 0.9) * 8 + ')'; ctx.beginPath(); ctx.arc(x0 + xc * pxcm, y0, 16 * (e - 0.9) * 10, 0, 7); ctx.fill(); } }
      ctx.strokeStyle = '#ff6a2b'; ctx.lineWidth = 2; [1, -1].forEach(sg => { ctx.beginPath(); for (let i = 0; i <= 300; i++){ const xc = 30 * i / 300, y = y0 - 70 - sg * 18 * Math.sin(k * xc + off) * Math.cos(2 * PI * t); i ? ctx.lineTo(x0 + xc * pxcm, y) : ctx.moveTo(x0, y); } ctx.stroke(); });
      text('wave pattern', x0, 52, { font: '600 10px "IBM Plex Mono",monospace', col: '#ff6a2b' });
      for (let c = 0; c <= 30; c++){ const x = x0 + c * pxcm, big = c % 5 === 0; ctx.strokeStyle = '#111'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, 200); ctx.lineTo(x, 200 + (big ? 14 : 7)); ctx.stroke(); if (big) text(String(c), x, 228, { align: 'center', font: '600 10px "IBM Plex Mono",monospace' }); }
      text('cm', x1 + 6, 228, { font: '600 10px "IBM Plex Mono",monospace' }); text('melted spots = antinodes', 12, 300, { font: '700 12px "Space Grotesk",sans-serif', col: '#5a3a22' });
      panelTitle('YOUR RESULT', 395, 18);
      [['gap Δx', v.g + ' cm'], ['λ = 2Δx', fplain(2 * v.g) + ' cm'], ['f', v.fg + ' GHz'], ['c = fλ', fplain(d.c) + ' m/s']].forEach(([a, b], i) => { text(a, 400, 50 + i * 26, { font: '600 12px "Space Grotesk",sans-serif', col: '#4a4a4a' }); text(b, 590, 50 + i * 26, { align: 'right', font: '700 13px "IBM Plex Mono",monospace' }); });
      return;
    }
    if (mode === 'tube'){
      panelTitle('RESONANCE TUBE', 10, 18);
      const x = 160, w = 46, top = 60, bot = 300, Lpx = v.La * 2.2, ws = top + Lpx;
      ctx.fillStyle = 'rgba(21,120,214,0.25)'; ctx.fillRect(60, 240, 240, 70); ctx.fillStyle = 'rgba(21,120,214,0.45)'; ctx.fillRect(x, Math.min(ws, bot), w, Math.max(0, bot - ws));
      ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bot); ctx.moveTo(x + w, top); ctx.lineTo(x + w, bot); ctx.stroke();
      const sh = Math.sin(2 * PI * 3 * t) * 3; ctx.fillStyle = '#8a8a8a'; ctx.fillRect(x + 10 + sh, 18, 5, 34); ctx.fillRect(x + w - 15 - sh, 18, 5, 34); ctx.fillRect(x + 10, 50, w - 20, 5);
      // displacement envelope in the air column, antinode at top, node at water
      if (d.loud > 0.05){ const k = 2 * PI / (d.lam * 100 * 2.2), amp = (w / 2 - 3) * d.loud * Math.cos(2 * PI * 4 * t); ctx.strokeStyle = '#ff6a2b'; ctx.lineWidth = 2; ctx.beginPath();
        for (let y = top; y <= Math.min(ws, bot); y += 2){ const e = amp * Math.sin(k * (ws - y)); y === top ? ctx.moveTo(x + w / 2 + e, y) : ctx.lineTo(x + w / 2 + e, y); } ctx.stroke(); }
      ctx.strokeStyle = '#c43a00'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x - 14, top); ctx.lineTo(x - 14, ws); ctx.stroke(); text('L = ' + v.La.toFixed(1) + ' cm', x - 18, (top + ws) / 2, { align: 'right', font: '700 12px "IBM Plex Mono",monospace', col: '#c43a00' });
      text(d.loud > 0.6 ? 'LOUD' : d.loud > 0.2 ? 'getting louder…' : 'quiet', x + w + 14, 100, { font: '700 16px "Space Grotesk",sans-serif', col: d.loud > 0.6 ? '#c43a00' : '#8a8a8a' });
      panelTitle('LOUDNESS vs L', 395, 18);
      const gx = 405, gy = 200, gw = 180, gh = 140; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(gx, gy - gh); ctx.lineTo(gx, gy); ctx.lineTo(gx + gw, gy); ctx.stroke();
      ctx.strokeStyle = '#1546d6'; ctx.lineWidth = 2; ctx.beginPath(); for (let i = 0; i <= 300; i++){ const L = 5 + 95 * i / 300, dd = SIM.calc(Object.assign({}, v, { La: L }), 'tube', opt); i ? ctx.lineTo(gx + gw * i / 300, gy - gh * dd.loud) : ctx.moveTo(gx, gy - gh * dd.loud); } ctx.stroke();
      ctx.fillStyle = '#ff6a2b'; ctx.beginPath(); ctx.arc(gx + gw * (v.La - 5) / 95, gy - gh * d.loud, 5, 0, 7); ctx.fill();
      text('5 cm', gx, gy + 14, { align: 'center', font: '500 10px "IBM Plex Mono",monospace' }); text('100 cm', gx + gw, gy + 14, { align: 'center', font: '500 10px "IBM Plex Mono",monospace' });
      text('peaks λ/2 = ' + fplain(d.lam * 50) + ' cm apart', 400, 250, { font: '600 11px "IBM Plex Mono",monospace', col: '#4a4a4a' });
      return;
    }
    panelTitle((mode === 'pipe' ? 'PIPE: ' : 'STRING: ') + ({ ff: 'FIXED–FIXED', fr: 'FIXED–FREE', rr: 'FREE–FREE', oo: 'OPEN–OPEN', co: 'CLOSED–OPEN', cc: 'CLOSED–CLOSED' })[d.ends] + ' · HARMONIC ' + d.n, 10, 18);
    const X1 = 40, X2 = 360, y0 = 130, Amp = 46, k = 2 * PI / d.lam, Lm = v.L, sh = x => d.nodeAt0 ? Math.sin(k * x) : Math.cos(k * x), osc = Math.cos(2 * PI * 0.8 * t), X = x => X1 + (X2 - X1) * x / Lm;
    if (mode === 'pipe'){
      ctx.fillStyle = 'rgba(21,70,214,0.06)'; ctx.fillRect(X1, y0 - 56, X2 - X1, 112); ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(X1, y0 - 56); ctx.lineTo(X2, y0 - 56); ctx.moveTo(X1, y0 + 56); ctx.lineTo(X2, y0 + 56); ctx.stroke();
      if (d.ends === 'co' || d.ends === 'cc'){ ctx.fillStyle = '#111'; ctx.fillRect(X1 - 8, y0 - 56, 8, 112); } if (d.ends === 'cc'){ ctx.fillRect(X2, y0 - 56, 8, 112); }
      // air particles: horizontal displacement
      for (let i = 0; i <= 52; i++) for (let j = -3; j <= 3; j++){ const x0 = Lm * i / 52, dx = sh(x0) * osc * 7; ctx.fillStyle = '#4a4a4a'; ctx.beginPath(); ctx.arc(X(x0) + dx, y0 + j * 14 + (i % 2 ? 7 : 0) * (j < 3 ? 1 : 0), 1.8, 0, 7); ctx.fill(); }
      ctx.strokeStyle = 'rgba(196,58,0,0.8)'; ctx.lineWidth = 2; [1, -1].forEach(s => { ctx.beginPath(); for (let i = 0; i <= 200; i++){ const x = Lm * i / 200, y = y0 - s * Amp * sh(x); i ? ctx.lineTo(X(x), y) : ctx.moveTo(X(x), y); } ctx.stroke(); });
    } else {
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1; [1, -1].forEach(s => { ctx.beginPath(); for (let i = 0; i <= 200; i++){ const x = Lm * i / 200, y = y0 - s * Amp * sh(x); i ? ctx.lineTo(X(x), y) : ctx.moveTo(X(x), y); } ctx.stroke(); });
      ctx.strokeStyle = '#1546d6'; ctx.lineWidth = 3; ctx.beginPath(); for (let i = 0; i <= 200; i++){ const x = Lm * i / 200, y = y0 - Amp * sh(x) * osc; i ? ctx.lineTo(X(x), y) : ctx.moveTo(X(x), y); } ctx.stroke();
      const endMark = (x, fixed) => { if (fixed){ ctx.fillStyle = '#555'; ctx.fillRect(x - 4, y0 - 60, 8, 120); } else { ctx.fillStyle = '#555'; ctx.fillRect(x - 2, y0 - 60, 4, 120); } };
      endMark(X1, d.ends !== 'rr'); endMark(X2, d.ends === 'ff');
    }
    // node/antinode labels
    const step = d.lam / 4; for (let q = 0; q * step <= Lm + 1e-6; q++){ const x = q * step, isNode = Math.abs(sh(x)) < 0.5; text(isNode ? 'N' : 'A', X(x), y0 + 76, { align: 'center', font: '700 12px "Space Grotesk",sans-serif', col: isNode ? '#111' : '#c43a00' }); }
    const lx = Math.min(d.lam, Lm); ctx.strokeStyle = '#c43a00'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(X(0), 232); ctx.lineTo(X(lx), 232); ctx.moveTo(X(0), 226); ctx.lineTo(X(0), 238); ctx.moveTo(X(lx), 226); ctx.lineTo(X(lx), 238); ctx.stroke();
    text(lx < d.lam ? 'λ = ' + fplain(d.lam) + ' m (longer than L)' : 'λ = ' + fplain(d.lam) + ' m', X(lx / 2), 250, { align: 'center', font: '700 11px "IBM Plex Mono",monospace', col: '#c43a00' });
    text('L = ' + v.L + ' m   f = ' + fplain(d.f) + ' Hz', 12, 310, { font: '700 13px "Space Grotesk",sans-serif' });
    panelTitle('POSSIBLE FREQUENCIES', 395, 18);
    const ns = d.asym ? [1, 3, 5, 7, 9] : [1, 2, 3, 4, 5]; ns.forEach((n, i) => { const y = 46 + i * 34, f = n * d.f1, on = n === d.n; ctx.fillStyle = on ? '#ff6a2b' : '#ddd'; ctx.fillRect(400, y, Math.min(180, 18 * n), 14);
      text('n = ' + n + ': ' + fplain(f) + ' Hz', 404, y + 26, { font: (on ? '700 ' : '500 ') + '11px "IBM Plex Mono",monospace' }); });
    if (d.asym) text('odd harmonics only', 400, 226 + 18, { font: '700 11px "Space Grotesk",sans-serif', col: '#c43a00' });
  }
};


(function (V) {
  if (V.title) SIM.title = V.title;
  if (V.hint) SIM.hint = V.hint;
  if (V.modes && SIM.modes) SIM.modes = V.modes.map(id => SIM.modes.find(m => m.id === id)).filter(Boolean);
  if (V.opts && SIM.opts) SIM.opts = SIM.opts.map(o => V.opts[o.id] ? Object.assign({}, o, { choices: o.choices.filter(c => V.opts[o.id].includes(c[0])) }) : o).filter(o => o.choices.length);
  if (SIM.opts && V.oneChoiceHidden !== false) SIM.opts = SIM.opts.filter(o => o.choices.length > 1);
  if (SIM.presets) SIM.presets = SIM.presets.filter(p => (!p.mode || !SIM.modes || SIM.modes.some(m => m.id === p.mode)) && !(V.dropPresets || []).includes(p.label));
  SIM.strip = h => h.replace(/<span style="color:#7a3fb0">IB[^<]*<\/span>:?\s*/g, '').replace(/\s*\((?:IB|AP)[^()]*\)/g, '').replace(/<p class="note">(?:AP|IB)[^<]*(?:<[^p][^>]*>[^<]*)*<\/p>/g, '').replace(/AP: qualitative only[^.]*\. ?/g, '');
})({"modes": ["string", "pipe", "micro"], "opts": {"se": ["ff"], "pe": ["oo", "co"]}});


S.mode = SIM.modes ? SIM.modes[0].id : 'one';
setup(); requestAnimationFrame(loop);
window.APP = { select(name){ const m = (SIM.modes || []).find(m => m.label === name || m.id === name); if (m && m.id !== S.mode){ S.mode = m.id; S.anim = {}; setup(); } } };
addEventListener('message', e => { const d = e.data; if (d && d.select) try { APP.select(d.select); } catch (er) {} });
</script>
