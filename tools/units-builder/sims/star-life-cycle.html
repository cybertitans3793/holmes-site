<!DOCTYPE html>
<!--
  Star Life Cycle — fusion, forces and size. An original simulation (single self-contained file, no network).
  Five starting masses, each followed through its life stages:
    - true-scale size view with the Sun, the Earth and planetary orbits for comparison
    - cutaway of the interior (not to scale) showing which fusion runs in the core and shells, with inward gravity
      vs outward pressure arrows (balanced, contracting, expanding, collapsing, exploding)
    - animated fusion reactions (p-p chain, CNO cycle, triple-alpha, carbon, neon, oxygen, silicon burning)
      with the core temperature and density compared to each fuel's ignition point
    - H-R diagram with lines of constant radius and the star's track.
  Stage values are representative textbook figures, rounded. Main-sequence values follow L = M^3.5, R = M^0.8
  and t = 10^10 yr x M^-2.5 so they match the relations students use; R always follows from L = 4 pi R^2 sigma T^4.
-->
<html lang="en"><head><meta charset="utf-8">
<title>Star Life Cycle</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f19;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1d2733}
#app{position:absolute;left:0;top:0;width:1100px;height:650px;transform-origin:0 0;display:flex;background:#fff}
#cv{width:800px;height:650px;display:block;touch-action:none}
#panel{width:300px;height:650px;box-sizing:border-box;padding:9px 11px;border-left:1px solid #d5dde6;overflow-y:auto;font-size:12.5px;line-height:1.35;background:#fbfcfd}
h1{font-size:15px;margin:0 0 7px}
.lbl{font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#5b6b7c;margin:7px 0 3px}
.masses{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.masses button{padding:4px 2px;font-size:11.5px;line-height:1.15;border:1px solid #c3cdd8;background:#f2f5f8;border-radius:5px;cursor:pointer;color:#1d2733}
.masses button b{display:block;font-size:13px}
.masses button.on{background:#2f6fd0;color:#fff;border-color:#2f6fd0}
.row{display:flex;gap:4px;align-items:center}
.row button{padding:5px 7px;font-size:12.5px;border:1px solid #c3cdd8;background:#f2f5f8;border-radius:5px;cursor:pointer;color:#1d2733}
#play{flex:1;font-weight:600}
select{font-size:12px;padding:3px;border-radius:5px;border:1px solid #c3cdd8}
#stages{margin:0;padding:0;list-style:none;border:1px solid #d5dde6;border-radius:6px;overflow:hidden}
#stages li{display:flex;justify-content:space-between;gap:6px;padding:2px 7px;cursor:pointer;border-top:1px solid #edf1f5;font-size:12px}
#stages li:first-child{border-top:0}
#stages li .d{color:#6a7886;white-space:nowrap;font-size:11.5px}
#stages li.cur{background:#e5efff;font-weight:600}
#stages li.fut{color:#8a96a3;font-style:italic}
table{width:100%;border-collapse:collapse;font-size:12px}
td{padding:1.5px 2px;vertical-align:top}td.v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
label{display:block;cursor:pointer;margin:1px 0}
.checks{display:flex;gap:9px;margin-top:5px;font-size:12px}.checks label{margin:0}
.foot{color:#6a7886;font-size:11px;margin-top:6px}
</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap"><style id="holmes-embed">
html,body{background:#fff!important}
#app{box-shadow:none!important}
#panel{font-family:"Space Grotesk",system-ui,sans-serif!important;background:#fff!important;border-left:3px solid #111!important}

#panel input[type=range],#panel input[type=checkbox]{accent-color:#111}
</style></head>
<body>
<div id="app">
<canvas id="cv" width="800" height="650" aria-label="Star life cycle simulation"></canvas>
<div id="panel">
  <h1>Star Life Cycle</h1>
  <div class="lbl" style="margin-top:0">Starting mass</div>
  <div class="masses" id="masses"></div>
  <div class="lbl">Time</div>
  <div class="row"><button id="prev" title="Previous stage">&#9664;&#9664;</button><button id="play">&#9654; Play</button><button id="next" title="Next stage">&#9654;&#9654;</button>
    <select id="speed"><option value="0.5">&frac12;&times;</option><option value="1" selected>1&times;</option><option value="2">2&times;</option></select></div>
  <div class="checks"><label><input type="checkbox" id="lock"> Lock zoom</label><label><input type="checkbox" id="orbits" checked> Orbits</label><label><input type="checkbox" id="forces" checked> Forces</label></div>
  <div class="lbl">Life stages <span style="font-weight:400;text-transform:none;letter-spacing:0">(click to jump)</span></div>
  <ul id="stages"></ul>
  <div class="lbl">Right now</div>
  <table id="read"></table>
  <div class="foot">M&#8857;, L&#8857;, R&#8857; = the Sun's mass, luminosity and radius. Values are rounded, representative figures.</div>
</div>
</div>

         : { n: 'Neutron star', dur: 1e10, pts: null, m: [o.rem, o.rem], Tc: [1e9, 1e8], rho: [4e14, 4e14], f: 'bal', pr: 'ndeg', kind: 'ns', lay: [[1, 'n', '', 'Neutrons packed as tightly as an atomic nucleus']], rx: null,

var NS_R = 12 / RSUN_KM, NS_T = 1e6;

/* ---------------- state ---------------- */
var star = STARS[1], si = 0, sp = 0, playing = false, speed = 1, pxPerR = null;
function cur() { return star.stages[si]; }
function ageAt(i, p) { var a = 0; for (var k = 0; k < i; k++) a += star.stages[k].dur; return a + p * star.stages[i].dur; }
function interp(pts, p) {

  var a = pts[i], b = pts[i + 1];
  return [Math.pow(10, Math.log10(a[0]) * (1 - f) + Math.log10(b[0]) * f), Math.pow(10, Math.log10(a[1]) * (1 - f) + Math.log10(b[1]) * f)];
}
function lerpLog(a, b, p) { if (a <= 0 || b <= 0) return a + (b - a) * p; return Math.pow(10, Math.log10(a) * (1 - p) + Math.log10(b) * p); }

  var html = rows.map(function (r) { return r[0] ? '<tr><td>' + r[0] + '</td><td class="v">' + r[1] + '</td></tr>' : '<tr><td colspan="2" style="color:#6a7886;font-size:11.5px">' + r[1] + '</td></tr>'; }).join('');
  if (readEl._h !== html) { readEl.innerHTML = html; readEl._h = html; }
  [].forEach.call(stagesEl.children, function (li, i) { li.classList.toggle('cur', i === si); });
}

/* ---------------- loop ---------------- */
var app = document.getElementById('app');
function fit() {
  var s = Math.min(window.innerWidth / 1100, window.innerHeight / 650);
  app.style.transform = 'scale(' + s + ')';
  var px = Math.max(1, Math.min(3, s * (window.devicePixelRatio || 1)));
  var w = Math.round(CW * px); if (cv.width !== w) { cv.width = w; cv.height = Math.round(CH * px); }
}
window.addEventListener('resize', fit);
pick(1); fit();
var last = performance.now(), T0 = 0;
var STAGE_SECONDS = 7;
function frame(now) {
  var dt = Math.min(0.05, (now - last) / 1000); last = now; T0 += dt;
  if (playing) {
    var s = cur(), secs = s.f === 'collapse' ? 3.5 : STAGE_SECONDS;
    sp += dt * speed / secs;
    if (sp >= 1) { if (si < star.stages.length - 1) { si++; sp = 0; } else { sp = 1; setPlay(false); } }
  }
  var P = props();
  var W = cv.width / CW; ctx.setTransform(W, 0, 0, W, 0, 0);
  ctx.fillStyle = '#0b0f19'; ctx.fillRect(0, 0, CW, CH);
  drawSize(P, T0); drawInterior(P, T0); drawHR(P); drawFusion(P, T0);
  readouts(P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.SIM = { pick: pick, set: function (i, p) { si = i; sp = p; }, props: props, get stage() { return cur(); } };
})();
