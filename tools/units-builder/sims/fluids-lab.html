<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluids Lab</title>
<!--
  Fluids Lab: simulations for AP Physics 1 Unit 8 (Fluids) and IB Physics (buoyancy, viscous drag).
  "Under Pressure", "Flow" and "Water Tower" tabs: HTML5 port of PhET Interactive Simulations' "Fluid Pressure and Flow"
  (University of Colorado Boulder, https://phet.colorado.edu), GPL. Buoyancy tab inspired by PhET "Buoyancy" (CC BY 4.0).
  Other tabs are original.
-->
<style>
:root{--ink:#1d1d1f;--tabbg:#1f3b57;--tabon:#f4f4f4;}
html,body{margin:0;height:100%;background:#16283b;overflow:hidden;font-family:"Space Grotesk",Arial,sans-serif;color:var(--ink);}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
#app{position:relative;width:1008px;height:718px;transform-origin:0 0;background:#eef3f8;flex:none;}
#tabs{position:absolute;left:0;top:0;width:1008px;height:42px;background:var(--tabbg);display:flex;align-items:flex-end;gap:3px;padding:0 6px;box-sizing:border-box;}
#tabs button{font:600 13px "Space Grotesk",Arial,sans-serif;border:0;border-radius:7px 7px 0 0;padding:8px 13px 9px;background:#3d6488;color:#eaf3fb;cursor:pointer;white-space:nowrap;}
#tabs button.on{background:var(--tabon);color:#111;}
#tabs .sep{width:1px;height:22px;background:#6a7d92;margin:0 4px 9px;}
#tabs .brand{margin-left:auto;color:#a9c4dd;font:12px Arial;align-self:center;padding-right:4px;}
#stage{position:absolute;left:0;top:42px;width:1008px;height:676px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
#stage canvas{position:absolute;left:0;top:0;width:1008px;height:676px;}
.pttab,.xtab{position:absolute;inset:0;pointer-events:none;}
.pttab>*{pointer-events:auto;}
.ptpanel{position:absolute;background:rgb(238,238,238);border:1px solid #8a8a8a;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.18);font:13px "Space Grotesk",Arial,sans-serif;box-sizing:border-box;}
.pttitle{font:bold 13px "Space Grotesk",Arial,sans-serif;text-align:center;margin-bottom:3px;}
.ptrow{display:flex;align-items:center;font:13px "Space Grotesk",Arial,sans-serif;cursor:pointer;white-space:nowrap;}
.ptrow input{margin:2px 3px 2px 0;}
.ptbtn{font:13px "Space Grotesk",Arial,sans-serif;padding:5px 12px;border-radius:6px;border:1px solid #777;background:linear-gradient(#fff,#ddd);cursor:pointer;white-space:nowrap;}
.ptbtn:disabled{color:#999;cursor:default;}
.ptbtn:not(:disabled):active{background:linear-gradient(#ddd,#fff);}
.ptround{width:40px;height:40px;border-radius:50%;border:1px solid #666;background:radial-gradient(circle at 40% 35%,#fff,#bbb);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.ptround.small{width:30px;height:30px;}
.ptround:disabled{opacity:.45;cursor:default;}
.pttext{position:absolute;font:18px "Space Grotesk",Arial,sans-serif;pointer-events:none!important;}
.ptslider{accent-color:#3b6fb6;}
.num{font-variant-numeric:tabular-nums}
input.ans{width:80px;font:13px Arial;padding:2px 4px}
.eq{font:14px "Cambria Math","Times New Roman",serif}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap"><style id="holmes-embed">
html,body{background:#fff!important}
#wrap{background:#fff!important}
#tabs{display:none!important}
#stage{top:0!important}
#app{height:676px!important}
.ptpanel{background:#fff!important;border:2px solid #111!important;border-radius:0!important;box-shadow:3px 3px 0 #111!important}
.ptpanel,.pttitle,.ptrow,.ptbtn,.pttext{font-family:"Space Grotesk",Arial,sans-serif!important}
.pttitle{font-weight:700!important}
.ptrow{font-size:12.5px!important;letter-spacing:-.01em}
.ptbtn{background:#fff!important;border:2px solid #111!important;border-radius:0!important;font-weight:700!important;color:#111!important}
.ptbtn:disabled{color:#999!important;border-color:#999!important}
.ptbtn:not(:disabled):hover{background:#ffe2d3!important}
.ptbtn:not(:disabled):active{background:#ff6a2b!important}
.ptround{border:2px solid #111!important;background:#fff!important}
.ptround:not(:disabled):hover{background:#ffe2d3!important}
.ptslider,input[type=range]{accent-color:#111}
input[type=checkbox],input[type=radio]{accent-color:#111}
</style></head>
