<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photogate Ramp</title>
<!-- Photogate Ramp: original Holmes Sims, built from frame.html + photogate.js. g = 10 m/s². -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Space Grotesk",system-ui,sans-serif;color:#111}
#app{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0;padding:10px 14px 12px;box-sizing:border-box;
  display:grid;grid-template-columns:600px 1fr;grid-template-rows:34px 330px 1fr;gap:10px 14px}
#bar{grid-column:1/-1;padding-right:48px;display:flex;gap:16px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.seg{display:flex;align-items:center}
.seg .lab{font:700 12px "IBM Plex Mono",monospace;margin-right:8px;text-transform:uppercase}
.seg button{white-space:nowrap;font:700 14px "Space Grotesk",sans-serif;padding:6px 11px;border:2px solid #111;background:#fff;color:#111;cursor:pointer}
.seg button+button{margin-left:-2px}
.seg button[aria-pressed="true"]{background:#111;color:#fff}
.seg button:hover:not([aria-pressed="true"]){background:#ffe2d3}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ff6a2b;outline-offset:2px;position:relative;z-index:1}
#cv{border:2px solid #111;background:#fbfbfb;width:600px;height:330px;box-sizing:border-box;display:block}
#work{border:2px solid #111;padding:8px 12px 10px;overflow:auto;font-size:14px;line-height:1.55;box-sizing:border-box}
#work .wt{font:700 12px "IBM Plex Mono",monospace;text-transform:uppercase;margin:0 0 4px;display:flex;justify-content:space-between}
#work .wt .hint{text-transform:none}
#work h4{margin:9px 0 1px;font-size:13px;font-weight:700;color:#4a4a4a}
#work h4:first-of-type{margin-top:2px}
#work .eq{font-variant-numeric:tabular-nums}
#work .n{font-family:"IBM Plex Mono",monospace;font-size:13px}
#work b .n,#work .ans{font-weight:700}
#work .note{font-size:12.5px;color:#4a4a4a;margin:2px 0 0}
#work .ok{background:#e5f4ea;border-left:4px solid #1e7d45;padding:3px 8px;margin-top:4px}
#work .bad{background:#fde7df;border-left:4px solid #c43a00;padding:3px 8px;margin-top:4px}
#work math{display:block;text-align:left;margin:4px 0;font-size:1em;overflow-x:auto;overflow-y:hidden;max-width:100%}
#work math.ans{font-weight:700}
#work math.ans mn,#work math.ans mi,#work math.ans mo,#work math.ans mtext{font-weight:700}
#work p.st{margin:4px 0}
.ivv{border-radius:2px;padding:0 2px;transition:background .25s}
.ivv.gx{background:#ffe2d3}
.ivv.hot{background:#ff6a2b;color:#fff}
#ctl{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;align-content:start}
.iv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:6px}
.iv .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iv .val{font:700 13px "IBM Plex Mono",monospace;white-space:nowrap}
.iv input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:#111;height:22px}
.iv input[type=radio]{accent-color:#ff6a2b;margin:0}
#presets{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
#presets .lab{font:700 12px "IBM Plex Mono",monospace}
#presets button{font:600 12.5px "Space Grotesk",sans-serif;padding:3px 8px;border:2px solid #111;background:#fff;cursor:pointer}
#presets button:hover{background:#ffe2d3}
#gcard{border:2px solid #111;padding:5px 8px 6px;display:flex;flex-direction:column;box-sizing:border-box;min-height:0}
.ghead{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.ghead select{font:600 13px "Space Grotesk",sans-serif;border:2px solid #111;padding:1px 4px;max-width:200px}
#gv{width:340px;height:150px;flex:none;display:block;margin-top:3px}
#dbl{font-size:12.5px;line-height:1.35;margin-top:2px}
#dbl b{font-weight:700}
.hint{font:500 11px "IBM Plex Mono",monospace;color:#4a4a4a}
/* Projector layout ("Big"): smaller design box, so everything scales up when fitted; graph and presets hidden */
#bigbtn{position:absolute;top:10px;right:14px;z-index:2;font:700 13px "IBM Plex Mono",monospace;padding:5px 9px;border:2px solid #111;background:#fff;color:#111;cursor:pointer}
#bigbtn[aria-pressed="true"]{background:#111;color:#fff}
body.big #bigbtn{top:8px;right:10px}
body.big #app{width:760px;height:480px;grid-template-columns:400px 1fr;grid-template-rows:auto 220px 1fr;gap:8px 12px;padding:8px 10px 10px}
body.big #bar{flex-wrap:wrap;row-gap:4px}
body.big #cv{width:400px;height:220px}
body.big #work{grid-column:2;grid-row:2/4}
body.big #ctl{grid-column:1;grid-row:3;grid-template-columns:1fr 1fr;gap:2px 12px;overflow:hidden}
body.big #gcard,body.big #presets,body.big #bar .hint{display:none}
</style></head><body>
<div id="app">
  <div id="bar"></div>
  <canvas id="cv" width="1200" height="660" aria-label="Animation of the situation with force arrows"></canvas>
  <div id="work" aria-live="polite"></div>
  <div id="ctl"></div>
  <div id="gcard">
    <div class="ghead"><span>Graph</span><select id="dvsel" aria-label="Quantity to graph"></select><span>vs <b id="ivname"></b></span></div>
    <canvas id="gv" width="680" height="300" aria-label="Graph of the chosen quantity against the chosen variable"></canvas>
    <div id="dbl"></div>
  </div>
</div>
<script>
// ---------------- shared frame ----------------
const $ = id => document.getElementById(id);
const G10 = 10, PI = Math.PI, DEG = PI / 180;
function fit(){ const big = document.body.classList.contains('big'), W = big ? 760 : 1000, H = big ? 480 : 640, s = Math.min(innerWidth / W, innerHeight / H); $('app').style.transform = 'scale(' + s + ')'; }
// Projector layout: toggled by the Big button, remembered on this computer, and switched on by the unit page in Present mode ({big:true}).
let BIG_SAVED = false; try { BIG_SAVED = localStorage.getItem('holmesBig') === '1'; } catch (e) {}
function setBig(on, save){ document.body.classList.toggle('big', !!on); const b = document.getElementById('bigbtn'); if (b){ b.setAttribute('aria-pressed', String(!!on)); b.textContent = on ? 'A−' : 'A+'; b.title = on ? 'Normal layout' : 'Projector layout: bigger text, graph hidden'; }
  if (save) try { localStorage.setItem('holmesBig', on ? '1' : '0'); } catch (e) {} fit(); }
if (BIG_SAVED) document.body.classList.add('big');
addEventListener('resize', fit); fit();

function fnum(x){ const r = fnum0(x); return typeof r === 'string' ? r.replace(/^-/, '−') : r; }
function fnum0(x){
  if (x === null || x === undefined || !isFinite(x)) return '—';
  const a = Math.abs(x);
  if (a === 0) return '0';
  if (a >= 1e5 || a < 1e-3){
    const e = Math.floor(Math.log10(a)); let m = x / Math.pow(10, e);
    let ms = m.toFixed(2); if (Math.abs(+ms) >= 10){ m /= 10; ms = m.toFixed(2); return ms + '×10<sup>' + (e + 1) + '</sup>'; }
    return ms + '×10<sup>' + e + '</sup>';
  }
  if (a >= 1000) return String(Math.round(x));
  return x.toPrecision(3);
}
function fplain(x){ return fnum(x).replace(/<sup>(.*?)<\/sup>/g, (m, e) => '^' + e).replace('×10^', 'e'); }
const H = {
  n: (x, u) => '<span class="n">' + fnum(x) + (u ? '&nbsp;' + u : '') + '</span>',
  iv: id => { const d = S.def[id]; const val = S.v[id]; const txt = (d.show ? d.show(val) : fnum(val) + (d.unit ? '&nbsp;' + d.unit : ''));
              return '<span class="ivv n' + (S.gx === id ? ' gx' : '') + (S.hot === id ? ' hot' : '') + '" data-iv="' + id + '">' + txt + '</span>'; },
  g: () => '<span class="n">10&nbsp;m/s²</span>',
  p: (x, u) => x < 0 ? '(' + H.n(x, u) + ')' : H.n(x, u)
};

// MathML builders for TEX`...` templates (converted at build time by tex.py)
const M = {
  num: x => { const r = fnum0(x); if (typeof r !== 'string') return '<mn>' + r + '</mn>'; const neg = r[0] === '-', b = neg ? r.slice(1) : r, m = b.match(/^(.*)×10<sup>(.*)<\/sup>$/);
    const body = m ? '<mn>' + m[1] + '</mn><mo>×</mo><msup><mn>10</mn><mrow>' + (m[2][0] === '-' ? '<mo>−</mo><mn>' + m[2].slice(1) + '</mn>' : '<mn>' + m[2] + '</mn>') + '</mrow></msup>' : '<mn>' + b + '</mn>';
    return neg ? '<mo>−</mo>' + body : body; },
  u: u => u ? '<mspace width="0.167em"/><mtext>' + u + '</mtext>' : '',
  n: (x, u) => '<mrow>' + M.num(x) + M.u(u) + '</mrow>',
  p: (x, u) => x < 0 ? '<mrow><mo>(</mo>' + M.n(x, u) + '<mo>)</mo></mrow>' : M.n(x, u),
  iv: (id, scale) => { const d = S.def[id], val = S.v[id] * (scale || 1);
    return '<mrow class="ivv' + (S.gx === id ? ' gx' : '') + (S.hot === id ? ' hot' : '') + '" data-iv="' + id + '">' + (d.show && !scale ? '<mtext>' + d.show(S.v[id]) + '</mtext>' : M.num(val) + (scale ? '' : M.u(d.unit))) + '</mrow>'; }
};

const S = { mode: null, opt: {}, v: {}, store: {}, def: {}, ivs: [], gx: null, dv: null, hot: null, t: 0, anim: {} };

function bar(){
  const b = $('bar'); b.innerHTML = '';
  const group = (label, items, cur, onpick) => {
    const g = document.createElement('div'); g.className = 'seg'; g.setAttribute('role', 'group');
    if (label){ const l = document.createElement('span'); l.className = 'lab'; l.textContent = label; g.appendChild(l); }
    items.forEach(([id, txt]) => { const bt = document.createElement('button'); bt.textContent = txt; bt.setAttribute('aria-pressed', String(id === cur)); bt.onclick = () => onpick(id); g.appendChild(bt); });
    b.appendChild(g);
  };
  const tip = document.createElement('span'); tip.className = 'hint'; tip.style.marginLeft = 'auto'; tip.style.whiteSpace = 'nowrap'; tip.innerHTML = '● = the variable on the graph’s x-axis · drag any slider';
  if (SIM.modes && SIM.modes.length > 1) group(null, SIM.modes.map(m => [m.id, m.label]), S.mode, id => { S.mode = id; S.anim = {}; setup(); });
  (SIM.opts || []).filter(o => !o.modes || o.modes.includes(S.mode)).forEach(o => {
    if (!(o.id in S.opt)) S.opt[o.id] = o.choices[0][0];
    group(o.label, o.choices, S.opt[o.id], id => { S.opt[o.id] = id; S.anim = {}; setup(); });
  });
  if (!SIM.noGraph) b.appendChild(tip);
  if (!$('bigbtn')){ const bb = document.createElement('button'); bb.id = 'bigbtn'; bb.type = 'button'; bb.onclick = () => setBig(!document.body.classList.contains('big'), true); $('app').appendChild(bb); }
  setBig(document.body.classList.contains('big'), false);
  if (b.scrollWidth > b.clientWidth + 1) tip.remove();
  if (b.scrollWidth > b.clientWidth + 1) b.querySelectorAll('.seg button').forEach(x => { x.style.fontSize = '13px'; x.style.padding = '6px 8px'; });
}

function setup(){
  if (SIM.noGraph){ $('gcard').style.display = 'none'; $('cv').style.gridArea = '2 / 1 / 3 / 2'; $('work').style.gridArea = '2 / 2 / 4 / 3'; $('ctl').style.gridArea = '3 / 1 / 4 / 2'; }
  bar();
  S.ivs = SIM.ivs(S.mode, S.opt); S.def = {}; S.v = {};
  S.ivs.forEach(d => { S.def[d.id] = d; const k = S.mode + ':' + d.id; S.v[d.id] = (k in S.store) ? S.store[k] : d.val; });
  if (!S.gx || !S.def[S.gx]) S.gx = S.ivs.find(d => d.graph) ? S.ivs.find(d => d.graph).id : S.ivs[1] ? S.ivs[1].id : S.ivs[0].id;
  const c = $('ctl'); c.innerHTML = '';
  S.ivs.forEach(d => {
    const w = document.createElement('div'); w.className = 'iv';
    w.innerHTML = '<input type="radio" name="gx"' + (SIM.noGraph ? ' style="display:none"' : '') + ' value="' + d.id + '" aria-label="Graph against ' + d.label + '" title="Put this on the graph’s x-axis"' + (S.gx === d.id ? ' checked' : '') + '>' +
      '<span class="nm">' + d.label + ' <i>' + d.sym + '</i></span><span class="val" id="val-' + d.id + '"></span>' +
      '<input type="range" id="r-' + d.id + '" min="' + d.min + '" max="' + d.max + '" step="' + d.step + '" value="' + S.v[d.id] + '" aria-label="' + d.label + '">';
    c.appendChild(w);
    const r = w.querySelector('input[type=range]');
    r.oninput = () => { S.v[d.id] = +r.value; S.store[S.mode + ':' + d.id] = +r.value; S.hot = d.id; clearTimeout(S.hotT); S.hotT = setTimeout(() => { S.hot = null; update(); }, 700); S.anim.reset = true; update(); };
    w.querySelector('input[type=radio]').onchange = () => { S.gx = d.id; update(); };
  });
  if (SIM.presets){
    const p = document.createElement('div'); p.id = 'presets'; p.innerHTML = '<span class="lab">Try:</span>';
    SIM.presets.filter(ps => !ps.mode || (SIM.modes || []).some(m => m.id === ps.mode)).forEach(ps => { const bt = document.createElement('button'); bt.textContent = ps.label; bt.onclick = () => { if (ps.mode && ps.mode !== S.mode){ S.mode = ps.mode; } if (ps.opt) Object.assign(S.opt, ps.opt); Object.entries(ps.v).forEach(([k, val]) => S.store[(ps.mode || S.mode) + ':' + k] = val); S.anim = {}; setup(); }; p.appendChild(bt); });
    c.appendChild(p);
  }
  const dvs = SIM.dvs(S.mode, S.opt), sel = $('dvsel');
  if (!S.dv || !dvs.find(d => d.id === S.dv)) S.dv = dvs[0].id;
  sel.innerHTML = dvs.map(d => '<option value="' + d.id + '"' + (d.id === S.dv ? ' selected' : '') + '>' + d.name + '</option>').join('');
  sel.onchange = () => { S.dv = sel.value; update(); };
  update();
}

function calcWith(over){ const v = Object.assign({}, S.v, over || {}); return SIM.calc(v, S.mode, S.opt); }

function update(){
  S.ivs.forEach(d => { $('val-' + d.id).innerHTML = d.show ? d.show(S.v[d.id]) : fnum(S.v[d.id]) + (d.unit ? '&nbsp;' + d.unit : ''); });
  S.d = calcWith();
  if (SIM.graphHidden && !SIM.noGraph) $('gcard').style.visibility = SIM.graphHidden(S.v, S.mode, S.opt) ? 'hidden' : '';
  $('work').innerHTML = '<div class="wt"><span>Show the work</span><span class="hint">' + (SIM.hint || 'g = 10 m/s²') + '</span></div>' + (SIM.strip ? SIM.strip(SIM.work(S.v, S.d, S.mode, S.opt)) : SIM.work(S.v, S.d, S.mode, S.opt));
  document.querySelectorAll('input[name=gx]').forEach(r => r.checked = (r.value === S.gx));
  graph();
}

function graph(){
  if (SIM.noGraph) return;
  const cv = $('gv'), g = cv.getContext('2d'), W = 340, Hh = 150; g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, W, Hh);
  const dvs = SIM.dvs(S.mode, S.opt), dv = dvs.find(d => d.id === S.dv), ref = dv.vs ? dvs.find(d => d.id === dv.vs) : null;
  const x = S.def[S.gx]; $('ivname').innerHTML = '<i>' + x.sym + '</i>' + (x.unit && !x.show ? ' (' + x.unit + ')' : '');
  const N = 160, xs = [], ys = [], rs = [];
  for (let i = 0; i <= N; i++){ const xv = x.min + (x.max - x.min) * i / N; const d = calcWith({ [S.gx]: xv }); xs.push(xv); ys.push(dv.f(d)); rs.push(ref ? ref.f(d) : null); }
  const all = ys.concat(ref ? rs : []).filter(isFinite);
  let ymin = Math.min(0, ...all), ymax = Math.max(...all, 0); if (ymax === ymin) ymax = ymin + 1; const pad = (ymax - ymin) * 0.08; ymax += pad; if (ymin < 0) ymin -= pad;
  const L = 46, R = 8, T = 8, B = 22, X = v => L + (v - x.min) / (x.max - x.min) * (W - L - R), Y = v => T + (ymax - v) / (ymax - ymin) * (Hh - T - B);
  g.strokeStyle = '#111'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(L, T); g.lineTo(L, Hh - B); g.lineTo(W - R, Hh - B); g.stroke();
  if (ymin < 0){ g.strokeStyle = '#999'; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(W - R, Y(0)); g.stroke(); g.setLineDash([]);
    if (dv.negNote){ g.fillStyle = 'rgba(196,58,0,0.08)'; g.fillRect(L, Y(0), W - R - L, Hh - B - Y(0)); g.fillStyle = '#c43a00'; g.font = '600 10px "Space Grotesk",sans-serif'; g.textAlign = 'left'; g.fillText(dv.negNote, L + 4, Hh - B - 4); } }
  g.font = '500 10px "IBM Plex Mono",monospace'; g.fillStyle = '#4a4a4a'; g.textAlign = 'right';
  g.fillText(fplain(ymax), L - 4, T + 8); g.fillText(fplain(ymin < 0 ? ymin : 0), L - 4, Hh - B); if (ymin < 0) g.fillText('0', L - 4, Y(0) + 3);
  g.textAlign = 'center'; g.fillText(fplain(x.min), L, Hh - 8); g.fillText(fplain(x.max), W - R - 10, Hh - 8);
  g.fillText((x.symText || x.id) + (x.unit ? ' (' + x.unit + ')' : ''), (L + W) / 2, Hh - 8);
  g.save(); g.translate(10, (T + Hh - B) / 2); g.rotate(-PI / 2); g.textAlign = 'center'; g.fillText(dv.short + (dv.unit ? ' (' + dv.unit + ')' : ''), 0, 0); g.restore();
  const line = (arr, col, dash) => { g.strokeStyle = col; g.lineWidth = 2.2; g.setLineDash(dash || []); g.beginPath(); let on = false; arr.forEach((y, i) => { if (!isFinite(y)){ on = false; return; } const px = X(xs[i]), py = Math.max(T - 4, Math.min(Hh - B + 4, Y(y))); on ? g.lineTo(px, py) : g.moveTo(px, py); on = true; }); g.stroke(); g.setLineDash([]); };
  if (ref){ line(rs, '#4a4a4a', [5, 4]); g.fillStyle = '#4a4a4a'; g.textAlign = 'right'; g.font = '600 10px "Space Grotesk",sans-serif'; const lastY = rs.filter(isFinite).pop(); if (isFinite(lastY)) g.fillText(ref.short, W - R - 2, Math.max(T + 9, Y(lastY) - 4)); }
  line(ys, '#1546d6');
  const cx = S.v[S.gx], cy = dv.f(S.d);
  if (isFinite(cy)){ g.strokeStyle = '#ff6a2b'; g.setLineDash([2, 3]); g.lineWidth = 1; g.beginPath(); g.moveTo(X(cx), Hh - B); g.lineTo(X(cx), Y(cy)); g.lineTo(L, Y(cy)); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#ff6a2b'; g.strokeStyle = '#111'; g.lineWidth = 1.5; g.beginPath(); g.arc(X(cx), Math.max(T, Math.min(Hh - B, Y(cy))), 4.5, 0, 7); g.fill(); g.stroke(); }
  // doubling readout
  const d2 = calcWith({ [S.gx]: cx * 2 }), y1 = dv.f(S.d), y2 = dv.f(d2);
  let msg = '';
  if (cx === 0 || Math.abs(y1) < 1e-12) msg = '<span class="hint">Move off zero to see the ×2 test.</span>';
  else if (!isFinite(y1) || !isFinite(y2)) msg = '<span class="hint">The ×2 test doesn’t apply here (doubling takes it outside what this quantity covers).</span>';
  else {
    const k = y2 / y1;
    if (k < 0){ $('dbl').innerHTML = 'If <b>' + x.sym + '</b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '</b> goes from ' + fnum(y1) + ' to ' + fnum(y2) + (dv.unit ? ' ' + dv.unit : '') + (dv.signOK ? ': it changes sign. ' + dv.signOK : ': it changes sign, so that can’t really happen.'); return; }
    const tags = [[1, 'doesn’t depend on it'], [2, 'proportional'], [4, 'goes as the square'], [0.5, 'inversely proportional'], [0.25, 'inverse square'], [Math.SQRT2, 'goes as the square root'], [Math.SQRT1_2, 'goes as 1/√'], [8, 'goes as the cube'], [2 * Math.SQRT2, 'goes as the 3/2 power']];
    const tag = tags.find(([v]) => Math.abs(k - v) < 0.004 * v);
    msg = 'If <b>' + x.sym + '</b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '</b> becomes <b>×' + (Math.abs(k) >= 100 ? fnum(k) : k.toFixed(2)) + '</b>' + (tag && !dv.noTag ? ' — ' + tag[1] : '') + '.' + (dv.dblNote ? ' <span class="hint">' + dv.dblNote + '</span>' : '');
  }
  $('dbl').innerHTML = msg;
}

// drawing helpers (canvas is drawn in 600×330 units)
const cv = $('cv'), ctx = cv.getContext('2d');
function arrow(x1, y1, x2, y2, col, label, opts){
  opts = opts || {}; const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy); if (len < 2) return;
  const ux = dx / len, uy = dy / len, hw = opts.head || 9;
  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = opts.w || 3.5; ctx.lineCap = 'round';
  if (opts.dash) ctx.setLineDash(opts.dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hw * 0.8, y2 - uy * hw * 0.8); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - ux * hw - uy * hw * 0.55, y2 - uy * hw + ux * hw * 0.55); ctx.lineTo(x2 - ux * hw + uy * hw * 0.55, y2 - uy * hw - ux * hw * 0.55); ctx.closePath(); ctx.fill();
  if (label){ ctx.font = '700 13px "Space Grotesk",sans-serif'; ctx.textAlign = opts.align || 'left'; ctx.textBaseline = 'middle';
    const lx = x2 + (opts.lx !== undefined ? opts.lx : (ux >= 0 ? 6 : -6)), ly = y2 + (opts.ly !== undefined ? opts.ly : (uy >= 0 ? 10 : -10));
    if (opts.align === undefined) ctx.textAlign = ux >= -0.2 ? 'left' : 'right';
    ctx.fillText(label, lx, ly); }
  ctx.restore();
}
function text(s, x, y, o){ o = o || {}; ctx.save(); ctx.font = (o.font || '600 13px "Space Grotesk",sans-serif'); ctx.fillStyle = o.col || '#111'; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic'; ctx.fillText(s, x, y); ctx.restore(); }
function panelTitle(s, x, y){ text(s, x, y, { font: '700 11px "IBM Plex Mono",monospace', col: '#4a4a4a' }); }
const COL = { F: '#c43a00', W: '#111', N: '#1e7d45', V: '#1546d6', T: '#7a3fb0', comp: '#8a8a8a' };

let last = 0;
function loop(ts){ const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts; S.t += dt;
  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, 600, 330);
  SIM.draw(S.v, S.d, S.mode, S.opt, S.t, dt, S.anim); S.anim.reset = false;
  requestAnimationFrame(loop); }

// ---------------- this sim ----------------
// Photogate Ramp (AP 1 kinematics lab rehearsal): a cart on a frictionless ramp (a = g sin θ) passes a photogate; the flag's blocked time Δt gives v = w/Δt. One gate: v² = 2ad. Two gates: a = Δv/Δt. Record points and plot v² vs d.
const PGF = '"Space Grotesk",sans-serif', PGM = '"IBM Plex Mono",monospace';
const PG = { pts: [], th: null, btn: [], msg: '', msgT: -9, cur: null };
const PGK = 215;                       // drawing scale: pixels per metre along the ramp
const PGC = ['#7a3fb0', '#1546d6'];     // gate 1, gate 2 colours
const tAt = (s, a) => Math.sqrt(2 * s / a);

const SIM = {
  title: 'Photogate Ramp',
  hint: 'v = w/Δt · v² = 2ad · a = g sin θ · g = 10 m/s²',
  modes: [{ id: 'one', label: 'One gate: v² = 2ad' }, { id: 'two', label: 'Two gates: a = Δv/Δt' }],
  ivs(mode){
    const th = { id: 'th', sym: 'θ', symText: 'θ', label: 'Ramp angle', unit: '°', min: 5, max: 30, step: 1, val: 20 };
    const w = { id: 'w', sym: 'w', symText: 'w', label: 'Flag width', unit: 'cm', min: 1, max: 10, step: 0.5, val: 3 };
    if (mode === 'two') return [th,
      { id: 'd1', sym: 'd<sub>1</sub>', symText: 'd1', label: 'Gate 1 position', unit: 'm', min: 0.15, max: 0.7, step: 0.05, val: 0.3, graph: true },
      { id: 'd2', sym: 'd<sub>2</sub>', symText: 'd2', label: 'Gate 2 position', unit: 'm', min: 0.4, max: 1.2, step: 0.05, val: 0.9 }, w];
    return [th, { id: 'd', sym: 'd', symText: 'd', label: 'Gate distance', unit: 'm', min: 0.2, max: 1.2, step: 0.05, val: 0.6, graph: true }, w];
  },
  presets: [{ label: 'Skinny flag (1 cm)', mode: 'one', v: { th: 20, d: 0.6, w: 1 } }, { label: 'Wide flag, close gate', mode: 'one', v: { th: 20, d: 0.2, w: 10 } },
    { label: 'Steep ramp', mode: 'one', v: { th: 30, d: 0.8, w: 3 } }, { label: 'Gentle ramp', mode: 'two', v: { th: 10, d: 0.5, w: 3, d1: 0.3, d2: 1.0 } }],
  calc(v, mode){
    const a = 10 * Math.sin(v.th * DEG), w = v.w / 100;
    const gate = dd => { const t1 = tAt(dd - w / 2, a), t2 = tAt(dd + w / 2, a); return { d: dd, t1, t2, dt: t2 - t1, v: w / (t2 - t1), vt: Math.sqrt(2 * a * dd) }; };
    if (mode === 'two'){
      const ds = [v.d1, v.d2].sort((x, y) => x - y), g1 = gate(ds[0]), g2 = gate(ds[1]), bad = ds[1] - ds[0] < 0.05, T = g2.t1 - g1.t1;
      return { two: true, a, w, gs: [g1, g2], g1, g2, T, bad, aMeas: bad ? NaN : (g2.v - g1.v) / T, send: ds[1] + w / 2 + 0.1 };
    }
    const g1 = gate(v.d);
    return { two: false, a, w, gs: [g1], g1, aMeas: g1.v * g1.v / (2 * v.d), send: v.d + w / 2 + 0.1 };
  },
  dvs(mode){
    const ath = { id: 'ath', name: 'Theory a = g sin θ', short: 'g sin θ', sym: 'g sin θ', unit: 'm/s²', f: d => d.a };
    if (mode === 'two') return [{ id: 'am', name: 'a from Δv/Δt', short: 'a', sym: 'a', unit: 'm/s²', vs: 'ath', f: d => d.aMeas },
      ath, { id: 'T', name: 'Time between gates', short: 'T', sym: 'T', unit: 's', f: d => d.T }, { id: 'v2', name: 'Speed at gate 2', short: 'v₂', sym: 'v<sub>2</sub>', unit: 'm/s', f: d => d.g2.v }];
    return [{ id: 'v', name: 'v = w/Δt', short: 'v', sym: 'v', unit: 'm/s', vs: 'vt', f: d => d.g1.v },
      { id: 'vt', name: 'True speed at gate', short: 'true v', sym: 'v<sub>true</sub>', unit: 'm/s', f: d => d.g1.vt },
      { id: 'dt', name: 'Blocked time Δt', short: 'Δt', sym: 'Δt', unit: 'ms', f: d => d.g1.dt * 1000 },
      { id: 'am', name: 'a from v² = 2ad', short: 'a', sym: 'a', unit: 'm/s²', vs: 'ath', f: d => d.aMeas }, ath];
  },
  work(v, d, mode){ syncTh(v); return mode === 'two' ? workTwo(v, d) : workOne(v, d); },
  draw(v, d, mode, opt, t, dt, A){ drawPG(v, d, mode, t, A); }
};

function syncTh(v){ if (PG.th !== null && PG.th !== v.th){ PG.pts.length = 0; PG.msg = 'Cleared (new angle)'; PG.msgT = S.t; } PG.th = v.th; }
function lsq(pts){ const n = pts.length; if (n < 2) return null; let sx = 0, sy = 0, sxx = 0, sxy = 0; pts.forEach(([x, y]) => { sx += x; sy += y; sxx += x * x; sxy += x * y; }); const den = n * sxx - sx * sx; if (Math.abs(den) < 1e-12) return null; const m = (n * sxy - sx * sy) / den; return { m, b: (sy - m * sx) / n }; }
function compareA(am, a){ const pc = (am - a) / a * 100; return '<p class="st">Your a is ' + H.n(Math.abs(pc), '%') + (pc < 0 ? ' below' : ' above') + ' the theory value' + (Math.abs(pc) < 3 ? ': a good match.' : '.') + '</p>'; }

function workOne(v, d){
  const g = d.g1, pts = PG.pts, n = pts.length;
  let h = '<h4>1 · The gate gives Δt</h4><p class="st">The flag (width w) blocks the beam while it passes. The timer reads:</p>' + ("<math class=\"ans\" display=\"block\"><mrow><mi>&#x00394;</mi><mi>t</mi><mo>&#x0003D;</mo>" + (M.n(g.dt * 1000, 'ms')) + "</mrow></math>");
  h += '<h4>2 · Speed from the flag</h4><p class="st">The flag moves its own width in Δt. (Δt = ' + H.n(g.dt, 's') + '.)</p>' + ("<math display=\"block\"><mrow><mi>v</mi><mo>&#x0003D;</mo><mfrac><mrow><mi>w</mi></mrow><mrow><mi>&#x00394;</mi><mi>t</mi></mrow></mfrac></mrow></math>") + ("<math display=\"block\"><mrow><mi>v</mi><mo>&#x0003D;</mo><mfrac><mrow>" + (M.iv('w', 0.01)) + "<mspace width=\"0.167em\" /><mtext>m</mtext></mrow><mrow>" + (M.n(g.dt, 's')) + "</mrow></mfrac></mrow></math>") + ("<math class=\"ans\" display=\"block\"><mrow><mi>v</mi><mo>&#x0003D;</mo>" + (M.n(g.v, 'm/s')) + "</mrow></math>");
  h += '<p class="note">This is the <b>average</b> speed over the flag. The true speed at the gate is ' + H.n(g.vt, 'm/s') + ' (' + fnum(Math.abs(g.v - g.vt) / g.vt * 100) + '% different). A narrower flag gives a better match.</p>';
  h += '<h4>3 · Acceleration from v² = 2ad</h4><p class="st">The cart starts from rest, so:</p>' + ("<math display=\"block\"><mrow><msup><mi>v</mi><mn>2</mn></msup><mo>&#x0003D;</mo><mn>2</mn><mi>a</mi><mi>d</mi></mrow></math>") + ("<math display=\"block\"><mrow><mi>a</mi><mo>&#x0003D;</mo><mfrac><mrow><msup><mi>v</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><mi>d</mi></mrow></mfrac></mrow></math>") + ("<math display=\"block\"><mrow><mi>a</mi><mo>&#x0003D;</mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;</mo>" + (M.n(g.v)) + "<msup><mo stretchy=\"false\">&#x00029;</mo><mn>2</mn></msup></mrow><mrow><mn>2</mn><mspace width=\"0.167em\" /><mo stretchy=\"false\">&#x00028;</mo>" + (M.iv('d')) + "<mo stretchy=\"false\">&#x00029;</mo></mrow></mfrac></mrow></math>") + ("<math class=\"ans\" display=\"block\"><mrow><mi>a</mi><mo>&#x0003D;</mo>" + (M.n(d.aMeas, 'm/s²')) + "</mrow></math>");
  h += '<h4>4 · Compare with the ramp</h4><p class="st">No friction, so gravity along the slope is all there is:</p>' + ("<math display=\"block\"><mrow><mi>a</mi><mo>&#x0003D;</mo><mi>g</mi><mspace width=\"0.167em\"/><mi>sin</mi><mspace width=\"0.167em\"/><mi>&#x003B8;</mi></mrow></math>") + ("<math display=\"block\"><mrow><mi>a</mi><mo>&#x0003D;</mo>" + (M.n(10)) + "<mspace width=\"0.167em\" /><mi>sin</mi><mspace width=\"0.167em\"/>" + (M.iv('th')) + "</mrow></math>") + ("<math class=\"ans\" display=\"block\"><mrow><mi>a</mi><mo>&#x0003D;</mo>" + (M.n(d.a, 'm/s²')) + "</mrow></math>") + compareA(d.aMeas, d.a);
  h += '<h4>5 · Your data</h4>';
  if (n < 2) return h + '<p class="st">Press <b>Record</b> at several gate distances d (same angle). Points so far: ' + n + '. Then v² vs d should be a straight line.</p>';
  const L = lsq(pts.map(p => [p.d, p.v * p.v]));
  if (!L) return h + '<p class="st">Use different gate distances so the points spread out.</p>';
  return h + '<p class="st">From v² = 2ad, a graph of v² against d has slope 2a. Best-fit line through your ' + n + ' points:</p>' + ("<math display=\"block\"><mrow><mtext>slope</mtext><mo>&#x0003D;</mo>" + (M.n(L.m, 'm/s²')) + "</mrow></math>") + ("<math display=\"block\"><mrow><mi>a</mi><mo>&#x0003D;</mo><mfrac><mrow><mtext>slope</mtext></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></math>") + ("<math display=\"block\"><mrow><mi>a</mi><mo>&#x0003D;</mo><mfrac><mrow>" + (M.n(L.m)) + "</mrow><mrow><mn>2</mn></mrow></mfrac></mrow></math>") + ("<math class=\"ans\" display=\"block\"><mrow><mi>a</mi><mo>&#x0003D;</mo>" + (M.n(L.m / 2, 'm/s²')) + "</mrow></math>") + compareA(L.m / 2, d.a);
}
function workTwo(v, d){
  const a = d.g1, b = d.g2;
  if (d.bad) return '<h4>Gates too close</h4><div class="bad">The two gates are almost on top of each other, so there is hardly any time between them. Move gate 2 farther down the ramp.</div>';
  let h = '<h4>1 · Speed at each gate</h4><p class="st">The same flag (width w) passes both gates.</p>';
  h += ("<math display=\"block\"><mrow><msub><mi>v</mi><mn>1</mn></msub><mo>&#x0003D;</mo><mfrac><mrow><mi>w</mi></mrow><mrow><mi>&#x00394;</mi><msub><mi>t</mi><mn>1</mn></msub></mrow></mfrac></mrow></math>") + ("<math display=\"block\"><mrow><msub><mi>v</mi><mn>1</mn></msub><mo>&#x0003D;</mo><mfrac><mrow>" + (M.iv('w', 0.01)) + "<mspace width=\"0.167em\" /><mtext>m</mtext></mrow><mrow>" + (M.n(a.dt, 's')) + "</mrow></mfrac></mrow></math>") + ("<math class=\"ans\" display=\"block\"><mrow><msub><mi>v</mi><mn>1</mn></msub><mo>&#x0003D;</mo>" + (M.n(a.v, 'm/s')) + "</mrow></math>");
  h += ("<math display=\"block\"><mrow><msub><mi>v</mi><mn>2</mn></msub><mo>&#x0003D;</mo><mfrac><mrow><mi>w</mi></mrow><mrow><mi>&#x00394;</mi><msub><mi>t</mi><mn>2</mn></msub></mrow></mfrac></mrow></math>") + ("<math display=\"block\"><mrow><msub><mi>v</mi><mn>2</mn></msub><mo>&#x0003D;</mo><mfrac><mrow>" + (M.iv('w', 0.01)) + "<mspace width=\"0.167em\" /><mtext>m</mtext></mrow><mrow>" + (M.n(b.dt, 's')) + "</mrow></mfrac></mrow></math>") + ("<math class=\"ans\" display=\"block\"><mrow><msub><mi>v</mi><mn>2</mn></msub><mo>&#x0003D;</mo>" + (M.n(b.v, 'm/s')) + "</mrow></math>");
  h += '<h4>2 · Time between the gates</h4><p class="st">The timer also reads how long the cart took to get from gate 1 to gate 2:</p>' + ("<math class=\"ans\" display=\"block\"><mrow><mi>T</mi><mo>&#x0003D;</mo>" + (M.n(d.T, 's')) + "</mrow></math>");
  h += '<h4>3 · Acceleration</h4><p class="st">Acceleration is the change in speed divided by the time it took:</p>' + ("<math display=\"block\"><mrow><mi>a</mi><mo>&#x0003D;</mo><mfrac><mrow><msub><mi>v</mi><mn>2</mn></msub><mo>&#x02212;</mo><msub><mi>v</mi><mn>1</mn></msub></mrow><mrow><mi>T</mi></mrow></mfrac></mrow></math>") + ("<math display=\"block\"><mrow><mi>a</mi><mo>&#x0003D;</mo><mfrac><mrow>" + (M.n(b.v)) + "<mo>&#x02212;</mo>" + (M.n(a.v)) + "</mrow><mrow>" + (M.n(d.T)) + "</mrow></mfrac></mrow></math>") + ("<math class=\"ans\" display=\"block\"><mrow><mi>a</mi><mo>&#x0003D;</mo>" + (M.n(d.aMeas, 'm/s²')) + "</mrow></math>");
  h += '<h4>4 · Compare with the ramp</h4>' + ("<math display=\"block\"><mrow><mi>a</mi><mo>&#x0003D;</mo><mi>g</mi><mspace width=\"0.167em\"/><mi>sin</mi><mspace width=\"0.167em\"/><mi>&#x003B8;</mi></mrow></math>") + ("<math display=\"block\"><mrow><mi>a</mi><mo>&#x0003D;</mo>" + (M.n(10)) + "<mspace width=\"0.167em\" /><mi>sin</mi><mspace width=\"0.167em\"/>" + (M.iv('th')) + "</mrow></math>") + ("<math class=\"ans\" display=\"block\"><mrow><mi>a</mi><mo>&#x0003D;</mo>" + (M.n(d.a, 'm/s²')) + "</mrow></math>") + compareA(d.aMeas, d.a);
  return h + '<p class="note">A small difference is normal: each v = w/Δt is an average over the flag, not the exact speed at the beam.</p>';
}

function btnDraw(x, y, w, h, label, hot){ PG.btn.push({ x, y, w, h, label }); ctx.save(); ctx.fillStyle = hot ? '#ff6a2b' : '#fff'; ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h); ctx.restore(); text(label, x + w / 2, y + h / 2 + 4.5, { align: 'center', font: '700 12px ' + PGF, col: hot ? '#fff' : '#111' }); }
function pgReplay(){ S.anim.reset = true; }
function pgRecord(){
  const c = PG.cur; if (!c || c.mode !== 'one') return; const g = c.d.g1;
  const k = PG.pts.findIndex(p => Math.abs(p.d - c.v.d) < 0.001);
  if (k >= 0){ PG.pts[k] = { d: c.v.d, dt: g.dt, v: g.v }; PG.msg = 'Updated #' + (k + 1); }
  else if (PG.pts.length >= 6){ PG.msg = 'Table full: clear it'; PG.msgT = S.t; return update(); }
  else { PG.pts.push({ d: c.v.d, dt: g.dt, v: g.v }); PG.msg = 'Recorded #' + PG.pts.length; }
  PG.msgT = S.t; update();
}
function pgClear(){ PG.pts.length = 0; PG.msg = 'Table cleared'; PG.msgT = S.t; update(); }
const PGACT = { 'Replay': pgReplay, 'Record': () => S.mode === 'one' && pgRecord(), 'Clear': () => S.mode === 'one' && pgClear() };
(function(){
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 600, (e.clientY - r.top) / r.height * 330]; };
  const hit = e => { const [x, y] = pos(e); return PG.btn.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h); };
  cv.addEventListener('pointerdown', e => { const b = hit(e); if (b && PGACT[b.label]){ PGACT[b.label](); e.preventDefault(); } });
  cv.addEventListener('pointermove', e => { cv.style.cursor = hit(e) ? 'pointer' : ''; });
  document.addEventListener('keydown', e => { if (e.ctrlKey || e.metaKey || e.altKey) return; const tg = e.target && e.target.tagName; if (tg === 'BUTTON' || tg === 'SELECT') return;
    const k = e.key.toLowerCase(); if (k === 'p') pgReplay(); else if (k === 'r' && S.mode === 'one') pgRecord(); else if (k === 'c' && S.mode === 'one') pgClear(); });
})();
function niceMax(x){ const p = Math.pow(10, Math.floor(Math.log10(x))), m = x / p; return p * [1, 2, 2.5, 5, 10].find(q => q >= m - 1e-9); }

function drawPG(v, d, mode, t, A){
  syncTh(v); PG.btn = []; PG.cur = { v, d, mode };
  if (A.t0 === undefined || A.reset) A.t0 = t;
  const th = v.th * DEG, a = d.a, tau = Math.max(0, t - A.t0 - 0.5), P0x = 24, P0y = 72, K = PGK, Lp = 1.5 * K;
  const s = Math.min(d.send, 0.5 * a * tau * tau), wpx = v.w / 100 * K;
  panelTitle('PHOTOGATE RAMP', 10, 18);
  // wedge + ground
  const P1x = P0x + Lp * Math.cos(th), P1y = P0y + Lp * Math.sin(th);
  ctx.fillStyle = '#efeadb'; ctx.beginPath(); ctx.moveTo(P0x, P0y); ctx.lineTo(P1x, P1y); ctx.lineTo(P0x, P1y); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(8, P1y + 9); ctx.lineTo(378, P1y + 9); ctx.stroke();
  ctx.save(); ctx.translate(P0x, P0y); ctx.rotate(th);
  ctx.fillStyle = '#cfc8b4'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.fillRect(-30, 0, Lp + 30, 8); ctx.strokeRect(-30, 0, Lp + 30, 8);
  ctx.fillStyle = '#8a8a8a'; ctx.fillRect(-26, -14, 4, 14);
  // cm tick marks every 10 cm
  ctx.strokeStyle = '#555'; ctx.lineWidth = 1; for (let m = 0; m <= 1.5001; m += 0.1){ ctx.beginPath(); ctx.moveTo(m * K, 8); ctx.lineTo(m * K, Math.abs(m * 10 % 5) < 1e-6 && Math.round(m * 10) % 5 === 0 ? 12 : 11); ctx.stroke(); }
  // distance lines from the release point
  d.gs.forEach((g, i) => { const x = g.d * K, yy = 22 + i * 14; ctx.strokeStyle = PGC[d.two ? i : 0]; ctx.lineWidth = 1.3; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(x, yy); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(0, yy - 4); ctx.lineTo(0, yy + 4); ctx.moveTo(x, yy - 4); ctx.lineTo(x, yy + 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, 8); ctx.lineTo(x, yy - 4); ctx.stroke();
    text((d.two ? 'd' + (i + 1) + ' = ' : 'd = ') + fplain(g.d) + ' m', Math.max(x / 2, 34), yy - 4, { align: 'center', font: '700 10.5px ' + PGF, col: PGC[d.two ? i : 0] }); });
  // gates
  const lit = d.gs.map(g => tau >= g.t1 && tau <= g.t2 + 0.45), blocked = d.gs.map(g => tau >= g.t1 && tau <= g.t2);
  d.gs.forEach((g, i) => { const x = g.d * K, col = PGC[d.two ? i : 0];
    ctx.fillStyle = '#3a3a3a'; ctx.fillRect(x - 6, -48, 12, 28); ctx.fillStyle = col; ctx.fillRect(x - 6, -48, 12, 5);
    if (d.two){ ctx.save(); ctx.fillStyle = '#fff'; ctx.font = '700 9px ' + PGM; ctx.textAlign = 'center'; ctx.fillText(String(i + 1), x, -22); ctx.restore(); }
    ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, -20); ctx.lineTo(x, 0); ctx.stroke();
    if (lit[i]){ ctx.fillStyle = 'rgba(214,40,40,0.28)'; ctx.beginPath(); ctx.arc(x, -34, 11, 0, 7); ctx.fill(); }
    ctx.fillStyle = lit[i] ? '#e02020' : '#1e7d45'; ctx.beginPath(); ctx.arc(x, -34, 4.2, 0, 7); ctx.fill(); });
  // cart with flag
  const cx = s * K;
  ctx.fillStyle = '#1546d6'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.fillRect(cx - 18, -14, 36, 10); ctx.strokeRect(cx - 18, -14, 36, 10);
  ctx.fillStyle = '#fff'; [-11, 11].forEach(o => { ctx.beginPath(); ctx.arc(cx + o, -3, 3.4, 0, 7); ctx.fill(); ctx.stroke(); });
  ctx.fillStyle = '#ff6a2b'; ctx.fillRect(cx - wpx / 2, -38, wpx, 24); ctx.strokeRect(cx - wpx / 2, -38, wpx, 24);
  ctx.restore();
  // status
  const anyB = blocked.some(Boolean);
  text(anyB ? 'BEAM BLOCKED' : 'beam clear', 382, 18, { align: 'right', font: '700 11px ' + PGM, col: anyB ? '#c43a00' : '#1e7d45' });
  // readouts
  const ms = g => fplain(g.dt * 1000) + ' ms';
  if (!d.two){ const g = d.g1;
    text('Δt = ' + ms(g) + '    v = w/Δt = ' + fplain(g.v) + ' m/s', 14, 256, { font: '700 12.5px ' + PGF, col: '#7a3fb0' });
    text('true speed at the gate = ' + fplain(g.vt) + ' m/s', 14, 271, { font: '600 12px ' + PGF, col: '#4a4a4a' });
    text('a = v²/2d = ' + fplain(d.aMeas) + ' m/s²    g sin θ = ' + fplain(d.a) + ' m/s²', 14, 286, { font: '700 12.5px ' + PGF, col: '#1546d6' });
  } else if (d.bad) text('Gates too close: move gate 2 down the ramp', 14, 262, { font: '700 12.5px ' + PGF, col: '#c43a00' });
  else {
    d.gs.forEach((g, i) => text('gate ' + (i + 1) + ': Δt = ' + ms(g) + ', v = ' + fplain(g.v) + ' m/s', 14, 256 + i * 15, { font: '700 12.5px ' + PGF, col: PGC[i] }));
    text('T = ' + fplain(d.T) + ' s → a = Δv/T = ' + fplain(d.aMeas) + ' m/s²  (g sin θ = ' + fplain(d.a) + ')', 14, 286, { font: '700 12px ' + PGF, col: '#111' });
  }
  // buttons
  btnDraw(14, 294, 70, 26, 'Replay', false);
  if (mode === 'one'){ btnDraw(92, 294, 74, 26, 'Record', S.t - PG.msgT < 0.25); btnDraw(174, 294, 60, 26, 'Clear', false); }
  const hx = mode === 'one' ? 242 : 96;
  if (S.t - PG.msgT < 3.5) text(PG.msg, hx, 311, { font: '600 10.5px ' + PGF, col: '#4a4a4a' }); else text(mode === 'one' ? 'keys: P replay, R record' : 'key: P replay', hx, 311, { font: '500 10px ' + PGM, col: '#8a8a8a' });
  if (mode === 'one') drawOneRight(v, d); else drawTwoRight(d);
}

function drawOneRight(v, d){
  panelTitle('DATA TABLE', 395, 18);
  [['d(m)', 446], ['Δt(ms)', 498], ['v(m/s)', 547], ['v²', 593]].forEach(([a, x]) => text(a, x, 33, { align: 'right', font: '700 9.5px ' + PGM, col: '#4a4a4a' }));
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(396, 37); ctx.lineTo(596, 37); ctx.stroke();
  PG.pts.forEach((p, i) => { const y = 49 + i * 12, f = { font: '600 11px ' + PGM }; text(String(i + 1), 400, y, { font: '500 10px ' + PGM, col: '#8a8a8a' }); text(fplain(p.d), 446, y, Object.assign({ align: 'right' }, f)); text(fplain(p.dt * 1000), 498, y, Object.assign({ align: 'right' }, f)); text(fplain(p.v), 547, y, Object.assign({ align: 'right' }, f)); text(fplain(p.v * p.v), 593, y, Object.assign({ align: 'right' }, f)); });
  if (!PG.pts.length) text('(empty: press Record)', 400, 53, { font: '500 10.5px ' + PGF, col: '#8a8a8a' });
  const L = lsq(PG.pts.map(p => [p.d, p.v * p.v]));
  if (L){ text('slope = 2a = ' + fplain(L.m) + ' m/s²', 395, 127, { font: '600 11px ' + PGF, col: '#1546d6' }); text('a = ' + fplain(L.m / 2) + ' m/s²  (theory ' + fplain(d.a) + ')', 395, 140, { font: '700 11.5px ' + PGF, col: '#1546d6' }); }
  const ymax = niceMax(2 * d.a * 1.2 * 1.05), px0 = 432, px1 = 584, py0 = 292, py1 = 168, PX = x => px0 + x / 1.2 * (px1 - px0), PY = y => py0 - y / ymax * (py0 - py1);
  panelTitle('v² (m²/s²) vs d (m)', 395, 156);
  ctx.strokeStyle = '#e3e0d6'; ctx.lineWidth = 1; [0.6, 1.2].forEach(x => { ctx.beginPath(); ctx.moveTo(PX(x), py0); ctx.lineTo(PX(x), py1); ctx.stroke(); }); [ymax / 2, ymax].forEach(y => { ctx.beginPath(); ctx.moveTo(px0, PY(y)); ctx.lineTo(px1, PY(y)); ctx.stroke(); });
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(px0, py1 - 3); ctx.lineTo(px0, py0); ctx.lineTo(px1 + 4, py0); ctx.stroke();
  [0, 0.6, 1.2].forEach(x => text(x === 0 ? '0' : String(x), PX(x), py0 + 12, { align: 'center', font: '500 9px ' + PGM, col: '#4a4a4a' }));
  [[0, '0'], [ymax / 2, fplain(ymax / 2)], [ymax, fplain(ymax)]].forEach(([y, s]) => text(s, px0 - 4, PY(y) + 3, { align: 'right', font: '500 9px ' + PGM, col: '#4a4a4a' }));
  ctx.save(); ctx.beginPath(); ctx.rect(px0, py1 - 4, px1 - px0 + 4, py0 - py1 + 4); ctx.clip();
  ctx.strokeStyle = '#8a8a8a'; ctx.lineWidth = 1.3; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(PX(0), PY(0)); ctx.lineTo(PX(1.2), PY(2 * d.a * 1.2)); ctx.stroke(); ctx.setLineDash([]);
  if (L){ ctx.strokeStyle = '#1546d6'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(PX(0), PY(L.b)); ctx.lineTo(PX(1.2), PY(L.m * 1.2 + L.b)); ctx.stroke(); }
  ctx.restore();
  PG.pts.forEach(p => { ctx.fillStyle = '#ff6a2b'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(PX(p.d), PY(p.v * p.v), 3.8, 0, 7); ctx.fill(); ctx.stroke(); });
  text('dashed: theory', px1, py1 + 9, { align: 'right', font: '500 9.5px ' + PGM, col: '#8a8a8a' });
  if (!L) text(PG.pts.length ? 'need 2+ points for a line' : 'points will appear here', (px0 + px1) / 2, 235, { align: 'center', font: '500 10.5px ' + PGF, col: '#8a8a8a' });
}

function drawTwoRight(d){
  panelTitle('TWO GATES', 395, 18);
  [['d(m)', 488], ['Δt(ms)', 542], ['v(m/s)', 593]].forEach(([a, x]) => text(a, x, 33, { align: 'right', font: '700 9.5px ' + PGM, col: '#4a4a4a' }));
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(396, 37); ctx.lineTo(596, 37); ctx.stroke();

  if (d.bad){ text('Gates too close together', 395, 90, { font: '700 11.5px ' + PGF, col: '#c43a00' }); return; }
  text('time between gates T = ' + fplain(d.T) + ' s', 395, 90, { font: '600 11.5px ' + PGF });
  text('Δv = v₂ − v₁ = ' + fplain(d.g2.v - d.g1.v) + ' m/s', 395, 105, { font: '600 11.5px ' + PGF });
  text('a = Δv/T = ' + fplain(d.aMeas) + ' m/s²', 395, 123, { font: '700 12.5px ' + PGF, col: '#1546d6' });
  text('theory g sin θ = ' + fplain(d.a) + ' m/s²', 395, 138, { font: '600 11px ' + PGF, col: '#4a4a4a' });
  const tmax = niceMax(d.g2.t1 * 1.15), vmax = niceMax(d.g2.v * 1.15), px0 = 432, px1 = 584, py0 = 292, py1 = 168, PX = x => px0 + x / tmax * (px1 - px0), PY = y => py0 - y / vmax * (py0 - py1);
  panelTitle('v (m/s) vs t (s)', 395, 156);
  ctx.strokeStyle = '#e3e0d6'; ctx.lineWidth = 1; [tmax / 2, tmax].forEach(x => { ctx.beginPath(); ctx.moveTo(PX(x), py0); ctx.lineTo(PX(x), py1); ctx.stroke(); }); [vmax / 2, vmax].forEach(y => { ctx.beginPath(); ctx.moveTo(px0, PY(y)); ctx.lineTo(px1, PY(y)); ctx.stroke(); });
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(px0, py1 - 3); ctx.lineTo(px0, py0); ctx.lineTo(px1 + 4, py0); ctx.stroke();
  [0, tmax / 2, tmax].forEach(x => text(x === 0 ? '0' : fplain(x), PX(x), py0 + 12, { align: 'center', font: '500 9px ' + PGM, col: '#4a4a4a' }));
  [[0, '0'], [vmax / 2, fplain(vmax / 2)], [vmax, fplain(vmax)]].forEach(([y, s]) => text(s, px0 - 4, PY(y) + 3, { align: 'right', font: '500 9px ' + PGM, col: '#4a4a4a' }));
  ctx.save(); ctx.beginPath(); ctx.rect(px0, py1 - 4, px1 - px0 + 4, py0 - py1 + 4); ctx.clip();
  ctx.strokeStyle = '#8a8a8a'; ctx.lineWidth = 1.3; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(PX(0), PY(0)); ctx.lineTo(PX(tmax), PY(d.a * tmax)); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = '#1546d6'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(PX(d.g1.t1), PY(d.g1.v)); ctx.lineTo(PX(d.g2.t1), PY(d.g2.v)); ctx.stroke(); ctx.restore();
  d.gs.forEach((g, i) => { ctx.fillStyle = PGC[i]; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(PX(g.t1), PY(g.v), 4, 0, 7); ctx.fill(); ctx.stroke(); });
  text('slope of the blue line = a', px1, py0 - 5, { align: 'right', font: '500 9.5px ' + PGM, col: '#1546d6' });
}



S.mode = SIM.modes ? SIM.modes[0].id : 'one';
setup(); requestAnimationFrame(loop);
window.APP = { select(name, only){ if (!SIM.modes) return; if (!SIM._all) SIM._all = SIM.modes.slice(); const before = SIM.modes.map(m => m.id).join();
  SIM.modes = only && only.length ? SIM._all.filter(m => only.includes(m.id) || only.includes(m.label)) : SIM._all.slice(); if (!SIM.modes.length) SIM.modes = SIM._all.slice();
  const m = SIM.modes.find(m => m.label === name || m.id === name) || SIM.modes.find(m => m.id === S.mode) || SIM.modes[0];
  if (m.id !== S.mode || SIM.modes.map(m => m.id).join() !== before){ S.mode = m.id; S.anim = {}; setup(); } } };
addEventListener('message', e => { const d = e.data; if (d && d.select) try { APP.select(d.select, d.modes); } catch (er) {} if (d && typeof d.big === 'boolean') setBig(d.big || BIG_SAVED, false); });
