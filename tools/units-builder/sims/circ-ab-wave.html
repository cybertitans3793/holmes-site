<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wave Basics</title>
<!-- Wave Basics: original Holmes Sims, built from frame.html + wave.js. g = 10 m/s². -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Space Grotesk",system-ui,sans-serif;color:#111}
#app{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0;padding:10px 14px 12px;box-sizing:border-box;
  display:grid;grid-template-columns:600px 1fr;grid-template-rows:34px 330px 1fr;gap:10px 14px}
#bar{grid-column:1/-1;display:flex;gap:16px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.seg{display:flex;align-items:center}
.seg .lab{font:700 12px "IBM Plex Mono",monospace;margin-right:8px;text-transform:uppercase}
.seg button{white-space:nowrap;font:700 14px "Space Grotesk",sans-serif;padding:6px 11px;border:2px solid #111;background:#fff;color:#111;cursor:pointer}
.seg button+button{margin-left:-2px}
.seg button[aria-pressed="true"]{background:#111;color:#fff}
.seg button:hover:not([aria-pressed="true"]){background:#ffe2d3}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ff6a2b;outline-offset:2px;position:relative;z-index:1}
#cv{border:2px solid #111;background:#fbfbfb;width:600px;height:330px;box-sizing:border-box;display:block}
#work{border:2px solid #111;padding:8px 12px 10px;overflow:auto;font-size:14px;line-height:1.55;box-sizing:border-box}
#work .wt{font:700 12px "IBM Plex Mono",monospace;text-transform:uppercase;margin:0 0 4px;display:flex;justify-content:space-between}
#work .wt .hint{text-transform:none}
#work h4{margin:9px 0 1px;font-size:13px;font-weight:700;color:#4a4a4a}
#work h4:first-of-type{margin-top:2px}
#work .eq{font-variant-numeric:tabular-nums}
#work .n{font-family:"IBM Plex Mono",monospace;font-size:13px}
#work b .n,#work .ans{font-weight:700}
#work .note{font-size:12.5px;color:#4a4a4a;margin:2px 0 0}
#work .ok{background:#e5f4ea;border-left:4px solid #1e7d45;padding:3px 8px;margin-top:4px}
#work .bad{background:#fde7df;border-left:4px solid #c43a00;padding:3px 8px;margin-top:4px}
.ivv{border-radius:2px;padding:0 2px;transition:background .25s}
.ivv.gx{background:#ffe2d3}
.ivv.hot{background:#ff6a2b;color:#fff}
#ctl{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;align-content:start}
.iv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:6px}
.iv .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iv .val{font:700 13px "IBM Plex Mono",monospace;white-space:nowrap}
.iv input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:#111;height:22px}
.iv input[type=radio]{accent-color:#ff6a2b;margin:0}
#presets{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
#presets .lab{font:700 12px "IBM Plex Mono",monospace}
#presets button{font:600 12.5px "Space Grotesk",sans-serif;padding:3px 8px;border:2px solid #111;background:#fff;cursor:pointer}
#presets button:hover{background:#ffe2d3}
#gcard{border:2px solid #111;padding:5px 8px 6px;display:flex;flex-direction:column;box-sizing:border-box;min-height:0}
.ghead{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.ghead select{font:600 13px "Space Grotesk",sans-serif;border:2px solid #111;padding:1px 4px;max-width:200px}
#gv{width:340px;height:150px;flex:none;display:block;margin-top:3px}
#dbl{font-size:12.5px;line-height:1.35;margin-top:2px}
#dbl b{font-weight:700}
.hint{font:500 11px "IBM Plex Mono",monospace;color:#4a4a4a}
</style></head><body>
<div id="app">
  <div id="bar"></div>
  <canvas id="cv" width="1200" height="660" aria-label="Animation of the situation with force arrows"></canvas>
  <div id="work" aria-live="polite"></div>
  <div id="ctl"></div>
  <div id="gcard">
    <div class="ghead"><span>Graph</span><select id="dvsel" aria-label="Quantity to graph"></select><span>vs <b id="ivname"></b></span></div>
    <canvas id="gv" width="680" height="300" aria-label="Graph of the chosen quantity against the chosen variable"></canvas>
    <div id="dbl"></div>
  </div>
</div>
<script>
// ---------------- shared frame ----------------
const $ = id => document.getElementById(id);
const G10 = 10, PI = Math.PI, DEG = PI / 180;
function fit(){ const s = Math.min(innerWidth / 1000, innerHeight / 640); $('app').style.transform = 'scale(' + s + ')'; }
addEventListener('resize', fit); fit();

function fnum(x){ const r = fnum0(x); return typeof r === 'string' ? r.replace(/^-/, '−') : r; }
function fnum0(x){
  if (x === null || x === undefined || !isFinite(x)) return '—';
  const a = Math.abs(x);
  if (a === 0) return '0';
  if (a >= 1e5 || a < 1e-3){
    const e = Math.floor(Math.log10(a)); let m = x / Math.pow(10, e);
    let ms = m.toFixed(2); if (Math.abs(+ms) >= 10){ m /= 10; ms = m.toFixed(2); return ms + '×10<sup>' + (e + 1) + '</sup>'; }
    return ms + '×10<sup>' + e + '</sup>';
  }
  if (a >= 1000) return String(Math.round(x));
  return x.toPrecision(3);
}
function fplain(x){ return fnum(x).replace(/<sup>(.*?)<\/sup>/g, (m, e) => '^' + e).replace('×10^', 'e'); }
const H = {
  n: (x, u) => '<span class="n">' + fnum(x) + (u ? '&nbsp;' + u : '') + '</span>',
  iv: id => { const d = S.def[id]; const val = S.v[id]; const txt = (d.show ? d.show(val) : fnum(val) + (d.unit ? '&nbsp;' + d.unit : ''));
              return '<span class="ivv n' + (S.gx === id ? ' gx' : '') + (S.hot === id ? ' hot' : '') + '" data-iv="' + id + '">' + txt + '</span>'; },
  g: () => '<span class="n">10&nbsp;m/s²</span>',
  p: (x, u) => x < 0 ? '(' + H.n(x, u) + ')' : H.n(x, u)
};

const S = { mode: null, opt: {}, v: {}, store: {}, def: {}, ivs: [], gx: null, dv: null, hot: null, t: 0, anim: {} };

function bar(){
  const b = $('bar'); b.innerHTML = '';
  const group = (label, items, cur, onpick) => {
    const g = document.createElement('div'); g.className = 'seg'; g.setAttribute('role', 'group');
    if (label){ const l = document.createElement('span'); l.className = 'lab'; l.textContent = label; g.appendChild(l); }
    items.forEach(([id, txt]) => { const bt = document.createElement('button'); bt.textContent = txt; bt.setAttribute('aria-pressed', String(id === cur)); bt.onclick = () => onpick(id); g.appendChild(bt); });
    b.appendChild(g);
  };
  const tip = document.createElement('span'); tip.className = 'hint'; tip.style.marginLeft = 'auto'; tip.style.whiteSpace = 'nowrap'; tip.innerHTML = '● = the variable on the graph’s x-axis · drag any slider';
  if (SIM.modes && SIM.modes.length > 1) group(null, SIM.modes.map(m => [m.id, m.label]), S.mode, id => { S.mode = id; S.anim = {}; setup(); });
  (SIM.opts || []).filter(o => !o.modes || o.modes.includes(S.mode)).forEach(o => {
    if (!(o.id in S.opt)) S.opt[o.id] = o.choices[0][0];
    group(o.label, o.choices, S.opt[o.id], id => { S.opt[o.id] = id; S.anim = {}; setup(); });
  });
  if (!SIM.noGraph) b.appendChild(tip);
  if (b.scrollWidth > b.clientWidth + 1) tip.remove();
  if (b.scrollWidth > b.clientWidth + 1) b.querySelectorAll('.seg button').forEach(x => { x.style.fontSize = '13px'; x.style.padding = '6px 8px'; });
}

function setup(){
  if (SIM.noGraph){ $('gcard').style.display = 'none'; $('cv').style.gridArea = '2 / 1 / 3 / 2'; $('work').style.gridArea = '2 / 2 / 4 / 3'; $('ctl').style.gridArea = '3 / 1 / 4 / 2'; }
  bar();
  S.ivs = SIM.ivs(S.mode, S.opt); S.def = {}; S.v = {};
  S.ivs.forEach(d => { S.def[d.id] = d; const k = S.mode + ':' + d.id; S.v[d.id] = (k in S.store) ? S.store[k] : d.val; });
  if (!S.gx || !S.def[S.gx]) S.gx = S.ivs.find(d => d.graph) ? S.ivs.find(d => d.graph).id : S.ivs[1] ? S.ivs[1].id : S.ivs[0].id;
  const c = $('ctl'); c.innerHTML = '';
  S.ivs.forEach(d => {
    const w = document.createElement('div'); w.className = 'iv';
    w.innerHTML = '<input type="radio" name="gx"' + (SIM.noGraph ? ' style="display:none"' : '') + ' value="' + d.id + '" aria-label="Graph against ' + d.label + '" title="Put this on the graph’s x-axis"' + (S.gx === d.id ? ' checked' : '') + '>' +
      '<span class="nm">' + d.label + ' <i>' + d.sym + '</i></span><span class="val" id="val-' + d.id + '"></span>' +
      '<input type="range" id="r-' + d.id + '" min="' + d.min + '" max="' + d.max + '" step="' + d.step + '" value="' + S.v[d.id] + '" aria-label="' + d.label + '">';
    c.appendChild(w);
    const r = w.querySelector('input[type=range]');
    r.oninput = () => { S.v[d.id] = +r.value; S.store[S.mode + ':' + d.id] = +r.value; S.hot = d.id; clearTimeout(S.hotT); S.hotT = setTimeout(() => { S.hot = null; update(); }, 700); S.anim.reset = true; update(); };
    w.querySelector('input[type=radio]').onchange = () => { S.gx = d.id; update(); };
  });
  if (SIM.presets){
    const p = document.createElement('div'); p.id = 'presets'; p.innerHTML = '<span class="lab">Try:</span>';
    SIM.presets.forEach(ps => { const bt = document.createElement('button'); bt.textContent = ps.label; bt.onclick = () => { if (ps.mode && ps.mode !== S.mode){ S.mode = ps.mode; } Object.entries(ps.v).forEach(([k, val]) => S.store[(ps.mode || S.mode) + ':' + k] = val); S.anim = {}; setup(); }; p.appendChild(bt); });
    c.appendChild(p);
  }
  const dvs = SIM.dvs(S.mode, S.opt), sel = $('dvsel');
  if (!S.dv || !dvs.find(d => d.id === S.dv)) S.dv = dvs[0].id;
  sel.innerHTML = dvs.map(d => '<option value="' + d.id + '"' + (d.id === S.dv ? ' selected' : '') + '>' + d.name + '</option>').join('');
  sel.onchange = () => { S.dv = sel.value; update(); };
  update();
}

function calcWith(over){ const v = Object.assign({}, S.v, over || {}); return SIM.calc(v, S.mode, S.opt); }

function update(){
  S.ivs.forEach(d => { $('val-' + d.id).innerHTML = d.show ? d.show(S.v[d.id]) : fnum(S.v[d.id]) + (d.unit ? '&nbsp;' + d.unit : ''); });
  S.d = calcWith();
  $('work').innerHTML = '<div class="wt"><span>Show the work</span><span class="hint">' + (SIM.hint || 'g = 10 m/s²') + '</span></div>' + (SIM.strip ? SIM.strip(SIM.work(S.v, S.d, S.mode, S.opt)) : SIM.work(S.v, S.d, S.mode, S.opt));
  document.querySelectorAll('input[name=gx]').forEach(r => r.checked = (r.value === S.gx));
  graph();
}

function graph(){
  if (SIM.noGraph) return;
  const cv = $('gv'), g = cv.getContext('2d'), W = 340, Hh = 150; g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, W, Hh);
  const dvs = SIM.dvs(S.mode, S.opt), dv = dvs.find(d => d.id === S.dv), ref = dv.vs ? dvs.find(d => d.id === dv.vs) : null;
  const x = S.def[S.gx]; $('ivname').innerHTML = '<i>' + x.sym + '</i>' + (x.unit && !x.show ? ' (' + x.unit + ')' : '');
  const N = 160, xs = [], ys = [], rs = [];
  for (let i = 0; i <= N; i++){ const xv = x.min + (x.max - x.min) * i / N; const d = calcWith({ [S.gx]: xv }); xs.push(xv); ys.push(dv.f(d)); rs.push(ref ? ref.f(d) : null); }
  const all = ys.concat(ref ? rs : []).filter(isFinite);
  let ymin = Math.min(0, ...all), ymax = Math.max(...all, 0); if (ymax === ymin) ymax = ymin + 1; const pad = (ymax - ymin) * 0.08; ymax += pad; if (ymin < 0) ymin -= pad;
  const L = 46, R = 8, T = 8, B = 22, X = v => L + (v - x.min) / (x.max - x.min) * (W - L - R), Y = v => T + (ymax - v) / (ymax - ymin) * (Hh - T - B);
  g.strokeStyle = '#111'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(L, T); g.lineTo(L, Hh - B); g.lineTo(W - R, Hh - B); g.stroke();
  if (ymin < 0){ g.strokeStyle = '#999'; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(W - R, Y(0)); g.stroke(); g.setLineDash([]);
    if (dv.negNote){ g.fillStyle = 'rgba(196,58,0,0.08)'; g.fillRect(L, Y(0), W - R - L, Hh - B - Y(0)); g.fillStyle = '#c43a00'; g.font = '600 10px "Space Grotesk",sans-serif'; g.textAlign = 'left'; g.fillText(dv.negNote, L + 4, Hh - B - 4); } }
  g.font = '500 10px "IBM Plex Mono",monospace'; g.fillStyle = '#4a4a4a'; g.textAlign = 'right';
  g.fillText(fplain(ymax), L - 4, T + 8); g.fillText(fplain(ymin < 0 ? ymin : 0), L - 4, Hh - B); if (ymin < 0) g.fillText('0', L - 4, Y(0) + 3);
  g.textAlign = 'center'; g.fillText(fplain(x.min), L, Hh - 8); g.fillText(fplain(x.max), W - R - 10, Hh - 8);
  g.fillText((x.symText || x.id) + (x.unit ? ' (' + x.unit + ')' : ''), (L + W) / 2, Hh - 8);
  g.save(); g.translate(10, (T + Hh - B) / 2); g.rotate(-PI / 2); g.textAlign = 'center'; g.fillText(dv.short + (dv.unit ? ' (' + dv.unit + ')' : ''), 0, 0); g.restore();
  const line = (arr, col, dash) => { g.strokeStyle = col; g.lineWidth = 2.2; g.setLineDash(dash || []); g.beginPath(); let on = false; arr.forEach((y, i) => { if (!isFinite(y)){ on = false; return; } const px = X(xs[i]), py = Math.max(T - 4, Math.min(Hh - B + 4, Y(y))); on ? g.lineTo(px, py) : g.moveTo(px, py); on = true; }); g.stroke(); g.setLineDash([]); };
  if (ref){ line(rs, '#4a4a4a', [5, 4]); g.fillStyle = '#4a4a4a'; g.textAlign = 'right'; g.font = '600 10px "Space Grotesk",sans-serif'; const lastY = rs.filter(isFinite).pop(); if (isFinite(lastY)) g.fillText(ref.short, W - R - 2, Math.max(T + 9, Y(lastY) - 4)); }
  line(ys, '#1546d6');
  const cx = S.v[S.gx], cy = dv.f(S.d);
  if (isFinite(cy)){ g.strokeStyle = '#ff6a2b'; g.setLineDash([2, 3]); g.lineWidth = 1; g.beginPath(); g.moveTo(X(cx), Hh - B); g.lineTo(X(cx), Y(cy)); g.lineTo(L, Y(cy)); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#ff6a2b'; g.strokeStyle = '#111'; g.lineWidth = 1.5; g.beginPath(); g.arc(X(cx), Math.max(T, Math.min(Hh - B, Y(cy))), 4.5, 0, 7); g.fill(); g.stroke(); }
  // doubling readout
  const d2 = calcWith({ [S.gx]: cx * 2 }), y1 = dv.f(S.d), y2 = dv.f(d2);
  let msg = '';
  if (cx === 0 || Math.abs(y1) < 1e-12) msg = '<span class="hint">Move off zero to see the ×2 test.</span>';
  else if (!isFinite(y1) || !isFinite(y2)) msg = '<span class="hint">The ×2 test doesn’t apply here (doubling takes it outside what this quantity covers).</span>';
  else {
    const k = y2 / y1;
    if (k < 0){ $('dbl').innerHTML = 'If <b>' + x.sym + '</b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '</b> goes from ' + fnum(y1) + ' to ' + fnum(y2) + (dv.unit ? ' ' + dv.unit : '') + (dv.signOK ? ': it changes sign. ' + dv.signOK : ': it changes sign, so that can’t really happen.'); return; }
    const tags = [[1, 'doesn’t depend on it'], [2, 'proportional'], [4, 'goes as the square'], [0.5, 'inversely proportional'], [0.25, 'inverse square'], [Math.SQRT2, 'goes as the square root'], [Math.SQRT1_2, 'goes as 1/√'], [8, 'goes as the cube'], [2 * Math.SQRT2, 'goes as the 3/2 power']];
    const tag = tags.find(([v]) => Math.abs(k - v) < 0.004 * v);
    msg = 'If <b>' + x.sym + '</b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '</b> becomes <b>×' + (Math.abs(k) >= 100 ? fnum(k) : k.toFixed(2)) + '</b>' + (tag && !dv.noTag ? ' — ' + tag[1] : '') + '.' + (dv.dblNote ? ' <span class="hint">' + dv.dblNote + '</span>' : '');
  }
  $('dbl').innerHTML = msg;
}

// drawing helpers (canvas is drawn in 600×330 units)
const cv = $('cv'), ctx = cv.getContext('2d');
function arrow(x1, y1, x2, y2, col, label, opts){
  opts = opts || {}; const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy); if (len < 2) return;
  const ux = dx / len, uy = dy / len, hw = opts.head || 9;
  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = opts.w || 3.5; ctx.lineCap = 'round';
  if (opts.dash) ctx.setLineDash(opts.dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hw * 0.8, y2 - uy * hw * 0.8); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - ux * hw - uy * hw * 0.55, y2 - uy * hw + ux * hw * 0.55); ctx.lineTo(x2 - ux * hw + uy * hw * 0.55, y2 - uy * hw - ux * hw * 0.55); ctx.closePath(); ctx.fill();
  if (label){ ctx.font = '700 13px "Space Grotesk",sans-serif'; ctx.textAlign = opts.align || 'left'; ctx.textBaseline = 'middle';
    const lx = x2 + (opts.lx !== undefined ? opts.lx : (ux >= 0 ? 6 : -6)), ly = y2 + (opts.ly !== undefined ? opts.ly : (uy >= 0 ? 10 : -10));
    if (opts.align === undefined) ctx.textAlign = ux >= -0.2 ? 'left' : 'right';
    ctx.fillText(label, lx, ly); }
  ctx.restore();
}
function text(s, x, y, o){ o = o || {}; ctx.save(); ctx.font = (o.font || '600 13px "Space Grotesk",sans-serif'); ctx.fillStyle = o.col || '#111'; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic'; ctx.fillText(s, x, y); ctx.restore(); }
function panelTitle(s, x, y){ text(s, x, y, { font: '700 11px "IBM Plex Mono",monospace', col: '#4a4a4a' }); }
const COL = { F: '#c43a00', W: '#111', N: '#1e7d45', V: '#1546d6', T: '#7a3fb0', comp: '#8a8a8a' };

let last = 0;
function loop(ts){ const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts; S.t += dt;
  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, 600, 330);
  SIM.draw(S.v, S.d, S.mode, S.opt, S.t, dt, S.anim); S.anim.reset = false;
  requestAnimationFrame(loop); }

// ---------------- this sim ----------------
// Wave Basics (AP 14.1–14.3, IB C.2): transverse and longitudinal waves, displacement–distance vs displacement–time graphs, v = fλ, phase difference, a wave entering a new medium, and polarization.
const SIM = {
  title: 'Wave Basics',
  hint: 'v = fλ · T = 1/f',
  modes: [{ id: 'trans', label: 'Transverse' }, { id: 'long', label: 'Longitudinal' }, { id: 'medium', label: 'New medium' }, { id: 'polar', label: 'Polarization' }],
  opts: [{ id: 'npol', label: 'Filters', modes: ['polar'], choices: [['two', 'Two'], ['three', 'Three (crossed outer pair)']] }],
  ivs(mode, opt){
    if (mode === 'polar') return [
      { id: 'I0', sym: 'I<sub>0</sub>', symText: 'I0', label: 'Intensity of unpolarized light', unit: 'W/m²', min: 10, max: 1000, step: 10, val: 400 },
      { id: 'th', sym: 'θ', symText: 'θ', label: (opt && opt.npol) === 'three' ? 'Angle of the middle filter' : 'Angle of the second filter (analyzer)', unit: '°', min: 0, max: 90, step: 1, val: 30, graph: true }];
    if (mode === 'medium') return [
      { id: 'f', sym: 'f', symText: 'f', label: 'Frequency (set by the source)', unit: 'Hz', min: 0.2, max: 2, step: 0.05, val: 1 },
      { id: 'v1', sym: 'v<sub>1</sub>', symText: 'v1', label: 'Speed in medium 1', unit: 'm/s', min: 0.5, max: 3, step: 0.1, val: 2 },
      { id: 'v2', sym: 'v<sub>2</sub>', symText: 'v2', label: 'Speed in medium 2', unit: 'm/s', min: 0.5, max: 3, step: 0.1, val: 1, graph: true }];
    return [
      { id: 'A', sym: 'A', symText: 'A', label: 'Amplitude', unit: 'cm', min: 0.5, max: 5, step: 0.1, val: 3 },
      { id: 'f', sym: 'f', symText: 'f', label: 'Frequency', unit: 'Hz', min: 0.2, max: 2, step: 0.05, val: 0.5, graph: true },
      { id: 'v', sym: 'v', symText: 'v', label: 'Wave speed', unit: 'm/s', min: 0.5, max: 3, step: 0.1, val: 1 },
      { id: 'dx', sym: 'Δx', symText: 'Δx', label: 'Distance from P to Q', unit: 'm', min: 0, max: 3, step: 0.05, val: 0.5 }];
  },
  presets: [{ label: 'Double the frequency', mode: 'trans', v: { f: 1 } }, { label: 'Q half a λ from P', mode: 'trans', v: { f: 0.5, v: 1, dx: 1 } }, { label: 'Into a slower medium', mode: 'medium', v: { v1: 2, v2: 1 } }, { label: 'Crossed filters', mode: 'polar', v: { th: 90 } }],
  calc(v, mode, opt){
    if (mode === 'polar'){ const three = (opt.npol || 'two') === 'three', I1 = v.I0 / 2, c2 = Math.pow(Math.cos(v.th * DEG), 2);
      const I2 = I1 * c2, I3 = three ? I2 * Math.pow(Math.cos((90 - v.th) * DEG), 2) : NaN; return { three, I1, I2, I3, Iout: three ? I3 : I2 }; }
    if (mode === 'medium') return { l1: v.v1 / v.f, l2: v.v2 / v.f, T: 1 / v.f };
    const lam = v.v / v.f, T = 1 / v.f, ph = 2 * PI * v.dx / lam, phm = ((ph % (2 * PI)) + 2 * PI) % (2 * PI);
    return { lam, T, ph, phm, vmax: 2 * PI * v.f * v.A / 100 };
  },
  dvs(mode){
    if (mode === 'polar') return [{ id: 'Io', name: 'Intensity that gets through', short: 'I', sym: 'I', unit: 'W/m²', f: d => d.Iout }];
    if (mode === 'medium') return [{ id: 'l2', name: 'Wavelength in medium 2', short: 'λ₂', sym: 'λ<sub>2</sub>', unit: 'm', f: d => d.l2 }, { id: 'l1', name: 'Wavelength in medium 1', short: 'λ₁', sym: 'λ<sub>1</sub>', unit: 'm', f: d => d.l1 }];
    return [{ id: 'lam', name: 'Wavelength', short: 'λ', sym: 'λ', unit: 'm', f: d => d.lam }, { id: 'T', name: 'Period', short: 'T', sym: 'T', unit: 's', f: d => d.T },
      { id: 'ph', name: 'Phase difference P to Q', short: 'Δφ', sym: 'Δφ', unit: 'rad', f: d => d.ph }, { id: 'vm', name: 'Maximum speed of a particle', short: 'v_max', sym: 'v<sub>max</sub>', unit: 'm/s', f: d => d.vmax }];
  },
  work(v, d, mode){
    if (mode === 'polar'){
      let s = '<h4>1 · First filter: unpolarized → polarized</h4><div class="eq">Unpolarized light vibrates in every direction. A filter lets through only one plane, so half the intensity gets through: I₁ = I₀/2 = <b>' + H.n(d.I1, 'W/m²') + '</b></div>' +
        '<h4>2 · Next filter at θ to the first (Malus’s law)</h4><div class="eq">I₂ = I₁ cos²θ = ' + fnum(d.I1) + ' × cos²(' + H.iv('th') + ') = <b>' + H.n(d.I2, 'W/m²') + '</b></div>';
      if (d.three) s += '<h4>3 · Last filter at 90° to the first, so (90° − θ) to the middle one</h4><div class="eq">I₃ = I₂ cos²(90° − θ) = <b>' + H.n(d.I3, 'W/m²') + '</b></div><p class="note">With no middle filter, crossed filters pass nothing. Adding a filter <i>between</i> them lets light through: the middle filter re-polarizes the light at a new angle. Most light gets through at θ = 45°.</p>';
      else s += '<p class="note">Only <b>transverse</b> waves can be polarized; sound (longitudinal) can’t. Uses: polarized sunglasses block glare (light reflected off water or a road is partly polarized), LCD screens, 3-D movie glasses.</p>';
      return s;
    }
    if (mode === 'medium') return '<h4>1 · Frequency stays the same</h4><div class="eq">The source sets f = ' + H.iv('f') + ' on both sides. Each crest that arrives at the boundary makes one crest on the other side.</div>' +
      '<h4>2 · Speed is set by the medium</h4><div class="eq">λ₁ = v₁/f = ' + H.iv('v1') + '/' + H.iv('f') + ' = <b>' + H.n(d.l1, 'm') + '</b><br>λ₂ = v₂/f = ' + H.iv('v2') + '/' + H.iv('f') + ' = <b>' + H.n(d.l2, 'm') + '</b></div>' +
      '<p class="note">' + (v.v2 < v.v1 ? 'Slower medium → shorter wavelength (light entering glass, a wave on a string reaching a heavier string).' : v.v2 > v.v1 ? 'Faster medium → longer wavelength (sound going from air into water).' : 'Same speed: nothing changes.') + ' FRQ trap: the frequency never changes at a boundary.</p>';
    const deg = d.phm / DEG, inph = Math.abs(deg) < 0.5 || Math.abs(deg - 360) < 0.5, anti = Math.abs(deg - 180) < 0.5;
    return '<h4>1 · Wavelength and period</h4><div class="eq">λ = v/f = ' + H.iv('v') + '/' + H.iv('f') + ' = <b>' + H.n(d.lam, 'm') + '</b> &nbsp; T = 1/f = <b>' + H.n(d.T, 's') + '</b></div>' +
      '<h4>2 · Reading the two graphs</h4><div class="eq">Displacement–<b>distance</b> graph: peak to peak = λ. Displacement–<b>time</b> graph: peak to peak = T. Both have the same amplitude A = ' + H.iv('A') + '.</div>' +
      '<h4>3 · Phase difference between P and Q</h4><div class="eq">Δφ = 2πΔx/λ = 2π(' + H.iv('dx') + ')/' + fnum(d.lam) + ' m = <b>' + H.n(d.ph, 'rad') + '</b> (' + Math.round(d.ph / DEG) + '°)' + (inph ? ' → <b>in phase</b>' : anti ? ' → <b>in antiphase</b>' : '') + '</div>' +
      '<p class="note">' + (mode === 'long' ? 'Longitudinal: particles move <b>along</b> the direction the wave travels. Compressions are where the particles bunch up; on the displacement graph they are where the curve crosses zero going down.' : 'Transverse: particles move <b>perpendicular</b> to the direction the wave travels. The particles never travel along with the wave; only energy moves.') + '</p>';
  },
  draw(v, d, mode, opt, t){
    if (mode === 'polar'){
      panelTitle('UNPOLARIZED LIGHT THROUGH FILTERS', 10, 18);
      const y = 150, xs = d.three ? [110, 210, 310] : [140, 290], angs = d.three ? [0, v.th, 90] : [0, v.th], Is = d.three ? [v.I0, d.I1, d.I2, d.I3] : [v.I0, d.I1, d.I2];
      const seg = (x1, x2, I, ang) => { const a = Math.min(1, I / v.I0); ctx.fillStyle = 'rgba(255,210,60,' + (0.15 + 0.7 * a) + ')'; ctx.fillRect(x1, y - 22, x2 - x1, 44);
        const mid = (x1 + x2) / 2; ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
        if (ang === null){ [0, 45, 90, 135].forEach(q => { const c = Math.cos(q * DEG) * 18 * Math.sqrt(a + 0.05), s = Math.sin(q * DEG) * 18 * Math.sqrt(a + 0.05); ctx.beginPath(); ctx.moveTo(mid - s, y - c); ctx.lineTo(mid + s, y + c); ctx.stroke(); }); }
        else if (I > 0.5){ const L = 20 * Math.sqrt(a), c = Math.cos(ang * DEG) * L, s = Math.sin(ang * DEG) * L; arrow(mid, y, mid + s, y - c, '#111', null, { w: 2, head: 6 }); arrow(mid, y, mid - s, y + c, '#111', null, { w: 2, head: 6 }); }
        text(fplain(I) + ' W/m²', mid, y + 44, { align: 'center', font: '600 10px "IBM Plex Mono",monospace' }); };
      const edges = [20].concat(xs).concat([385]);
      for (let i = 0; i < edges.length - 1; i++) seg(edges[i] + (i ? 6 : 0), edges[i + 1] - (i < edges.length - 2 ? 6 : 0), Is[i], i === 0 ? null : angs[i - 1]);
      xs.forEach((x, i) => { ctx.save(); ctx.translate(x, y); ctx.fillStyle = 'rgba(120,120,140,0.25)'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(0, 0, 8, 52, 0, 0, 7); ctx.fill(); ctx.stroke();
        ctx.rotate(angs[i] * DEG); ctx.strokeStyle = '#333'; ctx.lineWidth = 1; for (let k = -2; k <= 2; k++){ ctx.beginPath(); ctx.moveTo(k * 3, -40); ctx.lineTo(k * 3, 40); ctx.stroke(); } ctx.restore();
        text(angs[i] + '°', x, y - 62, { align: 'center', font: '700 12px "Space Grotesk",sans-serif' }); });
      text('lines show each filter’s transmission axis', 12, 312, { font: '600 10px "IBM Plex Mono",monospace', col: '#4a4a4a' });
      panelTitle('OUTPUT vs ANGLE', 395, 18);
      const gx = 405, gy = 230, gw = 180, gh = 150; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(gx, gy - gh); ctx.lineTo(gx, gy); ctx.lineTo(gx + gw, gy); ctx.stroke();
      ctx.strokeStyle = '#1546d6'; ctx.lineWidth = 2; ctx.beginPath(); for (let i = 0; i <= 90; i++){ const c2 = Math.pow(Math.cos(i * DEG), 2), I = d.three ? c2 * (1 - c2) * 4 : c2; i ? ctx.lineTo(gx + gw * i / 90, gy - gh * I) : ctx.moveTo(gx, gy - gh * I); } ctx.stroke();
      const cur = d.Iout / (d.three ? d.I1 / 4 : d.I1); ctx.fillStyle = '#ff6a2b'; ctx.beginPath(); ctx.arc(gx + gw * v.th / 90, gy - gh * cur, 5, 0, 7); ctx.fill();
      text('0°', gx, gy + 14, { align: 'center', font: '500 10px "IBM Plex Mono",monospace' }); text('90°', gx + gw, gy + 14, { align: 'center', font: '500 10px "IBM Plex Mono",monospace' }); text('θ', gx + gw / 2, gy + 14, { align: 'center', font: '600 11px "IBM Plex Mono",monospace' });
      text(d.three ? 'max = I₀/8 at 45°' : 'max = I₀/2 at 0°', gx + 4, gy - gh - 6, { font: '600 10px "IBM Plex Mono",monospace', col: '#4a4a4a' });
      text('I out = ' + fplain(d.Iout) + ' W/m²', 400, 290, { font: '700 13px "Space Grotesk",sans-serif' });
      return;
    }
    const PX = 60, X0 = 20, XW = 360;
    if (mode === 'medium'){
      panelTitle('A WAVE CROSSING INTO A NEW MEDIUM', 10, 18);
      const xb = X0 + 180, y0 = 130, A = 35, w = 2 * PI * v.f;
      ctx.fillStyle = 'rgba(21,70,214,0.06)'; ctx.fillRect(xb, 40, X0 + XW - xb, 180); ctx.strokeStyle = '#8a8a8a'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(xb, 40); ctx.lineTo(xb, 220); ctx.stroke(); ctx.setLineDash([]);
      text('medium 1: v₁ = ' + v.v1 + ' m/s', X0 + 4, 52, { font: '600 11px "IBM Plex Mono",monospace' }); text('medium 2: v₂ = ' + v.v2 + ' m/s', xb + 6, 52, { font: '600 11px "IBM Plex Mono",monospace' });
      const ph = x => { const m = (x - X0) / PX, mb = (xb - X0) / PX; return x <= xb ? w * (t - m / v.v1) : w * (t - mb / v.v1 - (m - mb) / v.v2); };
      ctx.strokeStyle = '#1546d6'; ctx.lineWidth = 2.5; ctx.beginPath(); for (let x = X0; x <= X0 + XW; x += 2){ const y = y0 - A * Math.sin(ph(x)); x === X0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke();
      const bracket = (x1, lam, lab) => { const x2 = x1 + lam * PX; ctx.strokeStyle = '#c43a00'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x1, 200); ctx.lineTo(x2, 200); ctx.moveTo(x1, 194); ctx.lineTo(x1, 206); ctx.moveTo(x2, 194); ctx.lineTo(x2, 206); ctx.stroke(); text(lab, (x1 + x2) / 2, 216, { align: 'center', font: '700 11px "IBM Plex Mono",monospace', col: '#c43a00' }); };
      if (d.l1 * PX < 175) bracket(X0 + 2, d.l1, 'λ₁ = ' + fplain(d.l1) + ' m'); if (d.l2 * PX < 175) bracket(xb + 4, d.l2, 'λ₂ = ' + fplain(d.l2) + ' m');
      text('f = ' + v.f + ' Hz on both sides', 12, 260, { font: '700 13px "Space Grotesk",sans-serif' });
      text('1 m', X0, 300, { font: '600 10px "IBM Plex Mono",monospace', col: '#4a4a4a' }); ctx.fillStyle = '#111'; ctx.fillRect(X0, 304, PX, 3);
      panelTitle('SAME f, DIFFERENT λ', 395, 18);
      [['medium 1', d.l1], ['medium 2', d.l2]].forEach(([n, l], i) => { const y = 60 + i * 60; text(n + ': λ = ' + fplain(l) + ' m', 400, y, { font: '700 12px "Space Grotesk",sans-serif' }); ctx.fillStyle = i ? '#1546d6' : '#8a8a8a'; ctx.fillRect(400, y + 8, Math.min(180, l * 40), 12); });
      text('Light into glass:', 400, 196, { font: '600 10px "IBM Plex Mono",monospace', col: '#4a4a4a' }); text('slower, shorter λ', 400, 210, { font: '600 10px "IBM Plex Mono",monospace', col: '#4a4a4a' }); text('Sound air → water:', 400, 232, { font: '600 10px "IBM Plex Mono",monospace', col: '#4a4a4a' }); text('faster, longer λ', 400, 246, { font: '600 10px "IBM Plex Mono",monospace', col: '#4a4a4a' });
      return;
    }
    const lam = d.lam, k = 2 * PI / lam, w = 2 * PI * v.f, xP = 1, xQ = 1 + v.dx, disp = x => v.A * Math.sin(w * t - k * x);
    if (mode === 'trans'){
      panelTitle('SNAPSHOT: DISPLACEMENT vs DISTANCE', 10, 18);
      const y0 = 100, sc = 9; ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(X0, y0); ctx.lineTo(X0 + XW, y0); ctx.stroke();
      ctx.strokeStyle = '#1546d6'; ctx.lineWidth = 2; ctx.beginPath(); for (let x = X0; x <= X0 + XW; x += 2){ const y = y0 - sc * disp((x - X0) / PX); x === X0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke();
      for (let m = 0; m <= 6; m += 0.2){ ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(X0 + m * PX, y0 - sc * disp(m), 2.2, 0, 7); ctx.fill(); }
      [[xP, 'P', '#ff6a2b'], [xQ, 'Q', '#1e7d45']].forEach(([x, n, c]) => { if (x > 6) return; const px = X0 + x * PX, py = y0 - sc * disp(x); ctx.fillStyle = c; ctx.beginPath(); ctx.arc(px, py, 6, 0, 7); ctx.fill(); text(n, px + 8, py - 8, { font: '700 13px "Space Grotesk",sans-serif', col: c }); });
      arrow(300, 40, 360, 40, '#4a4a4a', 'v', { w: 2, head: 7 });
      if (lam * PX < 340){ const xa = X0 + (((w * t / k) + lam / 4) % lam) * PX; ctx.strokeStyle = '#c43a00'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(xa, 150); ctx.lineTo(xa + lam * PX, 150); ctx.stroke(); text('λ = ' + fplain(lam) + ' m', xa + lam * PX / 2, 164, { align: 'center', font: '700 11px "IBM Plex Mono",monospace', col: '#c43a00' }); }
    } else {
      panelTitle('PARTICLES OF THE MEDIUM (AIR, SPRING COIL)', 10, 18);
      const sc = 4; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.2;
      for (let m = 0; m <= 6; m += 0.06){ const x = X0 + m * PX + sc * disp(m); if (x < X0 - 2 || x > X0 + XW + 2) continue; ctx.beginPath(); ctx.moveTo(x, 42); ctx.lineTo(x, 88); ctx.stroke(); }
      [[xP, 'P', '#ff6a2b'], [xQ, 'Q', '#1e7d45']].forEach(([x, n, c]) => { if (x > 6) return; const px = X0 + x * PX + sc * disp(x); ctx.fillStyle = c; ctx.beginPath(); ctx.arc(px, 65, 6, 0, 7); ctx.fill(); text(n, px, 104, { align: 'center', font: '700 13px "Space Grotesk",sans-serif', col: c }); });
      for (let n = -2; n < 8; n++){ const xc = (w * t / k) + n * lam; if (xc >= 0 && xc <= 6) text('C', X0 + xc * PX, 38, { align: 'center', font: '700 11px "Space Grotesk",sans-serif', col: '#c43a00' }); const xr = xc + lam / 2; if (xr >= 0 && xr <= 6) text('R', X0 + xr * PX, 38, { align: 'center', font: '700 11px "Space Grotesk",sans-serif', col: '#1546d6' }); }
      const y0 = 140, s2 = 7; ctx.strokeStyle = '#ccc'; ctx.beginPath(); ctx.moveTo(X0, y0); ctx.lineTo(X0 + XW, y0); ctx.stroke();
      ctx.strokeStyle = '#1546d6'; ctx.lineWidth = 2; ctx.beginPath(); for (let x = X0; x <= X0 + XW; x += 2){ const y = y0 - s2 * disp((x - X0) / PX); x === X0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke();
      text('displacement (+ = right) vs distance', X0, 180, { font: '600 10px "IBM Plex Mono",monospace', col: '#4a4a4a' });
    }
    // displacement-time of P
    const gy = 250, gh = 9 * Math.min(v.A, 5) * 0.75, tw = 8; panelTitle('DISPLACEMENT vs TIME AT P', 10, 200);
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(X0, gy); ctx.lineTo(X0 + XW, gy); ctx.stroke();
    ctx.strokeStyle = '#ff6a2b'; ctx.lineWidth = 2; ctx.beginPath(); for (let i = 0; i <= 180; i++){ const tt = tw * i / 180, y = gy - 0.75 * 9 * v.A * Math.sin(w * tt - k * xP); i ? ctx.lineTo(X0 + XW * i / 180, y) : ctx.moveTo(X0, y); } ctx.stroke();
    const tc = t % tw; ctx.strokeStyle = '#111'; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(X0 + XW * tc / tw, gy - 40); ctx.lineTo(X0 + XW * tc / tw, gy + 40); ctx.stroke(); ctx.setLineDash([]);
    if (d.T < tw / 1.2){ ctx.strokeStyle = '#c43a00'; ctx.lineWidth = 1.5; const x1 = X0 + XW * ((0.25 + k * xP / (2 * PI)) % 1) * d.T / tw; ctx.beginPath(); ctx.moveTo(x1, gy + 42); ctx.lineTo(x1 + XW * d.T / tw, gy + 42); ctx.stroke(); text('T = ' + fplain(d.T) + ' s', x1 + XW * d.T / tw / 2, gy + 56, { align: 'center', font: '700 11px "IBM Plex Mono",monospace', col: '#c43a00' }); }
    text('0 to ' + tw + ' s', X0 + XW, gy + 56, { align: 'right', font: '500 10px "IBM Plex Mono",monospace', col: '#4a4a4a' });
    panelTitle('NUMBERS', 395, 18);
    [['λ', fplain(d.lam) + ' m'], ['T', fplain(d.T) + ' s'], ['f', v.f + ' Hz'], ['v = fλ', fplain(v.f * d.lam) + ' m/s'], ['Δφ (P→Q)', Math.round(d.ph / DEG) + '°'], ['v max particle', fplain(d.vmax) + ' m/s']].forEach(([a, b], i) => { text(a, 400, 50 + i * 26, { font: '600 12px "Space Grotesk",sans-serif', col: '#4a4a4a' }); text(b, 590, 50 + i * 26, { align: 'right', font: '700 13px "IBM Plex Mono",monospace' }); });
    text('Particles oscillate;', 400, 230, { font: '600 10px "IBM Plex Mono",monospace', col: '#4a4a4a' }); text('energy travels.', 400, 244, { font: '600 10px "IBM Plex Mono",monospace', col: '#4a4a4a' });
  }
};


(function (V) {
  if (V.title) SIM.title = V.title;
  if (V.hint) SIM.hint = V.hint;
  if (V.modes && SIM.modes) SIM.modes = V.modes.map(id => SIM.modes.find(m => m.id === id)).filter(Boolean);
  if (V.opts && SIM.opts) SIM.opts = SIM.opts.map(o => V.opts[o.id] ? Object.assign({}, o, { choices: o.choices.filter(c => V.opts[o.id].includes(c[0])) }) : o).filter(o => o.choices.length);
  if (SIM.opts && V.oneChoiceHidden !== false) SIM.opts = SIM.opts.filter(o => o.choices.length > 1);
  if (SIM.presets) SIM.presets = SIM.presets.filter(p => (!p.mode || !SIM.modes || SIM.modes.some(m => m.id === p.mode)) && !(V.dropPresets || []).includes(p.label));
  SIM.strip = h => h.replace(/<span style="color:#7a3fb0">IB[^<]*<\/span>:?\s*/g, '').replace(/\s*\((?:IB|AP)[^()]*\)/g, '').replace(/<p class="note">(?:AP|IB)[^<]*(?:<[^p][^>]*>[^<]*)*<\/p>/g, '').replace(/AP: qualitative only[^.]*\. ?/g, '');
})({"modes": ["trans", "long"]});


S.mode = SIM.modes ? SIM.modes[0].id : 'one';
setup(); requestAnimationFrame(loop);
window.APP = { select(name){ const m = (SIM.modes || []).find(m => m.label === name || m.id === name); if (m && m.id !== S.mode){ S.mode = m.id; S.anim = {}; setup(); } } };
addEventListener('message', e => { const d = e.data; if (d && d.select) try { APP.select(d.select); } catch (er) {} });
</script>
