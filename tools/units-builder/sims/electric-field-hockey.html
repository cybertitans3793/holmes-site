<!DOCTYPE html>
<!--
  Electric Field Hockey - single-file HTML5 port of the PhET Java simulation "Electric Field Hockey".
  Original: PhET Interactive Simulations, University of Colorado Boulder (https://phet.colorado.edu).
  Original credits: lead design Michael Dubson; software development Michael Dubson, Sam Reid.
  This port reproduces the Java version's model exactly (Coulomb force 1e6*q1*q2/r^2 with r clamped to >= 25 px,
  position-Verlet with dt = 3, force factor 0.002, default mass 25, 700x600 field, same mazes, goal and
  8 px collision margin). PhET's Java simulation code is GPL-licensed; this port is offered under the same terms.
  Deviations from the Java version:
    - Goal/collision sounds are synthesized in the browser (the original audio files are not included).
    - The "Charges" counter also updates when Clear is pressed (the Java version left it stale).
    - The whole sim scales to fit the window/embed frame; mouse and touch both work.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electric Field Hockey</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; overflow: hidden; }
  body { font-family: "Lucida Sans", "Lucida Grande", "Segoe UI", Arial, sans-serif; font-size: 13px; color: #000; }
  #wrap { position: relative; margin: 0 auto; }
  #app { width: 700px; position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #field { display: block; width: 700px; height: 600px; touch-action: none; cursor: default; }
  #cp { width: 700px; }
  #cp .row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 6px; padding: 4px 4px; }
  #cp .top { background: #ffff00; }
  #cp .bottom { background: #00ff00; display: grid; grid-template-columns: 1fr 1fr; padding: 0; }
  #cp .bottom > div { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px 6px; padding: 5px 4px; }
  #cp .grp { display: inline-flex; align-items: center; gap: 6px; padding: 0 6px; }
  #cp label { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; user-select: none; cursor: pointer; }
  #cp button { font: inherit; padding: 3px 12px; border: 1px solid #7a8a99; border-radius: 3px;
               background: linear-gradient(#ffffff, #dde3ea); cursor: pointer; }
  #cp button:disabled { color: #999; cursor: default; background: #eef0f2; border-color: #b8c2cc; }
  #cp input[type=text] { width: 34px; font: inherit; padding: 1px 3px; }
  #cp input[type=range] { width: 190px; }
  #cp .lbl { white-space: pre; }
</style>
</head>
<body>
<div id="wrap">
  <div id="app">
    <canvas id="field" width="700" height="600"></canvas>
    <div id="cp">
      <div class="row top">
        <span class="grp">
          <button id="startBtn">Start</button>
          <button id="resetBtn" disabled>Reset</button>
          <span id="triesLbl" class="lbl">Tries: 0</span>
        </span>
        <span class="grp">
          <label><input type="checkbox" id="pauseChk">Pause</label>
          <button id="clearBtn">Clear</button>
        </span>
        <span class="grp">
          <label><input type="checkbox" id="posChk" checked>Puck Is Positive</label>
          <label><input type="checkbox" id="traceChk">Trace</label>
          <label><input type="checkbox" id="fieldChk">Field</label>
          <label><input type="checkbox" id="aaChk">Antialias</label>
        </span>
      </div>
      <div class="bottom">
        <div>
          <label><input type="radio" name="level" value="0" checked>Practice</label>
          <span class="lbl">   Difficulty:</span>
          <label><input type="radio" name="level" value="1">1</label>
          <label><input type="radio" name="level" value="2">2</label>
          <label><input type="radio" name="level" value="3">3</label>
          <span id="chargesLbl" class="lbl">    Charges: 0</span>
        </div>
        <div>
          <span>Mass</span>
          <input type="text" id="massText" value="25">
          <input type="range" id="massSlider" min="1" max="100" step="1" value="25">
        </div>
      </div>
    </div>
  </div>
</div>

<script id="model">
/* ===== Model: direct port of edu.colorado.phet.electrichockey (Model, Force, Charge, BarrierList, FieldGrid) ===== */
var EFH = (function () {
  'use strict';
  var W = 700, H = 600;
  var trunc = Math.trunc;

  // BarrierList.rectArray0..3 (x, y, width, height) - drawn as-is; collision uses copies grown by 8 px.
  var BASE = [[625, 265, 15, 5], [625, 330, 10, 5], [635, 265, 5, 70]];
  var RECTS = [
    BASE.slice(),
    BASE.concat([[360, 150, 10, 210]]),
    BASE.concat([[450, 210, 10, 230], [280, 70, 10, 210]]),
    BASE.concat([[370, -20, 10, 350], [240, 180, 10, 450], [500, 180, 10, 430],
                 [470, 170, 70, 10], [340, 330, 70, 10], [210, 170, 70, 10]])
  ];
  function rectContains(r, x, y) { return x >= r[0] && y >= r[1] && x < r[0] + r[2] && y < r[1] + r[3]; }
  var COLLISION = RECTS.map(function (rs) {
    var g = rs.map(function (r) { return [r[0] - 8, r[1] - 8, r[2] + 16, r[3] + 16]; });
    var a = new Uint8Array(W * H);
    for (var x = 0; x < W; x++) for (var y = 0; y < H; y++) {
      for (var k = 0; k < g.length; k++) if (rectContains(g[k], x, y)) { a[x * H + y] = 1; break; }
    }
    return a;
  });
  // PlayingField.goal = new Rectangle(89*w/100, h/2 - 30, 13, 60)
  var GOAL = [trunc(89 * W / 100), trunc(H / 2) - 30, 13, 60];

  // Charge: integer "position" (used as a force source / for drawing) and double "position2D" (used as a force target)
  function Charge(x, y, sign) { this.x = trunc(x); this.y = trunc(y); this.x2 = x; this.y2 = y; this.sign = sign; this.radius = 8; }
  Charge.prototype.contains = function (px, py) {
    return px < this.x + this.radius && px > this.x - this.radius && py < this.y + this.radius && py > this.y - this.radius;
  };

  // ElectricHockeyArrow.setPosition -> 8-point polygon (integer offsets, as in Java)
  function hockeyArrow(n, n2, n3, n4) {
    var d = n3 - n, d2 = n4 - n2, L = Math.pow(d * d + d2 * d2, 0.5);
    var w = Math.min(6.0, L / 10.0), h = 4.0 * w * Math.sqrt(3.0) / 2.0;
    var ax = [w / 2 * (-d2 / L), w / 2 * (-d2 / L) + (L - h) * (d / L), w * (-d2 / L) + (L - h) * (d / L), L * (d / L),
              w * (d2 / L) + (L - h) * (d / L), w / 2 * (d2 / L) + (L - h) * (d / L), w / 2 * (d2 / L), w / 2 * (-d2 / L)];
    var ay = [w / 2 * d / L, w / 2 * (d / L) + (L - h) * (d2 / L), w * (d / L) + (L - h) * (d2 / L), L * (d2 / L),
              w * (-d / L) + (L - h) * (d2 / L), w / 2 * (-d / L) + (L - h) * (d2 / L), w / 2 * (-d / L), w / 2 * (d / L)];
    var pts = [];
    for (var i = 0; i < 8; i++) pts.push([n + trunc(ax[i]), n2 + trunc(ay[i])]);
    return pts;
  }

  // Force(charge, charge2): force on charge2 due to charge
  var FORCE_FACTOR = 1000000.0, CUTOFF = 25.0;
  function force(src, tgt) {
    var x0 = tgt.x2, y0 = tgt.y2, dx = x0 - src.x, dy = y0 - src.y;
    var r = Math.sqrt(dx * dx + dy * dy);
    if (r < CUTOFF) r = CUTOFF;
    var rSq = r * r, k = FORCE_FACTOR * src.sign * tgt.sign;
    var fx = k * dx / (r * rSq), fy = k * dy / (r * rSq);
    return { fx: fx, fy: fy, sign: src.sign,
             arrow: hockeyArrow(trunc(x0), trunc(y0), trunc(x0) + trunc(fx), trunc(y0) + trunc(fy)) };
  }

  function Model() {
    this.W = W; this.H = H;
    this.RECTS = RECTS; this.GOAL = GOAL;
    this.initX = W / 5.0; this.initY = H / 2.0;
    this.puck = new Charge(this.initX, this.initY, 1);
    this.x = this.puck.x2; this.y = this.puck.y2;
    this.xBefore = 0; this.yBefore = 0;
    this.mass = 25.0; this.fFactor = 0.002; this.dt = 3;
    this.charges = []; this.forces = [];
    this.starting = true; this.running = false; this.time = 0;
    this.goalState = false; this.collisionState = false;
    this.level = 0; this.trace = false;
    this.path = []; this.pathStarted = false;     // array of subpaths, each an array of [x, y]
    this.onGoal = null; this.onCollision = null;
  }
  Model.prototype.updateForceList = function () {
    for (var i = 0; i < this.forces.length; i++) this.forces[i] = force(this.charges[i], this.puck);
  };
  Model.prototype.addCharge = function (c) { this.charges.push(c); this.forces.push(force(c, this.puck)); };
  Model.prototype.removeChargeAt = function (i) { this.charges.splice(i, 1); this.forces.splice(i, 1); };
  Model.prototype.netForce = function () {
    var fx = 0, fy = 0;
    for (var i = 0; i < this.forces.length; i++) { fx += this.forces[i].fx; fy += this.forces[i].fy; }
    return [fx, fy];
  };
  Model.prototype.updatePuckPositionVerlet = function () {
    var f, dt = this.dt;
    if (this.starting) {
      f = this.netForce();
      this.xBefore = this.x; this.yBefore = this.y;
      this.x += this.fFactor * f[0] / (2.0 * this.mass) * dt * dt;
      this.y += this.fFactor * f[1] / (2.0 * this.mass) * dt * dt;
      this.starting = false;
    } else {
      f = this.netForce();
      var xT = this.x, yT = this.y;
      this.x = 2.0 * this.x - this.xBefore + this.fFactor * f[0] / this.mass * dt * dt;
      this.y = 2.0 * this.y - this.yBefore + this.fFactor * f[1] / this.mass * dt * dt;
      this.xBefore = xT; this.yBefore = yT;
      this.puck.x2 = this.x; this.puck.y2 = this.y;
      this.puck.x = javaInt(this.x); this.puck.y = javaInt(this.y);
      this.updateForceList();
      if (this.x > 3 * W || this.x < -3 * W || this.y > 3 * H || this.y < -3 * H) this.running = false;
    }
  };
  // Java (int) cast of a double: truncates, NaN -> 0, saturates at int range
  function javaInt(v) { if (v !== v) return 0; if (v >= 2147483647) return 2147483647; if (v <= -2147483648) return -2147483648; return trunc(v); }
  Model.prototype.updatePath = function () {
    if (!this.pathStarted) { this.path.push([[this.puck.x, this.puck.y]]); this.pathStarted = true; }
    else { if (!this.path.length) this.path.push([]); this.path[this.path.length - 1].push([this.puck.x, this.puck.y]); }
  };
  Model.prototype.resetPath = function () { this.path = []; };
  // Model.timerHandler.actionPerformed - one tick (every 3 ms in the Java version)
  Model.prototype.tick = function () {
    var n = this.puck.x, n2 = this.puck.y, g = GOAL;
    if (n >= g[0] && n2 >= g[1] && n < g[0] + g[2] && n2 < g[1] + g[3]) {
      this.goalState = true; this.running = false; if (this.onGoal) this.onGoal(); return;
    }
    if (n > 0 && n < W && n2 > 0 && n2 < H && COLLISION[this.level][n * H + n2] === 1) {
      this.collisionState = true; this.running = false; if (this.onCollision) this.onCollision(); return;
    }
    this.time++;
    this.updatePuckPositionVerlet();
    if (this.trace) this.updatePath();
  };
  Model.prototype.resetTimer = function () {
    this.running = false; this.time = 0;
    this.x = this.initX; this.y = this.initY;
    this.puck.x2 = this.initX; this.puck.y2 = this.initY;
    this.puck.x = trunc(this.initX); this.puck.y = trunc(this.initY);
    this.updateForceList();
    this.path = []; this.pathStarted = false; this.starting = true;
    this.goalState = false; this.collisionState = false;
  };

  // FieldGrid: 25 columns, spacing 28 px, test charge sign 3
  var GRID_N = 25, GRID_S = trunc(W / GRID_N), GRID_NY = trunc(H / GRID_S);
  function fieldGrid(charges) {
    var out = [];
    for (var i = 0; i < GRID_N; i++) for (var j = 0; j < GRID_NY; j++) {
      var p = new Charge(i * GRID_S + trunc(GRID_S / 2), j * GRID_S + trunc(GRID_S / 2), 3);
      var d = 0, d2 = 0;
      for (var k = 0; k < charges.length; k++) { var f = force(charges[k], p); d += f.fx; d2 += f.fy; }
      var mag = Math.pow(Math.pow(d, 2) + Math.pow(d2, 2), 0.5);
      var gray = trunc(-255.0 * mag / 300.0 + 255.0);
      if (gray < 1) gray = 1; else if (gray > 255) gray = 255;
      out.push({ x: p.x, y: p.y, dx: javaInt(25.0 * d / mag), dy: javaInt(25.0 * d2 / mag), gray: gray });
    }
    return out;
  }

  return { Model: Model, Charge: Charge, force: force, fieldGrid: fieldGrid, W: W, H: H, COLLISION: COLLISION, GOAL: GOAL };
})();
if (typeof module !== 'undefined') module.exports = EFH;
</script>

    ctx.strokeRect(minusBag[0] + 0.5, minusBag[1] + 0.5, minusBag[2], minusBag[3]);
    if (newGrabbed && grabbed) {
      ctx.fillStyle = grabbed.sign === -1 ? '#0000ff' : (grabbed.sign === 1 ? '#ff0000' : '#000');
      ctx.beginPath(); ctx.arc(grabbed.x, grabbed.y, grabbed.radius, 0, Math.PI * 2); ctx.fill();
      drawForce(grabbedForce);
    }
    var rs = model.RECTS[model.level];
    for (var i = 0; i < rs.length; i++) fill3DRect(ctx, rs[i][0], rs[i][1], rs[i][2], rs[i][3], BARRIER);
    for (var j = 0; j < model.charges.length; j++) {
      var c = model.charges[j];
      var im = c.sign === -1 ? IMG.minusDisk : IMG.plusDisk;
      if (im.complete) ctx.drawImage(im, c.x - c.radius, c.y - c.radius);
      drawForce(model.forces[j]);
    }
    var p = model.puck, pim = p.sign === 1 ? IMG.puckPositive : IMG.puckNegative;
    if (pim.complete && isFinite(p.x) && Math.abs(p.x) < 1e6 && Math.abs(p.y) < 1e6) ctx.drawImage(pim, p.x - p.radius, p.y - p.radius);
    if (model.goalState) {
      ctx.fillStyle = 'rgb(0,125,0)'; ctx.font = '110px "Lucida Sans", "Lucida Grande", Arial, sans-serif';
      ctx.fillText('Goal!', 3 * W / 10, H / 5);
    }
    if (model.collisionState && !model.goalState) {
      ctx.fillStyle = '#ff0000'; ctx.font = '50px "Lucida Sans", "Lucida Grande", Arial, sans-serif';
      ctx.fillText('Collision!', 2 * W / 5, H / 10);
    }
    if (model.trace) {
      ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 1; ctx.lineCap = 'square'; ctx.lineJoin = 'miter'; ctx.setLineDash([10, 5]);
      ctx.beginPath();
      for (var s = 0; s < model.path.length; s++) {
        var sp = model.path[s];
        for (var q = 0; q < sp.length; q++) { if (q === 0) ctx.moveTo(sp[q][0] + 0.5, sp[q][1] + 0.5); else ctx.lineTo(sp[q][0] + 0.5, sp[q][1] + 0.5); }
      }
      ctx.stroke(); ctx.setLineDash([]); ctx.lineCap = 'butt';
    }
  }

  /* ---------- timer (Java: javax.swing.Timer every 3 ms) ---------- */
  var last = null, acc = 0, TICK_MS = 3;
  function frame(t) {
    if (last === null) last = t;
    var elapsed = Math.min(t - last, 100); last = t;
    if (model.running) {
      acc += elapsed;
      var n = 0;
      while (acc >= TICK_MS && model.running && n < 60) { model.tick(); acc -= TICK_MS; n++; }
      if (!model.running) acc = 0;
    } else acc = 0;
    draw();
    requestAnimationFrame(frame);
  }
  function startTimer() { model.running = true; }
  function stopTimer() { model.running = false; }

  /* ---------- controls (ControlPanel) ---------- */
  var startBtn = $('startBtn'), resetBtn = $('resetBtn'), clearBtn = $('clearBtn'), pauseChk = $('pauseChk');
  function setTries() { $('triesLbl').textContent = 'Tries: ' + tries; }
  function setCharges() { $('chargesLbl').textContent = '    Charges: ' + model.charges.length; }
  startBtn.onclick = function () { ac(); resetBtn.disabled = false; startBtn.disabled = true; startTimer(); };
  resetBtn.onclick = function () { model.resetTimer(); tries++; setTries(); resetBtn.disabled = true; startBtn.disabled = false; };
  clearBtn.onclick = function () {
    for (var i = model.charges.length - 1; i >= 0; i--) model.removeChargeAt(i);
    updateGrid(); stopTimer(); setCharges();
  };
  pauseChk.onchange = function () {
    if (pauseChk.checked) { stopTimer(); startBtn.disabled = true; resetBtn.disabled = true; clearBtn.disabled = true; }
    else { startTimer(); startBtn.disabled = false; resetBtn.disabled = false; clearBtn.disabled = false; }
  };
  $('posChk').onchange = function () {
    model.puck.sign = this.checked ? 1 : -1;
    model.updatePath(); model.updateForceList();
  };
  $('traceChk').onchange = function () {
    if (this.checked) { model.trace = true; model.pathStarted = false; model.resetPath(); } else model.trace = false;
  };
  $('fieldChk').onchange = function () { showField = this.checked; };
  $('aaChk').onchange = function () { antialias = this.checked; renderGrid(); };
  Array.prototype.forEach.call(document.querySelectorAll('input[name=level]'), function (r) {
    r.onchange = function () { if (r.checked) { model.level = +r.value; tries = 0; setTries(); } };
  });
  var massText = $('massText'), massSlider = $('massSlider');
  function applyMassText() {
    var s = massText.value.trim(); if (s === '' || isNaN(Number(s))) return;
    var d = Number(s); model.mass = d;
    if (d >= 1 && d <= 99) massSlider.value = Math.trunc(d); else if (d < 1) massSlider.value = 1; else if (d > 100) massSlider.value = 99;
  }
  massText.addEventListener('keydown', function (e) { if (e.key === 'Enter') applyMassText(); });
  massText.addEventListener('change', applyMassText);
  massSlider.addEventListener('input', function () { var n = +massSlider.value; model.mass = n; massText.value = String(n); });

  /* ---------- mouse / touch (PlayingField listeners) ---------- */
  function evPoint(e) {
    var r = canvas.getBoundingClientRect();
    return [Math.floor((e.clientX - r.left) * W / r.width), Math.floor((e.clientY - r.top) * H / r.height)];
  }
  var pointerDown = false;
  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault(); ac(); pointerDown = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    var pt = evPoint(e);
    if (inRect(plusBag, pt[0], pt[1])) {
      newGrabbed = true; grabbed = new EFHm.Charge(pt[0], pt[1], 1); grabbedForce = EFHm.force(grabbed, model.puck);
    } else if (inRect(minusBag, pt[0], pt[1])) {
      newGrabbed = true; grabbed = new EFHm.Charge(pt[0], pt[1], -1); grabbedForce = EFHm.force(grabbed, model.puck);
    } else {
      for (var i = 0; i < model.charges.length; i++) {
        if (model.charges[i].contains(pt[0], pt[1])) { oldGrabbed = true; grabbedIndex = i; grabbed = model.charges[i]; }
      }
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!pointerDown) return;
    var pt = evPoint(e);
    if (newGrabbed || oldGrabbed) { grabbed.x = pt[0]; grabbed.y = pt[1]; grabbedForce = EFHm.force(grabbed, model.puck); }
    if (oldGrabbed) {
      model.charges[grabbedIndex] = grabbed;
      model.forces[grabbedIndex] = EFHm.force(grabbed, model.puck);
      updateGrid();
    }
    renderGrid();
  });
  function release(e) {
    if (!pointerDown) return; pointerDown = false;
    var pt = evPoint(e);
    if (newGrabbed) {
      newGrabbed = false;
      if (!inRect(chargeBag, pt[0], pt[1])) { model.addCharge(grabbed); setCharges(); }
    }
    if (oldGrabbed) {
      oldGrabbed = false;
      if (inRect(chargeBag, pt[0], pt[1])) { model.removeChargeAt(grabbedIndex); setCharges(); }
    }
    updateGrid(); renderGrid();
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);

  /* ---------- fit to window / embed frame ---------- */
  function fit() {
    var app = $('app'), wrap = $('wrap');
    var natH = app.offsetHeight || 680;
    scale = Math.min(window.innerWidth / 700, window.innerHeight / natH);
    if (!(scale > 0)) scale = 1;
    scale = Math.min(scale, 2);
    app.style.transform = 'scale(' + scale + ')';
    wrap.style.width = (700 * scale) + 'px'; wrap.style.height = (natH * scale) + 'px';
    var pr = Math.max(1, Math.min(3, Math.ceil(scale * (window.devicePixelRatio || 1) * 2) / 2));
    if (pr !== pxRatio || canvas.width !== Math.round(W * pr)) { pxRatio = pr; canvas.width = Math.round(W * pr); canvas.height = Math.round(H * pr); }
    draw();
  }
  window.addEventListener('resize', fit);

  updateGrid(); renderGrid(); fit();
  requestAnimationFrame(frame);
  window.__efh = { model: model, draw: draw };
})();
</script>
</body>
</html>
