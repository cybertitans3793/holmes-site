<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electric Potential</title>
<!-- Electric Potential: original Holmes Sims, built from frame.html + potential.js. g = 10 m/s². -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Space Grotesk",system-ui,sans-serif;color:#111}
#app{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0;padding:10px 14px 12px;box-sizing:border-box;
  display:grid;grid-template-columns:600px 1fr;grid-template-rows:34px 330px 1fr;gap:10px 14px}
#bar{grid-column:1/-1;display:flex;gap:16px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.seg{display:flex;align-items:center}
.seg .lab{font:700 12px "IBM Plex Mono",monospace;margin-right:8px;text-transform:uppercase}
.seg button{white-space:nowrap;font:700 14px "Space Grotesk",sans-serif;padding:6px 11px;border:2px solid #111;background:#fff;color:#111;cursor:pointer}
.seg button+button{margin-left:-2px}
.seg button[aria-pressed="true"]{background:#111;color:#fff}
.seg button:hover:not([aria-pressed="true"]){background:#ffe2d3}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ff6a2b;outline-offset:2px;position:relative;z-index:1}
#cv{border:2px solid #111;background:#fbfbfb;width:600px;height:330px;box-sizing:border-box;display:block}
#work{border:2px solid #111;padding:8px 12px 10px;overflow:auto;font-size:14px;line-height:1.55;box-sizing:border-box}
#work .wt{font:700 12px "IBM Plex Mono",monospace;text-transform:uppercase;margin:0 0 4px;display:flex;justify-content:space-between}
#work .wt .hint{text-transform:none}
#work h4{margin:9px 0 1px;font-size:13px;font-weight:700;color:#4a4a4a}
#work h4:first-of-type{margin-top:2px}
#work .eq{font-variant-numeric:tabular-nums}
#work .n{font-family:"IBM Plex Mono",monospace;font-size:13px}
#work b .n,#work .ans{font-weight:700}
#work .note{font-size:12.5px;color:#4a4a4a;margin:2px 0 0}
#work .ok{background:#e5f4ea;border-left:4px solid #1e7d45;padding:3px 8px;margin-top:4px}
#work .bad{background:#fde7df;border-left:4px solid #c43a00;padding:3px 8px;margin-top:4px}
.ivv{border-radius:2px;padding:0 2px;transition:background .25s}
.ivv.gx{background:#ffe2d3}
.ivv.hot{background:#ff6a2b;color:#fff}
#ctl{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;align-content:start}
.iv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:6px}
.iv .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iv .val{font:700 13px "IBM Plex Mono",monospace;white-space:nowrap}
.iv input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:#111;height:22px}
.iv input[type=radio]{accent-color:#ff6a2b;margin:0}
#presets{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
#presets .lab{font:700 12px "IBM Plex Mono",monospace}
#presets button{font:600 12.5px "Space Grotesk",sans-serif;padding:3px 8px;border:2px solid #111;background:#fff;cursor:pointer}
#presets button:hover{background:#ffe2d3}
#gcard{border:2px solid #111;padding:5px 8px 6px;display:flex;flex-direction:column;box-sizing:border-box;min-height:0}
.ghead{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.ghead select{font:600 13px "Space Grotesk",sans-serif;border:2px solid #111;padding:1px 4px;max-width:200px}
#gv{width:340px;height:150px;flex:none;display:block;margin-top:3px}
#dbl{font-size:12.5px;line-height:1.35;margin-top:2px}
#dbl b{font-weight:700}
.hint{font:500 11px "IBM Plex Mono",monospace;color:#4a4a4a}
</style></head><body>
<div id="app">
  <div id="bar"></div>
  <canvas id="cv" width="1200" height="660" aria-label="Animation of the situation with force arrows"></canvas>
  <div id="work" aria-live="polite"></div>
  <div id="ctl"></div>
  <div id="gcard">
    <div class="ghead"><span>Graph</span><select id="dvsel" aria-label="Quantity to graph"></select><span>vs <b id="ivname"></b></span></div>
    <canvas id="gv" width="680" height="300" aria-label="Graph of the chosen quantity against the chosen variable"></canvas>
    <div id="dbl"></div>
  </div>
</div>
<script>
// ---------------- shared frame ----------------
const $ = id => document.getElementById(id);
const G10 = 10, PI = Math.PI, DEG = PI / 180;
function fit(){ const s = Math.min(innerWidth / 1000, innerHeight / 640); $('app').style.transform = 'scale(' + s + ')'; }
addEventListener('resize', fit); fit();

function fnum(x){ const r = fnum0(x); return typeof r === 'string' ? r.replace(/^-/, '−') : r; }
function fnum0(x){
  if (x === null || x === undefined || !isFinite(x)) return '—';
  const a = Math.abs(x);
  if (a === 0) return '0';
  if (a >= 1e5 || a < 1e-3){
    const e = Math.floor(Math.log10(a)); let m = x / Math.pow(10, e);
    let ms = m.toFixed(2); if (Math.abs(+ms) >= 10){ m /= 10; ms = m.toFixed(2); return ms + '×10<sup>' + (e + 1) + '</sup>'; }
    return ms + '×10<sup>' + e + '</sup>';
  }
  if (a >= 1000) return String(Math.round(x));
  return x.toPrecision(3);
}
function fplain(x){ return fnum(x).replace(/<sup>(.*?)<\/sup>/g, (m, e) => '^' + e).replace('×10^', 'e'); }
const H = {
  n: (x, u) => '<span class="n">' + fnum(x) + (u ? '&nbsp;' + u : '') + '</span>',
  iv: id => { const d = S.def[id]; const val = S.v[id]; const txt = (d.show ? d.show(val) : fnum(val) + (d.unit ? '&nbsp;' + d.unit : ''));
              return '<span class="ivv n' + (S.gx === id ? ' gx' : '') + (S.hot === id ? ' hot' : '') + '" data-iv="' + id + '">' + txt + '</span>'; },
  g: () => '<span class="n">10&nbsp;m/s²</span>',
  p: (x, u) => x < 0 ? '(' + H.n(x, u) + ')' : H.n(x, u)
};

const S = { mode: null, opt: {}, v: {}, store: {}, def: {}, ivs: [], gx: null, dv: null, hot: null, t: 0, anim: {} };

function bar(){
  const b = $('bar'); b.innerHTML = '';
  const group = (label, items, cur, onpick) => {
    const g = document.createElement('div'); g.className = 'seg'; g.setAttribute('role', 'group');
    if (label){ const l = document.createElement('span'); l.className = 'lab'; l.textContent = label; g.appendChild(l); }
    items.forEach(([id, txt]) => { const bt = document.createElement('button'); bt.textContent = txt; bt.setAttribute('aria-pressed', String(id === cur)); bt.onclick = () => onpick(id); g.appendChild(bt); });
    b.appendChild(g);
  };
  const tip = document.createElement('span'); tip.className = 'hint'; tip.style.marginLeft = 'auto'; tip.style.whiteSpace = 'nowrap'; tip.innerHTML = '● = the variable on the graph’s x-axis · drag any slider';
  if (SIM.modes && SIM.modes.length > 1) group(null, SIM.modes.map(m => [m.id, m.label]), S.mode, id => { S.mode = id; S.anim = {}; setup(); });
  (SIM.opts || []).filter(o => !o.modes || o.modes.includes(S.mode)).forEach(o => {
    if (!(o.id in S.opt)) S.opt[o.id] = o.choices[0][0];
    group(o.label, o.choices, S.opt[o.id], id => { S.opt[o.id] = id; S.anim = {}; setup(); });
  });
  b.appendChild(tip);
  if (b.scrollWidth > b.clientWidth + 1) tip.remove();
  if (b.scrollWidth > b.clientWidth + 1) b.querySelectorAll('.seg button').forEach(x => { x.style.fontSize = '13px'; x.style.padding = '6px 8px'; });
}

function setup(){
  bar();
  S.ivs = SIM.ivs(S.mode, S.opt); S.def = {}; S.v = {};
  S.ivs.forEach(d => { S.def[d.id] = d; const k = S.mode + ':' + d.id; S.v[d.id] = (k in S.store) ? S.store[k] : d.val; });
  if (!S.gx || !S.def[S.gx]) S.gx = S.ivs.find(d => d.graph) ? S.ivs.find(d => d.graph).id : S.ivs[1] ? S.ivs[1].id : S.ivs[0].id;
  const c = $('ctl'); c.innerHTML = '';
  S.ivs.forEach(d => {
    const w = document.createElement('div'); w.className = 'iv';
    w.innerHTML = '<input type="radio" name="gx" value="' + d.id + '" aria-label="Graph against ' + d.label + '" title="Put this on the graph’s x-axis"' + (S.gx === d.id ? ' checked' : '') + '>' +
      '<span class="nm">' + d.label + ' <i>' + d.sym + '</i></span><span class="val" id="val-' + d.id + '"></span>' +
      '<input type="range" id="r-' + d.id + '" min="' + d.min + '" max="' + d.max + '" step="' + d.step + '" value="' + S.v[d.id] + '" aria-label="' + d.label + '">';
    c.appendChild(w);
    const r = w.querySelector('input[type=range]');
    r.oninput = () => { S.v[d.id] = +r.value; S.store[S.mode + ':' + d.id] = +r.value; S.hot = d.id; clearTimeout(S.hotT); S.hotT = setTimeout(() => { S.hot = null; update(); }, 700); S.anim.reset = true; update(); };
    w.querySelector('input[type=radio]').onchange = () => { S.gx = d.id; update(); };
  });
  if (SIM.presets){
    const p = document.createElement('div'); p.id = 'presets'; p.innerHTML = '<span class="lab">Try:</span>';
    SIM.presets.forEach(ps => { const bt = document.createElement('button'); bt.textContent = ps.label; bt.onclick = () => { if (ps.mode && ps.mode !== S.mode){ S.mode = ps.mode; } Object.entries(ps.v).forEach(([k, val]) => S.store[(ps.mode || S.mode) + ':' + k] = val); S.anim = {}; setup(); }; p.appendChild(bt); });
    c.appendChild(p);
  }
  const dvs = SIM.dvs(S.mode, S.opt), sel = $('dvsel');
  if (!S.dv || !dvs.find(d => d.id === S.dv)) S.dv = dvs[0].id;
  sel.innerHTML = dvs.map(d => '<option value="' + d.id + '"' + (d.id === S.dv ? ' selected' : '') + '>' + d.name + '</option>').join('');
  sel.onchange = () => { S.dv = sel.value; update(); };
  update();
}

function calcWith(over){ const v = Object.assign({}, S.v, over || {}); return SIM.calc(v, S.mode, S.opt); }

function update(){
  S.ivs.forEach(d => { $('val-' + d.id).innerHTML = d.show ? d.show(S.v[d.id]) : fnum(S.v[d.id]) + (d.unit ? '&nbsp;' + d.unit : ''); });
  S.d = calcWith();
  $('work').innerHTML = '<div class="wt"><span>Show the work</span><span class="hint">' + (SIM.hint || 'g = 10 m/s²') + '</span></div>' + (SIM.strip ? SIM.strip(SIM.work(S.v, S.d, S.mode, S.opt)) : SIM.work(S.v, S.d, S.mode, S.opt));
  document.querySelectorAll('input[name=gx]').forEach(r => r.checked = (r.value === S.gx));
  graph();
}

function graph(){
  const cv = $('gv'), g = cv.getContext('2d'), W = 340, Hh = 150; g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, W, Hh);
  const dvs = SIM.dvs(S.mode, S.opt), dv = dvs.find(d => d.id === S.dv), ref = dv.vs ? dvs.find(d => d.id === dv.vs) : null;
  const x = S.def[S.gx]; $('ivname').innerHTML = '<i>' + x.sym + '</i>' + (x.unit && !x.show ? ' (' + x.unit + ')' : '');
  const N = 160, xs = [], ys = [], rs = [];
  for (let i = 0; i <= N; i++){ const xv = x.min + (x.max - x.min) * i / N; const d = calcWith({ [S.gx]: xv }); xs.push(xv); ys.push(dv.f(d)); rs.push(ref ? ref.f(d) : null); }
  const all = ys.concat(ref ? rs : []).filter(isFinite);
  let ymin = Math.min(0, ...all), ymax = Math.max(...all, 0); if (ymax === ymin) ymax = ymin + 1; const pad = (ymax - ymin) * 0.08; ymax += pad; if (ymin < 0) ymin -= pad;
  const L = 46, R = 8, T = 8, B = 22, X = v => L + (v - x.min) / (x.max - x.min) * (W - L - R), Y = v => T + (ymax - v) / (ymax - ymin) * (Hh - T - B);
  g.strokeStyle = '#111'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(L, T); g.lineTo(L, Hh - B); g.lineTo(W - R, Hh - B); g.stroke();
  if (ymin < 0){ g.strokeStyle = '#999'; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(W - R, Y(0)); g.stroke(); g.setLineDash([]);
    if (dv.negNote){ g.fillStyle = 'rgba(196,58,0,0.08)'; g.fillRect(L, Y(0), W - R - L, Hh - B - Y(0)); g.fillStyle = '#c43a00'; g.font = '600 10px "Space Grotesk",sans-serif'; g.textAlign = 'left'; g.fillText(dv.negNote, L + 4, Hh - B - 4); } }
  g.font = '500 10px "IBM Plex Mono",monospace'; g.fillStyle = '#4a4a4a'; g.textAlign = 'right';
  g.fillText(fplain(ymax), L - 4, T + 8); g.fillText(fplain(ymin < 0 ? ymin : 0), L - 4, Hh - B); if (ymin < 0) g.fillText('0', L - 4, Y(0) + 3);
  g.textAlign = 'center'; g.fillText(fplain(x.min), L, Hh - 8); g.fillText(fplain(x.max), W - R - 10, Hh - 8);
  g.fillText((x.symText || x.id) + (x.unit ? ' (' + x.unit + ')' : ''), (L + W) / 2, Hh - 8);
  g.save(); g.translate(10, (T + Hh - B) / 2); g.rotate(-PI / 2); g.textAlign = 'center'; g.fillText(dv.short + (dv.unit ? ' (' + dv.unit + ')' : ''), 0, 0); g.restore();
  const line = (arr, col, dash) => { g.strokeStyle = col; g.lineWidth = 2.2; g.setLineDash(dash || []); g.beginPath(); let on = false; arr.forEach((y, i) => { if (!isFinite(y)){ on = false; return; } const px = X(xs[i]), py = Math.max(T - 4, Math.min(Hh - B + 4, Y(y))); on ? g.lineTo(px, py) : g.moveTo(px, py); on = true; }); g.stroke(); g.setLineDash([]); };
  if (ref){ line(rs, '#4a4a4a', [5, 4]); g.fillStyle = '#4a4a4a'; g.textAlign = 'right'; g.font = '600 10px "Space Grotesk",sans-serif'; const lastY = rs.filter(isFinite).pop(); if (isFinite(lastY)) g.fillText(ref.short, W - R - 2, Math.max(T + 9, Y(lastY) - 4)); }
  line(ys, '#1546d6');
  const cx = S.v[S.gx], cy = dv.f(S.d);
  if (isFinite(cy)){ g.strokeStyle = '#ff6a2b'; g.setLineDash([2, 3]); g.lineWidth = 1; g.beginPath(); g.moveTo(X(cx), Hh - B); g.lineTo(X(cx), Y(cy)); g.lineTo(L, Y(cy)); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#ff6a2b'; g.strokeStyle = '#111'; g.lineWidth = 1.5; g.beginPath(); g.arc(X(cx), Math.max(T, Math.min(Hh - B, Y(cy))), 4.5, 0, 7); g.fill(); g.stroke(); }
  // doubling readout
  const d2 = calcWith({ [S.gx]: cx * 2 }), y1 = dv.f(S.d), y2 = dv.f(d2);
  let msg = '';
  if (cx === 0 || Math.abs(y1) < 1e-12) msg = '<span class="hint">Move off zero to see the ×2 test.</span>';
  else if (!isFinite(y1) || !isFinite(y2)) msg = '<span class="hint">The ×2 test doesn’t apply here (doubling takes it outside what this quantity covers).</span>';
  else {
    const k = y2 / y1;
    if (k < 0){ $('dbl').innerHTML = 'If <b>' + x.sym + '</b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '</b> goes from ' + fnum(y1) + ' to ' + fnum(y2) + (dv.unit ? ' ' + dv.unit : '') + (dv.signOK ? ': it changes sign. ' + dv.signOK : ': it changes sign, so that can’t really happen.'); return; }
    const tags = [[1, 'doesn’t depend on it'], [2, 'proportional'], [4, 'goes as the square'], [0.5, 'inversely proportional'], [0.25, 'inverse square'], [Math.SQRT2, 'goes as the square root'], [Math.SQRT1_2, 'goes as 1/√'], [8, 'goes as the cube'], [2 * Math.SQRT2, 'goes as the 3/2 power']];
    const tag = tags.find(([v]) => Math.abs(k - v) < 0.004 * v);
    msg = 'If <b>' + x.sym + '</b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '</b> becomes <b>×' + (Math.abs(k) >= 100 ? fnum(k) : k.toFixed(2)) + '</b>' + (tag && !dv.noTag ? ' — ' + tag[1] : '') + '.' + (dv.dblNote ? ' <span class="hint">' + dv.dblNote + '</span>' : '');
  }
  $('dbl').innerHTML = msg;
}

// drawing helpers (canvas is drawn in 600×330 units)
const cv = $('cv'), ctx = cv.getContext('2d');
function arrow(x1, y1, x2, y2, col, label, opts){
  opts = opts || {}; const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy); if (len < 2) return;
  const ux = dx / len, uy = dy / len, hw = opts.head || 9;
  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = opts.w || 3.5; ctx.lineCap = 'round';
  if (opts.dash) ctx.setLineDash(opts.dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hw * 0.8, y2 - uy * hw * 0.8); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - ux * hw - uy * hw * 0.55, y2 - uy * hw + ux * hw * 0.55); ctx.lineTo(x2 - ux * hw + uy * hw * 0.55, y2 - uy * hw - ux * hw * 0.55); ctx.closePath(); ctx.fill();
  if (label){ ctx.font = '700 13px "Space Grotesk",sans-serif'; ctx.textAlign = opts.align || 'left'; ctx.textBaseline = 'middle';
    const lx = x2 + (opts.lx !== undefined ? opts.lx : (ux >= 0 ? 6 : -6)), ly = y2 + (opts.ly !== undefined ? opts.ly : (uy >= 0 ? 10 : -10));
    if (opts.align === undefined) ctx.textAlign = ux >= -0.2 ? 'left' : 'right';
    ctx.fillText(label, lx, ly); }
  ctx.restore();
}
function text(s, x, y, o){ o = o || {}; ctx.save(); ctx.font = (o.font || '600 13px "Space Grotesk",sans-serif'); ctx.fillStyle = o.col || '#111'; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic'; ctx.fillText(s, x, y); ctx.restore(); }
function panelTitle(s, x, y){ text(s, x, y, { font: '700 11px "IBM Plex Mono",monospace', col: '#4a4a4a' }); }
const COL = { F: '#c43a00', W: '#111', N: '#1e7d45', V: '#1546d6', T: '#7a3fb0', comp: '#8a8a8a' };

let last = 0;
function loop(ts){ const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts; S.t += dt;
  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, 600, 330);
  SIM.draw(S.v, S.d, S.mode, S.opt, S.t, dt, S.anim); S.anim.reset = false;
  requestAnimationFrame(loop); }

// ---------------- this sim ----------------
// Electric Potential (AP 10.4–10.5, 10.7; IB HL D.2): equipotential map and work W = qΔV, potential energy of a system of charges, release from rest (energy conservation), charged conducting sphere E(r) and V(r).
const K = 8.99e9;
function Vat(Q, x, y){ return Q.reduce((a, [cx, cy, q]) => a + K * q * 1e-9 / Math.hypot(x - cx, y - cy), 0); }
const SIM = {
  title: 'Electric Potential',
  hint: 'k = 8.99×10⁹ N·m²/C² · V = 0 at infinity',
  modes: [{ id: 'map', label: 'Equipotentials & work' }, { id: 'energy', label: 'Energy of a system' }, { id: 'release', label: 'Release from rest' }, { id: 'sphere', label: 'Charged conducting sphere' }],
  ivs(mode){
    if (mode === 'energy') return [
      { id: 'q1', sym: 'q<sub>1</sub>', symText: 'q1', label: 'Charge 1', unit: 'nC', min: -10, max: 10, step: 0.5, val: 4 },
      { id: 'q2', sym: 'q<sub>2</sub>', symText: 'q2', label: 'Charge 2', unit: 'nC', min: -10, max: 10, step: 0.5, val: 4 },
      { id: 'q3', sym: 'q<sub>3</sub>', symText: 'q3', label: 'Charge 3', unit: 'nC', min: -10, max: 10, step: 0.5, val: -4 },
      { id: 's', sym: 's', symText: 's', label: 'Side of the triangle', unit: 'cm', min: 2, max: 30, step: 0.5, val: 10, graph: true }];
    if (mode === 'release') return [
      { id: 'Q', sym: 'Q', symText: 'Q', label: 'Fixed charge', unit: 'nC', min: 10, max: 500, step: 10, val: 200 },
      { id: 'q', sym: 'q', symText: 'q', label: 'Charge on the bead (− = attracted)', unit: 'nC', min: -200, max: 200, step: 5, val: 50 },
      { id: 'm', sym: 'm', symText: 'm', label: 'Mass of the bead', unit: 'g', min: 0.1, max: 10, step: 0.1, val: 1 },
      { id: 'r1', sym: 'r<sub>1</sub>', symText: 'r1', label: 'Released from rest at', unit: 'cm', min: 2, max: 50, step: 0.5, val: 5 },
      { id: 'r2', sym: 'r<sub>2</sub>', symText: 'r2', label: 'Speed found at', unit: 'cm', min: 2, max: 100, step: 0.5, val: 20, graph: true }];
    if (mode === 'sphere') return [
      { id: 'Q', sym: 'Q', symText: 'Q', label: 'Charge on the sphere', unit: 'nC', min: -50, max: 50, step: 1, val: 20 },
      { id: 'R', sym: 'R', symText: 'R', label: 'Sphere radius', unit: 'cm', min: 5, max: 30, step: 0.5, val: 10 },
      { id: 'r', sym: 'r', symText: 'r', label: 'Distance from the center', unit: 'cm', min: 0, max: 60, step: 0.5, val: 20, graph: true }];
    return [
      { id: 'q1', sym: 'q<sub>1</sub>', symText: 'q1', label: 'Left charge', unit: 'nC', min: -10, max: 10, step: 0.5, val: 5 },
      { id: 'q2', sym: 'q<sub>2</sub>', symText: 'q2', label: 'Right charge', unit: 'nC', min: -10, max: 10, step: 0.5, val: -5 },
      { id: 's', sym: 's', symText: 's', label: 'Separation', unit: 'cm', min: 4, max: 24, step: 0.5, val: 12 },
      { id: 'xA', sym: 'x<sub>A</sub>', symText: 'xA', label: 'Point A: x (y = 6 cm)', unit: 'cm', min: -18, max: 18, step: 0.5, val: -8 },
      { id: 'xB', sym: 'x<sub>B</sub>', symText: 'xB', label: 'Point B: x (y = 6 cm)', unit: 'cm', min: -18, max: 18, step: 0.5, val: 8, graph: true },
      { id: 'qt', sym: 'q<sub>test</sub>', symText: 'qtest', label: 'Charge moved from A to B', unit: 'nC', min: -5, max: 5, step: 0.5, val: 1 }];
  },
  presets: [{ label: 'Like charges', mode: 'map', v: { q1: 5, q2: 5 } }, { label: 'Move an electron-like charge', mode: 'map', v: { qt: -1 } }, { label: 'Attracted bead', mode: 'release', v: { q: -50, r1: 30, r2: 5 } }],
  calc(v, mode){
    if (mode === 'energy'){ const s = v.s / 100, q = [v.q1, v.q2, v.q3].map(c => c * 1e-9), U12 = K * q[0] * q[1] / s, U13 = K * q[0] * q[2] / s, U23 = K * q[1] * q[2] / s; return { U12, U13, U23, U: U12 + U13 + U23, s }; }
    if (mode === 'release'){ const Q = v.Q * 1e-9, q = v.q * 1e-9, m = v.m / 1000, r1 = v.r1 / 100, r2 = v.r2 / 100, U1 = K * Q * q / r1, U2 = K * Q * q / r2, KE = U1 - U2; return { U1, U2, KE, v: KE >= 0 ? Math.sqrt(2 * KE / m) : NaN, ok: KE >= 0, Vf1: K * Q / r1, Vf2: K * Q / r2 }; }
    if (mode === 'sphere'){ const Q = v.Q * 1e-9, R = v.R / 100, r = v.r / 100, inside = r < R; return { inside, E: inside ? 0 : K * Q / (r * r), V: inside ? K * Q / R : K * Q / r, Vsurf: K * Q / R, Esurf: K * Q / (R * R) }; }
    const s = v.s / 100, Q = [[-s / 2, 0, v.q1], [s / 2, 0, v.q2]], yA = 0.06, VA = Vat(Q, v.xA / 100, yA), VB = Vat(Q, v.xB / 100, yA), q = v.qt * 1e-9;
    return { Q, VA, VB, dV: VB - VA, Wf: -q * (VB - VA), Wext: q * (VB - VA), Eavg: Math.abs(v.xB - v.xA) > 0.1 ? -(VB - VA) / ((v.xB - v.xA) / 100) : NaN };
  },
  dvs(mode){
    if (mode === 'energy') return [{ id: 'U', name: 'Total potential energy of the system', short: 'U', sym: 'U', unit: 'J', f: d => d.U }];
    if (mode === 'release') return [{ id: 'v', name: 'Speed at r₂', short: 'v', sym: 'v', unit: 'm/s', f: d => d.v }, { id: 'KE', name: 'Kinetic energy gained', short: 'KE', sym: 'KE', unit: 'J', f: d => d.KE }];
    if (mode === 'sphere') return [{ id: 'E', name: 'Field strength at r', short: 'E', sym: 'E', unit: 'N/C', f: d => d.E }, { id: 'V', name: 'Potential at r', short: 'V', sym: 'V', unit: 'V', f: d => d.V }];
    return [{ id: 'VB', name: 'Potential at B', short: 'V_B', sym: 'V<sub>B</sub>', unit: 'V', f: d => d.VB }, { id: 'dV', name: 'Potential difference V_B − V_A', short: 'ΔV', sym: 'ΔV', unit: 'V', f: d => d.dV }, { id: 'Wext', name: 'Work by you to move it A → B', short: 'W_ext', sym: 'W<sub>ext</sub>', unit: 'J', f: d => d.Wext }];
  },
  work(v, d, mode){
    if (mode === 'energy') return '<h4>1 · Potential energy of a pair: U = kq<sub>1</sub>q<sub>2</sub>/r (sign included)</h4><div class="eq">U<sub>12</sub> = ' + H.n(d.U12, 'J') + ', U<sub>13</sub> = ' + H.n(d.U13, 'J') + ', U<sub>23</sub> = ' + H.n(d.U23, 'J') + '</div>' +
      '<h4>2 · System energy = sum over every pair (it’s a scalar)</h4><div class="eq">U = <b>' + H.n(d.U, 'J') + '</b></div>' +
      '<h4>3 · Meaning: work to assemble the charges from infinitely far apart</h4><div class="eq">Bring q₁: 0. Bring q₂: U<sub>12</sub>. Bring q₃: U<sub>13</sub> + U<sub>23</sub>. Total = U.</div>' +
      '<div class="eq">' + (d.U > 0 ? 'U &gt; 0: you had to push them together; let go and they fly apart.' : d.U < 0 ? 'U &lt; 0: the system is bound; you’d have to do work to pull it apart.' : 'U = 0') + '</div>' +
      '<p class="note">Halve the side → each pair energy doubles (1/r, not 1/r²).</p>';
    if (mode === 'release') return '<h4>1 · Only the electric force does work: energy is conserved</h4><div class="eq">K<sub>1</sub> + U<sub>1</sub> = K<sub>2</sub> + U<sub>2</sub>, with K<sub>1</sub> = 0 and U = kQq/r</div>' +
      '<div class="eq">U<sub>1</sub> = kQq/r<sub>1</sub> = ' + H.n(d.U1, 'J') + ' &nbsp; U<sub>2</sub> = kQq/r<sub>2</sub> = ' + H.n(d.U2, 'J') + '</div>' +
      (d.ok ? '<div class="eq">K<sub>2</sub> = U<sub>1</sub> − U<sub>2</sub> = ' + H.n(d.KE, 'J') + ' → v = √(2K/m) = <b>' + H.n(d.v, 'm/s') + '</b></div>' : '<div class="bad">U<sub>2</sub> &gt; U<sub>1</sub>: it would need negative KE. Released from rest, it never gets to r<sub>2</sub> (it moves the other way).</div>') +
      '<h4>2 · Same thing with potential: ΔK = −qΔV</h4><div class="eq">V at r₁ = ' + H.n(d.Vf1, 'V') + ', at r₂ = ' + H.n(d.Vf2, 'V') + '. ' + (v.q > 0 ? 'Positive charges fall from high V to low V.' : 'Negative charges “fall” from low V to high V.') + '</div>' +
      '<p class="note">Use energy, not F = ma: the force changes with distance, so the acceleration isn’t constant.</p>';
    if (mode === 'sphere') return '<h4>1 · Conductor in equilibrium: charge sits on the surface</h4><div class="eq">Inside (r &lt; R): <b>E = 0</b>, and V is the same everywhere: V = kQ/R = ' + H.n(d.Vsurf, 'V') + '</div>' +
      '<h4>2 · Outside: acts like a point charge at the center</h4><div class="eq">E = kQ/r², V = kQ/r. At the surface: E = ' + H.n(d.Esurf, 'N/C') + '</div>' +
      '<h4>3 · At r = ' + H.iv('r') + (d.inside ? ' (inside)' : ' (outside)') + '</h4><div class="eq">E = <b>' + H.n(d.E, 'N/C') + '</b>, V = <b>' + H.n(d.V, 'V') + '</b></div>' +
      '<p class="note">E = −ΔV/Δr: where V is flat (inside), E = 0. The surface is an equipotential, so E meets it at right angles. Hollow or solid, the answer is the same.</p>';
    return '<h4>1 · Potential is a scalar: V = Σ kq/r (keep the signs)</h4><div class="eq">V<sub>A</sub> = ' + H.n(d.VA, 'V') + ' &nbsp; V<sub>B</sub> = ' + H.n(d.VB, 'V') + ' → ΔV = V<sub>B</sub> − V<sub>A</sub> = <b>' + H.n(d.dV, 'V') + '</b></div>' +
      '<h4>2 · Work to move q = ' + H.iv('qt') + ' from A to B (slowly)</h4><div class="eq">W<sub>you</sub> = qΔV = <b>' + H.n(d.Wext, 'J') + '</b> &nbsp; W<sub>field</sub> = −qΔV = ' + H.n(d.Wf, 'J') + '</div>' +
      '<div class="eq">ΔU = qΔV = ' + H.n(d.Wext, 'J') + '. The path doesn’t matter, only the start and end.</div>' +
      '<h4>3 · Field from potential: E = −ΔV/Δx</h4><div class="eq">Average E<sub>x</sub> between A and B ≈ ' + H.n(d.Eavg, 'V/m') + '. E points from high V to low V, at right angles to the equipotentials.</div>' +
      '<p class="note">Moving along an equipotential takes no work. Close-together equipotentials = strong field.</p>';
  },
  draw(v, d, mode, opt, t, dt, A){
    const small = (s, x, y, c) => text(s, x, y, { font: '600 10px "IBM Plex Mono",monospace', col: c || '#4a4a4a' });
    if (mode === 'energy'){
      panelTitle('ASSEMBLE THREE CHARGES (equilateral triangle)', 10, 18);
      const s = 60 + 6 * v.s, cx = 195, cy = 175, pts = [[cx - s / 2, cy + s * 0.29], [cx + s / 2, cy + s * 0.29], [cx, cy - s * 0.58]], qs = [v.q1, v.q2, v.q3];
      const pair = (i, j, U) => { ctx.strokeStyle = U > 0 ? '#c43a00' : U < 0 ? '#1546d6' : '#bbb'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(...pts[i]); ctx.lineTo(...pts[j]); ctx.stroke(); const mx = (pts[i][0] + pts[j][0]) / 2, my = (pts[i][1] + pts[j][1]) / 2, ox = mx - cx, oy = my - (cy - s * 0.0), on = Math.hypot(ox, oy) || 1; text(fplain(U) + ' J', mx + 26 * ox / on, my + 26 * oy / on + 4, { align: 'center', font: '600 10px "IBM Plex Mono",monospace', col: U > 0 ? '#c43a00' : '#1546d6' }); };
      pair(0, 1, d.U12); pair(0, 2, d.U13); pair(1, 2, d.U23);
      pts.forEach(([x, y], i) => { const q = qs[i]; ctx.fillStyle = q > 0 ? '#ff6a2b' : q < 0 ? '#1546d6' : '#bbb'; ctx.beginPath(); ctx.arc(x, y, 13, 0, 7); ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.stroke(); text(q > 0 ? '+' : q < 0 ? '−' : '0', x, y + 5, { align: 'center', font: '700 14px "Space Grotesk",sans-serif', col: '#fff' }); small('q' + (i + 1), x + 15, y + 4, '#111'); });
      small('red = positive pair energy (repel) · blue = negative (attract)', 12, 316);
      panelTitle('TOTAL', 395, 18); text('U = ' + fplain(d.U) + ' J', 400, 60, { font: '700 16px "Space Grotesk",sans-serif', col: d.U >= 0 ? '#c43a00' : '#1546d6' });
      return;
    }
    if (mode === 'release'){
      if (A.s === undefined || A.reset) A.s = 0; A.s = (A.s + dt / 3) % 1.3; const s = Math.min(1, A.s);
      panelTitle('BEAD RELEASED FROM REST', 10, 18);
      const X = r => 40 + 330 * r / 100; ctx.fillStyle = '#ff6a2b'; ctx.beginPath(); ctx.arc(40, 150, 14, 0, 7); ctx.fill(); ctx.strokeStyle = '#111'; ctx.stroke(); text('+Q', 40, 155, { align: 'center', font: '700 11px "Space Grotesk",sans-serif', col: '#fff' });
      ctx.strokeStyle = '#ccc'; ctx.beginPath(); ctx.moveTo(40, 150); ctx.lineTo(375, 150); ctx.stroke();
      [[v.r1, 'r₁', 205], [v.r2, 'r₂', 222]].forEach(([r, l, yy]) => { ctx.strokeStyle = '#888'; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(X(r), 110); ctx.lineTo(X(r), yy - 10); ctx.stroke(); ctx.setLineDash([]); small(l + ' = ' + r + ' cm', X(r) - 20, yy); });
      if (d.ok){ const r = v.r1 + (v.r2 - v.r1) * s; ctx.fillStyle = v.q > 0 ? '#ff6a2b' : '#1546d6'; ctx.beginPath(); ctx.arc(X(r), 150, 8, 0, 7); ctx.fill(); }
      else { ctx.fillStyle = v.q > 0 ? '#ff6a2b' : '#1546d6'; ctx.beginPath(); ctx.arc(X(v.r1), 150, 8, 0, 7); ctx.fill(); small('can’t reach r₂ from rest', 120, 240, '#c43a00'); }
      text(d.ok ? 'v at r₂ = ' + fplain(d.v) + ' m/s' : 'never gets to r₂', 12, 300, { font: '700 14px "Space Grotesk",sans-serif' });
      panelTitle('ENERGY (J)', 395, 18);
      const bars = [['U₁', d.U1, '#7a3fb0'], ['U₂', d.U2, '#7a3fb0'], ['K₂', d.ok ? d.KE : 0, '#1546d6']], mx = Math.max(...bars.map(b => Math.abs(b[1])), 1e-12), b0 = 170;
      ctx.strokeStyle = '#bbb'; ctx.beginPath(); ctx.moveTo(400, b0); ctx.lineTo(585, b0); ctx.stroke();
      bars.forEach(([l, q, c], i) => { const h = 100 * q / mx, x = 415 + i * 58; ctx.fillStyle = c; ctx.fillRect(x, Math.min(b0, b0 - h), 34, Math.abs(h)); small(l, x + 12, q < 0 ? b0 - 4 : b0 + 14, '#111'); small(fplain(q), x, q < 0 ? b0 - h + 12 : b0 - h - 4); });
      return;
    }
    if (mode === 'sphere'){
      panelTitle('CHARGED CONDUCTING SPHERE', 10, 18);
      const cx = 140, cy = 170, Rp = 30 + 3 * v.R, sc = Rp / v.R; ctx.fillStyle = '#e6e6e6'; ctx.beginPath(); ctx.arc(cx, cy, Rp, 0, 7); ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.stroke();
      const n = Math.min(24, Math.round(Math.abs(v.Q) / 2)); for (let i = 0; i < n; i++){ const a = 2 * PI * i / n; text(v.Q > 0 ? '+' : '−', cx + (Rp - 6) * Math.cos(a), cy + (Rp - 6) * Math.sin(a) + 4, { align: 'center', font: '700 11px "Space Grotesk",sans-serif', col: v.Q > 0 ? '#c43a00' : '#1546d6' }); }
      for (let i = 0; i < Math.min(12, n); i++){ const a = 2 * PI * i / Math.min(12, n) + 0.13; const x1 = cx + (Rp + 4) * Math.cos(a), y1 = cy + (Rp + 4) * Math.sin(a), x2 = cx + (Rp + 40) * Math.cos(a), y2 = cy + (Rp + 40) * Math.sin(a); v.Q > 0 ? arrow(x1, y1, x2, y2, '#7a3fb0', null, { w: 1.5, head: 6 }) : arrow(x2, y2, x1, y1, '#7a3fb0', null, { w: 1.5, head: 6 }); }
      small('E = 0 inside', cx - 34, cy + 4, '#1e7d45');
      const px = cx + sc * v.r; ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(Math.min(385, px), cy, 4, 0, 7); ctx.fill(); small('r', Math.min(380, px) - 2, cy - 8, '#111');
      panelTitle('E(r) AND V(r)', 395, 18);
      const gx = 405, gw = 180, rmax = 60, Xg = r => gx + gw * r / rmax;
      const plot = (gy, gh, f, col, lab) => { ctx.strokeStyle = '#111'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(gx, gy - gh); ctx.lineTo(gx, gy); ctx.lineTo(gx + gw, gy); ctx.stroke(); const mx = Math.max(...Array.from({ length: 121 }, (_, i) => Math.abs(f(rmax * i / 120)))) || 1;
        ctx.strokeStyle = col; ctx.lineWidth = 2.2; ctx.beginPath(); for (let i = 0; i <= 120; i++){ const r = rmax * i / 120, y = gy - gh * Math.abs(f(r)) / mx; i ? ctx.lineTo(Xg(r), y) : ctx.moveTo(Xg(r), y); } ctx.stroke(); ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(Xg(v.r), gy - gh * Math.abs(f(v.r)) / mx, 4, 0, 7); ctx.fill(); small(lab, gx + 4, gy - gh - 2, col);
        ctx.setLineDash([3, 3]); ctx.strokeStyle = '#bbb'; ctx.beginPath(); ctx.moveTo(Xg(v.R), gy - gh); ctx.lineTo(Xg(v.R), gy); ctx.stroke(); ctx.setLineDash([]); };
      const Ef = r => r < v.R ? 0 : K * v.Q * 1e-9 / Math.pow(r / 100, 2), Vf = r => K * v.Q * 1e-9 / (Math.max(r, v.R) / 100);
      plot(150, 100, Ef, '#c43a00', '|E|'); plot(290, 100, Vf, '#1546d6', '|V|'); small('R', Xg(v.R) - 3, 302); small('r (cm)', gx + gw - 30, 302);
      return;
    }
    // equipotential map
    const X = x => 195 + 900 * x, Y = y => 165 - 900 * y, key = [v.q1, v.q2, v.s].join();
    if (!A.img || A.key !== key){ A.key = key; const oc = document.createElement('canvas'); oc.width = 760; oc.height = 600; const o = oc.getContext('2d'); o.setTransform(2, 0, 0, 2, 0, 0);
      const st = 3, nx = Math.ceil(375 / st) + 1, ny = Math.ceil(275 / st) + 1, G = [];
      for (let j = 0; j < ny; j++){ G.push([]); for (let i = 0; i < nx; i++){ const px = 10 + i * st, py = 30 + j * st; G[j].push(Vat(d.Q, (px - 195) / 900, (165 - py) / 900)); } }
      for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++){ const Vv = G[j][i], a = Math.min(1, Math.log10(1 + Math.abs(Vv) / 20) / 3.2); o.fillStyle = Vv > 0 ? 'rgba(255,106,43,' + a * 0.55 + ')' : 'rgba(21,70,214,' + a * 0.55 + ')'; o.fillRect(10 + i * st, 30 + j * st, st, st); }
      const levels = [-3000, -1500, -800, -400, -200, -100, 0, 100, 200, 400, 800, 1500, 3000];
      o.lineWidth = 1.2;
      levels.forEach(L => { o.strokeStyle = L === 0 ? '#111' : '#333'; o.beginPath();
        for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++){ const c = [G[j][i], G[j][i + 1], G[j + 1][i + 1], G[j + 1][i]]; if (c.some(z => !isFinite(z) || Math.abs(z) > 5e4)) continue; const pts = [], e = [[0, 1, 0, 0, 1, 0], [1, 2, 1, 0, 1, 1], [2, 3, 1, 1, 0, 1], [3, 0, 0, 1, 0, 0]];
          e.forEach(([a, b, x1, y1, x2, y2]) => { if ((c[a] - L) * (c[b] - L) < 0){ const f = (L - c[a]) / (c[b] - c[a]); pts.push([10 + (i + x1 + (x2 - x1) * f) * st, 30 + (j + y1 + (y2 - y1) * f) * st]); } });
          if (pts.length >= 2){ o.moveTo(...pts[0]); o.lineTo(...pts[1]); if (pts.length === 4){ o.moveTo(...pts[2]); o.lineTo(...pts[3]); } } }
        o.stroke(); });
      A.img = oc; }
    ctx.drawImage(A.img, 0, 0, 760, 600, 0, 0, 380, 300); ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.strokeRect(10, 30, 375, 275);
    panelTitle('EQUIPOTENTIALS (lines) · red = high V, blue = low V', 10, 18);
    d.Q.forEach(([cx, cy, q], i) => { ctx.fillStyle = q > 0 ? '#ff6a2b' : q < 0 ? '#1546d6' : '#bbb'; ctx.beginPath(); ctx.arc(X(cx), Y(cy), 9, 0, 7); ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.stroke(); text(q > 0 ? '+' : q < 0 ? '−' : '0', X(cx), Y(cy) + 5, { align: 'center', font: '700 13px "Space Grotesk",sans-serif', col: '#fff' }); });
    const ax = X(v.xA / 100), bx = X(v.xB / 100), yy = Y(0.06);
    ctx.setLineDash([5, 4]); ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(ax, yy); ctx.quadraticCurveTo((ax + bx) / 2, yy - 50, bx, yy); ctx.stroke(); ctx.setLineDash([]);
    [[ax, 'A'], [bx, 'B']].forEach(([x, l]) => { ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x, yy, 5, 0, 7); ctx.fill(); text(l, x - 4, yy - 9, { font: '700 13px "Space Grotesk",sans-serif' }); });
    text('V_A = ' + fplain(d.VA) + ' V   V_B = ' + fplain(d.VB) + ' V', 14, 320, { font: '700 12px "Space Grotesk",sans-serif' });
    panelTitle('MOVE q FROM A TO B', 395, 18);
    text('ΔV = ' + fplain(d.dV) + ' V', 400, 56, { font: '700 14px "Space Grotesk",sans-serif' });
    text('W by you = ' + fplain(d.Wext) + ' J', 400, 82, { font: '600 12px "IBM Plex Mono",monospace', col: d.Wext >= 0 ? '#c43a00' : '#1e7d45' });
    text('W by field = ' + fplain(d.Wf) + ' J', 400, 102, { font: '600 12px "IBM Plex Mono",monospace' });
    small('any path: same W', 400, 300);
  }
};



S.mode = SIM.modes ? SIM.modes[0].id : 'one';
setup(); requestAnimationFrame(loop);
window.APP = { select(name){ const m = (SIM.modes || []).find(m => m.label === name || m.id === name); if (m && m.id !== S.mode){ S.mode = m.id; S.anim = {}; setup(); } } };
addEventListener('message', e => { const d = e.data; if (d && d.select) try { APP.select(d.select); } catch (er) {} });
</script>
