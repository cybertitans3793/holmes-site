<!DOCTYPE html>
<!--
  Nuclear Fission (lite): an original rewrite inspired by PhET Interactive Simulations' Nuclear Fission
  (University of Colorado Boulder, phet.colorado.edu) and the OpenStax version. Written from scratch; no code copied.
  Kept from the PhET Java version: Chain Reaction nuclei are placed within +/-100 x +/-75 and removed beyond
  +/-200 x +/-150, and "Nuclei fissioned" counts departed fragment pairs with integer division.
  Self-contained: no outside files, fonts or links.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuclear Fission</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fff}
*,*:before,*:after{box-sizing:border-box}
#stage{position:absolute;left:0;top:0;width:1000px;height:750px;transform-origin:0 0;overflow:hidden;background:#fff;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px;line-height:20px;color:#333;
  -webkit-user-select:none;user-select:none}
button{font:inherit;margin:0;cursor:pointer}
button:focus{outline:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid #9fc0ff;outline-offset:1px}
#app{position:absolute;left:20px;top:10px;width:960px;height:723px}
/* tabs */
#tabs{height:37px;padding-left:30px;border-bottom:2px solid #21366b;font-size:0;white-space:nowrap}
#tabs .tab{display:inline-block;margin-right:3px;padding:7px 10px;height:35px;font-size:14px;line-height:21px;border:0;
  background:#ededed;color:#21366b;vertical-align:top}
#tabs .tab span{margin-left:2px}
#tabs .tab span:after{content:"+";font-weight:bold;margin-left:5px}
#tabs .tab.active{background:#21366b;color:#ededed}
#tabs .tab.active span:after{content:"\2212"}
/* sim views */
.simv{position:absolute;left:0;top:37px;width:960px;height:686px;display:none}
.simv.on{display:block}
.simv.exploded{filter:grayscale(100%)}
.scene{position:absolute;left:0;top:0;width:960px;height:624px;display:block;
  background:linear-gradient(#ff6a6a 0%,#cab5e6 85%)}
.ui{position:absolute;left:0;top:0;width:960px;height:624px;pointer-events:none}
.ui>*{pointer-events:auto}
.panels{position:absolute;right:20px;top:20px;width:220px}
.panel{background:rgba(255,255,255,.2);box-shadow:0 0 11px rgba(0,0,0,.25);width:220px;padding:15px;margin-bottom:12px;position:relative}
.panel h2{font-size:16px;font-weight:400;line-height:17.6px;color:rgba(34,34,34,.65);margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid rgba(0,0,0,.09)}
.legend{font-size:13px}
.lrow{display:flex;align-items:flex-start;margin-bottom:4px}
.lrow .li{flex:none;margin-right:12px;display:flex;justify-content:center;align-items:center;overflow:visible}
.lrow span{line-height:18px}
.bigbtn{position:absolute;background:#21366b;color:#fff;border:1px solid transparent;border-radius:6px;padding:10px 16px;
  font-size:18px;line-height:24px;width:160px;text-align:center;display:none}
.bigbtn:hover{opacity:.9}
/* chain controls */
.cbx{display:flex;align-items:center;font-weight:700;color:#222;line-height:16px;cursor:pointer;margin-bottom:12px;width:max-content}
.cbx i{width:16px;height:16px;border:2px solid #333;background:#fff;margin-right:10px;position:relative}
.cbx.on i:after{content:"";position:absolute;left:-1px;top:-1px;width:14px;height:14px;background:#21366b}
.sw{position:relative;height:30px}
.sh{font-weight:700;height:20px;display:flex;align-items:center}
.sh canvas{margin-right:8px;margin-top:-4px}
.sh .sv{margin-left:auto;font-weight:400}
.sl{position:absolute;left:0;right:0;top:28px;height:2px;background:#fbdfe8;cursor:pointer;touch-action:none}
.sl:before{content:"";position:absolute;left:-14px;right:-14px;top:-12px;height:26px}
.sl .fill{position:absolute;left:0;top:0;height:2px;background:#21366b}
.sl .kn{position:absolute;top:-12px;width:26px;height:26px;margin-left:-13px}
.sl .kn:after{content:"";position:absolute;left:7px;top:7px;width:12px;height:12px;border-radius:50%;background:#21366b}
/* energy graphs */
.gw{float:left;width:85px;position:relative;height:195px}
.gb{position:absolute;left:22.5px;top:0;width:40px;height:150px;background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.15)}
.gb i{position:absolute;left:0;bottom:0;width:100%;height:0}
.ga{position:absolute;left:10px;top:76px;transform:translate(-50%,-50%) rotate(-90deg);font-weight:700;color:#222;white-space:nowrap}
.gt{position:absolute;left:0;top:150px;width:85px;text-align:center;font-weight:700;color:#222}
/* playback */
.pb{position:absolute;left:0;top:624px;width:960px;height:62px;background:#dac9f1}
.pbtn{position:absolute;border:0;border-radius:50%;background:rgba(33,54,107,.14);color:#21366b;padding:0;display:flex;align-items:center;justify-content:center}
.pbtn:hover{opacity:.9}
.pbtn:active{background:#21366b;color:#fff}
.pbtn svg{fill:currentColor}
.pp{left:443px;top:10px;width:42px;height:42px}
.st{left:489px;top:17px;width:28px;height:28px}
.fiss{position:absolute;left:590px;top:22px;width:210px;display:flex;align-items:center;font-weight:700}
.fiss canvas{margin-right:8px;margin-top:-6px}
.fiss .fv{margin-left:auto;width:60px;text-align:right;font-weight:400}
.rall{position:absolute;left:863px;top:15px;height:32px;padding:6px 12px;border:0;border-radius:4px;font-size:14px;font-weight:500;line-height:20px;
  color:#21366b;background:rgba(33,54,107,.14)}
.rall:hover{opacity:.9}
.rall:active{color:#fff;background:#21366b}
/* explosion */
.boom{position:absolute;left:0;top:0;width:960px;height:624px;z-index:50;opacity:0;transition:opacity 3s linear;display:none}
.boom.show{opacity:1}
.boom canvas{position:absolute;left:0;top:0}
.boom div{position:absolute;bottom:20px;width:100%;text-align:center;font-size:42px;line-height:46px;color:#fff;font-family:monospace}
/* picture dialog */
#modal{position:absolute;left:0;top:0;width:1000px;height:750px;z-index:100;display:none}
#modal .bd{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#modal .dlg{position:absolute;left:324px;top:30px;width:351px;background:#fff;border:1px solid rgba(0,0,0,.2);border-radius:6px;box-shadow:0 5px 15px rgba(0,0,0,.5)}
#modal .mh{padding:15px;border-bottom:1px solid #e5e5e5;position:relative}
#modal h4{margin:0;font-size:18px;font-weight:500;line-height:20px;color:#333}
#modal .x{position:absolute;right:15px;top:13px;border:0;background:none;font-size:21px;font-weight:700;color:#000;opacity:.2;padding:0;line-height:21px}
#modal .x:hover{opacity:.5}
#modal .mb{padding:4px 2px 4px 4px}
#modal .mf{padding:15px;text-align:right;border-top:1px solid #e5e5e5}
#modal .mf button{border:1px solid #ccc;background:#fff;color:#333;border-radius:4px;padding:6px 12px;line-height:20px}
#modal .mf button:hover{background:#e6e6e6}
#credit{position:absolute;right:30px;top:735px;font-size:11px;line-height:14px;color:#b5b5b5}
</style>
</head>
<body>
<div id="stage">
<div id="app">
  <nav id="tabs" role="tablist">
    <button class="tab active" data-t="0" role="tab"><span>Fission: One Nucleus</span></button><button class="tab" data-t="1" role="tab"><span>Chain Reaction</span></button><button class="tab" data-t="2" role="tab"><span>Nuclear Reactor</span></button>
  </nav>

  <!-- One Nucleus -->
  <section class="simv on" id="v0">
    <canvas class="scene"></canvas>
    <div class="ui">
      <div class="panels"><div class="panel legend"><h2>Legend</h2><div class="lg"></div></div></div>
      <button class="bigbtn" id="resetNucleus" style="left:750px;top:250px">Reset Nucleus</button>
    </div>
    <div class="pb"><button class="pbtn pp" title="Pause"></button><button class="pbtn st" title="Step forward"></button></div>
  </section>

  <!-- Chain Reaction -->
  <section class="simv" id="v1">
    <canvas class="scene"></canvas>
    <div class="ui">
      <div class="panels">
        <div class="panel legend"><h2>Legend</h2><div class="lg"></div></div>
        <div class="panel" style="height:178px">
          <h2>Controls</h2>
          <div class="cbx" id="vesselChk" tabindex="0" role="checkbox" aria-checked="false"><i></i>Containment Vessel</div>
          <div class="sw" style="margin-top:4px;margin-bottom:18px"><div class="sh"><canvas data-ic="235"></canvas>U-235 <span class="sv" id="n235">1 Nucleus</span></div>
            <div class="sl" id="s235" tabindex="0" role="slider" aria-label="U-235 nuclei" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div><div class="kn"></div></div></div>
          <div class="sw"><div class="sh"><canvas data-ic="238"></canvas>U-238 <span class="sv" id="n238">0 Nuclei</span></div>
            <div class="sl" id="s238" tabindex="0" role="slider" aria-label="U-238 nuclei" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div><div class="kn"></div></div></div>
        </div>
      </div>
      <button class="bigbtn" id="resetNuclei1" style="left:12px;top:12px">Reset Nuclei</button>
    </div>
    <div class="pb">
      <button class="pbtn pp" title="Pause"></button><button class="pbtn st" title="Step forward"></button>
      <div class="fiss"><canvas data-ic="235"></canvas>Nuclei fissioned<b style="font-weight:400">:</b><span class="fv" id="fissPct">0.00%</span></div>
      <button class="rall" id="resetAll" title="Reset All">Reset All</button>
    </div>
    <div class="boom" id="boom"><canvas width="960" height="624"></canvas><div>You have created an atomic bomb!</div></div>
  </section>

  <!-- Nuclear Reactor -->
  <section class="simv" id="v2">
    <canvas class="scene"></canvas>
    <div class="ui">
      <div class="panels" style="width:200px">
        <div class="panel legend" style="width:200px"><h2>Legend</h2><div class="lg"></div></div>
        <div class="panel" style="width:200px;height:253px"><h2>Energy Graphs</h2>
          <div class="gw"><div class="gb"><i id="powerBar" style="background:#ffbb44"></i></div><div class="ga">joules/sec</div><div class="gt">Power Output</div></div>
          <div class="gw"><div class="gb"><i id="energyBar" style="background:#78b04a"></i></div><div class="ga">joules</div><div class="gt">Energy Produced</div></div>
        </div>
      </div>
      <button class="bigbtn" id="resetNuclei2" style="left:12px;top:12px">Reset Nuclei</button>
      <button class="bigbtn" id="picBtn" style="display:block;width:auto;right:240px;top:20px;padding:10px 16px"><svg width="18" height="16" viewBox="0 0 18 16" style="margin-right:8px;vertical-align:-2px"><rect x="1" y="1" width="16" height="14" rx="1.5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="5.5" cy="5" r="1.8" fill="#fff"/><path d="M3 13l4-4 2 2 3.5-4.5L15 10v3z" fill="#fff"/></svg>Picture of Reactor</button>
    </div>
    <div class="pb"><button class="pbtn pp" title="Pause"></button><button class="pbtn st" title="Step forward"></button></div>
  </section>
</div>
<div id="credit">Based on PhET Interactive Simulations' Nuclear Fission</div>
<div id="modal" role="dialog" aria-modal="true" aria-label="Picture of a nuclear reactor">
  <div class="bd"></div>
  <div class="dlg">
    <div class="mh"><button class="x" aria-label="Close">&times;</button><h4>Picture of a nuclear reactor</h4></div>
    <div class="mb">
      <svg width="343" height="430" viewBox="0 0 343 430" role="img" aria-label="Illustration of a pool-type research reactor core glowing blue under water">
        <defs>
          <radialGradient id="rg" cx=".5" cy=".64" r=".62"><stop offset="0" stop-color="#bff6ff"/><stop offset=".28" stop-color="#2fb4e6"/><stop offset=".7" stop-color="#0a4f8c"/><stop offset="1" stop-color="#03203f"/></radialGradient>
          <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9fdff"/><stop offset="1" stop-color="#5fd0f0" stop-opacity=".2"/></linearGradient>
        </defs>
        <rect width="343" height="430" fill="url(#rg)"/>
        <g fill="#04243f" opacity=".85">
          <rect x="22" y="0" width="20" height="230"/><rect x="300" y="0" width="20" height="230"/>
          <rect x="88" y="0" width="12" height="215"/><rect x="243" y="0" width="12" height="215"/>
          <rect x="0" y="70" width="343" height="16"/><rect x="0" y="150" width="343" height="10"/>
          <path d="M0 105L343 205v12L0 117z"/><path d="M150 0h46v90c0 18-46 18-46 0z"/><rect x="164" y="88" width="18" height="140"/>
          <rect x="40" y="215" width="263" height="14"/>
        </g>
        <rect x="55" y="232" width="233" height="92" fill="url(#lg)" opacity=".9"/>
        <g fill="#fff" opacity=".75"><rect x="104" y="236" width="6" height="84"/><rect x="124" y="236" width="6" height="84"/><rect x="144" y="236" width="6" height="84"/><rect x="164" y="236" width="6" height="84"/><rect x="184" y="236" width="6" height="84"/><rect x="204" y="236" width="6" height="84"/><rect x="224" y="236" width="6" height="84"/></g>
        <text x="171" y="410" text-anchor="middle" fill="#bfefff" font-size="11" font-family="Helvetica,Arial,sans-serif">Illustration: the blue Cherenkov glow of a pool-type reactor</text>
      </svg>
    </div>
    <div class="mf"><button class="cl">Close</button></div>
  </div>
</div>
</div>

<script>
(function(){
'use strict';
/* ---------------- constants (from the original model) ---------------- */
var FRAME = 0.04, DTMS = 40;                 // 25 model ticks per second, 40 ms of sim time each
var NUC_D = 1.6;
var FONT = '"Helvetica Neue",Helvetica,Arial,sans-serif';
var PROTON = '#f00', NEUTRON = '#888';
var TAU = Math.PI*2, rnd = Math.random;

function diamOf(w){ return w===1?1.6:(w<=3?3.2:(w===4?5.6:1.6*Math.pow(w,0.362))); }
function isoLabel(p,n){ if(p!==92) return null;
  if(n===143) return ['235','#0f0']; if(n===144) return ['236','#f80']; if(n===147) return ['239','#fff']; return ['238','#ff0']; }
function dist(ax,ay,bx,by){ var dx=ax-bx, dy=ay-by; return Math.sqrt(dx*dx+dy*dy); }
function hexRgb(h){ h=h.replace('#',''); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; var v=parseInt(h,16); return [v>>16&255,v>>8&255,v&255]; }
function mix(a,b,t){ var A=hexRgb(a),B=hexRgb(b); return 'rgb('+Math.round(A[0]*t+B[0]*(1-t))+','+Math.round(A[1]*t+B[1]*(1-t))+','+Math.round(A[2]*t+B[2]*(1-t))+')'; }

/* ---------------- stage scaling ---------------- */
var stage = document.getElementById('stage'), SCALE = 1, RES = 1;
function fit(){
  var w = window.innerWidth||1000, h = window.innerHeight||750;
  SCALE = Math.min(w/1000, h/750);
  stage.style.transform = 'scale('+SCALE+')';
  stage.style.left = Math.max(0,(w-1000*SCALE)/2)+'px';
  stage.style.top = Math.max(0,(h-750*SCALE)/2)+'px';
  var r = Math.max(1, Math.min(3, SCALE*(window.devicePixelRatio||1)));
  if (Math.abs(r-RES) > 0.01){ RES = r; spriteCache = {}; sims.forEach(function(s){ s.resize(); }); }
}

/* ---------------- sprite factory ---------------- */
var spriteCache = {};
function mk(w,h){ var c=document.createElement('canvas'); c.width=Math.max(1,Math.ceil(w*RES)); c.height=Math.max(1,Math.ceil(h*RES)); var x=c.getContext('2d'); x.scale(RES,RES); return {c:c,x:x,w:w,h:h}; }
function shade(col,f){ var c=hexRgb(col); return 'rgb('+Math.round(c[0]*f/255)+','+Math.round(c[1]*f/255)+','+Math.round(c[2]*f/255)+')'; }
function paintSphere(x,cx,cy,r,col){
  x.fillStyle=shade(col,185); x.beginPath(); x.arc(cx,cy,r,0,TAU); x.fill();
  x.fillStyle=shade(col,207); x.beginPath(); x.arc(cx+0.1*r,cy-0.06*r,0.88*r,0,TAU); x.fill();
  if (r>2){ x.fillStyle=shade(col,218); x.beginPath(); x.arc(cx+0.32*r,cy-0.32*r,0.37*r,0,TAU); x.fill(); }
}
function sphere(col,d){
  var k='s'+col+d+'@'+RES; if(spriteCache[k]) return spriteCache[k];
  var s=mk(d+2,d+2); paintSphere(s.x,d/2+1,d/2+1,d/2,col); s.ox=d/2+1; s.oy=d/2+1; return (spriteCache[k]=s);
}
function blit(ctx,s,x,y){ ctx.drawImage(s.c, x-s.ox, y-s.oy, s.w, s.h); }
function alphaLayout(sz){
  return rnd()<0.5 ? [['p',sz/4,-sz/4],['n',-sz/3,-sz/3],['n',sz/3,sz/3],['p',-sz/4,sz/4]]
                   : [['p',0,sz/3],['n',sz/2,0],['n',-sz/2,0],['p',0,-sz/3]];
}
/* isotope symbol: mass number up and to the left of the element letter */
function drawSymbol(x,cx,cy,mass,col,a){
  var ms = a>4 ? Math.floor(0.75*a) : 2;
  x.font='bold '+ms+'px '+FONT; var mw=x.measureText(mass).width;
  x.font='bold '+a+'px '+FONT; var bw=x.measureText('U').width;
  var ux=cx+mw/2+0.1*a, uy=cy+0.1*a, mh=ms*1.2;
  var mx=ux-bw/2-0.1*mw-mw, my=uy-0.3*mh;
  x.textBaseline='middle'; x.textAlign='left';
  for (var pass=0; pass<2; pass++){
    var ox=pass?0:0.87, oy=pass?0:0.5; x.fillStyle=pass?col:'#000';
    x.font='bold '+a+'px '+FONT; x.fillText('U',ux-bw/2+ox,uy+oy);
    x.font='bold '+ms+'px '+FONT; x.fillText(mass,mx+ox,my+oy);
  }
}
/* nucleus picture: nucleons scattered inside the nucleus radius (normal) or placed by radius (normalized) */
function nucleusSprite(p,n,scale,normalized,labelA){
  var key=['n',p,n,scale,normalized?1:0,labelA||0,RES].join(','), list=spriteCache[key]||(spriteCache[key]=[]);
  if (list.length>=5) return list[(rnd()*list.length)|0];
  var rv=scale*diamOf(p+n)/2, nd=NUC_D*scale, parts=[], i;
  if (normalized){
    for(i=0;i<p;i++) parts.push(['p']); for(i=0;i<n;i++) parts.push(['n']);
    for(i=parts.length-1;i>0;i--){ var j=(rnd()*(i+1))|0, t=parts[i]; parts[i]=parts[j]; parts[j]=t; }
    parts.forEach(function(q){ var o=rnd(); if(o>0.8) o=rnd()*rnd(); var r=o*rv, a=rnd()*TAU; q[1]=Math.cos(a)*r; q[2]=Math.sin(a)*r; });
  } else {
    var m=(p+n)/8, v=p-2*m, y=n-2*m; if (v>y) y=v; var X=Math.max(m,v,y);
    var place=function(){ var a=rnd()*TAU, f=rnd(); if(f>0.8) f=f*rnd()/2; return [Math.sin(a)*rv*f, Math.cos(a)*rv*f]; };
    for (var d=0; d<X; d++){
      var q;
      if (m===y){ q=place(); alphaLayout(nd).forEach(function(e){ parts.push([e[0],q[0]+e[1],q[1]+e[2]]); }); m--; }
      if (v===y){ q=place(); parts.push(['p',q[0],q[1]]); v--; }
      q=place(); parts.push(['n',q[0],q[1]]); y--;
    }
  }
  var ext=rv+nd; if(labelA) ext=Math.max(ext, labelA*1.5);
  var s=mk(2*ext+2,2*ext+2); s.ox=s.oy=ext+1;
  parts.forEach(function(q){ paintSphere(s.x, s.ox+q[1], s.oy+q[2], nd/2, q[0]==='p'?PROTON:NEUTRON); });
  if (labelA){ var L=isoLabel(p,n); if(L) drawSymbol(s.x,s.ox,s.oy,L[0],L[1],labelA); }
  list.push(s); return s;
}
function symbolSprite(p,n,a){
  var L=isoLabel(p,n); if(!L) return null; var k='y'+p+','+n+','+a+'@'+RES; if(spriteCache[k]) return spriteCache[k];
  var s=mk(a*3.2,a*2.4); s.ox=a*1.6; s.oy=a*1.2; drawSymbol(s.x,s.ox,s.oy,L[0],L[1],a); return (spriteCache[k]=s);
}
/* legend / control icons drawn into small canvases */
function iconCanvas(cv,w,h,draw){
  var r=Math.max(2,RES); cv.width=Math.ceil(w*r); cv.height=Math.ceil(h*r); cv.style.width=w+'px'; cv.style.height=h+'px';
  var x=cv.getContext('2d'); x.setTransform(r,1e-9,0,r,0,0); x.clearRect(0,0,w,h); draw(x);
}
function drawNucleusInto(x,cx,cy,p,n,scale,normalized,labelA){
  var save=RES; RES=Math.max(2,RES); var s=nucleusSprite(p,n,scale,normalized,labelA); RES=save;
  x.drawImage(s.c, cx-s.ox, cy-s.oy, s.w, s.h);
}
function buildLegend(el, items){
  el.innerHTML='';
  var maxW=0; items.forEach(function(it){ maxW=Math.max(maxW,it.w); });
  items.forEach(function(it){
    var row=document.createElement('div'); row.className='lrow';
    var H=it.rh||Math.max(19,it.h);
    var box=document.createElement('div'); box.className='li'; box.style.width=Math.ceil(maxW)+'px'; box.style.height=H+'px';
    var cv=document.createElement('canvas'); iconCanvas(cv,it.w,it.h,it.draw); box.appendChild(cv);
    var sp=document.createElement('span'); sp.textContent=it.label; sp.style.marginTop=(it.ty!=null?it.ty:(H-18)/2)+'px'; row.appendChild(box); row.appendChild(sp); el.appendChild(row);
  });
}
var LEG = {
  neutron:{label:'Neutron',w:12.75,h:12.75,draw:function(x){ paintSphere(x,6.375,6.375,6.375,NEUTRON); }},
  proton:{label:'Proton',w:12.75,h:12.75,draw:function(x){ paintSphere(x,6.375,6.375,6.375,PROTON); }},

  var rg=c.createRadialGradient(480,300,20,480,300,420); rg.addColorStop(0,'rgba(255,120,40,.35)'); rg.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=rg; c.fillRect(0,0,W,H);
  c.save(); c.translate(480,195); c.scale(1,0.28); var cg=c.createRadialGradient(0,0,40,0,0,330); cg.addColorStop(0,'#ffd27a'); cg.addColorStop(0.35,'#ff7a3a'); cg.addColorStop(0.75,'#c6402a'); cg.addColorStop(1,'rgba(120,20,10,0)');
  c.fillStyle=cg; c.beginPath(); c.arc(0,0,330,0,TAU); c.fill(); c.restore();
  var sg=c.createLinearGradient(0,220,0,480); sg.addColorStop(0,'#ffb347'); sg.addColorStop(0.5,'#ff8c1a'); sg.addColorStop(1,'rgba(255,90,20,.2)');
  c.fillStyle=sg; c.beginPath(); c.moveTo(440,230); c.quadraticCurveTo(470,330,455,470); c.lineTo(505,470); c.quadraticCurveTo(490,330,520,230); c.closePath(); c.fill();
  var bg=c.createRadialGradient(480,300,10,480,300,110); bg.addColorStop(0,'#fff3b0'); bg.addColorStop(0.4,'#ffb030'); bg.addColorStop(1,'rgba(200,60,20,0)');
  c.fillStyle=bg; c.beginPath(); c.ellipse(480,300,95,110,0,0,TAU); c.fill();
}

/* ======================================================================
   NUCLEAR REACTOR
   ====================================================================== */
var NR=(function(){ var W=650, H=0.42*W, wall=20, n=6, ratio=5; var R={W:W,H:H,wall:wall,X:-(W/1.9),Y:-(H/2),N:n,RATIO:ratio,MIN_WALL:18,SPACING:15,FIRE:2,NV:2,FREED_V:3,SPLIT:10,
  MAX_DT:1,J:3.2e-11,E_RANGE:1.1e-8,P_RANGE:2.5e-9,MAX_T:75}; return R; })();
function Reactor(){
  Shell.call(this,2);
  this.ox=360; this.oy=312;
  var W=NR.W, H=NR.H, m=NR.wall, cw=(W-2*m)/NR.N, rw=cw/NR.RATIO; cw-=rw*(NR.N-1)/NR.N;
  this.cham=[]; this.rods=[];
  for(var i=0;i<NR.N;i++){ var x=NR.X+m+i*(cw+rw), y=NR.Y+m; this.cham.push({x:x,y:y,w:cw,h:H-2*m});
    if(i<NR.N-1) this.rods.push({x:x+cw,y:y,w:rw,h:H}); }
  this.inner={x:NR.X+m,y:NR.Y+m,w:W-2*m,h:H-2*m};
  this.rodMin=this.inner.y; this.rodMax=this.inner.y+this.inner.h;
  this.bins=[]; for(i=0;i<25;i++) this.bins.push(0); this.bin=0; this.fc=0; this.cool=0;
  var self=this;
  this.rbtn=document.getElementById('resetNuclei2'); this.rbtn.addEventListener('click',function(){ self.reset(); });
  this.reset();
}
Reactor.prototype=Object.create(Shell.prototype);
var RP=Reactor.prototype;
RP.toView=function(x,y){ return [this.ox+x, this.oy+y]; };
RP.reset=function(){
  this.time=0; this.paused=false; this.syncPlay(); this.temp=0; this.pps=0; this.total=0; this.u235=[]; this.u238=[]; this.dau=[]; this.neu=[];
  for(var i=0;i<25;i++) this.bins[i]=0; this.bin=0;
  var c0=this.cham[0], nc=Math.floor((c0.w-2*NR.MIN_WALL)/NR.SPACING+1), nr=Math.floor((c0.h-2*NR.MIN_WALL)/NR.SPACING+1);
  for(var k=0;k<this.cham.length;k++){ var c=this.cham[k], x0=c.x+NR.MIN_WALL, y0=c.y+NR.MIN_WALL;
    for(var r=0;r<nr;r++) for(var f=0;f<nc;f++){ this.u235.push(new Nuc(235,x0+f*NR.SPACING,y0+r*NR.SPACING));
      if(f<nc-1) this.u238.push(new Nuc(238,x0+(f+0.5)*NR.SPACING,y0+(r+0.5)*NR.SPACING)); } }
  clearTimeout(this.rT); this.rT=null; showBtn(this.rbtn,false); this.bars();
};
RP.fire=function(){
  var used=[];
  for(var t=0;t<NR.FIRE;t++){ var k; do k=Math.floor(rnd()*NR.N); while(used.indexOf(k)!==-1); used.push(k);
    var c=this.cham[k], x, y;
    if(rnd()<0.5){ x=rnd()<0.5?c.x:c.x+c.w; y=c.y+rnd()*c.h; } else { y=rnd()<0.5?c.y+c.h:c.y; x=c.x+rnd()*c.w; }
    var a=Math.atan2(c.y+c.h/2-y,c.x+c.w/2-x); this.neu.push({x:x,y:y,vx:NR.NV*Math.cos(a),vy:NR.NV*Math.sin(a)}); }
};
function inRect(r,x,y){ return r.x<=x&&x<=r.x+r.w&&r.y<=y&&y<=r.y+r.h; }
RP.moveRods=function(dy){ var r0=this.rods[0]; if(r0.y+dy<this.rodMin) dy=this.rodMin-r0.y; else if(r0.y+dy>this.rodMax) dy=this.rodMax-r0.y;
  for(var i=0;i<this.rods.length;i++) this.rods[i].y+=dy; };
RP.step=function(t){
  var i,j,n,gone;
  for(i=this.neu.length-1;i>=0;i--){ var q=this.neu[i]; q.x+=q.vx; q.y+=q.vy; gone=!inRect(this.inner,q.x,q.y);
    for(j=0;j<this.rods.length&&!gone;j++) if(inRect(this.rods[j],q.x,q.y)) gone=true;          // control rod absorbs
    for(j=0;j<this.u238.length&&!gone;j++){ n=this.u238[j]; if(dist(q.x,q.y,n.x,n.y)<=n.d/2 && n.n===146){ n.n=147; n.changed(); gone=true; } }
    for(j=0;j<this.u235.length&&!gone;j++){ n=this.u235[j]; if(dist(q.x,q.y,n.x,n.y)<=n.d/2 && n.n===143){ n.n=144; n.changed(); n.ft=t; gone=true; } }
    if(gone) this.neu.splice(i,1); }
  for(i=0;i<this.u235.length;i++){ n=this.u235[i]; if(n.ft!==0 && t>=n.ft){ n.ft=0; this.fission(n); } }
  // energy: fissions in the last 25 ticks (1 s) give power; temperature follows at most 1 per tick
  var total=this.total+this.fc*NR.J, pps=this.pps+(this.fc-this.bins[this.bin])*NR.J;
  this.bins[this.bin]=this.fc; this.bin=(this.bin+1)%25; if(pps<NR.J) pps=0; this.fc=0;
  var target=pps/NR.J;
  if(this.temp!==target){ if(Math.abs(this.temp-target)<NR.MAX_DT) this.temp=target; else this.temp+= this.temp<target?NR.MAX_DT:-NR.MAX_DT; }
  this.pps=pps; this.total=total; this.bars();
};
RP.fission=function(n){
  var i,a;
  for(i=0;i<3;i++){ a=rnd()*TAU; this.neu.push({x:n.x,y:n.y,vx:Math.sin(a)*NR.FREED_V,vy:Math.cos(a)*NR.FREED_V}); }
  var d=new Nuc(235,n.x,n.y); d.p=36; d.n=56; d.kind=0; d.changed();
  n.n-=39; n.p-=56; n.changed(); n.flash=0;
  a=rnd()*TAU; var dx=Math.sin(a)*NR.SPLIT, dy=Math.cos(a)*NR.SPLIT; n.x=d.x+dx; n.y=d.y+dy; d.x-=dx; d.y-=dy;
  this.dau.push(d); this.u235.splice(this.u235.indexOf(n),1); this.dau.push(n); this.fc++;
  var self=this; if(!this.rT) this.rT=setTimeout(function(){ showBtn(self.rbtn,true); self.rT=null; },1500);
};
RP.bars=function(){
  document.getElementById('powerBar').style.height=Math.min(this.pps/NR.P_RANGE*100,100)+'%';
  document.getElementById('energyBar').style.height=Math.min(this.total/NR.E_RANGE*100,100)+'%';
};
RP.viewUpdate=function(dt){
  if(this.cool>0){ this.cool-=dt; if(this.cool<=0) this.cool=0; }
  if(this.paused) return;
  for(var j=0;j<this.dau.length;j++){ var n=this.dau[j]; if(n.flash>=0){ n.flash+=dt; if(n.flash>=0.4) n.flash=-1; } }
};
RP.geom=function(){
  var r={x:this.ox+NR.X,y:this.oy+NR.Y,w:NR.W,h:NR.H}, e=NR.wall, rw=0, o=1e9, rods=[];
  for(var i=0;i<this.rods.length;i++){ var rx=this.ox+this.rods[i].x, u=Math.round(rx)-1, d=Math.round(rx+this.rods[i].w)+1; rw=d-u; rods.push([u,rw]); if(u<o) o=u; }
  var f=r.x+r.w+10+rw, s=r.y+e, a=r.y+r.h+e, off=this.rods[0].y-this.rodMin;
  return {r:r,e:e,rods:rods,rw:rw,o:o,f:f,s:s,a:a,off:off};
};
RP.draw=function(c){
  var G=this.geom(), r=G.r, e=G.e, i, t=Math.min(this.temp,NR.MAX_T), self=this;
  c.fillStyle=mix('#CAB3CA','#ffbb44',(NR.MAX_T-t)/NR.MAX_T); c.fillRect(r.x+e/2,r.y+e/2,r.w-e,r.h-e);
  c.strokeStyle='#000'; c.lineWidth=e; c.strokeRect(r.x+e/2,r.y+e/2,r.w-e,r.h-e);
  c.strokeStyle='#796579'; c.lineWidth=1; c.beginPath();
  for(i=0;i<this.rods.length;i++){ var lx=Math.round(this.ox+this.rods[i].x), rx2=Math.round(this.ox+this.rods[i].x+this.rods[i].w);
    c.moveTo(lx+0.5,r.y+e); c.lineTo(lx+0.5,r.y+r.h-e); c.moveTo(rx2+0.5,r.y+e); c.lineTo(rx2+0.5,r.y+r.h-e); }
  c.stroke();
  var ns=sphere(NEUTRON,NUC_D);
  for(i=0;i<this.neu.length;i++){ var q=this.neu[i]; blit(c,ns,this.ox+q.x,this.oy+q.y); }
  var dv=diamOf(235);
  [this.u235,this.dau].forEach(function(L){ for(var k=0;k<L.length;k++){ var n=L[k], p=self.toView(n.x,n.y);
    if(!n.spr){ n.spr=nucleusSprite(n.p,n.n,1,false); n.sym=symbolSprite(n.p,n.n,0.55*n.d); }
    blit(c,n.spr,p[0],p[1]); if(n.sym) blit(c,n.sym,p[0],p[1]); } });
  for(i=0;i<this.dau.length;i++){ var dn=this.dau[i]; if(dn.flash>=0){ var pp=this.toView(dn.x,dn.y); drawFlash(c,pp[0],pp[1],dn.d,dn.flash); } }
  // fire button panel
  var bx=r.x+r.w/2-100, by=r.y-48+2;
  c.fillStyle='#CAB3CA'; c.fillRect(bx,by,200,48); c.strokeStyle='#000'; c.lineWidth=4; c.strokeRect(bx,by,200,48);
  var br=114*(32/117)/2; fireButton(c,bx+14+br,by+10+105*(32/117)/2,br,this.cool>0);
  c.fillStyle='#000'; c.font='20px '+FONT; c.textAlign='left'; c.textBaseline='middle'; c.fillText('Fire Neutrons',bx+32+28,by+24);
  // control rods and adjustor (all move together)
  c.save(); c.translate(0,G.off);
  c.fillStyle='#655D65'; for(i=0;i<G.rods.length;i++) c.fillRect(G.rods[i][0],G.s,G.rods[i][1],G.a-G.s);
  c.fillStyle='#21366b'; c.fillRect(G.o,G.a,G.f-G.o,G.rw); c.fillRect(G.f-G.rw,G.s,G.rw,G.a-G.s);
  c.fillStyle='#ccc'; c.fillRect(G.f,G.s,15,10); c.fillRect(G.f,G.s+120,15,10); rrect(c,G.f+10,G.s,10,130,5); c.fill();
  c.save(); c.translate(G.f-G.rw/2,G.a); c.rotate(-Math.PI/2); c.fillStyle='#fff'; c.font='bold 12px '+FONT; c.textAlign='left'; c.textBaseline='middle'; c.fillText('Control Rod Adjustor',0,0); c.restore();
  c.restore();
  this.drawThermo(c,r.x+r.w-0.258*r.w,r.y+48,this.temp/NR.MAX_T);
};
function rrect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
RP.drawThermo=function(c,x,y,val){
  var bi=14, tr=7, th=72, pad=2;
  c.save(); c.translate(x,y);
  c.globalAlpha=0.7; c.fillStyle='#fff'; c.beginPath(); c.arc(0,0,bi,0,TAU); c.fill(); c.fillRect(-tr,-bi-th,2*tr,bi+th); c.beginPath(); c.arc(0,-bi-th,tr,0,TAU); c.fill(); c.globalAlpha=1;
  c.strokeStyle='#555'; c.lineWidth=1; var cy=Math.round(-Math.sqrt(bi*bi-tr*tr)), al=Math.acos(tr/bi);
  c.beginPath(); c.moveTo(-tr,cy); c.lineTo(-tr,-bi-th); c.arc(0,-bi-th,tr,Math.PI,0); c.lineTo(tr,cy); c.arc(0,0,bi,-al,Math.PI+al); c.stroke();
  c.fillStyle='#ff3c00'; c.beginPath(); c.arc(0,0,bi-pad,0,TAU); c.fill();
  var lr=tr-pad, top=-bi-(th-pad)-2*pad, h=Math.max(0,Math.min(2*th,th*val)), ly=-bi-h+pad;
  c.save(); c.beginPath(); c.rect(-lr,top,2*lr,-top); c.arc(0,top,lr,0,TAU); c.clip(); c.fillRect(-lr,ly,2*lr,-ly); c.restore();
  c.strokeStyle='#555'; c.beginPath(); for(var l=0;l<7;l++){ var ty=Math.floor(-bi-th/7*(l+0.5))+0.5; c.moveTo(-tr,ty); c.lineTo(-tr+Math.floor(0.4*2*tr),ty); } c.stroke();
  c.restore();
};
RP.hitFire=function(x,y){ var G=this.geom(), bx=G.r.x+G.r.w/2-100, by=G.r.y-46, br=114*(32/117)/2, cx=bx+14+br, cy=by+10+105*(32/117)/2;
  return Math.abs(x-cx)<=br && Math.abs(y-cy)<=105*(32/117)/2; };
RP.hitAdj=function(x,y){ var G=this.geom(); y-=G.off;
  return (x>=G.o&&x<=G.f&&y>=G.a&&y<=G.a+G.rw) || (x>=G.f-G.rw&&x<=G.f&&y>=G.s&&y<=G.a) || (x>=G.f&&x<=G.f+20&&y>=G.s&&y<=G.s+130); };
RP.down=function(x,y){
  var self=this;
  if(this.hitFire(x,y)){ if(this.cool===0){ this.cool=0.4; this.fire(); } return null; }
  if(this.hitAdj(x,y)){ var last=y; return {move:function(mx,my){ self.moveRods(my-last); last=my; }}; }
  return null;
};
RP.cursor=function(x,y){ if(this.hitFire(x,y)) return 'pointer'; if(this.hitAdj(x,y)) return 'ns-resize'; return null; };
