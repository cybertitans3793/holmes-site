k, 'm') + '<\/div>' +\n        '<h4>2 · The kick: a brief force changes the velocity<\/h4><div class=\"eq\">v<sub>1<\/sub> = v<sub>0<\/sub> + Δv = ' + H.iv('v0') + ' + ' + H.p(v.dv, 'm/s') + ' = <b>' + H.n(d.v1, 'm/s') + '<\/b><\/div>' +\n        (d.stop ? '<div class=\"eq\">It stops dead and <b>stays<\/b> stopped: nothing else pushes it.<\/div>' : d.flip ? '<div class=\"eq\">The sign flipped: the puck now moves the other way.<\/div>' : '') +\n        '<h4>3 · After the kick: no net force again<\/h4><div class=\"eq\">The new velocity stays ' + H.n(d.v1, 'm/s') + ' until something else pushes it. It does <b>not<\/b> slowly “use up” the kick.<\/div>' +\n        '<div class=\"eq\">x(8 s) = ' + H.n(d.xk) + ' + (' + H.n(d.v1) + ')(8 − ' + H.iv('tk') + ') = <b>' + H.n(d.xEnd, 'm') + '<\/b><\/div>' +\n        '<h4>4 · Read the graphs<\/h4><div class=\"eq\">v–t: two flat steps (a force acted only at the jump). x–t: two straight lines; the slope changes at the kick.<\/div>';\n      return h;\n    }\n    return '<h4>1 · Before the kick<\/h4><div class=\"eq\">ΣF = 0, so the puck slides → at a steady ' + H.iv('v0') + '.<\/div>' +\n      '<h4>2 · The kick only changes the ↑ part of the velocity<\/h4><div class=\"eq\">After: v<sub>x<\/sub> = ' + H.iv('v0') + ' (unchanged: the kick had no → part) and v<sub>y<\/sub> = ' + H.iv('dvy') + '<\/div>' +\n      '<h4>3 · Add them<\/h4><div class=\"eq\">speed = √(v<sub>x<\/sub>² + v<sub>y<\/sub>²) = √((' + H.n(v.v0) + ')² + (' + H.n(v.dvy) + ')²) = <b>' + H.n(d.sp, 'm/s') + '<\/b> at θ = tan<sup>−1<\/sup>(v<sub>y<\/sub>/v<sub>x<\/sub>) = <b>' + H.n(d.ang, '°') + '<\/b><\/div>' +\n      '<h4>4 · After the kick: a straight line, not a curve<\/h4><div class=\"eq\">No force acts after the kick, so the new path is straight at constant speed. The puck does <b>not<\/b> go straight ↑ (the direction it was kicked): it keeps its → motion too.<\/div>' +\n      '<p class=\"note\">Classic test question: a spaceship coasting → fires its engine ↑ briefly. Which path does it follow afterward?<\/p>';\n  },\n  draw(v, d, mode, opt, t, dt, A){\n    if (A.t === undefined || A.reset) A.t = 0; A.t += dt;\n    const hold = 1.5, cyc = d.Tt + hold, tt = Math.min(A.t % cyc, d.Tt);\n    const dotCol = '#bdbdbd', puck = (x, y) => { ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill(); ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(x - 2, y - 2, 3, 0, 7); ctx.fill(); };\n    if (mode === 'line'){\n      panelTitle('FRICTIONLESS TRACK (dots every 0.5 s)', 10, 18);\n      const xs = []; for (let s = 0; s <= d.Tt; s += 0.25) xs.push(d.pos(s)); const lo = Math.min(...xs, 0) - 1, hi = Math.max(...xs, 0) + 1, X = x => 30 + 540 * (x - lo) / (hi - lo);\n      ctx.fillStyle = '#e8f3ff'; ctx.fillRect(15, 40, 570, 60); ctx.strokeStyle = '#9ac'; ctx.lineWidth = 1; ctx.strokeRect(15, 40, 570, 60);\n      for (let m = Math.ceil(lo); m <= hi; m++){ if (hi - lo > 30 && m % 5) continue; ctx.fillStyle = '#9ac'; ctx.fillRect(X(m), 92, 1, 8); if (m % (hi - lo > 30 ? 10 : 2) === 0) text(m + '', X(m), 112, { align: 'center', font: '500 9px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); }\n      for (let s = 0; s <= tt + 1e-9; s += 0.5){ ctx.fillStyle = s < v.tk ? '#ffb38f' : '#9db4f0'; ctx.beginPath(); ctx.arc(X(d.pos(s)), 70, 4, 0, 7); ctx.fill(); }\n      if (tt >= v.tk){ ctx.strokeStyle = '#c43a00'; ctx.lineWidth = 2; const kx = X(d.xk); for (let k = 0; k < 6; k++){ const a = k * PI / 3; ctx.beginPath(); ctx.moveTo(kx + 14 * Math.cos(a), 70 + 14 * Math.sin(a)); ctx.lineTo(kx + 20 * Math.cos(a), 70 + 20 * Math.sin(a)); ctx.stroke(); } text('kick', kx, 34, { align: 'center', font: '700 11px \"Space Grotesk\",sans-serif', col: '#c43a00' }); }\n      const vnow = tt < v.tk ? v.v0 : d.v1; puck(X(d.pos(tt)), 70); if (vnow) arrow(X(d.pos(tt)), 56, X(d.pos(tt)) + vnow * 12, 56, COL.V, '', { w: 2.5, head: 7 });\n      // v–t and x–t\n      const graph = (gx, title, f, lo2, hi2) => { const gy = 300, gw = 240, gh = 130; panelTitle(title, gx - 20, 140);\n        const Y = q => gy - gh * (q - lo2) / (hi2 - lo2), Tx = s => gx + gw * s / d.Tt;\n        ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(gx, gy - gh); ctx.lineTo(gx, gy); ctx.lineTo(gx + gw, gy); ctx.stroke();\n        if (lo2 < 0){ ctx.strokeStyle = '#bbb'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(gx, Y(0)); ctx.lineTo(gx + gw, Y(0)); ctx.stroke(); }\n        ctx.strokeStyle = COL.V; ctx.lineWidth = 2.5; ctx.beginPath(); for (let k = 0; k <= 200; k++){ const s = tt * k / 200; k ? ctx.lineTo(Tx(s), Y(f(s))) : ctx.moveTo(Tx(s), Y(f(s))); } ctx.stroke();\n        text(fplain(hi2), gx - 4, gy - gh + 4, { align: 'right', font: '500 9px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); text(fplain(lo2), gx - 4, gy + 3, { align: 'right', font: '500 9px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n        text('t (s) → 8', gx + gw, gy + 13, { align: 'right', font: '500 9px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); };\n      const vlo = Math.min(0, v.v0, d.v1) - 1, vhi = Math.max(0, v.v0, d.v1) + 1;\n      graph(50, 'VELOCITY vs TIME (m/s)', s => s < v.tk ? v.v0 : d.v1, vlo, vhi);\n      graph(340, 'POSITION vs TIME (m)', d.pos, lo, hi);\n      return;\n    }\n    panelTitle('TOP VIEW: FRICTIONLESS ICE (dots every 0.5 s)', 10, 18);\n    const sc = 300 / Math.max(d.end[0] + 1, d.end[1] + 1, 6), X = x => 30 + x * sc, Y = y => 290 - y * sc;\n    ctx.fillStyle = '#e8f3ff'; ctx.fillRect(15, 30, 365, 275);\n    for (let s = 0; s <= tt + 1e-9; s += 0.5){ const p = d.pos(s); ctx.fillStyle = s < v.tk ? '#ffb38f' : '#9db4f0'; ctx.beginPath(); ctx.arc(X(p[0]), Y(p[1]), 4, 0, 7); ctx.fill(); }\n    const pk = d.pos(v.tk); if (tt >= v.tk){ arrow(X(pk[0]), Y(pk[1]) + 30, X(pk[0]), Y(pk[1]) + 6, '#c43a00', 'kick ↑', { w: 3, lx: 6, ly: 10 }); ctx.setLineDash([4, 4]); ctx.strokeStyle = '#bbb'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(X(pk[0]), Y(pk[1])); ctx.lineTo(X(d.end[0]), Y(pk[1])); ctx.stroke(); ctx.setLineDash([]);\n      text('without the kick', X(d.end[0]) - 2, Y(pk[1]) + 14, { align: 'right', font: '500 10px \"IBM Plex Mono\",monospace', col: '#8a8a8a' }); }\n    const p = d.pos(tt), vy = tt < v.tk ? 0 : v.dvy; puck(X(p[0]), Y(p[1])); arrow(X(p[0]), Y(p[1]), X(p[0]) + v.v0 * 12, Y(p[1]) - vy * 12, COL.V, 'v', { w: 2.5, head: 7 });\n    // velocity addition\n    panelTitle('VELOCITY BEFORE + KICK = AFTER', 395, 18);\n    const ox = 420, oy = 230, k = 140 / Math.max(d.sp, 1);\n    arrow(ox, oy, ox + v.v0 * k, oy, '#ff6a2b', 'before', { w: 3, lx: 0, ly: 14, align: 'center' });\n    arrow(ox + v.v0 * k, oy, ox + v.v0 * k, oy - v.dvy * k, '#c43a00', 'kick', { w: 3, lx: 6, ly: 0 });\n    arrow(ox, oy, ox + v.v0 * k, oy - v.dvy * k, COL.V, 'after', { w: 3.5, lx: -8, ly: -6, align: 'right' });\n    text(fplain(d.sp) + ' m/s at ' + fplain(d.ang) + '°', 395, 300, { font: '700 13px \"Space Grotesk\",sans-serif' });\n  }\n};\n\n\nS.mode = SIM.modes ? SIM.modes[0].id : 'one';\nsetup(); requestAnimationFrame(loop);\n<\/script>\n<\/body><\/html>\n"},
"balance":{ar:"1000 / 640",html:"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Balanced Forces<\/title>\n<\!-- Balanced Forces: original Holmes Sims, built from frame.html + balance.js. g = 10 m/s². -->\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap\">\n<style>\nhtml,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:\"Space Grotesk\",system-ui,sans-serif;color:#111}\n#app{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0;padding:10px 14px 12px;box-sizing:border-box;\n  display:grid;grid-template-columns:600px 1fr;grid-template-rows:34px 330px 1fr;gap:10px 14px}\n#bar{grid-column:1/-1;display:flex;gap:16px;align-items:center;flex-wrap:nowrap;overflow:hidden}\n.seg{display:flex;align-items:center}\n.seg .lab{font:700 12px \"IBM Plex Mono\",monospace;margin-right:8px;text-transform:uppercase}\n.seg button{white-space:nowrap;font:700 14px \"Space Grotesk\",sans-serif;padding:6px 11px;border:2px solid #111;background:#fff;color:#111;cursor:pointer}\n.seg button+button{margin-left:-2px}\n.seg button[aria-pressed=\"true\"]{background:#111;color:#fff}\n.seg button:hover:not([aria-pressed=\"true\"]){background:#ffe2d3}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ff6a2b;outline-offset:2px;position:relative;z-index:1}\n#cv{border:2px solid #111;background:#fbfbfb;width:600px;height:330px;box-sizing:border-box;display:block}\n#work{border:2px solid #111;padding:8px 12px 10px;overflow:auto;font-size:14px;line-height:1.55;box-sizing:border-box}\n#work .wt{font:700 12px \"IBM Plex Mono\",monospace;text-transform:uppercase;margin:0 0 4px;display:flex;justify-content:space-between}\n#work h4{margin:9px 0 1px;font-size:13px;font-weight:700;color:#4a4a4a}\n#work h4:first-of-type{margin-top:2px}\n#work .eq{font-variant-numeric:tabular-nums}\n#work .n{font-family:\"IBM Plex Mono\",monospace;font-size:13px}\n#work b .n,#work .ans{font-weight:700}\n#work .note{font-size:12.5px;color:#4a4a4a;margin:2px 0 0}\n#work .ok{background:#e5f4ea;border-left:4px solid #1e7d45;padding:3px 8px;margin-top:4px}\n#work .bad{background:#fde7df;border-left:4px solid #c43a00;padding:3px 8px;margin-top:4px}\n.ivv{border-radius:2px;padding:0 2px;transition:background .25s}\n.ivv.gx{background:#ffe2d3}\n.ivv.hot{background:#ff6a2b;color:#fff}\n#ctl{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;align-content:start}\n.iv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:6px}\n.iv .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.iv .val{font:700 13px \"IBM Plex Mono\",monospace;white-space:nowrap}\n.iv input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:#111;height:22px}\n.iv input[type=radio]{accent-color:#ff6a2b;margin:0}\n#presets{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}\n#presets .lab{font:700 12px \"IBM Plex Mono\",monospace}\n#presets button{font:600 12.5px \"Space Grotesk\",sans-serif;padding:3px 8px;border:2px solid #111;background:#fff;cursor:pointer}\n#presets button:hover{background:#ffe2d3}\n#gcard{border:2px solid #111;padding:5px 8px 6px;display:flex;flex-direction:column;box-sizing:border-box;min-height:0}\n.ghead{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}\n.ghead select{font:600 13px \"Space Grotesk\",sans-serif;border:2px solid #111;padding:1px 4px;max-width:200px}\n#gv{width:340px;height:150px;flex:none;display:block;margin-top:3px}\n#dbl{font-size:12.5px;line-height:1.35;margin-top:2px}\n#dbl b{font-weight:700}\n.hint{font:500 11px \"IBM Plex Mono\",monospace;color:#4a4a4a}\n<\/style><\/head><body>\n<div id=\"app\">\n  <div id=\"bar\"><\/div>\n  <canvas id=\"cv\" width=\"1200\" height=\"660\" aria-label=\"Animation of the situation with force arrows\"><\/canvas>\n  <div id=\"work\" aria-live=\"polite\"><\/div>\n  <div id=\"ctl\"><\/div>\n  <div id=\"gcard\">\n    <div class=\"ghead\"><span>Graph<\/span><select id=\"dvsel\" aria-label=\"Quantity to graph\"><\/select><span>vs <b id=\"ivname\"><\/b><\/span><\/div>\n    <canvas id=\"gv\" width=\"680\" height=\"300\" aria-label=\"Graph of the chosen quantity against the chosen variable\"><\/canvas>\n    <div id=\"dbl\"><\/div>\n  <\/div>\n<\/div>\n<script>\n// ---------------- shared frame ----------------\nconst $ = id => document.getElementById(id);\nconst G10 = 10, PI = Math.PI, DEG = PI / 180;\nfunction fit(){ const s = Math.min(innerWidth / 1000, innerHeight / 640); $('app').style.transform = 'scale(' + s + ')'; }\naddEventListener('resize', fit); fit();\n\nfunction fnum(x){ const r = fnum0(x); return typeof r === 'string' ? r.replace(/^-/, '−') : r; }\nfunction fnum0(x){\n  if (x === null || x === undefined || !isFinite(x)) return '—';\n  const a = Math.abs(x);\n  if (a === 0) return '0';\n  if (a >= 1e5 || a < 1e-3){\n    const e = Math.floor(Math.log10(a)); let m = x / Math.pow(10, e);\n    let ms = m.toFixed(2); if (Math.abs(+ms) >= 10){ m /= 10; ms = m.toFixed(2); return ms + '×10<sup>' + (e + 1) + '<\/sup>'; }\n    return ms + '×10<sup>' + e + '<\/sup>';\n  }\n  if (a >= 1000) return String(Math.round(x));\n  return x.toPrecision(3);\n}\nfunction fplain(x){ return fnum(x).replace(/<sup>(.*?)<\\/sup>/g, (m, e) => '^' + e).replace('×10^', 'e'); }\nconst H = {\n  n: (x, u) => '<span class=\"n\">' + fnum(x) + (u ? '&nbsp;' + u : '') + '<\/span>',\n  iv: id => { const d = S.def[id]; const val = S.v[id]; const txt = (d.show ? d.show(val) : fnum(val) + (d.unit ? '&nbsp;' + d.unit : ''));\n              return '<span class=\"ivv n' + (S.gx === id ? ' gx' : '') + (S.hot === id ? ' hot' : '') + '\" data-iv=\"' + id + '\">' + txt + '<\/span>'; },\n  g: () => '<span class=\"n\">10&nbsp;m/s²<\/span>',\n  p: (x, u) => x < 0 ? '(' + H.n(x, u) + ')' : H.n(x, u)\n};\n\nconst S = { mode: null, opt: {}, v: {}, store: {}, def: {}, ivs: [], gx: null, dv: null, hot: null, t: 0, anim: {} };\n\nfunction bar(){\n  const b = $('bar'); b.innerHTML = '';\n  const group = (label, items, cur, onpick) => {\n    const g = document.createElement('div'); g.className = 'seg'; g.setAttribute('role', 'group');\n    if (label){ const l = document.createElement('span'); l.className = 'lab'; l.textContent = label; g.appendChild(l); }\n    items.forEach(([id, txt]) => { const bt = document.createElement('button'); bt.textContent = txt; bt.setAttribute('aria-pressed', String(id === cur)); bt.onclick = () => onpick(id); g.appendChild(bt); });\n    b.appendChild(g);\n  };\n  const tip = document.createElement('span'); tip.className = 'hint'; tip.style.marginLeft = 'auto'; tip.style.whiteSpace = 'nowrap'; tip.innerHTML = '● = the variable on the graph’s x-axis · drag any slider';\n  if (SIM.modes) group(null, SIM.modes.map(m => [m.id, m.label]), S.mode, id => { S.mode = id; S.anim = {}; setup(); });\n  (SIM.opts || []).filter(o => !o.modes || o.modes.includes(S.mode)).forEach(o => {\n    if (!(o.id in S.opt)) S.opt[o.id] = o.choices[0][0];\n    group(o.label, o.choices, S.opt[o.id], id => { S.opt[o.id] = id; S.anim = {}; setup(); });\n  });\n  b.appendChild(tip);\n  if (b.scrollWidth > b.clientWidth + 1) tip.remove();\n  if (b.scrollWidth > b.clientWidth + 1) b.querySelectorAll('.seg button').forEach(x => { x.style.fontSize = '13px'; x.style.padding = '6px 8px'; });\n}\n\nfunction setup(){\n  bar();\n  S.ivs = SIM.ivs(S.mode, S.opt); S.def = {}; S.v = {};\n  S.ivs.forEach(d => { S.def[d.id] = d; const k = S.mode + ':' + d.id; S.v[d.id] = (k in S.store) ? S.store[k] : d.val; });\n  if (!S.gx || !S.def[S.gx]) S.gx = S.ivs.find(d => d.graph) ? S.ivs.find(d => d.graph).id : S.ivs[1] ? S.ivs[1].id : S.ivs[0].id;\n  const c = $('ctl'); c.innerHTML = '';\n  S.ivs.forEach(d => {\n    const w = document.createElement('div'); w.className = 'iv';\n    w.innerHTML = '<input type=\"radio\" name=\"gx\" value=\"' + d.id + '\" aria-label=\"Graph against ' + d.label + '\" title=\"Put this on the graph’s x-axis\"' + (S.gx === d.id ? ' checked' : '') + '>' +\n      '<span class=\"nm\">' + d.label + ' <i>' + d.sym + '<\/i><\/span><span class=\"val\" id=\"val-' + d.id + '\"><\/span>' +\n      '<input type=\"range\" id=\"r-' + d.id + '\" min=\"' + d.min + '\" max=\"' + d.max + '\" step=\"' + d.step + '\" value=\"' + S.v[d.id] + '\" aria-label=\"' + d.label + '\">';\n    c.appendChild(w);\n    const r = w.querySelector('input[type=range]');\n    r.oninput = () => { S.v[d.id] = +r.value; S.store[S.mode + ':' + d.id] = +r.value; S.hot = d.id; clearTimeout(S.hotT); S.hotT = setTimeout(() => { S.hot = null; update(); }, 700); S.anim.reset = true; update(); };\n    w.querySelector('input[type=radio]').onchange = () => { S.gx = d.id; update(); };\n  });\n  if (SIM.presets){\n    const p = document.createElement('div'); p.id = 'presets'; p.innerHTML = '<span class=\"lab\">Try:<\/span>';\n    SIM.presets.forEach(ps => { const bt = document.createElement('button'); bt.textContent = ps.label; bt.onclick = () => { if (ps.mode && ps.mode !== S.mode){ S.mode = ps.mode; } Object.entries(ps.v).forEach(([k, val]) => S.store[(ps.mode || S.mode) + ':' + k] = val); S.anim = {}; setup(); }; p.appendChild(bt); });\n    c.appendChild(p);\n  }\n  const dvs = SIM.dvs(S.mode, S.opt), sel = $('dvsel');\n  if (!S.dv || !dvs.find(d => d.id === S.dv)) S.dv = dvs[0].id;\n  sel.innerHTML = dvs.map(d => '<option value=\"' + d.id + '\"' + (d.id === S.dv ? ' selected' : '') + '>' + d.name + '<\/option>').join('');\n  sel.onchange = () => { S.dv = sel.value; update(); };\n  update();\n}\n\nfunction calcWith(over){ const v = Object.assign({}, S.v, over || {}); return SIM.calc(v, S.mode, S.opt); }\n\nfunction update(){\n  S.ivs.forEach(d => { $('val-' + d.id).innerHTML = d.show ? d.show(S.v[d.id]) : fnum(S.v[d.id]) + (d.unit ? '&nbsp;' + d.unit : ''); });\n  S.d = calcWith();\n  $('work').innerHTML = '<div class=\"wt\"><span>Show the work<\/span><span class=\"hint\">' + (SIM.hint || 'g = 10 m/s²') + '<\/span><\/div>' + SIM.work(S.v, S.d, S.mode, S.opt);\n  document.querySelectorAll('input[name=gx]').forEach(r => r.checked = (r.value === S.gx));\n  graph();\n}\n\nfunction graph(){\n  const cv = $('gv'), g = cv.getContext('2d'), W = 340, Hh = 150; g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, W, Hh);\n  const dvs = SIM.dvs(S.mode, S.opt), dv = dvs.find(d => d.id === S.dv), ref = dv.vs ? dvs.find(d => d.id === dv.vs) : null;\n  const x = S.def[S.gx]; $('ivname').innerHTML = '<i>' + x.sym + '<\/i>' + (x.unit && !x.show ? ' (' + x.unit + ')' : '');\n  const N = 160, xs = [], ys = [], rs = [];\n  for (let i = 0; i <= N; i++){ const xv = x.min + (x.max - x.min) * i / N; const d = calcWith({ [S.gx]: xv }); xs.push(xv); ys.push(dv.f(d)); rs.push(ref ? ref.f(d) : null); }\n  const all = ys.concat(ref ? rs : []).filter(isFinite);\n  let ymin = Math.min(0, ...all), ymax = Math.max(...all, 0); if (ymax === ymin) ymax = ymin + 1; const pad = (ymax - ymin) * 0.08; ymax += pad; if (ymin < 0) ymin -= pad;\n  const L = 46, R = 8, T = 8, B = 22, X = v => L + (v - x.min) / (x.max - x.min) * (W - L - R), Y = v => T + (ymax - v) / (ymax - ymin) * (Hh - T - B);\n  g.strokeStyle = '#111'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(L, T); g.lineTo(L, Hh - B); g.lineTo(W - R, Hh - B); g.stroke();\n  if (ymin < 0){ g.strokeStyle = '#999'; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(W - R, Y(0)); g.stroke(); g.setLineDash([]);\n    if (dv.negNote){ g.fillStyle = 'rgba(196,58,0,0.08)'; g.fillRect(L, Y(0), W - R - L, Hh - B - Y(0)); g.fillStyle = '#c43a00'; g.font = '600 10px \"Space Grotesk\",sans-serif'; g.textAlign = 'left'; g.fillText(dv.negNote, L + 4, Hh - B - 4); } }\n  g.font = '500 10px \"IBM Plex Mono\",monospace'; g.fillStyle = '#4a4a4a'; g.textAlign = 'right';\n  g.fillText(fplain(ymax), L - 4, T + 8); g.fillText(fplain(ymin < 0 ? ymin : 0), L - 4, Hh - B); if (ymin < 0) g.fillText('0', L - 4, Y(0) + 3);\n  g.textAlign = 'center'; g.fillText(fplain(x.min), L, Hh - 8); g.fillText(fplain(x.max), W - R - 10, Hh - 8);\n  g.fillText((x.symText || x.id) + (x.unit ? ' (' + x.unit + ')' : ''), (L + W) / 2, Hh - 8);\n  g.save(); g.translate(10, (T + Hh - B) / 2); g.rotate(-PI / 2); g.textAlign = 'center'; g.fillText(dv.short + (dv.unit ? ' (' + dv.unit + ')' : ''), 0, 0); g.restore();\n  const line = (arr, col, dash) => { g.strokeStyle = col; g.lineWidth = 2.2; g.setLineDash(dash || []); g.beginPath(); let on = false; arr.forEach((y, i) => { if (!isFinite(y)){ on = false; return; } const px = X(xs[i]), py = Math.max(T - 4, Math.min(Hh - B + 4, Y(y))); on ? g.lineTo(px, py) : g.moveTo(px, py); on = true; }); g.stroke(); g.setLineDash([]); };\n  if (ref){ line(rs, '#4a4a4a', [5, 4]); g.fillStyle = '#4a4a4a'; g.textAlign = 'right'; g.font = '600 10px \"Space Grotesk\",sans-serif'; const lastY = rs.filter(isFinite).pop(); if (isFinite(lastY)) g.fillText(ref.short, W - R - 2, Math.max(T + 9, Y(lastY) - 4)); }\n  line(ys, '#1546d6');\n  const cx = S.v[S.gx], cy = dv.f(S.d);\n  if (isFinite(cy)){ g.strokeStyle = '#ff6a2b'; g.setLineDash([2, 3]); g.lineWidth = 1; g.beginPath(); g.moveTo(X(cx), Hh - B); g.lineTo(X(cx), Y(cy)); g.lineTo(L, Y(cy)); g.stroke(); g.setLineDash([]);\n    g.fillStyle = '#ff6a2b'; g.strokeStyle = '#111'; g.lineWidth = 1.5; g.beginPath(); g.arc(X(cx), Math.max(T, Math.min(Hh - B, Y(cy))), 4.5, 0, 7); g.fill(); g.stroke(); }\n  // doubling readout\n  const d2 = calcWith({ [S.gx]: cx * 2 }), y1 = dv.f(S.d), y2 = dv.f(d2);\n  let msg = '';\n  if (cx === 0 || Math.abs(y1) < 1e-12) msg = '<span class=\"hint\">Move off zero to see the ×2 test.<\/span>';\n  else if (!isFinite(y1) || !isFinite(y2)) msg = '<span class=\"hint\">The ×2 test doesn’t apply here (doubling takes it outside what this quantity covers).<\/span>';\n  else {\n    const k = y2 / y1;\n    if (k < 0){ $('dbl').innerHTML = 'If <b>' + x.sym + '<\/b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '<\/b> goes from ' + fnum(y1) + ' to ' + fnum(y2) + (dv.unit ? ' ' + dv.unit : '') + ': it changes sign, so that can’t really happen.'; return; }\n    const tags = [[1, 'doesn’t depend on it'], [2, 'proportional'], [4, 'goes as the square'], [0.5, 'inversely proportional'], [0.25, 'inverse square'], [Math.SQRT2, 'goes as the square root'], [Math.SQRT1_2, 'goes as 1/√'], [8, 'goes as the cube'], [2 * Math.SQRT2, 'goes as the 3/2 power']];\n    const tag = tags.find(([v]) => Math.abs(k - v) < 0.004 * v);\n    msg = 'If <b>' + x.sym + '<\/b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '<\/b> becomes <b>×' + (Math.abs(k) >= 100 ? fnum(k) : k.toFixed(2)) + '<\/b>' + (tag ? ' — ' + tag[1] : '') + '.' + (dv.dblNote ? ' <span class=\"hint\">' + dv.dblNote + '<\/span>' : '');\n  }\n  $('dbl').innerHTML = msg;\n}\n\n// drawing helpers (canvas is drawn in 600×330 units)\nconst cv = $('cv'), ctx = cv.getContext('2d');\nfunction arrow(x1, y1, x2, y2, col, label, opts){\n  opts = opts || {}; const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy); if (len < 2) return;\n  const ux = dx / len, uy = dy / len, hw = opts.head || 9;\n  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = opts.w || 3.5; ctx.lineCap = 'round';\n  if (opts.dash) ctx.setLineDash(opts.dash);\n  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hw * 0.8, y2 - uy * hw * 0.8); ctx.stroke(); ctx.setLineDash([]);\n  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - ux * hw - uy * hw * 0.55, y2 - uy * hw + ux * hw * 0.55); ctx.lineTo(x2 - ux * hw + uy * hw * 0.55, y2 - uy * hw - ux * hw * 0.55); ctx.closePath(); ctx.fill();\n  if (label){ ctx.font = '700 13px \"Space Grotesk\",sans-serif'; ctx.textAlign = opts.align || 'left'; ctx.textBaseline = 'middle';\n    const lx = x2 + (opts.lx !== undefined ? opts.lx : (ux >= 0 ? 6 : -6)), ly = y2 + (opts.ly !== undefined ? opts.ly : (uy >= 0 ? 10 : -10));\n    if (opts.align === undefined) ctx.textAlign = ux >= -0.2 ? 'left' : 'right';\n    ctx.fillText(label, lx, ly); }\n  ctx.restore();\n}\nfunction text(s, x, y, o){ o = o || {}; ctx.save(); ctx.font = (o.font || '600 13px \"Space Grotesk\",sans-serif'); ctx.fillStyle = o.col || '#111'; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic'; ctx.fillText(s, x, y); ctx.restore(); }\nfunction panelTitle(s, x, y){ text(s, x, y, { font: '700 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); }\nconst COL = { F: '#c43a00', W: '#111', N: '#1e7d45', V: '#1546d6', T: '#7a3fb0', comp: '#8a8a8a' };\n\nlet last = 0;\nfunction loop(ts){ const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts; S.t += dt;\n  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, 600, 330);\n  SIM.draw(S.v, S.d, S.mode, S.opt, S.t, dt, S.anim); S.anim.reset = false;\n  requestAnimationFrame(loop); }\n\n// ---------------- this sim ----------------\n// Balanced Forces: constant velocity means ΣF = 0 (Newton's 1st law). Push a crate, let it go, or fall at terminal speed.\nconst SIM = {\n  title: 'Balanced Forces',\n  modes: [{ id: 'push', label: 'Push a crate' }, { id: 'letgo', label: 'Let go' }, { id: 'sky', label: 'Skydiver' }],\n  opts: [{ id: 'chute', label: 'Parachute', modes: ['sky'], choices: [['closed', 'Closed'], ['open', 'Open']] }],\n  ivs(mode, opt){\n    if (mode === 'push') return [\n      { id: 'F', sym: 'F', symText: 'F', label: 'Your push', unit: 'N', min: 0, max: 200, step: 1, val: 60, graph: true },\n      { id: 'm', sym: 'm', symText: 'm', label: 'Crate mass', unit: 'kg', min: 5, max: 50, step: 1, val: 20 },\n      { id: 'mu', sym: 'μ<sub>k<\/sub>', symText: 'μk', label: 'Friction', unit: '', min: 0, max: 0.8, step: 0.01, val: 0.3, show: v => v.toFixed(2) }];\n    if (mode === 'letgo') return [\n      { id: 'v0', sym: 'v<sub>0<\/sub>', symText: 'v0', label: 'Speed when you let go', unit: 'm/s', min: 1, max: 10, step: 0.5, val: 4 },\n      { id: 'm', sym: 'm', symText: 'm', label: 'Crate mass', unit: 'kg', min: 5, max: 50, step: 1, val: 20 },\n      { id: 'mu', sym: 'μ<sub>k<\/sub>', symText: 'μk', label: 'Friction', unit: '', min: 0, max: 0.8, step: 0.01, val: 0.3, show: v => v.toFixed(2), graph: true }];\n    const open = opt.chute === 'open';\n    return [\n      { id: 'm', sym: 'm', symText: 'm', label: 'Skydiver + gear mass', unit: 'kg', min: 40, max: 130, step: 1, val: 80, graph: true },\n      { id: 'b', sym: 'b', symText: 'b', label: open ? 'Drag constant (open chute)' : 'Drag constant (body position)', unit: 'kg/m', min: open ? 15 : 0.15, max: open ? 50 : 0.6, step: open ? 0.5 : 0.01, val: open ? 30 : 0.26, show: v => v.toFixed(2) + ' kg/m' }];\n  },\n  presets: [{ label: 'Balanced push', mode: 'push', v: { F: 60, m: 20, mu: 0.3 } }, { label: 'Frictionless floor', mode: 'letgo', v: { mu: 0 } }, { label: 'Ice', mode: 'letgo', v: { mu: 0.05 } }],\n  calc(v, mode, opt){\n    if (mode === 'push'){ const W = v.m * G10, f = v.mu * W; return { W, N: W, f, net: v.F - f, bal: Math.abs(v.F - f) < 0.5 }; }\n    if (mode === 'letgo'){ const W = v.m * G10, f = v.mu * W, a = v.mu * G10; return { W, N: W, f, net: -f, tStop: a > 0 ? v.v0 / a : Infinity, dStop: a > 0 ? v.v0 * v.v0 / (2 * a) : Infinity }; }\n    const W = v.m * G10, vt = Math.sqrt(W / v.b), v0 = opt.chute === 'open' ? Math.sqrt(W / 0.26) : 0;\n    return { W, vt, v0, dragStart: v.b * v0 * v0 };\n  },\n  dvs(mode){\n    if (mode === 'push') return [\n      { id: 'net', name: 'Net force ΣF = F − f', short: 'ΣF', sym: 'ΣF', unit: 'N', f: d => d.net },\n      { id: 'f', name: 'Kinetic friction', short: 'f', sym: 'f<sub>k<\/sub>', unit: 'N', f: d => d.f }];\n    if (mode === 'letgo') return [\n      { id: 'f', name: 'Friction (the only horizontal force)', short: 'f', sym: 'f<sub>k<\/sub>', unit: 'N', f: d => d.f },\n      { id: 'tStop', name: 'Time to stop', short: 't', sym: 't<sub>stop<\/sub>', unit: 's', f: d => d.tStop },\n      { id: 'dStop', name: 'Distance to stop', short: 'd', sym: 'd<sub>stop<\/sub>', unit: 'm', f: d => d.dStop }];\n    return [\n      { id: 'vt', name: 'Terminal speed', short: 'v_t', sym: 'v<sub>t<\/sub>', unit: 'm/s', f: d => d.vt },\n      { id: 'W', name: 'Weight = drag at terminal speed', short: 'W', sym: 'W', unit: 'N', f: d => d.W }];\n  },\n  work(v, d, mode, opt){\n    if (mode === 'push'){\n      let h = '<h4>1 · Free-body diagram of the crate<\/h4><div class=\"eq\">Vertical: N = mg = (' + H.iv('m') + ')(' + H.g() + ') = ' + H.n(d.N, 'N') + ' (it doesn’t move up or down)<\/div>' +\n        '<div class=\"eq\">Horizontal: your push F = ' + H.iv('F') + ' forward, kinetic friction backward<\/div>' +\n        '<h4>2 · Friction while it slides<\/h4><div class=\"eq\">f<sub>k<\/sub> = μ<sub>k<\/sub>N = (' + H.iv('mu') + ')(' + H.n(d.N, 'N') + ') = <b>' + H.n(d.f, 'N') + '<\/b><\/div>' +\n        '<h4>3 · Net force<\/h4><div class=\"eq\">ΣF = F − f<sub>k<\/sub> = ' + H.iv('F') + ' − ' + H.n(d.f, 'N') + ' = <b>' + H.n(d.net, 'N') + '<\/b><\/div>';\n      h += d.bal ? '<div class=\"eq\">ΣF = 0 → <b>constant velocity<\/b>. Newton’s 1st law: balanced forces don’t mean “not moving,” they mean “velocity not changing.”<\/div>'\n        : d.net > 0 ? '<div class=\"eq\">ΣF points forward → the crate <b>speeds up<\/b>. (How fast it speeds up is Newton’s 2nd law, next unit.)<\/div>'\n        : '<div class=\"eq\">ΣF points backward → the crate <b>slows down<\/b>, even though you’re still pushing forward.<\/div>';\n      h += '<h4>4 · Push needed for constant velocity<\/h4><div class=\"eq\">F = f<sub>k<\/sub> = ' + H.n(d.f, 'N') + '. Faster or slower doesn’t matter: the same push keeps it at <i>any<\/i> steady speed.<\/div>' +\n        '<p class=\"note\">Common mistake: “if it moves forward, the forward force must be bigger.” Only if it’s speeding up.<\/p>';\n      return h;\n    }\n    if (mode === 'letgo') return '<h4>1 · After you let go, the only horizontal force is friction<\/h4><div class=\"eq\">f<sub>k<\/sub> = μ<sub>k<\/sub>mg = (' + H.iv('mu') + ')(' + H.iv('m') + ')(' + H.g() + ') = <b>' + H.n(d.f, 'N') + '<\/b>, backward<\/div>' +\n      (v.mu === 0 ? '<h4>2 · No friction → no net force<\/h4><div class=\"eq\">ΣF = 0, so the crate keeps moving at ' + H.iv('v0') + ' <b>forever<\/b>. Nothing is needed to keep it going: that’s inertia.<\/div>'\n        : '<h4>2 · Unbalanced → the velocity changes<\/h4><div class=\"eq\">ΣF = ' + H.n(d.f, 'N') + ' backward, so the crate slows down and stops.<\/div>' +\n          '<div class=\"eq\">Preview of Unit 2: it stops after ' + H.n(d.tStop, 's') + ' and ' + H.n(d.dStop, 'm') + '.<\/div>') +\n      '<h4>3 · Why do things “naturally” stop?<\/h4><div class=\"eq\">Not because the push “runs out.” Friction stops them. Make μ smaller and watch it go farther; at μ = 0 it never stops.<\/div>' +\n      '<p class=\"note\">Aristotle thought a moving object needs a force to keep moving. Galileo and Newton: it needs a force to <i>change<\/i> its motion.<\/p>';\n    const open = opt.chute === 'open';\n    return '<h4>1 · Forces on the skydiver<\/h4><div class=\"eq\">Weight W = mg = (' + H.iv('m') + ')(' + H.g() + ') = ' + H.n(d.W, 'N') + ' down. Air drag D = bv² up, and it grows as the speed grows.<\/div>' +\n      (open ? '<h4>2 · Chute opens at ' + H.n(d.v0, 'm/s') + '<\/h4><div class=\"eq\">D = bv² = (' + H.iv('b') + ')(' + H.n(d.v0) + ')² = ' + H.n(d.dragStart, 'N') + ' > W, so ΣF points <b>up<\/b>: the skydiver slows down (while still falling!).<\/div>'\n        : '<h4>2 · Just after jumping<\/h4><div class=\"eq\">v ≈ 0, so D ≈ 0 and ΣF = W down: the skydiver speeds up. As v grows, D grows.<\/div>') +\n      '<h4>3 · Terminal speed: the forces balance<\/h4><div class=\"eq\">ΣF = 0: bv<sub>t<\/sub>² = mg → v<sub>t<\/sub> = √(mg/b) = √(' + H.n(d.W) + ' / ' + H.iv('b') + ') = <b>' + H.n(d.vt, 'm/s') + '<\/b><\/div>' +\n      '<div class=\"eq\">From then on: constant velocity, even though gravity is still pulling.<\/div>' +\n      '<p class=\"note\">Heavier skydivers have a higher terminal speed: the drag has to grow bigger to balance a bigger weight.<\/p>';\n  },\n  draw(v, d, mode, opt, t, dt, A){\n    if (A.t === undefined || A.reset){ A.t = 0; A.x = 0; A.hist = []; A.v = mode === 'push' ? 2 : mode === 'letgo' ? v.v0 : d.v0; A.y = 0; }\n    const T = mode === 'sky' ? 14 : 8; if (A.t > T){ A.t = 0; A.x = 0; A.hist = []; A.v = mode === 'push' ? 2 : mode === 'letgo' ? v.v0 : d.v0; }\n    A.t += dt;\n    // physics stepping (small steps)\n    for (let k = 0; k < 5; k++){ const h = dt / 5;\n      if (mode === 'push'){ const a = (v.F - d.f) / v.m; if (A.v > 0 || v.F > d.f) A.v = Math.max(0, A.v + a * h); A.v = Math.min(A.v, 12); }\n      else if (mode === 'letgo'){ if (A.t > 0.6) A.v = Math.max(0, A.v - v.mu * G10 * h); }\n      else { A.v += (G10 - v.b / v.m * A.v * A.v) * h; }\n      A.x += A.v * h; }\n    A.hist.push([A.t, A.v]);\n    const sc = 26, crateY = 230;\n    if (mode !== 'sky'){\n      panelTitle(mode === 'push' ? 'PUSHING A CRATE' : 'SLIDING AFTER YOU LET GO', 10, 18);\n      // floor with scrolling marks (camera follows crate)\n      ctx.fillStyle = mode === 'letgo' && v.mu === 0 ? '#dff0ff' : '#e6dccb'; ctx.fillRect(0, crateY, 380, 40);\n      for (let xm = Math.floor(A.x - 8); xm <= A.x + 8; xm++){ const px = 180 + (xm - A.x) * sc; if (px < 0 || px > 380) continue; ctx.fillStyle = '#9a8a6a'; ctx.fillRect(px, crateY + 2, 2, xm % 2 ? 6 : 12); if (xm % 2 === 0) text(xm + ' m', px, crateY + 30, { align: 'center', font: '500 9px \"IBM Plex Mono\",monospace', col: '#6a5a3a' }); }\n      const cw = 50 + v.m, ch = 40 + v.m * 0.5, cx = 180;\n      ctx.fillStyle = '#c98a3c'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.fillRect(cx - cw / 2, crateY - ch, cw, ch); ctx.strokeRect(cx - cw / 2, crateY - ch, cw, ch);\n      const fs = 70 / Math.max(d.W, 1);\n      const pushing = mode === 'push' || A.t < 0.6;\n      if (pushing && mode === 'push' && v.F > 0){ arrow(cx - cw / 2 - 8 - v.F * fs * 0.9, crateY - ch / 2, cx - cw / 2 - 2, crateY - ch / 2, COL.T, 'F', { lx: -v.F * fs * 0.9 - 6, ly: -10, align: 'left' }); }\n      if (mode === 'letgo' && A.t < 0.6) text('✋ letting go…', cx - cw / 2 - 90, crateY - ch / 2, { font: '600 12px \"Space Grotesk\",sans-serif' });\n      if (A.v > 0 && d.f > 0) arrow(cx, crateY - 4, cx - d.f * fs * 0.9, crateY - 4, COL.F, 'f', { lx: -6, ly: -10, align: 'right' });\n      if (A.v > 0.01) arrow(cx - 20, crateY - ch - 16, cx - 20 + A.v * 10, crateY - ch - 16, COL.V, 'v', { w: 2.5, lx: 6, ly: 0 });\n      const net = mode === 'push' ? (A.v > 0 || v.F > d.f ? v.F - d.f : 0) : A.v > 0 ? -d.f : 0;\n      const st = Math.abs(net) < 0.5 ? (A.v > 0.01 ? 'ΣF = 0 → constant velocity' : 'at rest') : net > 0 ? 'ΣF forward → speeding up' : 'ΣF backward → slowing down';\n      text(st, 12, 300, { font: '700 13px \"Space Grotesk\",sans-serif', col: Math.abs(net) < 0.5 ? '#1e7d45' : '#c43a00' });\n      text('v = ' + fplain(A.v) + ' m/s   x = ' + fplain(A.x) + ' m', 12, 318, { font: '600 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n    } else {\n      panelTitle(opt.chute === 'open' ? 'SKYDIVER, CHUTE OPEN' : 'SKYDIVER, FREE FALL', 10, 18);\n      ctx.save(); ctx.beginPath(); ctx.rect(0, 26, 380, 260); ctx.clip(); ctx.fillStyle = '#e6f2ff'; ctx.fillRect(0, 26, 380, 260);\n      const sp = 70, off = ((A.x * 6) % sp + sp) % sp; ctx.fillStyle = '#fff'; for (let y = -sp; y < 330; y += sp){ const yy = y - off + sp; ctx.beginPath(); ctx.ellipse(80, yy, 30, 9, 0, 0, 7); ctx.ellipse(300, (yy + 35) % 300, 26, 8, 0, 0, 7); ctx.fill(); }\n      ctx.restore();\n      const cx = 190, cy = 160;\n      if (opt.chute === 'open'){ ctx.fillStyle = '#ff6a2b'; ctx.beginPath(); ctx.arc(cx, cy - 70, 48, PI, 2 * PI); ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(cx - 48, cy - 70); ctx.lineTo(cx - 6, cy - 14); ctx.moveTo(cx + 48, cy - 70); ctx.lineTo(cx + 6, cy - 14); ctx.stroke(); }\n      ctx.fillStyle = '#1546d6'; ctx.fillRect(cx - 7, cy - 14, 14, 28); ctx.fillStyle = '#f2c7a0'; ctx.beginPath(); ctx.arc(cx, cy - 20, 7, 0, 7); ctx.fill();\n      const D = v.b * A.v * A.v, fs = 80 / d.W;\n      arrow(cx + 26, cy, cx + 26, cy + d.W * fs, COL.W, 'W', { lx: 6, ly: 0 });\n      const dx = opt.chute === 'open' ? 70 : 26; arrow(cx - dx, cy + 10, cx - dx, cy + 10 - Math.min(D, 3 * d.W) * fs, COL.F, 'D', { lx: -6, ly: 0, align: 'right' });\n      const bal = Math.abs(D - d.W) < 0.02 * d.W;\n      text(bal ? 'D = W → ΣF = 0 → constant velocity' : D < d.W ? 'D < W → ΣF down → speeding up' : 'D > W → ΣF up → slowing down', 12, 300, { font: '700 13px \"Space Grotesk\",sans-serif', col: bal ? '#1e7d45' : '#c43a00' });\n      text('v = ' + fplain(A.v) + ' m/s (down)   D = ' + fplain(D) + ' N', 12, 318, { font: '600 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n    }\n    // live v–t graph\n    panelTitle('VELOCITY vs TIME (live)', 395, 18);\n    const gx0 = 420, gy0 = 260, gw = 165, gh = 200;\n    const vmax = mode === 'push' ? 12 : mode === 'letgo' ? Math.max(v.v0, 1) * 1.2 : Math.max(d.vt, d.v0, 1) * 1.15;\n    ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(gx0, gy0 - gh); ctx.lineTo(gx0, gy0); ctx.lineTo(gx0 + gw, gy0); ctx.stroke();\n    if (mode === 'sky'){ const yv = gy0 - gh * d.vt / vmax; ctx.setLineDash([4, 3]); ctx.strokeStyle = '#1e7d45'; ctx.beginPath(); ctx.moveTo(gx0, yv); ctx.lineTo(gx0 + gw, yv); ctx.stroke(); ctx.setLineDash([]); text('v_t', gx0 + gw - 2, yv - 4, { align: 'right', font: '600 10px \"IBM Plex Mono\",monospace', col: '#1e7d45' }); }\n    ctx.strokeStyle = COL.V; ctx.lineWidth = 2.5; ctx.beginPath(); A.hist.forEach(([s, q], i) => { const X = gx0 + gw * s / T, Y = gy0 - gh * Math.min(q, vmax) / vmax; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.stroke();\n    text('v (m/s)', gx0 - 4, gy0 - gh - 6, { font: '500 10px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); text(fplain(vmax), gx0 - 4, gy0 - gh + 4, { align: 'right', font: '500 10px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n    text('t (s) → ' + T, gx0 + gw, gy0 + 14, { align: 'right', font: '500 10px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n    text('flat line = ΣF = 0', 395, 300, { font: '600 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n  }\n};\n\n\nS.mode = SIM.modes ? SIM.modes[0].id : 'one';\nsetup(); requestAnimationFrame(loop);\n<\/script>\n<\/body><\/html>\n"},
"cartball":{ar:"1000 / 640",html:"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Inertia on a Cart<\/title>\n<\!-- Inertia on a Cart: original Holmes Sims, built from frame.html + cartball.js. g = 10 m/s². -->\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap\">\n<style>\nhtml,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:\"Space Grotesk\",system-ui,sans-serif;color:#111}\n#app{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0;padding:10px 14px 12px;box-sizing:border-box;\n  display:grid;grid-template-columns:600px 1fr;grid-template-rows:34px 330px 1fr;gap:10px 14px}\n#bar{grid-column:1/-1;display:flex;gap:16px;align-items:center;flex-wrap:nowrap;overflow:hidden}\n.seg{display:flex;align-items:center}\n.seg .lab{font:700 12px \"IBM Plex Mono\",monospace;margin-right:8px;text-transform:uppercase}\n.seg button{white-space:nowrap;font:700 14px \"Space Grotesk\",sans-serif;padding:6px 11px;border:2px solid #111;background:#fff;color:#111;cursor:pointer}\n.seg button+button{margin-left:-2px}\n.seg button[aria-pressed=\"true\"]{background:#111;color:#fff}\n.seg button:hover:not([aria-pressed=\"true\"]){background:#ffe2d3}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ff6a2b;outline-offset:2px;position:relative;z-index:1}\n#cv{border:2px solid #111;background:#fbfbfb;width:600px;height:330px;box-sizing:border-box;display:block}\n#work{border:2px solid #111;padding:8px 12px 10px;overflow:auto;font-size:14px;line-height:1.55;box-sizing:border-box}\n#work .wt{font:700 12px \"IBM Plex Mono\",monospace;text-transform:uppercase;margin:0 0 4px;display:flex;justify-content:space-between}\n#work h4{margin:9px 0 1px;font-size:13px;font-weight:700;color:#4a4a4a}\n#work h4:first-of-type{margin-top:2px}\n#work .eq{font-variant-numeric:tabular-nums}\n#work .n{font-family:\"IBM Plex Mono\",monospace;font-size:13px}\n#work b .n,#work .ans{font-weight:700}\n#work .note{font-size:12.5px;color:#4a4a4a;margin:2px 0 0}\n#work .ok{background:#e5f4ea;border-left:4px solid #1e7d45;padding:3px 8px;margin-top:4px}\n#work .bad{background:#fde7df;border-left:4px solid #c43a00;padding:3px 8px;margin-top:4px}\n.ivv{border-radius:2px;padding:0 2px;transition:background .25s}\n.ivv.gx{background:#ffe2d3}\n.ivv.hot{background:#ff6a2b;color:#fff}\n#ctl{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;align-content:start}\n.iv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:6px}\n.iv .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.iv .val{font:700 13px \"IBM Plex Mono\",monospace;white-space:nowrap}\n.iv input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:#111;height:22px}\n.iv input[type=radio]{accent-color:#ff6a2b;margin:0}\n#presets{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}\n#presets .lab{font:700 12px \"IBM Plex Mono\",monospace}\n#presets button{font:600 12.5px \"Space Grotesk\",sans-serif;padding:3px 8px;border:2px solid #111;background:#fff;cursor:pointer}\n#presets button:hover{background:#ffe2d3}\n#gcard{border:2px solid #111;padding:5px 8px 6px;display:flex;flex-direction:column;box-sizing:border-box;min-height:0}\n.ghead{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}\n.ghead select{font:600 13px \"Space Grotesk\",sans-serif;border:2px solid #111;padding:1px 4px;max-width:200px}\n#gv{width:340px;height:150px;flex:none;display:block;margin-top:3px}\n#dbl{font-size:12.5px;line-height:1.35;margin-top:2px}\n#dbl b{font-weight:700}\n.hint{font:500 11px \"IBM Plex Mono\",monospace;color:#4a4a4a}\n<\/style><\/head><body>\n<div id=\"app\">\n  <div id=\"bar\"><\/div>\n  <canvas id=\"cv\" width=\"1200\" height=\"660\" aria-label=\"Animation of the situation with force arrows\"><\/canvas>\n  <div id=\"work\" aria-live=\"polite\"><\/div>\n  <div id=\"ctl\"><\/div>\n  <div id=\"gcard\">\n    <div class=\"ghead\"><span>Graph<\/span><select id=\"dvsel\" aria-label=\"Quantity to graph\"><\/select><span>vs <b id=\"ivname\"><\/b><\/span><\/div>\n    <canvas id=\"gv\" width=\"680\" height=\"300\" aria-label=\"Graph of the chosen quantity against the chosen variable\"><\/canvas>\n    <div id=\"dbl\"><\/div>\n  <\/div>\n<\/div>\n<script>\n// ---------------- shared frame ----------------\nconst $ = id => document.getElementById(id);\nconst G10 = 10, PI = Math.PI, DEG = PI / 180;\nfunction fit(){ const s = Math.min(innerWidth / 1000, innerHeight / 640); $('app').style.transform = 'scale(' + s + ')'; }\naddEventListener('resize', fit); fit();\n\nfunction fnum(x){ const r = fnum0(x); return typeof r === 'string' ? r.replace(/^-/, '−') : r; }\nfunction fnum0(x){\n  if (x === null || x === undefined || !isFinite(x)) return '—';\n  const a = Math.abs(x);\n  if (a === 0) return '0';\n  if (a >= 1e5 || a < 1e-3){\n    const e = Math.floor(Math.log10(a)); let m = x / Math.pow(10, e);\n    let ms = m.toFixed(2); if (Math.abs(+ms) >= 10){ m /= 10; ms = m.toFixed(2); return ms + '×10<sup>' + (e + 1) + '<\/sup>'; }\n    return ms + '×10<sup>' + e + '<\/sup>';\n  }\n  if (a >= 1000) return String(Math.round(x));\n  return x.toPrecision(3);\n}\nfunction fplain(x){ return fnum(x).replace(/<sup>(.*?)<\\/sup>/g, (m, e) => '^' + e).replace('×10^', 'e'); }\nconst H = {\n  n: (x, u) => '<span class=\"n\">' + fnum(x) + (u ? '&nbsp;' + u : '') + '<\/span>',\n  iv: id => { const d = S.def[id]; const val = S.v[id]; const txt = (d.show ? d.show(val) : fnum(val) + (d.unit ? '&nbsp;' + d.unit : ''));\n              return '<span class=\"ivv n' + (S.gx === id ? ' gx' : '') + (S.hot === id ? ' hot' : '') + '\" data-iv=\"' + id + '\">' + txt + '<\/span>'; },\n  g: () => '<span class=\"n\">10&nbsp;m/s²<\/span>',\n  p: (x, u) => x < 0 ? '(' + H.n(x, u) + ')' : H.n(x, u)\n};\n\nconst S = { mode: null, opt: {}, v: {}, store: {}, def: {}, ivs: [], gx: null, dv: null, hot: null, t: 0, anim: {} };\n\nfunction bar(){\n  const b = $('bar'); b.innerHTML = '';\n  const group = (label, items, cur, onpick) => {\n    const g = document.createElement('div'); g.className = 'seg'; g.setAttribute('role', 'group');\n    if (label){ const l = document.createElement('span'); l.className = 'lab'; l.textContent = label; g.appendChild(l); }\n    items.forEach(([id, txt]) => { const bt = document.createElement('button'); bt.textContent = txt; bt.setAttribute('aria-pressed', String(id === cur)); bt.onclick = () => onpick(id); g.appendChild(bt); });\n    b.appendChild(g);\n  };\n  const tip = document.createElement('span'); tip.className = 'hint'; tip.style.marginLeft = 'auto'; tip.style.whiteSpace = 'nowrap'; tip.innerHTML = '● = the variable on the graph’s x-axis · drag any slider';\n  if (SIM.modes) group(null, SIM.modes.map(m => [m.id, m.label]), S.mode, id => { S.mode = id; S.anim = {}; setup(); });\n  (SIM.opts || []).filter(o => !o.modes || o.modes.includes(S.mode)).forEach(o => {\n    if (!(o.id in S.opt)) S.opt[o.id] = o.choices[0][0];\n    group(o.label, o.choices, S.opt[o.id], id => { S.opt[o.id] = id; S.anim = {}; setup(); });\n  });\n  b.appendChild(tip);\n  if (b.scrollWidth > b.clientWidth + 1) tip.remove();\n  if (b.scrollWidth > b.clientWidth + 1) b.querySelectorAll('.seg button').forEach(x => { x.style.fontSize = '13px'; x.style.padding = '6px 8px'; });\n}\n\nfunction setup(){\n  bar();\n  S.ivs = SIM.ivs(S.mode, S.opt); S.def = {}; S.v = {};\n  S.ivs.forEach(d => { S.def[d.id] = d; const k = S.mode + ':' + d.id; S.v[d.id] = (k in S.store) ? S.store[k] : d.val; });\n  if (!S.gx || !S.def[S.gx]) S.gx = S.ivs.find(d => d.graph) ? S.ivs.find(d => d.graph).id : S.ivs[1] ? S.ivs[1].id : S.ivs[0].id;\n  const c = $('ctl'); c.innerHTML = '';\n  S.ivs.forEach(d => {\n    const w = document.createElement('div'); w.className = 'iv';\n    w.innerHTML = '<input type=\"radio\" name=\"gx\" value=\"' + d.id + '\" aria-label=\"Graph against ' + d.label + '\" title=\"Put this on the graph’s x-axis\"' + (S.gx === d.id ? ' checked' : '') + '>' +\n      '<span class=\"nm\">' + d.label + ' <i>' + d.sym + '<\/i><\/span><span class=\"val\" id=\"val-' + d.id + '\"><\/span>' +\n      '<input type=\"range\" id=\"r-' + d.id + '\" min=\"' + d.min + '\" max=\"' + d.max + '\" step=\"' + d.step + '\" value=\"' + S.v[d.id] + '\" aria-label=\"' + d.label + '\">';\n    c.appendChild(w);\n    const r = w.querySelector('input[type=range]');\n    r.oninput = () => { S.v[d.id] = +r.value; S.store[S.mode + ':' + d.id] = +r.value; S.hot = d.id; clearTimeout(S.hotT); S.hotT = setTimeout(() => { S.hot = null; update(); }, 700); S.anim.reset = true; update(); };\n    w.querySelector('input[type=radio]').onchange = () => { S.gx = d.id; update(); };\n  });\n  if (SIM.presets){\n    const p = document.createElement('div'); p.id = 'presets'; p.innerHTML = '<span class=\"lab\">Try:<\/span>';\n    SIM.presets.forEach(ps => { const bt = document.createElement('button'); bt.textContent = ps.label; bt.onclick = () => { if (ps.mode && ps.mode !== S.mode){ S.mode = ps.mode; } Object.entries(ps.v).forEach(([k, val]) => S.store[(ps.mode || S.mode) + ':' + k] = val); S.anim = {}; setup(); }; p.appendChild(bt); });\n    c.appendChild(p);\n  }\n  const dvs = SIM.dvs(S.mode, S.opt), sel = $('dvsel');\n  if (!S.dv || !dvs.find(d => d.id === S.dv)) S.dv = dvs[0].id;\n  sel.innerHTML = dvs.map(d => '<option value=\"' + d.id + '\"' + (d.id === S.dv ? ' selected' : '') + '>' + d.name + '<\/option>').join('');\n  sel.onchange = () => { S.dv = sel.value; update(); };\n  update();\n}\n\nfunction calcWith(over){ const v = Object.assign({}, S.v, over || {}); return SIM.calc(v, S.mode, S.opt); }\n\nfunction update(){\n  S.ivs.forEach(d => { $('val-' + d.id).innerHTML = d.show ? d.show(S.v[d.id]) : fnum(S.v[d.id]) + (d.unit ? \/b>. Same distance → the ball lands <b>right back in the launcher<\/b>.<\/div>' +\n      '<p class=\"note\">From the cart it looks like the ball goes straight up and down. Switch to “Watch from: The cart.” Same idea: drop your keys on a smooth train and they land at your feet.<\/p>' +\n      '<p class=\"note\">Common mistake: “the ball falls behind because the cart moves out from under it.” Only if the cart changes its velocity. Try the other two modes.<\/p>';\n    h += '<h4>3 · But the cart ' + (mode === 'speed' ? 'speeds up' : 'slows down') + ' while the ball is in the air<\/h4><div class=\"eq\">x<sub>cart<\/sub> = vt ' + (mode === 'speed' ? '+' : '−') + ' ½at² = ' + H.n(d.xCart, 'm') + ' <span class=\"hint\">(½at²: Unit 2)<\/span><\/div>' +\n      '<h4>4 · Compare<\/h4><div class=\"eq\">Δx = x<sub>ball<\/sub> − x<sub>cart<\/sub> = ' + H.n(d.xBall) + ' − ' + H.n(d.xCart) + ' = <b>' + H.n(d.miss, 'm') + '<\/b>: the ball lands <b>' + (d.miss > 0 ? 'ahead of' : 'behind') + '<\/b> the launcher.<\/div>' +\n      '<p class=\"note\">The ball didn’t change its horizontal motion; the cart did. In the cart’s view the ball seems to drift ' + (d.miss > 0 ? 'forward' : 'backward') + ' with no force pushing it, which is how you know the cart is not an inertial (constant-velocity) frame.<\/p>';\n    return h;\n  },\n  draw(v, d, mode, opt, t, dt, A){\n    if (A.t === undefined || A.reset) A.t = 0; A.t += dt;\n    const pre = 0.8, post = 1.4, cyc = pre + d.tAir + post, tc = (A.t % cyc) - pre;   // tc: time since launch\n    const s = Math.max(0, Math.min(tc, d.tAir)), sCart = Math.max(0, tc);\n    const cartX = tc < 0 ? v.v * tc : d.xc(Math.min(sCart, d.tAir + post));\n    const caught = Math.abs(d.miss) < 0.05, landed = tc > d.tAir;\n    const ballX = tc < 0 ? cartX : !landed ? d.xb(s) : caught ? cartX : d.xBall;   // caught: rides on in the launcher; missed: sits on the ground\n    const ballY = tc < 0 ? 0 : d.yb(s);\n    const groundView = opt.view === 'ground';\n    panelTitle(groundView ? 'WATCHED FROM THE GROUND' : 'WATCHED FROM THE CART', 10, 18);\n    const span = groundView ? Math.max(d.xBall, d.xc(d.tAir + post), 0.5) + v.v * pre : Math.abs(d.miss) * 2 + 1, sc = Math.min(70, (groundView ? 280 : 150) / Math.max(span, 0.5), 170 / Math.max(d.hMax, 0.5));\n    const groundY = 250, X0 = groundView ? 40 + v.v * pre * sc : 190;\n    const X = x => groundView ? X0 + x * sc : X0 + (x - cartX) * sc, Y = y => groundY - 28 - y * sc;\n    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 385, 330); ctx.clip();\n    // ground with marks\n    ctx.fillStyle = '#e6dccb'; ctx.fillRect(0, groundY, 380, 30);\n    for (let m = Math.floor(-v.v * pre - 20); m < 40; m++){ const px = X(m); if (px < 0 || px > 380) continue; ctx.fillStyle = '#9a8a6a'; ctx.fillRect(px, groundY, 1.5, m % 5 ? 5 : 11); }\n    // ball trail (from the chosen frame)\n    if (tc > 0){ ctx.fillStyle = '#ffb38f'; for (let q = 0; q <= s; q += 0.05){ const tx = groundView ? X(d.xb(q)) : X0 + (d.xb(q) - d.xc(q)) * sc; ctx.beginPath(); ctx.arc(tx, Y(d.yb(q)), 2, 0, 7); ctx.fill(); } }\n    // cart\n    const cx = X(cartX); ctx.fillStyle = '#1546d6'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.fillRect(cx - 40, groundY - 26, 80, 18); ctx.strokeRect(cx - 40, groundY - 26, 80, 18);\n    ctx.fillStyle = '#555'; ctx.fillRect(cx - 5, groundY - 40, 10, 14);\n    [cx - 26, cx + 26].forEach(wx => { ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(wx, groundY - 6, 6, 0, 7); ctx.fill(); });\n    // ball\n    const bx = X(ballX), by = landed && !caught ? groundY - 7 : Y(ballY);\n    ctx.fillStyle = '#ff6a2b'; ctx.beginPath(); ctx.arc(bx, by, 7, 0, 7); ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 1; ctx.stroke();\n    if (tc > 0 && tc < d.tAir){ const vy = v.u - G10 * s, vx = groundView ? v.v : v.v - (v.v + d.acc * s); if (Math.hypot(vx, vy) > 0.2) arrow(bx, Y(ballY), bx + vx * 8, Y(ballY) - vy * 8, COL.V, '', { w: 2, head: 6 }); }\n    ctx.restore();\n    const msg = tc < 0 ? 'rolling…' : tc <= d.tAir ? 'ball in the air' : Math.abs(d.miss) < 0.05 ? 'lands back in the launcher' : d.miss > 0 ? 'lands ' + fplain(d.miss) + ' m AHEAD of the launcher' : 'lands ' + fplain(-d.miss) + ' m BEHIND the launcher';\n    text(msg, 12, 300, { font: '700 13px \"Space Grotesk\",sans-serif', col: Math.abs(d.miss) < 0.05 || tc <= d.tAir ? '#111' : '#c43a00' });\n    text('t = ' + fplain(Math.max(0, Math.min(tc, d.tAir))) + ' s  of ' + fplain(d.tAir) + ' s in the air', 12, 318, { font: '600 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n    // x–t of ball vs cart during the flight\n    panelTitle('HORIZONTAL POSITION vs TIME', 395, 18);\n    const gx0 = 420, gy0 = 250, gw = 165, gh = 190, xm = Math.max(d.xBall, d.xCart, 0.5) * 1.1, PX = q => gx0 + gw * q / d.tAir, PY = x => gy0 - gh * x / xm;\n    ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(gx0, gy0 - gh); ctx.lineTo(gx0, gy0); ctx.lineTo(gx0 + gw, gy0); ctx.stroke();\n    const ln = (f, col, dash, w) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.setLineDash(dash); ctx.beginPath(); for (let k = 0; k <= 60; k++){ const q = d.tAir * k / 60; k ? ctx.lineTo(PX(q), PY(f(q))) : ctx.moveTo(PX(q), PY(f(q))); } ctx.stroke(); ctx.setLineDash([]); };\n    ln(d.xc, '#1546d6', [], 4); ln(d.xb, '#ff6a2b', [5, 4], 2.5);\n    if (tc >= 0 && tc <= d.tAir){ ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(PX(s), gy0); ctx.lineTo(PX(s), gy0 - gh); ctx.stroke(); }\n    text('cart', gx0 + gw + 2, PY(d.xCart) + (d.miss > 0 ? 10 : -4), { align: 'right', font: '700 11px \"Space Grotesk\",sans-serif', col: '#1546d6' });\n    text('ball', gx0 + gw + 2, PY(d.xBall) + (d.miss > 0 ? -4 : 12), { align: 'right', font: '700 11px \"Space Grotesk\",sans-serif', col: '#ff6a2b' });\n    text('x (m)', gx0 - 4, gy0 - gh - 6, { font: '500 10px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); text('t → ' + fplain(d.tAir) + ' s', gx0 + gw, gy0 + 14, { align: 'right', font: '500 10px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n    text(mode === 'const' ? 'same line: the ball keeps up' : 'the lines split', 395, 300, { font: '600 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n  }\n};\n\n\nS.mode = SIM.modes ? SIM.modes[0].id : 'one';\nsetup(); requestAnimationFrame(loop);\n<\/script>\n<\/body><\/html>\n"},
"meet":{ar:"1000 / 640",html:"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>When Do They Meet?<\/title>\n<\!-- When Do They Meet?: original Holmes Sims, built from frame.html + meet.js. g = 10 m/s². -->\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap\">\n<style>\nhtml,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:\"Space Grotesk\",system-ui,sans-serif;color:#111}\n#app{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0;padding:10px 14px 12px;box-sizing:border-box;\n  display:grid;grid-template-columns:600px 1fr;grid-template-rows:34px 330px 1fr;gap:10px 14px}\n#bar{grid-column:1/-1;display:flex;gap:16px;align-items:center;flex-wrap:nowrap;overflow:hidden}\n.seg{display:flex;align-items:center}\n.seg .lab{font:700 12px \"IBM Plex Mono\",monospace;margin-right:8px;text-transform:uppercase}\n.seg button{white-space:nowrap;font:700 14px \"Space Grotesk\",sans-serif;padding:6px 11px;border:2px solid #111;background:#fff;color:#111;cursor:pointer}\n.seg button+button{margin-left:-2px}\n.seg button[aria-pressed=\"true\"]{background:#111;color:#fff}\n.seg button:hover:not([aria-pressed=\"true\"]){background:#ffe2d3}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ff6a2b;outline-offset:2px;position:relative;z-index:1}\n#cv{border:2px solid #111;background:#fbfbfb;width:600px;height:330px;box-sizing:border-box;display:block}\n#work{border:2px solid #111;padding:8px 12px 10px;overflow:auto;font-size:14px;line-height:1.55;box-sizing:border-box}\n#work .wt{font:700 12px \"IBM Plex Mono\",monospace;text-transform:uppercase;margin:0 0 4px;display:flex;justify-content:space-between}\n#work h4{margin:9px 0 1px;font-size:13px;font-weight:700;color:#4a4a4a}\n#work h4:first-of-type{margin-top:2px}\n#work .eq{font-variant-numeric:tabular-nums}\n#work .n{font-family:\"IBM Plex Mono\",monospace;font-size:13px}\n#work b .n,#work .ans{font-weight:700}\n#work .note{font-size:12.5px;color:#4a4a4a;margin:2px 0 0}\n#work .ok{background:#e5f4ea;border-left:4px solid #1e7d45;padding:3px 8px;margin-top:4px}\n#work .bad{background:#fde7df;border-left:4px solid #c43a00;padding:3px 8px;margin-top:4px}\n.ivv{border-radius:2px;padding:0 2px;transition:background .25s}\n.ivv.gx{background:#ffe2d3}\n.ivv.hot{background:#ff6a2b;color:#fff}\n#ctl{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;align-content:start}\n.iv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:6px}\n.iv .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.iv .val{font:700 13px \"IBM Plex Mono\",monospace;white-space:nowrap}\n.iv input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:#111;height:22px}\n.iv input[type=radio]{accent-color:#ff6a2b;margin:0}\n#presets{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}\n#presets .lab{font:700 12px \"IBM Plex Mono\",monospace}\n#presets button{font:600 12.5px \"Space Grotesk\",sans-serif;padding:3px 8px;border:2px solid #111;background:#fff;cursor:pointer}\n#presets button:hover{background:#ffe2d3}\n#gcard{border:2px solid #111;padding:5px 8px 6px;display:flex;flex-direction:column;box-sizing:border-box;min-height:0}\n.ghead{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}\n.ghead select{font:600 13px \"Space Grotesk\",sans-serif;border:2px solid #111;padding:1px 4px;max-width:200px}\n#gv{width:340px;height:150px;flex:none;display:block;margin-top:3px}\n#dbl{font-size:12.5px;line-height:1.35;margin-top:2px}\n#dbl b{font-weight:700}\n.hint{font:500 11px \"IBM Plex Mono\",monospace;color:#4a4a4a}\n<\/style><\/head><body>\n<div id=\"app\">\n  <div id=\"bar\"><\/div>\n  <canvas id=\"cv\" width=\"1200\" height=\"660\" aria-label=\"Animation of the situation with force arrows\"><\/canvas>\n  <div id=\"work\" aria-live=\"polite\"><\/div>\n  <div id=\"ctl\"><\/div>\n  <div id=\"gcard\">\n    <div class=\"ghead\"><span>Graph<\/span><select id=\"dvsel\" aria-label=\"Quantity to graph\"><\/select><span>vs <b id=\"ivname\"><\/b><\/span><\/div>\n    <canvas id=\"gv\" width=\"680\" height=\"300\" aria-label=\"Graph of the chosen quantity against the chosen variable\"><\/canvas>\n    <div id=\"dbl\"><\/div>\n  <\/div>\n<\/div>\n<script>\n// ---------------- shared frame ----------------\nconst $ = id => document.getElementById(id);\nconst G10 = 10, PI = Math.PI, DEG = PI / 180;\nfunction fit(){ const s = Math.min(innerWidth / 1000, innerHeight / 640); $('app').style.transform = 'scale(' + s + ')'; }\naddEventListener('resize', fit); fit();\n\nfunction fnum(x){ const r = fnum0(x); return typeof r === 'string' ? r.replace(/^-/, '−') : r; }\nfunction fnum0(x){\n  if (x === null || x === undefined || !isFinite(x)) return '—';\n  const a = Math.abs(x);\n  if (a === 0) return '0';\n  if (a >= 1e5 || a < 1e-3){\n    const e = Math.floor(Math.log10(a)); let m = x / Math.pow(10, e);\n    let ms = m.toFixed(2); if (Math.abs(+ms) >= 10){ m /= 10; ms = m.toFixed(2); return ms + '×10<sup>' + (e + 1) + '<\/sup>'; }\n    return ms + '×10<sup>' + e + '<\/sup>';\n  }\n  if (a >= 1000) return String(Math.round(x));\n  return x.toPrecision(3);\n}\nfunction fplain(x){ return fnum(x).replace(/<sup>(.*?)<\\/sup>/g, (m, e) => '^' + e).replace('×10^', 'e'); }\nconst H = {\n  n: (x, u) => '<span class=\"n\">' + fnum(x) + (u ? '&nbsp;' + u : '') + '<\/span>',\n  iv: id => { const d = S.def[id]; const val = S.v[id]; const txt = (d.show ? d.show(val) : fnum(val) + (d.unit ? '&nbsp;' + d.unit : ''));\n              return '<span class=\"ivv n' + (S.gx === id ? ' gx' : '') + (S.hot === id ? ' hot' : '') + '\" data-iv=\"' + id + '\">' + txt + '<\/span>'; },\n  g: () => '<span class=\"n\">10&nbsp;m/s²<\/span>',\n  p: (x, u) => x < 0 ? '(' + H.n(x, u) + ')' : H.n(x, u)\n};\n\nconst S = { mode: null, opt: {}, v: {}, store: {}, def: {}, ivs: [], gx: null, dv: null, hot: null, t: 0, anim: {} };\n\nfunction bar(){\n  const b = $('bar'); b.innerHTML = '';\n  const group = (label, items, cur, onpick) => {\n    const g = document.createElement('div'); g.className = 'seg'; g.setAttribute('role', 'group');\n    if (label){ const l = document.createElement('span'); l.className = 'lab'; l.textContent = label; g.appendChild(l); }\n    items.forEach(([id, txt]) => { const bt = document.createElement('button'); bt.textContent = txt; bt.setAttribute('aria-pressed', String(id === cur)); bt.onclick = () => onpick(id); g.appendChild(bt); });\n    b.appendChild(g);\n  };\n  const tip = document.createElement('span'); tip.className = 'hint'; tip.style.marginLeft = 'auto'; tip.style.whiteSpace = 'nowrap'; tip.innerHTML = '● = the variable on the graph’s x-axis · drag any slider';\n  if (SIM.modes) group(null, SIM.modes.map(m => [m.id, m.label]), S.mode, id => { S.mode = id; S.anim = {}; setup(); });\n  (SIM.opts || []).filter(o => !o.modes || o.modes.includes(S.mode)).forEach(o => {\n    if (!(o.id in S.opt)) S.opt[o.id] = o.choices[0][0];\n    group(o.label, o.choices, S.opt[o.id], id => { S.opt[o.id] = id; S.anim = {}; setup(); });\n  });\n  b.appendChild(tip);\n  if (b.scrollWidth > b.clientWidth + 1) tip.remove();\n  if (b.scrollWidth > b.clientWidth + 1) b.querySelectorAll('.seg button').forEach(x => { x.style.fontSize = '13px'; x.style.padding = '6px 8px'; });\n}\n\nfunction setup(){\n  bar();\n  S.ivs = SIM.ivs(S.mode, S.opt); S.def = {}; S.v = {};\n  S.ivs.forEach(d => { S.def[d.id] = d; const k = S.mode + ':' + d.id; S.v[d.id] = (k in S.store) ? S.store[k] : d.val; });\n  if (!S.gx || !S.def[S.gx]) S.gx = S.ivs.find(d => d.graph) ? S.ivs.find(d => d.graph).id : S.ivs[1] ? S.ivs[1].id : S.ivs[0].id;\n  const c = $('ctl'); c.innerHTML = '';\n  S.ivs.forEach(d => {\n    const w = document.createElement('div'); w.className = 'iv';\n    w.innerHTML = '<input type=\"radio\" name=\"gx\" value=\"' + d.id + '\" aria-label=\"Graph against ' + d.label + '\" title=\"Put this on the graph’s x-axis\"' + (S.gx === d.id ? ' checked' : '') + '>' +\n      '<span class=\"nm\">' + d.label + ' <i>' + d.sym + '<\/i><\/span><span class=\"val\" id=\"val-' + d.id + '\"><\/span>' +\n      '<input type=\"range\" id=\"r-' + d.id + '\" min=\"' + d.min + '\" max=\"' + d.max + '\" step=\"' + d.step + '\" value=\"' + S.v[d.id] + '\" aria-label=\"' + d.label + '\">';\n    c.appendChild(w);\n    const r = w.querySelector('input[type=range]');\n    r.oninput = () => { S.v[d.id] = +r.value; S.store[S.mode + ':' + d.id] = +r.value; S.hot = d.id; clearTimeout(S.hotT); S.hotT = setTimeout(() => { S.hot = null; update(); }, 700); S.anim.reset = true; update(); };\n    w.querySelector('input[type=radio]').onchange = () => { S.gx = d.id; update(); };\n  });\n  if (SIM.presets){\n    const p = document.createElement('div'); p.id = 'presets'; p.innerHTML = '<span class=\"lab\">Try:<\/span>';\n    SIM.presets.forEach(ps => { const bt = document.createElement('button'); bt.textContent = ps.label; bt.onclick = () => { if (ps.mode && ps.mode !== S.mode){ S.mode = ps.mode; } Object.entries(ps.v).forEach(([k, val]) => S.store[(ps.mode || S.mode) + ':' + k] = val); S.anim = {}; setup(); }; p.appendChild(bt); });\n    c.appendChild(p);\n  }\n  const dvs = SIM.dvs(S.mode, S.opt), sel = $('dvsel');\n  if (!S.dv || !dvs.find(d => d.id === S.dv)) S.dv = dvs[0].id;\n  sel.innerHTML = dvs.map(d => '<option value=\"' + d.id + '\"' + (d.id === S.dv ? ' selected' : '') + '>' + d.name + '<\/option>').join('');\n  sel.onchange = () => { S.dv = sel.value; update(); };\n  update();\n}\n\nfunction calcWith(over){ const v = Object.assign({}, S.v, over || {}); return SIM.calc(v, S.mode, S.opt); }\n\nfunction update(){\n  S.ivs.forEach(d => { $('val-' + d.id).innerHTML = d.show ? d.show(S.v[d.id]) : fnum(S.v[d.id]) + (d.unit ? '&nbsp;' + d.unit : ''); });\n  S.d = calcWith();\n  $('work').innerHTML = '<div class=\"wt\"><span>Show the work<\/span><span class=\"hint\">' + (SIM.hint || 'g = 10 m/s²') + '<\/span><\/div>' + SIM.work(S.v, S.d, S.mode, S.opt);\n  document.querySelectorAll('input[name=gx]').forEach(r => r.checked = (r.value === S.gx));\n  graph();\n}\n\nfunction graph(){\n  const cv = $('gv'), g = cv.getContext('2d'), W = 340, Hh = 150; g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, W, Hh);\n  const dvs = SIM.dvs(S.mode, S.opt), dv = dvs.find(d => d.id === S.dv), ref = dv.vs ? dvs.find(d => d.id === dv.vs) : null;\n  const x = S.def[S.gx]; $('ivname').innerHTML = '<i>' + x.sym + '<\/i>' + (x.unit && !x.show ? ' (' + x.unit + ')' : '');\n  const N = 160, xs = [], ys = [], rs = [];\n  for (let i = 0; i <= N; i++){ const xv = x.min + (x.max - x.min) * i / N; const d = calcWith({ [S.gx]: xv }); xs.push(xv); ys.push(dv.f(d)); rs.push(ref ? ref.f(d) : null); }\n  const all = ys.concat(ref ? rs : []).filter(isFinite);\n  let ymin = Math.min(0, ...all), ymax = Math.max(...all, 0); if (ymax === ymin) ymax = ymin + 1; const pad = (ymax - ymin) * 0.08; ymax += pad; if (ymin < 0) ymin -= pad;\n  const L = 46, R = 8, T = 8, B = 22, X = v => L + (v - x.min) / (x.max - x.min) * (W - L - R), Y = v => T + (ymax - v) / (ymax - ymin) * (Hh - T - B);\n  g.strokeStyle = '#111'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(L, T); g.lineTo(L, Hh - B); g.lineTo(W - R, Hh - B); g.stroke();\n  if (ymin < 0){ g.strokeStyle = '#999'; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(W - R, Y(0)); g.stroke(); g.setLineDash([]);\n    if (dv.negNote){ g.fillStyle = 'rgba(196,58,0,0.08)'; g.fillRect(L, Y(0), W - R - L, Hh - B - Y(0)); g.fillStyle = '#c43a00'; g.font = '600 10px \"Space Grotesk\",sans-serif'; g.textAlign = 'left'; g.fillText(dv.negNote, L + 4, Hh - B - 4); } }\n  g.font = '500 10px \"IBM Plex Mono\",monospace'; g.fillStyle = '#4a4a4a'; g.textAlign = 'right';\n  g.fillText(fplain(yma
