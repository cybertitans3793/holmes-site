all three equations: the tensions cancel<\/h4><div class=\"eq\">a = ' + (at ? '(m<sub>1<\/sub> − m<sub>2<\/sub>)g' : 'm<sub>2<\/sub>g') + ' / (m<sub>1<\/sub> + m<sub>2<\/sub> + ' + IR + ') = <b>' + H.n(d.a, 'm/s²') + '<\/b> (vs ' + H.n(d.a0, 'm/s²') + ' with a massless pulley)<\/div>' +\n      '<div class=\"eq\">T<sub>1<\/sub> = <b>' + H.n(d.T1, 'N') + '<\/b> &nbsp; T<sub>2<\/sub> = <b>' + H.n(d.T2, 'N') + '<\/b> → difference ' + H.n(Math.abs(d.T1 - d.T2), 'N') + ' = ' + IR + '·a ✓<\/div>' +\n      '<p class=\"note\">The pulley acts like an extra mass ' + IR + ' = ' + H.n(d.Ieff, 'kg') + ' that has to be accelerated, but it isn’t pulled by gravity in the direction of motion.<\/p>';\n    return h;\n  },\n  draw(v, d, mode, opt, t, dt, A){\n    if (A.t === undefined || A.reset) A.t = 0; A.t += dt; const tt = A.t % 3, s = Math.min(0.5 * d.a * tt * tt * 25, 110), ang = s / 25 / v.R * 0.25;\n    const pulley = (cx, cy, Rp) => { ctx.fillStyle = opt.shape === 'hoop' ? '#fff' : '#9aa7b8'; ctx.strokeStyle = '#111'; ctx.lineWidth = opt.shape === 'hoop' ? 6 : 1.5; ctx.beginPath(); ctx.arc(cx, cy, Rp, 0, 7); ctx.fill(); ctx.stroke();\n      ctx.lineWidth = 2; ctx.strokeStyle = '#111'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Rp * Math.cos(ang), cy + Rp * Math.sin(ang)); ctx.stroke(); ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(cx, cy, 4, 0, 7); ctx.fill(); };\n    const box = (x, y, m, lab, col) => { const b = 18 + 12 * Math.sqrt(m); ctx.fillStyle = col; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.fillRect(x - b / 2, y, b, b); ctx.strokeRect(x - b / 2, y, b, b); text(lab, x, y + b / 2 + 4, { align: 'center', font: '700 10px \"Space Grotesk\",sans-serif', col: '#fff' }); return b; };\n    const Rp = 20 + v.R * 80, fs = 50 / G10;\n    ctx.strokeStyle = '#7a5a2a'; ctx.lineWidth = 2;\n    if (mode === 'spool'){\n      panelTitle('MASS HANGING FROM A SPOOL', 10, 18);\n      const cx = 190, cy = 80; ctx.fillStyle = '#111'; ctx.fillRect(cx - 4, 28, 8, cy - 28);\n      const y = 140 + s; ctx.beginPath(); ctx.moveTo(cx + Rp, cy); ctx.lineTo(cx + Rp, y); ctx.stroke(); pulley(cx, cy, Rp);\n      const b = box(cx + Rp, y, v.m, 'm', '#ff6a2b');\n      arrow(cx + Rp + b / 2 + 10, y + b / 2, cx + Rp + b / 2 + 10, y + b / 2 - d.T1 * fs / Math.max(v.m, 0.3), COL.T, 'T', { lx: 5, ly: 0 });\n      arrow(cx + Rp + b / 2 + 26, y + b / 2, cx + Rp + b / 2 + 26, y + b / 2 + v.m * G10 * fs / Math.max(v.m, 0.3), COL.W, 'mg', { lx: 5, ly: 0 });\n    } else if (mode === 'atwood'){\n      panelTitle('ATWOOD MACHINE WITH A MASSIVE PULLEY', 10, 18);\n      const cx = 190, cy = 70; ctx.fillStyle = '#111'; ctx.fillRect(cx - 4, 26, 8, cy - 26);\n      const dir = Math.sign(d.a), y1 = 160 + dir * s * 0.6, y2 = 160 - dir * s * 0.6;\n      ctx.beginPath(); ctx.moveTo(cx - Rp, cy); ctx.lineTo(cx - Rp, y1); ctx.moveTo(cx + Rp, cy); ctx.lineTo(cx + Rp, y2); ctx.stroke(); pulley(cx, cy, Rp);\n      box(cx - Rp, y1, v.m1, 'm1', '#ff6a2b'); box(cx + Rp, y2, v.m2, 'm2', '#1546d6');\n      text('T1 = ' + fplain(d.T1) + ' N', cx - Rp - 12, cy + 120, { align: 'right', font: '700 11px \"IBM Plex Mono\",monospace', col: COL.T });\n      text('T2 = ' + fplain(d.T2) + ' N', cx + Rp + 12, cy + 120, { font: '700 11px \"IBM Plex Mono\",monospace', col: COL.T });\n    } else {\n      panelTitle('TABLE + HANGING MASS, MASSIVE PULLEY', 10, 18);\n      const ty = 110, edge = 270, cx = edge + 6, cy = ty - 13 + Rp; ctx.fillStyle = '#e6dccb'; ctx.fillRect(20, ty, edge - 20, 12); ctx.fillRect(edge - 20, ty + 12, 10, 170);\n      const bx = 80 + s; ctx.fillStyle = '#ff6a2b'; const bw = 30 + v.m1 * 8; ctx.fillRect(bx, ty - 26, bw, 26); ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.strokeRect(bx, ty - 26, bw, 26); text('m1', bx + bw / 2, ty - 9, { align: 'center', font: '700 10px \"Space Grotesk\",sans-serif', col: '#fff' });\n      ctx.strokeStyle = '#7a5a2a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx + bw, ty - 13); ctx.lineTo(cx, ty - 13); ctx.moveTo(cx + Rp, cy); ctx.lineTo(cx + Rp, cy + 60 + s); ctx.stroke();\n      pulley(cx, cy, Rp); box(cx + Rp, cy + 60 + s, v.m2, 'm2', '#1546d6');\n      text('T1 = ' + fplain(d.T1) + ' N', 90, ty - 40, { font: '700 11px \"IBM Plex Mono\",monospace', col: COL.T });\n      text('T2 = ' + fplain(d.T2) + ' N', cx + Rp + 30, 140, { font: '700 11px \"IBM Plex Mono\",monospace', col: COL.T });\n    }\n    text('a = ' + fplain(d.a) + ' m/s²   (massless pulley: ' + fplain(d.a0) + ')', 12, 300, { font: '700 13px \"Space Grotesk\",sans-serif' });\n    text('α = ' + fplain(d.al) + ' rad/s²   I = ' + fplain(d.I) + ' kg·m²', 12, 318, { font: '600 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n    panelTitle('MASSIVE vs MASSLESS PULLEY', 395, 18);\n    const mx = Math.max(d.a0, 0.01), bar = (y, val, col, lab) => { const w = 85 * Math.abs(val) / mx; ctx.fillStyle = col; ctx.fillRect(470, y, w, 14); text(lab, 465, y + 11, { align: 'right', font: '600 10px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); text(fplain(val), 474 + w, y + 11, { font: '600 10px \"IBM Plex Mono\",monospace' }); };\n    bar(45, d.a0, '#bbb', 'a, massless'); bar(70, d.a, '#ff6a2b', 'a, this one');\n    if (mode !== 'spool'){ const tm = Math.max(d.T1, d.T2, 1); panelTitle('TENSIONS (N)', 395, 120); [[d.T1, 'T1'], [d.T2, 'T2']].forEach(([T, l], i) => { const w = 85 * T / tm; ctx.fillStyle = COL.T; ctx.fillRect(470, 135 + i * 25, w, 14); text(l, 465, 146 + i * 25, { align: 'right', font: '600 10px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); text(fplain(T), 474 + w, 146 + i * 25, { font: '600 10px \"IBM Plex Mono\",monospace' }); });\n      text(Math.abs(d.T1 - d.T2) < 0.01 ? 'equal tensions (massless pulley)' : 'unequal: the difference spins the pulley', 395, 200, { font: '600 10px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); }\n  }\n};\n\n\nS.mode = SIM.modes ? SIM.modes[0].id : 'one';\nsetup(); requestAnimationFrame(loop);\nwindow.APP = { select(name){ const m = (SIM.modes || []).find(m => m.label === name || m.id === name); if (m && m.id !== S.mode){ S.mode = m.id; S.anim = {}; setup(); } } };\naddEventListener('message', e => { const d = e.data; if (d && d.select) try { APP.select(d.select); } catch (er) {} });\n<\/script>\n<\/body><\/html>\n"},
"roll":{ar:"1000 / 640",html:"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Rolling Race<\/title>\n<\!-- Rolling Race: original Holmes Sims, built from frame.html + roll.js. g = 10 m/s². -->\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap\">\n<style>\nhtml,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:\"Space Grotesk\",system-ui,sans-serif;color:#111}\n#app{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0;padding:10px 14px 12px;box-sizing:border-box;\n  display:grid;grid-template-columns:600px 1fr;grid-template-rows:34px 330px 1fr;gap:10px 14px}\n#bar{grid-column:1/-1;display:flex;gap:16px;align-items:center;flex-wrap:nowrap;overflow:hidden}\n.seg{display:flex;align-items:center}\n.seg .lab{font:700 12px \"IBM Plex Mono\",monospace;margin-right:8px;text-transform:uppercase}\n.seg button{white-space:nowrap;font:700 14px \"Space Grotesk\",sans-serif;padding:6px 11px;border:2px solid #111;background:#fff;color:#111;cursor:pointer}\n.seg button+button{margin-left:-2px}\n.seg button[aria-pressed=\"true\"]{background:#111;color:#fff}\n.seg button:hover:not([aria-pressed=\"true\"]){background:#ffe2d3}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ff6a2b;outline-offset:2px;position:relative;z-index:1}\n#cv{border:2px solid #111;background:#fbfbfb;width:600px;height:330px;box-sizing:border-box;display:block}\n#work{border:2px solid #111;padding:8px 12px 10px;overflow:auto;font-size:14px;line-height:1.55;box-sizing:border-box}\n#work .wt{font:700 12px \"IBM Plex Mono\",monospace;text-transform:uppercase;margin:0 0 4px;display:flex;justify-content:space-between}\n#work .wt .hint{text-transform:none}\n#work h4{margin:9px 0 1px;font-size:13px;font-weight:700;color:#4a4a4a}\n#work h4:first-of-type{margin-top:2px}\n#work .eq{font-variant-numeric:tabular-nums}\n#work .n{font-family:\"IBM Plex Mono\",monospace;font-size:13px}\n#work b .n,#work .ans{font-weight:700}\n#work .note{font-size:12.5px;color:#4a4a4a;margin:2px 0 0}\n#work .ok{background:#e5f4ea;border-left:4px solid #1e7d45;padding:3px 8px;margin-top:4px}\n#work .bad{background:#fde7df;border-left:4px solid #c43a00;padding:3px 8px;margin-top:4px}\n.ivv{border-radius:2px;padding:0 2px;transition:background .25s}\n.ivv.gx{background:#ffe2d3}\n.ivv.hot{background:#ff6a2b;color:#fff}\n#ctl{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;align-content:start}\n.iv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:6px}\n.iv .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.iv .val{font:700 13px \"IBM Plex Mono\",monospace;white-space:nowrap}\n.iv input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:#111;height:22px}\n.iv input[type=radio]{accent-color:#ff6a2b;margin:0}\n#presets{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}\n#presets .lab{font:700 12px \"IBM Plex Mono\",monospace}\n#presets button{font:600 12.5px \"Space Grotesk\",sans-serif;padding:3px 8px;border:2px solid #111;background:#fff;cursor:pointer}\n#presets button:hover{background:#ffe2d3}\n#gcard{border:2px solid #111;padding:5px 8px 6px;display:flex;flex-direction:column;box-sizing:border-box;min-height:0}\n.ghead{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}\n.ghead select{font:600 13px \"Space Grotesk\",sans-serif;border:2px solid #111;padding:1px 4px;max-width:200px}\n#gv{width:340px;height:150px;flex:none;display:block;margin-top:3px}\n#dbl{font-size:12.5px;line-height:1.35;margin-top:2px}\n#dbl b{font-weight:700}\n.hint{font:500 11px \"IBM Plex Mono\",monospace;color:#4a4a4a}\n<\/style><\/head><body>\n<div id=\"app\">\n  <div id=\"bar\"><\/div>\n  <canvas id=\"cv\" width=\"1200\" height=\"660\" aria-label=\"Animation of the situation with force arrows\"><\/canvas>\n  <div id=\"work\" aria-live=\"polite\"><\/div>\n  <div id=\"ctl\"><\/div>\n  <div id=\"gcard\">\n    <div class=\"ghead\"><span>Graph<\/span><select id=\"dvsel\" aria-label=\"Quantity to graph\"><\/select><span>vs <b id=\"ivname\"><\/b><\/span><\/div>\n    <canvas id=\"gv\" width=\"680\" height=\"300\" aria-label=\"Graph of the chosen quantity against the chosen variable\"><\/canvas>\n    <div id=\"dbl\"><\/div>\n  <\/div>\n<\/div>\n<script>\n// ---------------- shared frame ----------------\nconst $ = id => document.getElementById(id);\nconst G10 = 10, PI = Math.PI, DEG = PI / 180;\nfunction fit(){ const s = Math.min(innerWidth / 1000, innerHeight / 640); $('app').style.transform = 'scale(' + s + ')'; }\naddEventListener('resize', fit); fit();\n\nfunction fnum(x){ const r = fnum0(x); return typeof r === 'string' ? r.replace(/^-/, '−') : r; }\nfunction fnum0(x){\n  if (x === null || x === undefined || !isFinite(x)) return '—';\n  const a = Math.abs(x);\n  if (a === 0) return '0';\n  if (a >= 1e5 || a < 1e-3){\n    const e = Math.floor(Math.log10(a)); let m = x / Math.pow(10, e);\n    let ms = m.toFixed(2); if (Math.abs(+ms) >= 10){ m /= 10; ms = m.toFixed(2); return ms + '×10<sup>' + (e + 1) + '<\/sup>'; }\n    return ms + '×10<sup>' + e + '<\/sup>';\n  }\n  if (a >= 1000) return String(Math.round(x));\n  return x.toPrecision(3);\n}\nfunction fplain(x){ return fnum(x).replace(/<sup>(.*?)<\\/sup>/g, (m, e) => '^' + e).replace('×10^', 'e'); }\nconst H = {\n  n: (x, u) => '<span class=\"n\">' + fnum(x) + (u ? '&nbsp;' + u : '') + '<\/span>',\n  iv: id => { const d = S.def[id]; const val = S.v[id]; const txt = (d.show ? d.show(val) : fnum(val) + (d.unit ? '&nbsp;' + d.unit : ''));\n              return '<span class=\"ivv n' + (S.gx === id ? ' gx' : '') + (S.hot === id ? ' hot' : '') + '\" data-iv=\"' + id + '\">' + txt + '<\/span>'; },\n  g: () => '<span class=\"n\">10&nbsp;m/s²<\/span>',\n  p: (x, u) => x < 0 ? '(' + H.n(x, u) + ')' : H.n(x, u)\n};\n\nconst S = { mode: null, opt: {}, v: {}, store: {}, def: {}, ivs: [], gx: null, dv: null, hot: null, t: 0, anim: {} };\n\nfunction bar(){\n  const b = $('bar'); b.innerHTML = '';\n  const group = (label, items, cur, onpick) => {\n    const g = document.createElement('div'); g.className = 'seg'; g.setAttribute('role', 'group');\n    if (label){ const l = document.createElement('span'); l.className = 'lab'; l.textContent = label; g.appendChild(l); }\n    items.forEach(([id, txt]) => { const bt = document.createElement('button'); bt.textContent = txt; bt.setAttribute('aria-pressed', String(id === cur)); bt.onclick = () => onpick(id); g.appendChild(bt); });\n    b.appendChild(g);\n  };\n  const tip = document.createElement('span'); tip.className = 'hint'; tip.style.marginLeft = 'auto'; tip.style.whiteSpace = 'nowrap'; tip.innerHTML = '● = the variable on the graph’s x-axis · drag any slider';\n  if (SIM.modes) group(null, SIM.modes.map(m => [m.id, m.label]), S.mode, id => { S.mode = id; S.anim = {}; setup(); });\n  (SIM.opts || []).filter(o => !o.modes || o.modes.includes(S.mode)).forEach(o => {\n    if (!(o.id in S.opt)) S.opt[o.id] = o.choices[0][0];\n    group(o.label, o.choices, S.opt[o.id], id => { S.opt[o.id] = id; S.anim = {}; setup(); });\n  });\n  b.appendChild(tip);\n  if (b.scrollWidth > b.clientWidth + 1) tip.remove();\n  if (b.scrollWidth > b.clientWidth + 1) b.querySelectorAll('.seg button').forEach(x => { x.style.fontSize = '13px'; x.style.padding = '6px 8px'; });\n}\n\nfunction setup(){\n  bar();\n  S.ivs = SIM.ivs(S.mode, S.opt); S.def = {}; S.v = {};\n  S.ivs.forEach(d => { S.def[d.id] = d; const k = S.mode + ':' + d.id; S.v[d.id] = (k in S.store) ? S.store[k] : d.val; });\n  if (!S.gx || !S.def[S.gx]) S.gx = S.ivs.find(d => d.graph) ? S.ivs.find(d => d.graph).id : S.ivs[1] ? S.ivs[1].id : S.ivs[0].id;\n  const c = $('ctl'); c.innerHTML = '';\n  S.ivs.forEach(d => {\n    const w = document.createElement('div'); w.className = 'iv';\n    w.innerHTML = '<input type=\"radio\" name=\"gx\" value=\"' + d.id + '\" aria-label=\"Graph against ' + d.label + '\" title=\"Put this on the graph’s x-axis\"' + (S.gx === d.id ? ' checked' : '') + '>' +\n      '<span class=\"nm\">' + d.label + ' <i>' + d.sym + '<\/i><\/span><span class=\"val\" id=\"val-' + d.id + '\"><\/span>' +\n      '<input type=\"range\" id=\"r-' + d.id + '\" min=\"' + d.min + '\" max=\"' + d.max + '\" step=\"' + d.step + '\" value=\"' + S.v[d.id] + '\" aria-label=\"' + d.label + '\">';\n    c.appendChild(w);\n    const r = w.querySelector('input[type=range]');\n    r.oninput = () => { S.v[d.id] = +r.value; S.store[S.mode + ':' + d.id] = +r.value; S.hot = d.id; clearTimeout(S.hotT); S.hotT = setTimeout(() => { S.hot = null; update(); }, 700); S.anim.reset = true; update(); };\n    w.querySelector('input[type=radio]').onchange = () => { S.gx = d.id; update(); };\n  });\n  if (SIM.presets){\n    const p = document.createElement('div'); p.id = 'presets'; p.innerHTML = '<span class=\"lab\">Try:<\/span>';\n    SIM.presets.forEach(ps => { const bt = document.createElement('button'); bt.textContent = ps.label; bt.onclick = () => { if (ps.mode && ps.mode !== S.mode){ S.mode = ps.mode; } Object.entries(ps.v).forEach(([k, val]) => S.store[(ps.mode || S.mode) + ':' + k] = val); S.anim = {}; setup(); }; p.appendChild(bt); });\n    c.appendChild(p);\n  }\n  const dvs = SIM.dvs(S.mode, S.opt), sel = $('dvsel');\n  if (!S.dv || !dvs.find(d => d.id === S.dv)) S.dv = dvs[0].id;\n  sel.innerHTML = dvs.map(d => '<option value=\"' + d.id + '\"' + (d.id === S.dv ? ' selected' : '') + '>' + d.name + '<\/option>').join('');\n  sel.onchange = () => { S.dv = sel.value; update(); };\n  update();\n}\n\nfunction calcWith(over){ const v = Object.assign({}, S.v, over || {}); return SIM.calc(v, S.mode, S.opt); }\n\nfunction update(){\n  S.ivs.forEach(d => { $('val-' + d.id).innerHTML = d.show ? d.show(S.v[d.id]) : fnum(S.v[d.id]) + (d.unit ? '&nbsp;' + d.unit : ''); });\n  S.d = calcWith();\n  $('work').innerHTML = '<div class=\"wt\"><span>Show the work<\/span><span class=\"hint\">' + (SIM.hint || 'g = 10 m/s²') + '<\/span><\/div>' + SIM.work(S.v, S.d, S.mode, S.opt);\n  document.querySelectorAll('input[name=gx]').forEach(r => r.checked = (r.value === S.gx));\n  graph();\n}\n\nfunction graph(){\n  const cv = $('gv'), g = cv.getContext('2d'), W = 340, Hh = 150; g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, W, Hh);\n  const dvs = SIM.dvs(S.mode, S.opt), dv = dvs.find(d => d.id === S.dv), ref = dv.vs ? dvs.find(d => d.id === dv.vs) : null;\n  const x = S.def[S.gx]; $('ivname').innerHTML = '<i>' + x.sym + '<\/i>' + (x.unit && !x.show ? ' (' + x.unit + ')' : '');\n  const N = 160, xs = [], ys = [], rs = [];\n  for (let i = 0; i <= N; i++){ const xv = x.min + (x.max - x.min) * i / N; const d = calcWith({ [S.gx]: xv }); xs.push(xv); ys.push(dv.f(d)); rs.push(ref ? ref.f(d) : null); }\n  const all = ys.concat(ref ? rs : []).filter(isFinite);\n  let ymin = Math.min(0, ...all), ymax = Math.max(...all, 0); if (ymax === ymin) ymax = ymin + 1; const pad = (ymax - ymin) * 0.08; ymax += pad; if (ymin < 0) ymin -= pad;\n  const L = 46, R = 8, T = 8, B = 22, X = v => L + (v - x.min) / (x.max - x.min) * (W - L - R), Y = v => T + (ymax - v) / (ymax - ymin) * (Hh - T - B);\n  g.strokeStyle = '#111'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(L, T); g.lineTo(L, Hh - B); g.lineTo(W - R, Hh - B); g.stroke();\n  if (ymin < 0){ g.strokeStyle = '#999'; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(W - R, Y(0)); g.stroke(); g.setLineDash([]);\n    if (dv.negNote){ g.fillStyle = 'rgba(196,58,0,0.08)'; g.fillRect(L, Y(0), W - R - L, Hh - B - Y(0)); g.fillStyle = '#c43a00'; g.font = '600 10px \"Space Grotesk\",sans-serif'; g.textAlign = 'left'; g.fillText(dv.negNote, L + 4, Hh - B - 4); } }\n  g.font = '500 10px \"IBM Plex Mono\",monospace'; g.fillStyle = '#4a4a4a'; g.textAlign = 'right';\n  g.fillText(fplain(ymax), L - 4, T + 8); g.fillText(fplain(ymin < 0 ? ymin : 0), L - 4, Hh - B); if (ymin < 0) g.fillText('0', L - 4, Y(0) + 3);\n  g.textAlign = 'center'; g.fillText(fplain(x.min), L, Hh - 8); g.fillText(fplain(x.max), W - R - 10, Hh - 8);\n  g.fillText((x.symText || x.id) + (x.unit ? ' (' + x.unit + ')' : ''), (L + W) / 2, Hh - 8);\n  g.save(); g.translate(10, (T + Hh - B) / 2); g.rotate(-PI / 2); g.textAlign = 'center'; g.fillText(dv.short + (dv.unit ? ' (' + dv.unit + ')' : ''), 0, 0); g.restore();\n  const line = (arr, col, dash) => { g.strokeStyle = col; g.lineWidth = 2.2; g.setLineDash(dash || []); g.beginPath(); let on = false; arr.forEach((y, i) => { if (!isFinite(y)){ on = false; return; } const px = X(xs[i]), py = Math.max(T - 4, Math.min(Hh - B + 4, Y(y))); on ? g.lineTo(px, py) : g.moveTo(px, py); on = true; }); g.stroke(); g.setLineDash([]); };\n  if (ref){ line(rs, '#4a4a4a', [5, 4]); g.fillStyle = '#4a4a4a'; g.textAlign = 'right'; g.font = '600 10px \"Space Grotesk\",sans-serif'; const lastY = rs.filter(isFinite).pop(); if (isFinite(lastY)) g.fillText(ref.short, W - R - 2, Math.max(T + 9, Y(lastY) - 4)); }\n  line(ys, '#1546d6');\n  const cx = S.v[S.gx], cy = dv.f(S.d);\n  if (isFinite(cy)){ g.strokeStyle = '#ff6a2b'; g.setLineDash([2, 3]); g.lineWidth = 1; g.beginPath(); g.moveTo(X(cx), Hh - B); g.lineTo(X(cx), Y(cy)); g.lineTo(L, Y(cy)); g.stroke(); g.setLineDash([]);\n    g.fillStyle = '#ff6a2b'; g.strokeStyle = '#111'; g.lineWidth = 1.5; g.beginPath(); g.arc(X(cx), Math.max(T, Math.min(Hh - B, Y(cy))), 4.5, 0, 7); g.fill(); g.stroke(); }\n  // doubling readout\n  const d2 = calcWith({ [S.gx]: cx * 2 }), y1 = dv.f(S.d), y2 = dv.f(d2);\n  let msg = '';\n  if (cx === 0 || Math.abs(y1) < 1e-12) msg = '<span class=\"hint\">Move off zero to see the ×2 test.<\/span>';\n  else if (!isFinite(y1) || !isFinite(y2)) msg = '<span class=\"hint\">The ×2 test doesn’t apply here (doubling takes it outside what this quantity covers).<\/span>';\n  else {\n    const k = y2 / y1;\n    if (k < 0){ $('dbl').innerHTML = 'If <b>' + x.sym + '<\/b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '<\/b> goes from ' + fnum(y1) + ' to ' + fnum(y2) + (dv.unit ? ' ' + dv.unit : '') + (dv.signOK ? ': it changes sign. ' + dv.signOK : ': it changes sign, so that can’t really happen.'); return; }\n    const tags = [[1, 'doesn’t depend on it'], [2, 'proportional'], [4, 'goes as the square'], [0.5, 'inversely proportional'], [0.25, 'inverse square'], [Math.SQRT2, 'goes as the square root'], [Math.SQRT1_2, 'goes as 1/√'], [8, 'goes as the cube'], [2 * Math.SQRT2, 'goes as the 3/2 power']];\n    const tag = tags.find(([v]) => Math.abs(k - v) < 0.004 * v);\n    msg = 'If <b>' + x.sym + '<\/b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '<\/b> becomes <b>×' + (Math.abs(k) >= 100 ? fnum(k) : k.toFixed(2)) + '<\/b>' + (tag && !dv.noTag ? ' — ' + tag[1] : '') + '.' + (dv.dblNote ? ' <span class=\"hint\">' + dv.dblNote + '<\/span>' : '');\n  }\n  $('dbl').innerHTML = msg;\n}\n\n// drawing helpers (canvas is drawn in 600×330 units)\nconst cv = $('cv'), ctx = cv.getContext('2d');\nfunction arrow(x1, y1, x2, y2, col, label, opts){\n  opts = opts || {}; const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy); if (len < 2) return;\n  const ux = dx / len, uy = dy / len, hw = opts.head || 9;\n  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = opts.w || 3.5; ctx.lineCap = 'round';\n  if (opts.dash) ctx.setLineDash(opts.dash);\n  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hw * 0.8, y2 - uy * hw * 0.8); ctx.stroke(); ctx.setLineDash([]);\n  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - ux * hw - uy * hw * 0.55, y2 - uy * hw + ux * hw * 0.55); ctx.lineTo(x2 - ux * hw + uy * hw * 0.55, y2 - uy * hw - ux * hw * 0.55); ctx.closePath(); ctx.fill();\n  if (label){ ctx.font = '700 13px \"Space Grotesk\",sans-serif'; ctx.textAlign = opts.align || 'left'; ctx.textBaseline = 'middle';\n    const lx = x2 + (opts.lx !== undefined ? opts.lx : (ux >= 0 ? 6 : -6)), ly = y2 + (opts.ly !== undefined ? opts.ly : (uy >= 0 ? 10 : -10));\n    if (opts.align === undefined) ctx.textAlign = ux >= -0.2 ? 'left' : 'right';\n    ctx.fillText(label, lx, ly); }\n  ctx.restore();\n}\nfunction text(s, x, y, o){ o = o || {}; ctx.save(); ctx.font = (o.font || '600 13px \"Space Grotesk\",sans-serif'); ctx.fillStyle = o.col || '#111'; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic'; ctx.fillText(s, x, y); ctx.restore(); }\nfunction panelTitle(s, x, y){ text(s, x, y, { font: '700 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); }\nconst COL = { F: '#c43a00', W: '#111', N: '#1e7d45', V: '#1546d6', T: '#7a3fb0', comp: '#8a8a8a' };\n\nlet last = 0;\nfunction loop(ts){ const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts; S.t += dt;\n  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, 600, 330);\n  SIM.draw(S.v, S.d, S.mode, S.opt, S.t, dt, S.anim); S.anim.reset = false;\n  requestAnimationFrame(loop); }\n\n// ---------------- this sim ----------------\n// Rolling Race: rolling objects split their kinetic energy between moving and spinning. v = √(2gh/(1+k)) with I = kMR².\nconst RSH = [['ball', 'Solid ball', 0.4, '#1546d6'], ['disk', 'Disk', 0.5, '#7a3fb0'], ['shell', 'Hollow ball', 2 / 3, '#1e7d45'], ['hoop', 'Hoop', 1, '#c43a00'], ['block', 'Sliding block (no friction)', 0, '#888']];\nconst SIM = {\n  title: 'Rolling Race',\n  modes: [{ id: 'down', label: 'Race down the ramp' }, { id: 'up', label: 'Roll up a hill' }],\n  opts: [{ id: 'shape', label: 'Show work for', choices: RSH.map(s => [s[0], s[1].replace(' (no friction)', '')]) }],\n  ivs(mode){\n    const l = mode === 'down' ? [{ id: 'h', sym: 'h', symText: 'h', label: 'Ramp height', unit: 'm', min: 0.2, max: 3, step: 0.05, val: 1, graph: true },\n      { id: 'th', sym: 'θ', symText: 'θ', label: 'Ramp angle', unit: '°', min: 5, max: 60, step: 1, val: 20, show: x => x.toFixed(0) + '°' }]\n      : [{ id: 'v0', sym: 'v<sub>0<\/sub>', symText: 'v0', label: 'Rolling speed at the bottom', unit: 'm/s', min: 0.5, max: 8, step: 0.1, val: 4, graph: true }];\n    l.push({ id: 'M', sym: 'M', symText: 'M', label: 'Mass', unit: 'kg', min: 0.2, max: 5, step: 0.1, val: 1 }, { id: 'R', sym: 'R', symText: 'R', label: 'Radius', unit: 'm', min: 0.02, max: 0.3, step: 0.01, val: 0.1 });\n    return l;\n  },\n  calc(v, mode, opt){\n    const s = RSH.find(x => x[0] === (opt.shape || 'ball')), k = s[2];\n    if (mode === 'down'){ const L = v.h / Math.sin(v.th * DEG), aOf = kk => G10 * Math.sin(v.th * DEG) / (1 + kk), vOf = kk => Math.sqrt(2 * G10 * v.h / (1 + kk)), tOf = kk => Math.sqrt(2 * L / aOf(kk));\n      const vb = vOf(k), E = v.M * G10 * v.h, Kt = 0.5 * v.M * vb * vb, Kr = E - Kt;\n      return { s, k, L, vb, a: aOf(k), t: tOf(k), E, Kt, Kr, w: vb / v.R, times: RSH.map(x => tOf(x[2])), aOf, tOf }; }\n    const E = 0.5 * v.M * v.v0 * v.v0 * (1 + k), hmax = E / (v.M * G10), Kt = 0.5 * v.M * v.v0 * v.v0, Kr = E - Kt;\n    return { s, k, E, hmax, Kt, Kr, w: v.v0 / v.R, heights: RSH.map(x => v.v0 * v.v0 * (1 + x[2]) / (2 * G10)) };\n  },\n  dvs(mode){\n    if (mode === 'down') return [{ id: 'vb', name: 'Speed at the bottom', short: 'v', sym: 'v', unit: 'm/s', f: d => d.vb }, { id: 't', name: 'Time to the bottom', short: 't', sym: 't', unit: 's', f: d => d.t }, { id: 'Kr', name: 'Rotational KE at the bottom', short: 'K_rot', sym: 'K<sub>rot<\/sub>', unit: 'J', f: d => d.Kr }];\n    return [{ id: 'hmax', name: 'Height it rolls up to', short: 'h', sym: 'h<sub>max<\/sub>', unit: 'm', f: d => d.hmax }, { id: 'Kr', name: 'Rotational KE at the bottom', short: 'K_rot', sym: 'K<sub>rot<\/sub>', unit: 'J', f: d => d.Kr }];\n  },\n  work(v, d, mode, opt){\n    const nm = d.s[1].replace(' (no friction)', ''), kS = d.k === 0 ? '0 (it doesn’t spin)' : d.s[0] === 'ball' ? '⅖' : d.s[0] === 'disk' ? '½' : d.s[0] === 'shell' ? '⅔' : '1';\n    const h0 = '<h4>1 · Rolling without slipping: v = Rω<\/h4><div class=\"eq\">' + nm + ': I = kMR² with k = ' + kS + '<\/div>' +\n      '<div class=\"eq\">K = ½Mv² + ½Iω² = ½Mv² + ½(kMR²)(v/R)² = ½Mv²(1 + k)<\/div><p class=\"note\">The R’s cancel! Static friction makes it spin but does no work (the contact point doesn’t slide), so energy is conserved.<\/p>';\n    if (mode === 'down') return h0 + '<h4>2 · Energy: Mgh = ½Mv²(1 + k)<\/h4><div class=\"eq\">v = √(2gh/(1 + k)) = √(2(10)(' + H.iv('h') + ')/' + H.n(1 + d.k) + ') = <b>' + H.n(d.vb, 'm/s') + '<\/b>. M and R both cancel.<\/div>' +\n      '<h4>3 · Where the energy went<\/h4><div class=\"eq\">Mgh = ' + H.n(d.E, 'J') + ' → moving ½Mv² = ' + H.n(d.Kt, 'J') + ' + spinning ½Iω² = ' + H.n(d.Kr, 'J') + ' (' + H.n(100 * d.k / (1 + d.k)) + '% spinning)<\/div>' +\n      '<h4>4 · Who wins?<\/h4><div class=\"eq\">Smaller k → less energy tied up in spinning → faster. Order: block (if frictionless), solid ball, disk, hollow ball, hoop. Time for this one: ' + H.n(d.t, 's') + '.<\/div>' +\n      '<p class=\"note\">A heavy hoop and a light hoop tie. A big ball and a small ball tie. Only the shape (k) matters.<\/p>';\n    return h0 + '<h4>2 · Rolling up: all the KE turns into Mgh<\/h4><div class=\"eq\">½Mv<sub>0<\/sub>²(1 + k) = Mgh → h = (1 + k)v<sub>0<\/sub>²/2g = (' + H.n(1 + d.k) + ')(' + H.iv('v0') + ')² / 20 = <b>' + H.n(d.hmax, 'm') + '<\/b><\/div>' +\n      '<p class=\"note\">The hoop goes highest: it carries the most spinning energy, and that’s turned into height too. The sliding block (no spin) only reaches v<sub>0<\/sub>²/2g = ' + H.n(v.v0 * v.v0 / 20, 'm') + '.<\/p>' +\n      '<div class=\"eq\">Energy at the bottom: moving ' + H.n(d.Kt, 'J') + ' + spinning ' + H.n(d.Kr, 'J') + ' = ' + H.n(d.E, 'J') + '<\/div>';\n  },\n  draw(v, d, mode, opt, t, dt, A){\n    if (A.t === undefined || A.reset) A.t = 0; A.t += dt;\n    const sel = opt.shape || 'ball';\n    if (mode === 'down'){\n      panelTitle('FIVE RAMPS, SAME HEIGHT, RELEASED TOGETHER', 10, 18);\n      const tmax = Math.max(...d.times), tt = Math.min(A.t % (tmax + 1.5), tmax), lane = 52;\n      RSH.forEach((s, i) => { const y0 = 40 + i * lane, x0 = 20, x1 = 360, k = s[2], frac = Math.min(1, 0.5 * d.aOf(k) * tt * tt / d.L);\n        ctx.strokeStyle = '#bbb'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0, y0 + 6); ctx.lineTo(x1, y0 + 36); ctx.stroke();\n        const x = x0 + (x1 - x0) * frac, y = y0 + 6 + 30 * frac, r = 9;\n        if (k === 0){ ctx.fillStyle = s[3]; ctx.fillRect(x - 9, y - 14, 18, 14); }\n        else { const rot = frac * (x1 - x0) / r; ctx.fillStyle = s[0] === 'hoop' ? '#fff' : s[3]; ctx.strokeStyle = s[3]; ctx.lineWidth = s[0] === 'hoop' ? 4 : 1; ctx.beginPath(); ctx.arc(x, y - r, r, 0, 7); ctx.fill(); ctx.stroke(); ctx.strokeStyle = '#fff'; if (s[0] === 'hoop') ctx.strokeStyle = s[3]; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r * Math.cos(rot), y - r + r * Math.sin(rot)); ctx.stroke(); }\n        text(s[1] + (frac >= 1 ? '  ✓ ' + fplain(d.times[i]) + ' s' : ''), x0, y0 + 2, { font: (s[0] === sel ? '700 ' : '500 ') + '10px \"Space Grotesk\",sans-serif', col: s[0] === sel ? '#111' : '#666' }); });\n      text('t = ' + fplain(tt) + ' s   (ramp drawn the same; real angle ' + fplain(v.th) + '°)', 12, 318, { font: '600 10px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n    } else {\n      panelTitle('ROLLING UP A HILL FROM ' + fplain(v.v0) + ' m/s', 10, 18);\n      const hm = Math.max(...d.heights), sc = 220 / hm, gy = 290;\n      RSH.forEach((s, i) => { const x = 40 + i * 68, hh = d.heights[i];\n        ctx.fillStyle = '#eee'; ctx.fillRect(x - 20, gy - 230, 40, 230); ctx.fillStyle = s[3]; ctx.globalAlpha = s[0] === sel ? 1 : 0.55; ctx.fillRect(x - 20, gy - hh * sc, 40, hh * sc); ctx.globalAlpha = 1;\n        text(fplain(hh) + ' m', x, gy - hh * sc - 5, { align: 'center', font: '600 10px \"IBM Plex Mono\",monospace' });\n        text(s[1].split(' (')[0], x, gy + 14, { align: 'center', font: (s[0] === sel ? '700 ' : '500 ') + '9px \"Space Grotesk\",sans-serif' }); });\n      text('height reached', 12, 318, { font: '600 10px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n    }\n    panelTitle('ENERGY SPLIT: ' + d.s[1].split(' (')[0].toUpperCase(), 395, 18);\n    const fr = d.k / (1 + d.k), bw = 180;\n    ctx.fillStyle = '#ff6a2b'; ctx.fillRect(400, 50, bw * (1 - fr), 24); ctx.fillStyle = '#7a3fb0'; ctx.fillRect(400 + bw * (1 - fr), 50, bw * fr, 24);\n    text('moving ' + fplain(100 * (1 - fr)) + '%', 400, 92, { font: '600 10px \"IBM Plex Mono\",monospace', col: '#ff6a2b' }); text('spinning ' + fplain(100 * fr) + '%', 580, 92, { align: 'right', font: '600 10px \"IBM Plex Mono\",monospace', col: '#7a3fb0' });\n    text(mode === 'down' ? 'v at the bottom = ' + fplain(d.vb) + ' m/s' : 'h = ' + fplain(d.hmax) + ' m', 400, 125, { font: '700 13px \"Space Grotesk\",sans-serif' });\n    text('ω = v/R = ' + fplain(d.w) + ' rad/s', 400, 145, { font: '600 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n    text('M and R cancel: shape matters', 400, 175, { font: '600 10px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n  }\n};\n\n\nS.mode = SIM.modes ? SIM.modes[0].id : 'one';\nsetup(); requestAnimationFrame(loop);\nwindow.APP = { select(name){ const m = (SIM.modes || []).find(m => m.label === name || m.id === name); if (m && m.id !== S.mode){ S.mode = m.id; S.anim = {}; setup(); } } };\naddEventListener('message', e => { const d = e.data; if (d && d.select) try { APP.select(d.select); } catch (er) {} });\n<\/script>\n<\/body><\/html>\n"},
"angmom":{ar:"1000 / 640",html:"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Angular Momentum<\/title>\n<\!-- Angular Momentum: original Holmes Sims, built from frame.html + angmom.js. g = 10 m/s². -->\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap\">\n<style>\nhtml,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:\"Space Grotesk\",system-ui,sans-serif;color:#111}\n#app{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0;padding:10px 14px 12px;box-sizing:border-box;\n  display:grid;grid-template-columns:600px 1fr;grid-template-rows:34px 330px 1fr;gap:10px 14px}\n#bar{grid-column:1/-1;display:flex;gap:16px;align-items:center;flex-wrap:nowrap;overflow:hidden}\n.seg{display:flex;align-items:center}\n.seg .lab{font:700 12px \"IBM Plex Mono\",monospace;margin-right:8px;text-transform:uppercase}\n.seg button{white-space:nowrap;font:700 14px \"Space Grotesk\",sans-serif;padding:6px 11px;border:2px solid #111;background:#fff;color:#111;cursor:pointer}\n.seg button+button{margin-left:-2px}\n.seg button[aria-pressed=\"true\"]{background:#111;color:#fff}\n.seg button:hover:not([aria-pressed=\"true\"]){background:#ffe2d3}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ff6a2b;outline-offset:2px;position:relative;z-index:1}\n#cv{border:2px solid #111;background:#fbfbfb;width:600px;height:330px;box-sizing:border-box;display:block}\n#work{border:2px solid #111;padding:8px 12px 10px;overflow:auto;font-size:14px;line-height:1.55;box-sizing:border-box}\n#work .wt{font:700 12px \"IBM Plex Mono\",monospace;text-transform:uppercase;margin:0 0 4px;display:flex;justify-content:space-between}\n#work .wt .hint{text-transform:none}\n#work h4{margin:9px 0 1px;font-size:13px;font-weight:700;color:#4a4a4a}\n#work h4:first-of-type{margin-top:2px}\n#work .eq{font-variant-numeric:tabular-nums}\n#work .n{font-family:\"IBM Plex Mono\",monospace;font-size:13px}\n#work b .n,#work .ans{font-weight:700}\n#work .note{font-size:12.5px;color:#4a4a4a;margin:2px 0 0}\n#work .ok{background:#e5f4ea;border-left:4px solid #1e7d45;padding:3px 8px;margin-top:4px}\n#work .bad{background:#fde7df;border-left:4px solid #c43a00;padding:3px 8px;margin-top:4px}\n.ivv{border-radius:2px;padding:0 2px;transition:background .25s}\n.ivv.gx{background:#ffe2d3}\n.ivv.hot{background:#ff6a2b;color:#fff}\n#ctl{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;align-content:start}\n.iv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:6px}\n.iv .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.iv .val{font:700 13px \"IBM Plex Mono\",monospace;white-space:nowrap}\n.iv input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:#111;height:22px}\n.iv input[type=radio]{accent-color:#ff6a2b;margin:0}\n#presets{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}\n#presets .lab{font:700 12px \"IBM Plex Mono\",monospace}\n#presets button{font:600 12.5px \"Space Grotesk\",sans-serif;padding:3px 8px;border:2px solid #111;background:#fff;cursor:pointer}\n#presets button:hover{background:#ffe2d3}\n#gcard{border:2px solid #111;padding:5px 8px 6px;display:flex;flex-direction:column;box-sizing:border-box;min-height:0}\n.ghead{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}\n.ghead select{font:600 13px \"Space Grotesk\",sans-serif;border:2px solid #111;padding:1px 4px;max-width:200px}\n#gv{width:340px;height:150px;flex:none;display:block;margin-top:3px}\n#dbl{font-size:12.5px;line-height:1.35;margin-top:2px}\n#dbl b{font-weight:700}\n.hint{font:500 11px \"IBM Plex Mono\",monospace;color:#4a4a4a}\n<\/style><\/head><body>\n<div id=\"app\">\n  <div id=\"bar\"><\/div>\n  <canvas id=\"cv\" width=\"1200\" height=\"660\" aria-label=\"Animation of the situation with force arrows\"><\/canvas>\n  <div id=\"work\" aria-live=\"polite\"><\/div>\n  <div id=\"ctl\"><\/div>\n  <div id=\"gcard\">\n    <div class=\"ghead\"><span>Graph<\/span><select id=\"dvsel\" aria-label=\"Quantity to graph\"><\/select><span>vs <b id=\"ivname\"><\/b><\/span><\/div>\n    <canvas id=\"gv\" width=\"680\" height=\"300\" aria-label=\"Graph of the chosen quantity against the chosen variable\"><\/canvas>\n    <div id=\"dbl\"><\/div>\n  <\/div>\n<\/div>\n<script>\n// ---------------- shared frame ----------------\nconst $ = id => document.getElementById(id);\nconst G10 = 10, PI = Math.PI, DEG = PI / 180;\nfunction fit(){ const s = Math.min(innerWidth / 1000, innerHeight / 640); $('app').style.transform = 'scale(' + s + ')'; }\naddEventListener('resize', fit); fit();\n\nfunction fnum(x){ const r = fnum0(x); return typeof r === 'string' ? r.replace(/^-/, '−') : r; }\nfunction fnum0(x){\n  if (x === null || x === undefined || !isFinite(x)) return '—';\n  const a = Math.abs(x);\n  if (a === 0) return '0';\n  if (a >= 1e5 || a < 1e-3){\n    const e = Math.floor(Math.log10(a)); let m = x / Math.pow(10, e);\n    let ms = m.toFixed(2); if (Math.abs(+ms) >= 10){ m /= 10; ms = m.toFixed(2); return ms + '×10<sup>' + (e + 1) + '<\/sup>'; }\n    return ms + '×10<sup>' + e + '<\/sup>';\n  }\n  if (a >= 1000) return String(Math.round(x));\n  return x.toPrecision(3);\n}\nfunction fplain(x){ return fnum(x).replace(/<sup>(.*?)<\\/sup>/g, (m, e) => '^' + e).replace('×10^', 'e'); }\nconst H = {\n  n: (x, u) => '<span class=\"n\">' + fnum(x) + (u ? '&nbsp;' + u : '') + '<\/span>',\n  iv: id => { const d = S.def[id]; const val = S.v[id]; const txt = (d.show ? d.show(val) : fnum(val) + (d.unit ? '&nbsp;' + d.unit : ''));\n              return '<span class=\"ivv n' + (S.gx === id ? ' gx' : '') + (S.hot === id ? ' hot' : '') + '\" data-iv=\"' + id + '\">' + txt + '<\/span>'; },\n  g: () => '<span class=\"n\">10&nbsp;m/s²<\/span>',\n  p: (x, u) => x < 0 ? '(' + H.n(x, u) + ')' : H.n(x, u)\n};\n\nconst S = { mode: null, opt: {}, v: {}, store: {}, def: {}, ivs: [], gx: null, dv: null, hot: null, t: 0, anim: {} };\n\nfunction bar(){\n  const b = $('bar'); b.innerHTML = '';\n  const group = (label, items, cur, onpick) => {\n    const g = document.createElement('div'); g.className = 'seg'; g.setAttribute('role', 'group');\n    if (label){ const l = document.createElement('span'); l.className = 'lab'; l.textContent = label; g.appendChild(l); }\n    items.forEach(([id, txt]) => { const bt = document.createElement('button'); bt.textContent = txt; bt.setAttribute('aria-pressed', String(id === cur)); bt.onclick = () => onpick(id); g.appendChild(bt); });\n    b.appendChild(g);\n  };\n  const tip = document.createElement('span'); tip.className = 'hint'; tip.style.marginLeft = 'auto'; tip.style.whiteSpace = 'nowrap'; tip.innerHTML = '● = the variable on the graph’s x-axis · drag any slider';\n  if (SIM.modes) group(null, SIM.modes.map(m => [m.id, m.label]), S.mode, id => { S.mode = id; S.anim = {}; setup(); });\n  (SIM.opts || []).filter(o => !o.modes || o.modes.includes(S.mode)).forEach(o => {\n    if (!(o.id in S.opt)) S.opt[o.id] = o.choices[0][0];\n    group(o.label, o.choices, S.opt[o.id], id => { S.opt[o.id] = id; S.anim = {}; setup(); });\n  });\n  b.appendChild(tip);\n  if (b.scrollWidth > b.clientWidth + 1) tip.remove();\n  if (b.scrollWidth > b.clientWidth + 1) b.querySelectorAll('.seg button').forEach(x => { x.style.fontSize = '13px'; x.style.padding = '6px 8px'; });\n}\n\nfunction setup(){\n  bar();\n  S.ivs = SIM.ivs(S.mode, S.opt); S.def = {}; S.v = {};\n  S.ivs.forEach(d => { S.def[d.id] = d; const k = S.mode + ':' + d.id; S.v[d.id] = (k in S.store) ? S.store[k] : d.val; });\n  if (!S.gx || !S.def[S.gx]) S.gx = S.ivs.find(d => d.graph) ? S.ivs.find(d => d.graph).id : S.ivs[1] ? S.ivs[1].id : S.ivs[0].id;\n  const c = $('ctl'); c.innerHTML = '';\n  S.ivs.forEach(d => {\n    const w = document.createElement('div'); w.className = 'iv';\n    w.innerHTML = '<input type=\"radio\" name=\"gx\" value=\"' + d.id + '\" aria-label=\"Graph against ' + d.label + '\" title=\"Put this on the graph’s x-axis\"' + (S.gx === d.id ? ' checked' : '') + '>' +\n      '<span class=\"nm\">' + d.label + ' <i>' + d.sym + '<\/i><\/span><span class=\"val\" id=\"val-' + d.id + '\"><\/span>' +\n      '<input type=\"range\" id=\"r-' + d.id + '\" min=\"' + d.min + '\" max=\"' + d.max + '\" step=\"' + d.step + '\" value=\"' + S.v[d.id] + '\" aria-label=\"' + d.label + '\">';\n    c.appendChild(w);\n    const r = w.querySelector('input[type=range]');\n    r.oninput = () => { S.v[d.id] = +r.value; S.store[S.mode + ':' + d.id] = +r.value; S.hot = d.id; clearTimeout(S.hotT); S.hotT = setTimeout(() => { S.hot = null; update(); }, 700); S.anim.reset = true; update(); };\n    w.querySelector('input[type=radio]').onchange = () => { S.gx = d.id; update(); };\n  });\n  if (SIM.presets){\n    const p = document.createElement('div'); p.id = 'presets'; p.innerHTML = '<span class=\"lab\">Try:<\/span>';\n    SIM.presets.forEach(ps => { const bt = document.createElement('button'); bt.textContent = ps.label; bt.onclick = () => { if (ps.mode && ps.mode !== S.mode){ S.mode = ps.mode; } Object.entries(ps.v).forEach(([k, val]) => S.store[(ps.mode || S.mode) + ':' + k] = val); S.anim = {}; setup(); }; p.appendChild(bt); });\n    c.appendChild(p);\n  }\n  const dvs = SIM.dvs(S.mode, S.opt), sel = $('dvsel');\n  if (!S.dv || !dvs.find(d => d.id === S.dv)) S.dv = dvs[0].id;\n  sel.innerHTML = dvs.map(d => '<option value=\"' + d.id + '\"' + (d.id === S.dv ? ' selected' : '') + '>' + d.name + '<\/option>').join('');\n  sel.onchange = () => { S.dv = sel.value; update(); };\n  update();\n}\n\nfunction calcWith(over){ const v = Object.assign({}, S.v, over || {}); return SIM.calc(v, S.mode, S.opt); }\n\nfunction update(){\n  S.ivs.forEach(d => { $('val-' + d.id).innerHTML = d.show ? d.show(S.v[d.id]) : fnum(S.v[d.id]) + (d.unit ? '&nbsp;' + d.unit : ''); });\n  S.d = calcWith();\n  $('work').innerHTML = '<div class=\"wt\"><span>Show the work<\/span><span class=\"hint\">' + (SIM.hint || 'g = 10 m/s²') + '<\/span><\/div>' + SIM.work(S.v, S.d, S.mode, S.opt);\n  document.querySelectorAll('input[name=gx]').forEach(r => r.checked = (r.value === S.gx));\n  graph();\n}\n\nfunction graph(){\n  const cv = $('gv'), g = cv.getContext('2d'), W = 340, Hh = 150; g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, W, Hh);\n  const dvs = SIM.dvs(S.mode, S.opt), dv = dvs.find(d => d.id === S.dv), ref = dv.vs ? dvs.find(d => d.id === dv.vs) : null;\n  const x = S.def[S.gx]; $('ivname').innerHTML = '<i>' + x.sym + '<\/i>' + (x.unit && !x.show ? ' (' + x.unit + ')' : '');\n  const N = 160, xs = [], ys = [], rs = [];\n  for (let i = 0; i <= N; i++){ const xv = x.min + (x.max - x.min) * i / N; const d = calcWith({ [S.gx]: xv }); xs.push(xv); ys.push(dv.f(d)); rs.push(ref ? ref.f(d) : null); }\n  const all = ys.concat(ref ? rs : []).filter(isFinite);\n  let ymin = Math.min(0, ...all), ymax = Math.max(...all, 0); if (ymax === ymin) ymax = ymin + 1; const pad = (ymax - ymin) * 0.08; ymax += pad; if (ymin < 0) ymin -= pad;\n  const L = 46, R = 8, T = 8, B = 22, X = v => L + (v - x.min) / (x.max - x.min) * (W - L - R), Y = v => T + (ymax - v) / (ymax - ymin) * (Hh - T - B);\n  g.strokeStyle = '#111'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(L, T); g.lineTo(L, Hh - B); g.lineTo(W - R, Hh - B); g.stroke();\n  if (ymin < 0){ g.strokeStyle = '#999'; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(W - R, Y(0)); g.stroke(); g.setLineDash([]);\n    if (dv.negNote){ g.fillStyle = 'rgba(196,58,0,0.08)'; g.fillRect(L, Y(0), W - R - L, Hh - B - Y(0)); g.fillStyle = '#c43a00'; g.font = '600 10px \"Space Grotesk\",sans-serif'; g.textAlign = 'left'; g.fillText(dv.negNote, L + 4, Hh - B - 4); } }\n  g.font = '500 10px \"IBM Plex Mono\",monospace'; g.fillStyle = '#4a4a4a'; g.textAlign = 'right';\n  g.fillText(fplain(ymax), L - 4, T + 8); g.fillText(fplain(ymin < 0 ? ymin : 0), L - 4, Hh - B); if (ymin < 0) g.fillText('0', L - 4, Y(0) + 3);\n  g.textAlign = 'center'; g.fillText(fplain(x.min), L, Hh - 8); g.fillText(fplain(x.max), W - R - 10, Hh - 8);\n  g.fillText((x.symText || x.id) + (x.unit ? ' (' + x.unit + ')' : ''), (L + W) / 2, Hh - 8);\n  g.save(); g.translate(10, (T + Hh - B) / 2); g.rotate(-PI / 2); g.textAlign = 'center'; g.fillText(dv.short + (dv.unit ? ' (' + dv.unit + ')' : ''), 0, 0); g.restore();\n  const line = (arr, col, dash) => { g.strokeStyle = col; g.lineWidth = 2.2; g.setLineDash(dash || []); g.beginPath(); let on = false; arr.forEach((y, i) => { if (!isFinite(y)){ on = false; return; } const px = X(xs[i]), py = Math.max(T - 4, Math.min(Hh - B + 4, Y(y))); on ? g.lineTo(px, py) : g.moveTo(px, py); on = true; }); g.stroke(); g.setLineDash([]); };\n  if (ref){ line(rs, '#4a4a4a', [5, 4]); g.fillStyle = '#4a4a4a'; g.textAlign = 'right'; g.font = '600 10px \"Space Grotesk\",sans-serif'; const lastY = rs.filter(isFinite).pop(); if (isFinite(lastY)) g.fillText(ref.short, W - R - 2, Math.max(T + 9, Y(lastY) - 4)); }\n  line(ys, '#1546d6');\n  const cx = S.v[S.gx], cy = dv.f(S.d);\n  if (isFinite(cy)){ g.strokeStyle = '#ff6a2b'; g.setLineDash([2, 3]); g.lineWidth = 1; g.beginPath(); g.moveTo(X(cx), Hh - B); g.lineTo(X(cx), Y(cy)); g.lineTo(L, Y(cy)); g.stroke(); g.setLineDash([]);\n    g.fillStyle = '#ff6a2b'; g.strokeStyle = '#111'; g.lineWidth = 1.5; g.beginPath(); g.arc(X(cx), Math.max(T, Math.min(Hh - B, Y(cy))), 4.5, 0, 7); g.fill(); g.stroke(); }\n  // doubling readout\n  const d2 = calcWith({ [S.gx]: cx * 2 }), y1 = dv.f(S.d), y2 = dv.f(d2);\n  let msg = '';\n  if (cx === 0 || Math.abs(y1) < 1e-12) msg = '<span class=\"hint\">Move off zero to see the ×2 test.<\/span>';\n  else if (!isFinite(y1) || !isFinite(y2)) msg = '<span class=\"hint\">The ×2 test doesn’t apply here (doubling takes it outside what this quantity covers).<\/span>';\n  else {\n    const k = y2 / y1;\n    if (k < 0){ $('dbl').innerHTML = 'If <b>' + x.sym + '<\/b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '<\/b> goes from ' + fnum(y1) + ' to ' + fnum(y2) + (dv.unit ? ' ' + dv.unit : '') + (dv.signOK ? ': it changes sign. ' + dv.signOK : ': it changes sign, so that can’t really happen.'); return; }\n    const tags = [[1, 'doesn’t depend on it'], [2, 'proportional'], [4, 'goes as the square'], [0.5, 'inversely proportional'], [0.25, 'inverse square'], [Math.SQRT2, 'goes as the square root'], [Math.SQRT1_2, 'goes as 1/√'], [8, 'goes as the cube'], [2 * Math.SQRT2, 'goes as the 3/2 power']];\n    const tag = tags.find(([v]) => Math.abs(k - v) < 0.004 * v);\n    msg = 'If <b>' + x.sym + '<\/b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '<\/b> becomes <b>×' + (Math.abs(k) >= 100 ? fnum(k) : k.toFixed(2)) + '<\/b>' + (tag && !dv.noTag ? ' — ' + tag[1] : '') + '.' + (dv.dblNote ? ' <span class=\"hint\">' + dv.dblNote + '<\/span>' : '');\n  }\n  $('dbl').innerHTML = msg;\n}\n\n// drawing helpers (canvas is drawn in 600×330 units)\nconst cv = $('cv'), ctx = cv.getContext('2d');\nfunction arrow(x1, y1, x2, y2, col, label, opts){\n  opts = opts || {}; const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy); if (len < 2) return;\n  const ux = dx / len, uy = dy / len, hw = opts.head || 9;\n  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = opts.w || 3.5; ctx.lineCap = 'round';\n  if (opts.dash) ctx.setLineDash(opts.dash);\n  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hw * 0.8, y2 - uy * hw * 0.8); ctx.stroke(); ctx.setLineDash([]);\n  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - ux * hw - uy * hw * 0.55, y2 - uy * hw + ux * hw * 0.55); ctx.lineTo(x2 - ux * hw + uy * hw * 0.55, y2 - uy * hw - ux * hw * 0.55); ctx.closePath(); ctx.fill();\n  if (label){ ctx.font = '700 13px \"     [...tabsEl.querySelectorAll('.tab')].forEach((b, j) => b.setAttribute('aria-selected', String(j === i)));
    $('simname').textContent = t.name;
    $('tasks').innerHTML = t.tasks.map(x => '<li>' + x + '</li>').join('');
    $('note').hidden = !t.note; $('note').innerHTML = t.note || '';
    const s = SIMS[t.sim];
    frame.style.aspectRatio = s.ar;
    if (ifrSim !== t.sim) {
      frame.innerHTML = '<div class="loading">Loading…</div>';
      ifr = document.createElement('iframe'); ifrSim = t.sim;
      ifr.title = t.name; ifr.setAttribute('allow', 'fullscreen'); ifr.setAttribute('allowfullscreen', '');
      ifr.addEventListener('load', () => { ifr.dataset.ready = '1'; const l = frame.querySelector('.loading'); if (l) l.remove(); select(); });
      ifr.srcdoc = s.html; frame.appendChild(ifr);
    } else select();
    if (user) { try { history.replaceState(null, '', '#' + slug(t.name)); } catch (e) {} }
  }
  function select() {
    const t = UNIT.tabs[cur];
    if (ifr && ifr.dataset.ready && t.select) ifr.contentWindow.postMessage({ select: t.select }, '*');
  }
  $('fs').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (frame.requestFullscreen) frame.requestFullscreen().catch(() => {});
  };
  if (!document.fullscreenEnabled) $('fs').hidden = true;
  document.addEventListener('fullscreenchange', () => { $('fs').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });
  const h = location.hash.slice(1); let start = UNIT.tabs.findIndex(t => slug(t.name) === h);
  show(start < 0 ? 0 : start, false);
  window.HOLMES = { show, unit: UNIT };
})();
</script>
