<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P1-08 Rotation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Holmes Sims, "Big Type" unit page. Same look on every unit: black ink, one orange accent, thick outlines. */
:root{
  --bg:#fafafa; --card:#ffffff; --ink:#111111; --muted:#4a4a4a; --hot:#ff6a2b; --soft:#ffe2d3; --rule:#111111;
  --f-display:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-display)}
.wrap{max-width:1240px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 36px max(16px,env(safe-area-inset-right,0px))}
.mono{font:700 .8rem var(--f-mono);letter-spacing:.02em}
.uhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:16px}
.uid{display:flex;align-items:flex-end;gap:16px;min-width:0}
.big{font-weight:700;font-size:clamp(64px,10vw,104px);line-height:.8;letter-spacing:-.04em}
.uhead h1{margin:0;font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1;letter-spacing:-.02em;text-wrap:balance}
.cta{display:inline-block;font-weight:700;text-decoration:none;color:var(--ink);padding:11px 16px;border:3px solid var(--ink);background:var(--hot);box-shadow:4px 4px 0 var(--ink)}
.cta:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding:0 6px 8px 0;scrollbar-width:thin}
.tab{all:unset;cursor:pointer;white-space:nowrap;padding:10px 14px;border:2px solid var(--ink);background:#fff;font-weight:700;font-size:15px}
.tab .code{font:700 12px var(--f-mono);margin-right:7px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);box-shadow:4px 4px 0 var(--hot)}
.tab:hover:not([aria-selected="true"]){background:var(--soft)}
.tabs .gap{flex:none;width:2px;background:var(--ink);margin:4px 4px}
.tab:focus-visible,.cta:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--hot);outline-offset:3px}
.main{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.simcard{flex:999 1 680px;min-width:0;border:3px solid var(--ink);background:var(--card);box-shadow:6px 6px 0 var(--ink)}
.simbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-bottom:3px solid var(--ink)}
.simbar h2{margin:0;font-size:18px;font-weight:700}
.simbar button{all:unset;cursor:pointer;font:700 13px var(--f-mono);padding:7px 11px;border:2px solid var(--ink);background:#fff}
.simbar button:hover{background:var(--soft)}
.frame{position:relative;width:100%;background:#fff}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.frame:fullscreen{aspect-ratio:auto!important;width:100vw;height:100vh;background:#fff}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:700 14px var(--f-mono);color:var(--muted)}
.try{flex:1 1 270px;border:3px solid var(--ink);background:var(--soft);padding:16px}
.try h2{margin:0 0 10px;font-weight:700;font-size:26px;letter-spacing:-.01em}
.try ol{margin:0;padding-left:1.3em;display:grid;gap:10px;font-size:15.5px;line-height:1.42}
.try .note{margin:14px 0 0;font-size:14px;line-height:1.4}
.try .plink{display:block;margin-top:16px;padding-top:12px;border-top:2px solid var(--ink);font-weight:700;text-decoration:none;color:var(--ink)}
.try .plink:hover{text-decoration:underline}
.credits{margin-top:22px;font:500 12px/1.5 var(--f-mono);color:var(--muted)}
@media (max-width:640px){ .simbar h2{font-size:15px} .tab{font-size:14px;padding:9px 12px} }

.soon{border:3px solid var(--ink);background:var(--card);box-shadow:6px 6px 0 var(--ink);padding:28px 24px;max-width:720px}
.soon h2{margin:0 0 8px;font-size:26px}
.soon p{margin:0;font-size:17px}
</style>
</head>
<body>
<div class="wrap">
  <header class="uhead">
    <div class="uid"><div class="big" aria-hidden="true">08</div><div><div class="mono">AP Physics 1 · P1-08</div><h1>Rotation</h1></div></div>
  </header>
  <section class="soon"><h2>Sims for this unit are on the way.</h2><p>Check back soon. The practice questions for this unit are below.</p></section>
</div>
</body>
</html>
