/sub> + αt, &nbsp; Δθ = ω<sub>0<\/sub>t + ½αt², &nbsp; ω² = ω<sub>0<\/sub>² + 2αΔθ<\/div>';\n    if (mode === 'stop') h += '<h4>2 · Convert rpm to rad/s<\/h4><div class=\"eq\">ω<sub>0<\/sub> = ' + H.iv('rpm') + ' × 2π/60 = <b>' + H.n(d.w0, 'rad/s') + '<\/b><\/div>' +\n      '<h4>3 · Angular acceleration (it ends at ω = 0)<\/h4><div class=\"eq\">α = (0 − ω<sub>0<\/sub>)/t = −' + H.n(d.w0) + ' / ' + H.iv('tS') + ' = <b>' + H.n(d.al, 'rad/s²') + '<\/b><\/div>' +\n      '<h4>4 · How far it turns while stopping<\/h4><div class=\"eq\">Δθ = ω<sub>avg<\/sub>t = ½(' + H.n(d.w0) + ' + 0)(' + H.iv('tS') + ') = <b>' + H.n(d.th, 'rad') + '<\/b> = ' + H.n(d.th) + '/2π = <b>' + H.n(d.revs, 'rev') + '<\/b><\/div>' +\n      '<p class=\"note\">Area under the ω–t graph = angle turned, just like area under v–t = displacement.<\/p>';\n    else {\n      h += '<h4>2 · After ' + H.iv('t') + '<\/h4><div class=\"eq\">ω = ' + H.iv('w0') + ' + (' + H.iv('al') + ')(' + H.iv('t') + ') = <b>' + H.n(d.w, 'rad/s') + '<\/b><\/div>' +\n        '<div class=\"eq\">Δθ = (' + H.n(d.w0) + ')(' + H.n(d.T) + ') + ½(' + H.n(d.al) + ')(' + H.n(d.T) + ')² = <b>' + H.n(d.th, 'rad') + '<\/b> = ' + H.n(d.revs, 'rev') + '<\/div>';\n      if (isFinite(d.tTurn) && d.tTurn < d.T) h += '<p class=\"note\">It stopped at t = ' + H.n(d.tTurn, 's') + ' and then spun the other way; Δθ is the net angle.<\/p>';\n    }\n    h += '<h4>' + (mode === 'stop' ? '5' : '3') + ' · A point on the rim (r = ' + H.iv('R') + ')<\/h4><div class=\"eq\">Speed v = rω = <b>' + H.n(d.v1, 'm/s') + '<\/b> &nbsp; tangential a<sub>t<\/sub> = rα = ' + H.n(d.at, 'm/s²') + ' &nbsp; centripetal a<sub>c<\/sub> = rω² = ' + H.n(d.ac, 'm/s²') + '<\/div>' +\n      '<p class=\"note\">Every point on the wheel has the same ω and α, but points farther out move faster: v = rω. Radians make these work; degrees and revs don’t.<\/p>';\n    return h;\n  },\n  draw(v, d, mode, opt, t, dt, A){\n    if (A.t === undefined || A.reset) A.t = 0; A.t += dt;\n    const T = d.T, tt = Math.min(A.t % (T + 1.5), T), ang = d.w0 * tt + 0.5 * d.al * tt * tt, wn = d.w0 + d.al * tt;\n    panelTitle(mode === 'spin' ? 'WHEEL (counterclockwise +)' : 'COASTING TO A STOP', 10, 18);\n    const cx = 170, cy = 165, Rp = 60 + v.R * 70;\n    ctx.fillStyle = '#eee'; ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, Rp, 0, 7); ctx.fill(); ctx.stroke();\n    ctx.lineWidth = 2; for (let k = 0; k < 6; k++){ const a = -ang + k * PI / 3; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Rp * Math.cos(a), cy + Rp * Math.sin(a)); ctx.stroke(); }\n    const px = cx + Rp * Math.cos(-ang), py = cy + Rp * Math.sin(-ang); ctx.fillStyle = '#ff6a2b'; ctx.beginPath(); ctx.arc(px, py, 7, 0, 7); ctx.fill();\n    // vectors at the dot: tangent (ccw) direction is (−sin, −cos) in screen coords for angle −ang\n    const tx = -Math.sin(ang), ty = -Math.cos(ang), rx = cx - px, ry = cy - py, rl = Math.hypot(rx, ry);\n    const vv = v.R * wn; if (Math.abs(vv) > 0.05) arrow(px, py, px + tx * vv * 12, py + ty * vv * 12, COL.V, 'v', { w: 2.5, head: 7 });\n    const acn = v.R * wn * wn; if (acn > 0.05) arrow(px, py, px + rx / rl * Math.min(acn * 4, 60), py + ry / rl * Math.min(acn * 4, 60), '#c43a00', 'a_c', { w: 2.5, head: 7 });\n    text('ω = ' + fplain(wn) + ' rad/s   θ = ' + fplain(ang) + ' rad (' + fplain(ang / (2 * PI)) + ' rev)', 12, 300, { font: '700 12px \"IBM Plex Mono\",monospace' });\n    text('t = ' + fplain(tt) + ' s', 12, 318, { font: '600 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n    // ω–t graph with area\n    panelTitle('ω vs t (area = angle turned)', 395, 18);\n    const gx = 420, gy0 = 250, gw = 165, gh = 200, wmax = Math.max(Math.abs(d.w0), Math.abs(d.w), 1) * 1.1, lo = Math.min(0, d.w0, d.w) < 0 ? -wmax : 0;\n    const X = q => gx + gw * q / T, Y = w => gy0 - gh * (w - lo) / (wmax - lo);\n    ctx.fillStyle = 'rgba(255,106,43,0.2)'; ctx.beginPath(); ctx.moveTo(X(0), Y(0)); for (let k = 0; k <= 60; k++){ const q = tt * k / 60; ctx.lineTo(X(q), Y(d.w0 + d.al * q)); } ctx.lineTo(X(tt), Y(0)); ctx.closePath(); ctx.fill();\n    ctx.strokeStyle = '#111'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(gx, gy0 - gh); ctx.lineTo(gx, gy0); ctx.lineTo(gx + gw, gy0); ctx.stroke();\n    if (lo < 0){ ctx.strokeStyle = '#bbb'; ctx.beginPath(); ctx.moveTo(gx, Y(0)); ctx.lineTo(gx + gw, Y(0)); ctx.stroke(); }\n    ctx.strokeStyle = COL.V; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(X(0), Y(d.w0)); ctx.lineTo(X(T), Y(d.w)); ctx.stroke();\n    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(X(tt), Y(wn), 4, 0, 7); ctx.fill();\n    text(fplain(wmax), gx - 3, gy0 - gh + 4, { align: 'right', font: '500 9px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); text('t → ' + fplain(T) + ' s', gx + gw, gy0 + 13, { align: 'right', font: '500 9px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n    text('slope = α = ' + fplain(d.al) + ' rad/s²', 395, 300, { font: '600 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n  }\n};\n\n\nS.mode = SIM.modes ? SIM.modes[0].id : 'one';\nsetup(); requestAnimationFrame(loop);\nwindow.APP = { select(name){ const m = (SIM.modes || []).find(m => m.label === name || m.id === name); if (m && m.id !== S.mode){ S.mode = m.id; S.anim = {}; setup(); } } };\naddEventListener('message', e => { const d = e.data; if (d && d.select) try { APP.select(d.select); } catch (er) {} });\n<\/script>\n<\/body><\/html>\n"},
"torque":{ar:"1000 / 640",html:"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Torque<\/title>\n<\!-- Torque: original Holmes Sims, built from frame.html + torque.js. g = 10 m/s². -->\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap\">\n<style>\nhtml,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:\"Space Grotesk\",system-ui,sans-serif;color:#111}\n#app{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0;padding:10px 14px 12px;box-sizing:border-box;\n  display:grid;grid-template-columns:600px 1fr;grid-template-rows:34px 330px 1fr;gap:10px 14px}\n#bar{grid-column:1/-1;display:flex;gap:16px;align-items:center;flex-wrap:nowrap;overflow:hidden}\n.seg{display:flex;align-items:center}\n.seg .lab{font:700 12px \"IBM Plex Mono\",monospace;margin-right:8px;text-transform:uppercase}\n.seg button{white-space:nowrap;font:700 14px \"Space Grotesk\",sans-serif;padding:6px 11px;border:2px solid #111;background:#fff;color:#111;cursor:pointer}\n.seg button+button{margin-left:-2px}\n.seg button[aria-pressed=\"true\"]{background:#111;color:#fff}\n.seg button:hover:not([aria-pressed=\"true\"]){background:#ffe2d3}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ff6a2b;outline-offset:2px;position:relative;z-index:1}\n#cv{border:2px solid #111;background:#fbfbfb;width:600px;height:330px;box-sizing:border-box;display:block}\n#work{border:2px solid #111;padding:8px 12px 10px;overflow:auto;font-size:14px;line-height:1.55;box-sizing:border-box}\n#work .wt{font:700 12px \"IBM Plex Mono\",monospace;text-transform:uppercase;margin:0 0 4px;display:flex;justify-content:space-between}\n#work .wt .hint{text-transform:none}\n#work h4{margin:9px 0 1px;font-size:13px;font-weight:700;color:#4a4a4a}\n#work h4:first-of-type{margin-top:2px}\n#work .eq{font-variant-numeric:tabular-nums}\n#work .n{font-family:\"IBM Plex Mono\",monospace;font-size:13px}\n#work b .n,#work .ans{font-weight:700}\n#work .note{font-size:12.5px;color:#4a4a4a;margin:2px 0 0}\n#work .ok{background:#e5f4ea;border-left:4px solid #1e7d45;padding:3px 8px;margin-top:4px}\n#work .bad{background:#fde7df;border-left:4px solid #c43a00;padding:3px 8px;margin-top:4px}\n.ivv{border-radius:2px;padding:0 2px;transition:background .25s}\n.ivv.gx{background:#ffe2d3}\n.ivv.hot{background:#ff6a2b;color:#fff}\n#ctl{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;align-content:start}\n.iv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:6px}\n.iv .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.iv .val{font:700 13px \"IBM Plex Mono\",monospace;white-space:nowrap}\n.iv input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:#111;height:22px}\n.iv input[type=radio]{accent-color:#ff6a2b;margin:0}\n#presets{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}\n#presets .lab{font:700 12px \"IBM Plex Mono\",monospace}\n#presets button{font:600 12.5px \"Space Grotesk\",sans-serif;padding:3px 8px;border:2px solid #111;background:#fff;cursor:pointer}\n#presets button:hover{background:#ffe2d3}\n#gcard{border:2px solid #111;padding:5px 8px 6px;display:flex;flex-direction:column;box-sizing:border-box;min-height:0}\n.ghead{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}\n.ghead select{font:600 13px \"Space Grotesk\",sans-serif;border:2px solid #111;padding:1px 4px;max-width:200px}\n#gv{width:340px;height:150px;flex:none;display:block;margin-top:3px}\n#dbl{font-size:12.5px;line-height:1.35;margin-top:2px}\n#dbl b{font-weight:700}\n.hint{font:500 11px \"IBM Plex Mono\",monospace;color:#4a4a4a}\n<\/style><\/head><body>\n<div id=\"app\">\n  <div id=\"bar\"><\/div>\n  <canvas id=\"cv\" width=\"1200\" height=\"660\" aria-label=\"Animation of the situation with force arrows\"><\/canvas>\n  <div id=\"work\" aria-live=\"polite\"><\/div>\n  <div id=\"ctl\"><\/div>\n  <div id=\"gcard\">\n    <div class=\"ghead\"><span>Graph<\/span><select id=\"dvsel\" aria-label=\"Quantity to graph\"><\/select><span>vs <b id=\"ivname\"><\/b><\/span><\/div>\n    <canvas id=\"gv\" width=\"680\" height=\"300\" aria-label=\"Graph of the chosen quantity against the chosen variable\"><\/canvas>\n    <div id=\"dbl\"><\/div>\n  <\/div>\n<\/div>\n<script>\n// ---------------- shared frame ----------------\nconst $ = id => document.getElementById(id);\nconst G10 = 10, PI = Math.PI, DEG = PI / 180;\nfunction fit(){ const s = Math.min(innerWidth / 1000, innerHeight / 640); $('app').style.transform = 'scale(' + s + ')'; }\naddEventListener('resize', fit); fit();\n\nfunction fnum(x){ const r = fnum0(x); return typeof r === 'string' ? r.replace(/^-/, '−') : r; }\nfunction fnum0(x){\n  if (x === null || x === undefined || !isFinite(x)) return '—';\n  const a = Math.abs(x);\n  if (a === 0) return '0';\n  if (a >= 1e5 || a < 1e-3){\n    const e = Math.floor(Math.log10(a)); let m = x / Math.pow(10, e);\n    let ms = m.toFixed(2); if (Math.abs(+ms) >= 10){ m /= 10; ms = m.toFixed(2); return ms + '×10<sup>' + (e + 1) + '<\/sup>'; }\n    return ms + '×10<sup>' + e + '<\/sup>';\n  }\n  if (a >= 1000) return String(Math.round(x));\n  return x.toPrecision(3);\n}\nfunction fplain(x){ return fnum(x).replace(/<sup>(.*?)<\\/sup>/g, (m, e) => '^' + e).replace('×10^', 'e'); }\nconst H = {\n  n: (x, u) => '<span class=\"n\">' + fnum(x) + (u ? '&nbsp;' + u : '') + '<\/span>',\n  iv: id => { const d = S.def[id]; const val = S.v[id]; const txt = (d.show ? d.show(val) : fnum(val) + (d.unit ? '&nbsp;' + d.unit : ''));\n              return '<span class=\"ivv n' + (S.gx === id ? ' gx' : '') + (S.hot === id ? ' hot' : '') + '\" data-iv=\"' + id + '\">' + txt + '<\/span>'; },\n  g: () => '<span class=\"n\">10&nbsp;m/s²<\/span>',\n  p: (x, u) => x < 0 ? '(' + H.n(x, u) + ')' : H.n(x, u)\n};\n\nconst S = { mode: null, opt: {}, v: {}, store: {}, def: {}, ivs: [], gx: null, dv: null, hot: null, t: 0, anim: {} };\n\nfunction bar(){\n  const b = $('bar'); b.innerHTML = '';\n  const group = (label, items, cur, onpick) => {\n    const g = document.createElement('div'); g.className = 'seg'; g.setAttribute('role', 'group');\n    if (label){ const l = document.createElement('span'); l.className = 'lab'; l.textContent = label; g.appendChild(l); }\n    items.forEach(([id, txt]) => { const bt = document.createElement('button'); bt.textContent = txt; bt.setAttribute('aria-pressed', String(id === cur)); bt.onclick = () => onpick(id); g.appendChild(bt); });\n    b.appendChild(g);\n  };\n  const tip = document.createElement('span'); tip.className = 'hint'; tip.style.marginLeft = 'auto'; tip.style.whiteSpace = 'nowrap'; tip.innerHTML = '● = the variable on the graph’s x-axis · drag any slider';\n  if (SIM.modes) group(null, SIM.modes.map(m => [m.id, m.label]), S.mode, id => { S.mode = id; S.anim = {}; setup(); });\n  (SIM.opts || []).filter(o => !o.modes || o.modes.includes(S.mode)).forEach(o => {\n    if (!(o.id in S.opt)) S.opt[o.id] = o.choices[0][0];\n    group(o.label, o.choices, S.opt[o.id], id => { S.opt[o.id] = id; S.anim = {}; setup(); });\n  });\n  b.appendChild(tip);\n  if (b.scrollWidth > b.clientWidth + 1) tip.remove();\n  if (b.scrollWidth > b.clientWidth + 1) b.querySelectorAll('.seg button').forEach(x => { x.style.fontSize = '13px'; x.style.padding = '6px 8px'; });\n}\n\nfunction setup(){\n  bar();\n  S.ivs = SIM.ivs(S.mode, S.opt); S.def = {}; S.v = {};\n  S.ivs.forEach(d => { S.def[d.id] = d; const k = S.mode + ':' + d.id; S.v[d.id] = (k in S.store) ? S.store[k] : d.val; });\n  if (!S.gx || !S.def[S.gx]) S.gx = S.ivs.find(d => d.graph) ? S.ivs.find(d => d.graph).id : S.ivs[1] ? S.ivs[1].id : S.ivs[0].id;\n  const c = $('ctl'); c.innerHTML = '';\n  S.ivs.forEach(d => {\n    const w = document.createElement('div'); w.className = 'iv';\n    w.innerHTML = '<input type=\"radio\" name=\"gx\" value=\"' + d.id + '\" aria-label=\"Graph against ' + d.label + '\" title=\"Put this on the graph’s x-axis\"' + (S.gx === d.id ? ' checked' : '') + '>' +\n      '<span class=\"nm\">' + d.label + ' <i>' + d.sym + '<\/i><\/span><span class=\"val\" id=\"val-' + d.id + '\"><\/span>' +\n      '<input type=\"range\" id=\"r-' + d.id + '\" min=\"' + d.min + '\" max=\"' + d.max + '\" step=\"' + d.step + '\" value=\"' + S.v[d.id] + '\" aria-label=\"' + d.label + '\">';\n    c.appendChild(w);\n    const r = w.querySelector('input[type=range]');\n    r.oninput = () => { S.v[d.id] = +r.value; S.store[S.mode + ':' + d.id] = +r.value; S.hot = d.id; clearTimeout(S.hotT); S.hotT = setTimeout(() => { S.hot = null; update(); }, 700); S.anim.reset = true; update(); };\n    w.querySelector('input[type=radio]').onchange = () => { S.gx = d.id; update(); };\n  });\n  if (SIM.presets){\n    const p = document.createElement('div'); p.id = 'presets'; p.innerHTML = '<span class=\"lab\">Try:<\/span>';\n    SIM.presets.forEach(ps => { const bt = document.createElement('button'); bt.textContent = ps.label; bt.onclick = () => { if (ps.mode && ps.mode !== S.mode){ S.mode = ps.mode; } Object.entries(ps.v).forEach(([k, val]) => S.store[(ps.mode || S.mode) + ':' + k] = val); S.anim = {}; setup(); }; p.appendChild(bt); });\n    c.appendChild(p);\n  }\n  const dvs = SIM.dvs(S.mode, S.opt), sel = $('dvsel');\n  if (!S.dv || !dvs.find(d => d.id === S.dv)) S.dv = dvs[0].id;\n  sel.innerHTML = dvs.map(d => '<option value=\"' + d.id + '\"' + (d.id === S.dv ? ' selected' : '') + '>' + d.name + '<\/option>').join('');\n  sel.onchange = () => { S.dv = sel.value; update(); };\n  update();\n}\n\nfunction calcWith(over){ const v = Object.assign({}, S.v, over || {}); return SIM.calc(v, S.mode, S.opt); }\n\nfunction update(){\n  S.ivs.forEach(d => { $('val-' + d.id).innerHTML = d.show ? d.show(S.v[d.id]) : fnum(S.v[d.id]) + (d.unit ? '&nbsp;' + d.unit : ''); });\n  S.d = calcWith();\n  $('work').innerHTML = '<div class=\"wt\"><span>Show the work<\/span><span class=\"hint\">' + (SIM.hint || 'g = 10 m/s²') + '<\/span><\/div>' + SIM.work(S.v, S.d, S.mode, S.opt);\n  document.querySelectorAll('input[name=gx]').forEach(r => r.checked = (r.value === S.gx));\n  graph();\n}\n\nfunction graph(){\n  const cv = $('gv'), g = cv.getContext('2d'), W = 340, Hh = 150; g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, W, Hh);\n  const dvs = SIM.dvs(S.mode, S.opt), dv = dvs.find(d => d.id === S.dv), ref = dv.vs ? dvs.find(d => d.id === dv.vs) : null;\n  const x = S.def[S.gx]; $('ivname').innerHTML = '<i>' + x.sym + '<\/i>' + (x.unit && !x.show ? ' (' + x.unit + ')' : '');\n  const N = 160, xs = [], ys = [], rs = [];\n  for (let i = 0; i <= N; i++){ const xv = x.min + (x.max - x.min) * i / N; const d = calcWith({ [S.gx]: xv }); xs.push(xv); ys.push(dv.f(d)); rs.push(ref ? ref.f(d) : null); }\n  const all = ys.concat(ref ? rs : []).filter(isFinite);\n  let ymin = Math.min(0, ...all), ymax = Math.max(...all, 0); if (ymax === ymin) ymax = ymin + 1; const pad = (ymax - ymin) * 0.08; ymax += pad; if (ymin < 0) ymin -= pad;\n  const L = 46, R = 8, T = 8, B = 22, X = v => L + (v - x.min) / (x.max - x.min) * (W - L - R), Y = v => T + (ymax - v) / (ymax - ymin) * (Hh - T - B);\n  g.strokeStyle = '#111'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(L, T); g.lineTo(L, Hh - B); g.lineTo(W - R, Hh - B); g.stroke();\n  if (ymin < 0){ g.strokeStyle = '#999'; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(W - R, Y(0)); g.stroke(); g.setLineDash([]);\n    if (dv.negNote){ g.fillStyle = 'rgba(196,58,0,0.08)'; g.fillRect(L, Y(0), W - R - L, Hh - B - Y(0)); g.fillStyle = '#c43a00'; g.font = '600 10px \"Space Grotesk\",sans-serif'; g.textAlign = 'left'; g.fillText(dv.negNote, L + 4, Hh - B - 4); } }\n  g.font = '500 10px \"IBM Plex Mono\",monospace'; g.fillStyle = '#4a4a4a'; g.textAlign = 'right';\n  g.fillText(fplain(ymax), L - 4, T + 8); g.fillText(fplain(ymin < 0 ? ymin : 0), L - 4, Hh - B); if (ymin < 0) g.fillText('0', L - 4, Y(0) + 3);\n  g.textAlign = 'center'; g.fillText(fplain(x.min), L, Hh - 8); g.fillText(fplain(x.max), W - R - 10, Hh - 8);\n  g.fillText((x.symText || x.id) + (x.unit ? ' (' + x.unit + ')' : ''), (L + W) / 2, Hh - 8);\n  g.save(); g.translate(10, (T + Hh - B) / 2); g.rotate(-PI / 2); g.textAlign = 'center'; g.fillText(dv.short + (dv.unit ? ' (' + dv.unit + ')' : ''), 0, 0); g.restore();\n  const line = (arr, col, dash) => { g.strokeStyle = col; g.lineWidth = 2.2; g.setLineDash(dash || []); g.beginPath(); let on = false; arr.forEach((y, i) => { if (!isFinite(y)){ on = false; return; } const px = X(xs[i]), py = Math.max(T - 4, Math.min(Hh - B + 4, Y(y))); on ? g.lineTo(px, py) : g.moveTo(px, py); on = true; }); g.stroke(); g.setLineDash([]); };\n  if (ref){ line(rs, '#4a4a4a', [5, 4]); g.fillStyle = '#4a4a4a'; g.textAlign = 'right'; g.font = '600 10px \"Space Grotesk\",sans-serif'; const lastY = rs.filter(isFinite).pop(); if (isFinite(lastY)) g.fillText(ref.short, W - R - 2, Math.max(T + 9, Y(lastY) - 4)); }\n  line(ys, '#1546d6');\n  const cx = S.v[S.gx], cy = dv.f(S.d);\n  if (isFinite(cy)){ g.strokeStyle = '#ff6a2b'; g.setLineDash([2, 3]); g.lineWidth = 1; g.beginPath(); g.moveTo(X(cx), Hh - B); g.lineTo(X(cx), Y(cy)); g.lineTo(L, Y(cy)); g.stroke(); g.setLineDash([]);\n    g.fillStyle = '#ff6a2b'; g.strokeStyle = '#111'; g.lineWidth = 1.5; g.beginPath(); g.arc(X(cx), Math.max(T, Math.min(Hh - B, Y(cy))), 4.5, 0, 7); g.fill(); g.stroke(); }\n  // doubling readout\n  const d2 = calcWith({ [S.gx]: cx * 2 }), y1 = dv.f(S.d), y2 = dv.f(d2);\n  let msg = '';\n  if (cx === 0 || Math.abs(y1) < 1e-12) msg = '<span class=\"hint\">Move off zero to see the ×2 test.<\/span>';\n  else if (!isFinite(y1) || !isFinite(y2)) msg = '<span class=\"hint\">The ×2 test doesn’t apply here (doubling takes it outside what this quantity covers).<\/span>';\n  else {\n    const k = y2 / y1;\n    if (k < 0){ $('dbl').innerHTML = 'If <b>' + x.sym + '<\/b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '<\/b> goes from ' + fnum(y1) + ' to ' + fnum(y2) + (dv.unit ? ' ' + dv.unit : '') + (dv.signOK ? ': it changes sign. ' + dv.signOK : ': it changes sign, so that can’t really happen.'); return; }\n    const tags = [[1, 'doesn’t depend on it'], [2, 'proportional'], [4, 'goes as the square'], [0.5, 'inversely proportional'], [0.25, 'inverse square'], [Math.SQRT2, 'goes as the square root'], [Math.SQRT1_2, 'goes as 1/√'], [8, 'goes as the cube'], [2 * Math.SQRT2, 'goes as the 3/2 power']];\n    const tag = tags.find(([v]) => Math.abs(k - v) < 0.004 * v);\n    msg = 'If <b>' + x.sym + '<\/b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '<\/b> becomes <b>×' + (Math.abs(k) >= 100 ? fnum(k) : k.toFixed(2)) + '<\/b>' + (tag && !dv.noTag ? ' — ' + tag[1] : '') + '.' + (dv.dblNote ? ' <span class=\"hint\">' + dv.dblNote + '<\/span>' : '');\n  }\n  $('dbl').innerHTML = msg;\n}\n\n// drawing helpers (canvas is drawn in 600×330 units)\nconst cv = $('cv'), ctx = cv.getContext('2d');\nfunction arrow(x1, y1, x2, y2, col, label, opts){\n  opts = opts || {}; const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy); if (len < 2) return;\n  const ux = dx / len, uy = dy / len, hw = opts.head || 9;\n  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = opts.w || 3.5; ctx.lineCap = 'round';\n  if (opts.dash) ctx.setLineDash(opts.dash);\n  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hw * 0.8, y2 - uy * hw * 0.8); ctx.stroke(); ctx.setLineDash([]);\n  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - ux * hw - uy * hw * 0.55, y2 - uy * hw + ux * hw * 0.55); ctx.lineTo(x2 - ux * hw + uy * hw * 0.55, y2 - uy * hw - ux * hw * 0.55); ctx.closePath(); ctx.fill();\n  if (label){ ctx.font = '700 13px \"Space Grotesk\",sans-serif'; ctx.textAlign = opts.align || 'left'; ctx.textBaseline = 'middle';\n    const lx = x2 + (opts.lx !== undefined ? opts.lx : (ux >= 0 ? 6 : -6)), ly = y2 + (opts.ly !== undefined ? opts.ly : (uy >= 0 ? 10 : -10));\n    if (opts.align === undefined) ctx.textAlign = ux >= -0.2 ? 'left' : 'right';\n    ctx.fillText(label, lx, ly); }\n  ctx.restore();\n}\nfunction text(s, x, y, o){ o = o || {}; ctx.save(); ctx.font = (o.font || '600 13px \"Space Grotesk\",sans-serif'); ctx.fillStyle = o.col || '#111'; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic'; ctx.fillText(s, x, y); ctx.restore(); }\nfunction panelTitle(s, x, y){ text(s, x, y, { font: '700 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); }\nconst COL = { F: '#c43a00', W: '#111', N: '#1e7d45', V: '#1546d6', T: '#7a3fb0', comp: '#8a8a8a' };\n\nlet last = 0;\nfunction loop(ts){ const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts; S.t += dt;\n  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, 600, 330);\n  SIM.draw(S.v, S.d, S.mode, S.opt, S.t, dt, S.anim); S.anim.reset = false;\n  requestAnimationFrame(loop); }\n\n// ---------------- this sim ----------------\n// Torque: τ = rF sinθ on a wrench, then balance problems (seesaw, plank on two supports, beam held by a cable).\nconst SIM = {\n  title: 'Torque',\n  modes: [{ id: 'wrench', label: 'Wrench' }, { id: 'seesaw', label: 'Seesaw' }, { id: 'plank', label: 'Plank on two supports' }, { id: 'sign', label: 'Beam and cable' }],\n  ivs(mode){\n    if (mode === 'wrench') return [\n      { id: 'F', sym: 'F', symText: 'F', label: 'Force', unit: 'N', min: 0, max: 100, step: 1, val: 40 },\n      { id: 'r', sym: 'r', symText: 'r', label: 'Distance from the bolt', unit: 'm', min: 0.05, max: 0.5, step: 0.01, val: 0.25 },\n      { id: 'th', sym: 'θ', symText: 'θ', label: 'Angle between wrench and force', unit: '°', min: 0, max: 180, step: 1, val: 90, graph: true, show: x => x.toFixed(0) + '°' }];\n    if (mode === 'seesaw') return [\n      { id: 'm1', sym: 'm<sub>1<\/sub>', symText: 'm1', label: 'Left kid', unit: 'kg', min: 10, max: 60, step: 1, val: 30 },\n      { id: 'd1', sym: 'd<sub>1<\/sub>', symText: 'd1', label: 'Left kid’s distance from the pivot', unit: 'm', min: 0, max: 2, step: 0.05, val: 1.5 },\n      { id: 'm2', sym: 'm<sub>2<\/sub>', symText: 'm2', label: 'Right kid', unit: 'kg', min: 10, max: 60, step: 1, val: 45 },\n      { id: 'd2', sym: 'd<sub>2<\/sub>', symText: 'd2', label: 'Right kid’s distance from the pivot', unit: 'm', min: 0, max: 2, step: 0.05, val: 1, graph: true }];\n    if (mode === 'plank') return [\n      { id: 'x', sym: 'x', symText: 'x', label: 'Person’s position (from support A)', unit: 'm', min: 0, max: 4, step: 0.05, val: 2, graph: true },\n      { id: 'm', sym: 'm', symText: 'm', label: 'Person’s mass', unit: 'kg', min: 20, max: 100, step: 1, val: 60 },\n      { id: 'M', sym: 'M', symText: 'M', label: 'Plank mass (4 m long, uniform)', unit: 'kg', min: 5, max: 100, step: 1, val: 40 }];\n    return [\n      { id: 'm', sym: 'm', symText: 'm', label: 'Sign mass', unit: 'kg', min: 5, max: 50, step: 1, val: 20 },\n      { id: 'x', sym: 'x', symText: 'x', label: 'Sign’s distance from the wall', unit: 'm', min: 0.2, max: 2, step: 0.05, val: 1.5 },\n      { id: 'th', sym: 'θ', symText: 'θ', label: 'Cable angle above the beam', unit: '°', min: 10, max: 80, step: 1, val: 30, graph: true, show: x => x.toFixed(0) + '°' },\n      { id: 'M', sym: 'M', symText: 'M', label: 'Beam mass (2 m, uniform)', unit: 'kg', min: 0, max: 20, step: 0.5, val: 5 }];\n  },\n  presets: [{ label: 'Push at 90°', mode: 'wrench', v: { th: 90 } }, { label: 'Push along it', mode: 'wrench', v: { th: 0 } }, { label: 'Balance it', mode: 'seesaw', v: { m1: 30, d1: 1.5, m2: 45, d2: 1 } }, { label: 'Walk to the end', mode: 'plank', v: { x: 4 } }],\n  calc(v, mode){\n    if (mode === 'wrench'){ const s = Math.sin(v.th * DEG), tau = v.r * v.F * s; return { tau, arm: v.r * s, Fperp: v.F * s }; }\n    if (mode === 'seesaw'){ const t1 = v.m1 * G10 * v.d1, t2 = v.m2 * G10 * v.d2, net = t1 - t2; return { t1, t2, net, bal: Math.abs(net) < 0.5, dNeed: t1 / (v.m2 * G10), N: (v.m1 + v.m2) * G10 }; }\n    if (mode === 'plank'){ const W = v.M * G10, w = v.m * G10, NB = (W * 2 + w * v.x) / 3, NA = W + w - NB, xTip = 3 + v.M / v.m;\n      return { W, w, NB, NA, tips: NA < -1e-9, xTip, tA: W * 2 + w * v.x }; }\n    const L = 2, th = v.th * DEG, W = v.M * G10, w = v.m * G10, tauDown = W * L / 2 + w * v.x, T = tauDown / (L * Math.sin(th)), Hx = T * Math.cos(th), Hy = W + w - T * Math.sin(th);\n    return { L, W, w, tauDown, T, Hx, Hy, H: Math.hypot(Hx, Hy) };\n  },\n  dvs(mode){\n    if (mode === 'wrench') return [{ id: 'tau', name: 'Torque τ = rF sinθ', short: 'τ', sym: 'τ', unit: 'N·m', f: d => d.tau }, { id: 'arm', name: 'Lever arm r sinθ', short: 'r⊥', sym: 'r<sub>⊥<\/sub>', unit: 'm', f: d => d.arm }];\n    if (mode === 'seesaw') return [{ id: 'net', name: 'Net torque (+ = counterclockwise)', short: 'Στ', sym: 'Στ', unit: 'N·m', f: d => d.net }, { id: 't2', name: 'Right kid’s torque', short: 'τ2', sym: 'τ<sub>2<\/sub>', unit: 'N·m', f: d => d.t2, vs: 't1' }, { id: 't1', name: 'Left kid’s torque', short: 'τ1', sym: 'τ<sub>1<\/sub>', unit: 'N·m', f: d => d.t1 }];\n    if (mode === 'plank') return [{ id: 'NA', name: 'Support A pushes up', short: 'N_A', sym: 'N<sub>A<\/sub>', unit: 'N', f: d => d.NA }, { id: 'NB', name: 'Support B pushes up', short: 'N_B', sym: 'N<sub>B<\/sub>', unit: 'N', f: d => d.NB }];\n    return [{ id: 'T', name: 'Cable tension', short: 'T', sym: 'T', unit: 'N', f: d => d.T }, { id: 'Hx', name: 'Hinge force, horizontal', short: 'H_x', sym: 'H<sub>x<\/sub>', unit: 'N', f: d => d.Hx }, { id: 'Hy', name: 'Hinge force, vertical', short: 'H_y', sym: 'H<sub>y<\/sub>', unit: 'N', f: d => d.Hy }];\n  },\n  work(v, d, mode){\n    if (mode === 'wrench') return '<h4>1 · Torque = how hard a force twists<\/h4><div class=\"eq\">τ = rF sinθ = (' + H.iv('r') + ')(' + H.iv('F') + ') sin ' + H.iv('th') + ' = <b>' + H.n(d.tau, 'N·m') + '<\/b><\/div>' +\n      '<h4>2 · Two ways to read sinθ<\/h4><div class=\"eq\">Lever arm: r<sub>⊥<\/sub> = r sinθ = ' + H.n(d.arm, 'm') + ' (the perpendicular distance from the bolt to the force’s line of action) → τ = r<sub>⊥<\/sub>F<\/div>' +\n      '<div class=\"eq\">Or the part of the force perpendicular to the wrench: F<sub>⊥<\/sub> = F sinθ = ' + H.n(d.Fperp, 'N') + ' → τ = rF<sub>⊥<\/sub><\/div>' +\n      '<p class=\"note\">Push along the wrench (θ = 0° or 180°): no twist at all. Biggest torque at 90°. Doubling r (a longer wrench) doubles τ.<\/p>';\n    if (mode === 'seesaw') return '<h4>1 · Each kid’s weight makes a torque about the pivot (counterclockwise +)<\/h4><div class=\"eq\">Left: τ<sub>1<\/sub> = m<sub>1<\/sub>g d<sub>1<\/sub> = (' + H.iv('m1') + ')(' + H.g() + ')(' + H.iv('d1') + ') = ' + H.n(d.t1, 'N·m') + ' ↺<\/div>' +\n      '<div class=\"eq\">Right: τ<sub>2<\/sub> = m<sub>2<\/sub>g d<sub>2<\/sub> = (' + H.iv('m2') + ')(' + H.g() + ')(' + H.iv('d2') + ') = ' + H.n(d.t2, 'N·m') + ' ↻<\/div>' +\n      '<h4>2 · Net torque<\/h4><div class=\"eq\">Στ = ' + H.n(d.t1) + ' − ' + H.n(d.t2) + ' = <b>' + H.n(d.net, 'N·m') + '<\/b> → ' + (d.bal ? '<b>balanced<\/b>' : d.net > 0 ? 'tips left (↺)' : 'tips right (↻)') + '<\/div>' +\n      '<h4>3 · Where should the right kid sit to balance?<\/h4><div class=\"eq\">m<sub>1<\/sub>d<sub>1<\/sub> = m<sub>2<\/sub>d<sub>2<\/sub> → d<sub>2<\/sub> = m<sub>1<\/sub>d<sub>1<\/sub>/m<sub>2<\/sub> = <b>' + H.n(d.dNeed, 'm') + '<\/b>' + (d.dNeed > 2 ? ' (past the end: can’t balance)' : '') + '<\/div>' +\n      '<h4>4 · The pivot<\/h4><div class=\"eq\">Balanced or not, the pivot pushes up with (m<sub>1<\/sub> + m<sub>2<\/sub>)g = ' + H.n(d.N, 'N') + ' (massless board). It makes no torque about itself: r = 0.<\/div>' +\n      '<p class=\"note\">Equilibrium needs both: ΣF = 0 <i>and<\/i> Στ = 0.<\/p>';\n    if (mode === 'plank') return '<h4>1 · Free-body diagram of the plank<\/h4><div class=\"eq\">Supports at A (x = 0) and B (x = 3 m); plank 4 m, its weight Mg = ' + H.n(d.W, 'N') + ' acts at its center (x = 2 m); person mg = ' + H.n(d.w, 'N') + ' at x = ' + H.iv('x') + '.<\/div>' +\n      '<h4>2 · Torques about A (so N<sub>A<\/sub> drops out)<\/h4><div class=\"eq\">N<sub>B<\/sub>(3) = Mg(2) + mg·x → N<sub>B<\/sub> = [' + H.n(d.W) + '(2) + ' + H.n(d.w) + '(' + H.iv('x') + ')] / 3 = <b>' + H.n(d.NB, 'N') + '<\/b><\/div>' +\n      '<h4>3 · Forces: N<sub>A<\/sub> + N<sub>B<\/sub> = Mg + mg<\/h4><div class=\"eq\">N<sub>A<\/sub> = ' + H.n(d.W + d.w) + ' − ' + H.n(d.NB) + ' = <b>' + H.n(d.NA, 'N') + '<\/b><\/div>' +\n      (d.tips ? '<div class=\"bad\">N<sub>A<\/sub> would have to pull <i>down<\/i>. A support can only push, so the plank <b>tips<\/b> about B.<\/div>' : '') +\n      '<h4>4 · How far out before it tips?<\/h4><div class=\"eq\">About to tip: N<sub>A<\/sub> = 0. Torques about B: M g(1) = mg(x − 3) → x = 3 + M/m = <b>' + H.n(d.xTip, 'm') + '<\/b>' + (d.xTip >= 4 ? ' (past the end of the plank: safe all the way out)' : '') + '<\/div>' +\n      '<p class=\"note\">Choose the pivot point at an unknown force: it disappears from the torque equation.<\/p>';\n    return '<h4>1 · Torques about the hinge (the hinge force drops out)<\/h4><div class=\"eq\">Clockwise: beam Mg at L/2 and sign mg at x: ' + H.n(d.W) + '(1) + ' + H.n(d.w) + '(' + H.iv('x') + ') = ' + H.n(d.tauDown, 'N·m') + '<\/div>' +\n      '<div class=\"eq\">Counterclockwise: only the cable, T sinθ at the end: T sinθ · L<\/div>' +\n      '<h4>2 · Balance them<\/h4><div class=\"eq\">T = ' + H.n(d.tauDown) + ' / (2 sin ' + H.iv('th') + ') = <b>' + H.n(d.T, 'N') + '<\/b><\/div>' +\n      '<h4>3 · Then forces give the hinge<\/h4><div class=\"eq\">Horizontal: H<sub>x<\/sub> = T cosθ = <b>' + H.n(d.Hx, 'N') + '<\/b> (pushing out from the wall)<\/div>' +\n      '<div class=\"eq\">Vertical: H<sub>y<\/sub> = Mg + mg − T sinθ = <b>' + H.n(d.Hy, 'N') + '<\/b>' + (d.Hy < 0 ? ' (negative: the hinge pulls down)' : '') + '<\/div>' +\n      '<p class=\"note\">A low cable angle needs a huge tension: sinθ is small, so the cable has little lever arm.<\/p>';\n  },\n  draw(v, d, mode, opt, t, dt, A){\n    const tbars = (items) => { panelTitle('TORQUES (N·m)', 395, 18); const mx = Math.max(...items.map(i => Math.abs(i[1])), 1); items.forEach(([lab, val, col], i) => { const y = 40 + i * 26, w = 85 * Math.abs(val) / mx; ctx.fillStyle = col; ctx.fillRect(470, y, w, 14); text(lab, 465, y + 11, { align: 'right', font: '600 10px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); text(fplain(val), 474 + w, y + 11, { font: '600 10px \"IBM Plex Mono\",monospace' }); }); };\n    if (mode === 'wrench'){\n      panelTitle('WRENCH ON A BOLT (top view)', 10, 18);\n      const bx = 110, by = 180, sc = 560, L = v.r * sc;\n      ctx.fillStyle = '#888'; ctx.beginPath(); for (let k = 0; k < 6; k++){ const a = k * PI / 3; ctx.lineTo(bx + 16 * Math.cos(a), by + 16 * Math.sin(a)); } ctx.closePath(); ctx.fill();\n      ctx.fillStyle = '#9aa7b8'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.fillRect(bx, by - 8, L + 10, 16); ctx.strokeRect(bx, by - 8, L + 10, 16);\n      const ex = bx + L, ey = by, a = -v.th * DEG, Fl = 40 + v.F * 1.1, fx = Math.cos(a), fy = Math.sin(a);\n      ctx.setLineDash([4, 4]); ctx.strokeStyle = '#bbb'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(ex - fx * 300, ey - fy * 300); ctx.lineTo(ex + fx * 300, ey + fy * 300); ctx.stroke(); ctx.setLineDash([]);\n      // lever arm: perpendicular from the bolt to the line of action\n      const t0 = (bx - ex) * fx + (by - ey) * fy, px = ex + fx * t0, py = ey + fy * t0;\n      if (d.arm > 0.005){ ctx.strokeStyle = '#1e7d45'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(px, py); ctx.stroke(); text('r⊥ = ' + fplain(d.arm) + ' m', (bx + px) / 2 - 8, (by + py) / 2 - 6, { align: 'right', font: '700 11px \"Space Grotesk\",sans-serif', col: '#1e7d45' }); }\n      if (v.F > 0) arrow(ex, ey, ex + fx * Fl, ey + fy * Fl, COL.T, 'F', { lx: 6, ly: -6 });\n      text('r = ' + fplain(v.r) + ' m', bx + L / 2, by + 26, { align: 'center', font: '600 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n      text('τ = ' + fplain(d.tau) + ' N·m', 12, 300, { font: '700 14px \"Space Grotesk\",sans-serif' });\n      tbars([['τ = rF sinθ', d.tau, '#c43a00'], ['max (90°)', v.r * v.F, '#bbb']]);\n      return;\n    }\n    if (mode === 'seesaw'){\n      panelTitle('SEESAW (4 m board, pivot in the middle)', 10, 18);\n      if (A.ang === undefined) A.ang = 0; const target = d.bal ? 0 : (d.net > 0 ? 1 : -1) * 0.22; A.ang += (target - A.ang) * Math.min(1, dt * 3);\n      const px = 190, py = 220, sc = 80;\n      ctx.fillStyle = '#555'; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - 18, py + 50); ctx.lineTo(px + 18, py + 50); ctx.closePath(); ctx.fill();\n      ctx.save(); ctx.translate(px, py); ctx.rotate(-A.ang); ctx.fillStyle = '#c98a3c'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.fillRect(-2 * sc, -8, 4 * sc, 8); ctx.strokeRect(-2 * sc, -8, 4 * sc, 8);\n      const kid = (x, m, col, lab) => { const sz = 16 + m * 0.4; ctx.fillStyle = col; ctx.fillRect(x * sc - sz / 2, -8 - sz, sz, sz); ctx.strokeRect(x * sc - sz / 2, -8 - sz, sz, sz); text(lab, x * sc, -12 - sz, { align: 'center', font: '700 10px \"Space Grotesk\",sans-serif', col }); };\n      kid(-v.d1, v.m1, '#ff6a2b', fplain(v.m1) + ' kg'); kid(v.d2, v.m2, '#1546d6', fplain(v.m2) + ' kg');\n      for (let k = -2; k <= 2; k++){ ctx.fillStyle = '#111'; ctx.fillRect(k * sc - 0.5, 0, 1, 6); text(Math.abs(k) + '', k * sc, 16, { align: 'center', font: '500 9px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); }\n      ctx.restore();\n      text(d.bal ? 'balanced: Στ = 0' : d.net > 0 ? 'tips left ↺' : 'tips right ↻', 12, 300, { font: '700 14px \"Space Grotesk\",sans-serif', col: d.bal ? '#1e7d45' : '#c43a00' });\n      text('balance needs d₂ = ' + fplain(d.dNeed) + ' m', 12, 318, { font: '600 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n      tbars([['left ↺', d.t1, '#ff6a2b'], ['right ↻', d.t2, '#1546d6'], ['net', Math.abs(d.net), d.bal ? '#1e7d45' : '#c43a00']]);\n      return;\n    }\n    if (mode === 'plank'){\n      panelTitle('PLANK ON TWO SUPPORTS (A at 0 m, B at 3 m)', 10, 18);\n      if (A.ang === undefined) A.ang = 0; const target = d.tips ? -0.35 : 0; A.ang += (target - A.ang) * Math.min(1, dt * 3);\n      const x0 = 40, sc = 75, py = 200, Bx = x0 + 3 * sc;\n      ctx.fillStyle = '#555'; [[x0, 'A'], [Bx, 'B']].forEach(([x, l]) => { ctx.beginPath(); ctx.moveTo(x, py); ctx.lineTo(x - 14, py + 40); ctx.lineTo(x + 14, py + 40); ctx.closePath(); ctx.fill(); text(l, x, py + 55, { align: 'center', font: '700 12px \"Space Grotesk\",sans-serif' }); });\n      ctx.save(); ctx.translate(Bx, py); ctx.rotate(-A.ang); ctx.translate(-Bx, -py);\n      ctx.fillStyle = '#c98a3c'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.fillRect(x0 - 4, py - 10, 4 * sc + 4, 10); ctx.strokeRect(x0 - 4, py - 10, 4 * sc + 4, 10);\n      const px = x0 + v.x * sc; ctx.fillStyle = '#1546d6'; ctx.fillRect(px - 7, py - 50, 14, 40); ctx.fillStyle = '#f2c7a0'; ctx.beginPath(); ctx.arc(px, py - 58, 8, 0, 7); ctx.fill();\n      ctx.restore();\n      const fs = 70 / Math.max(d.W + d.w, 1);\n      if (!d.tips){ arrow(x0, py + 40, x0, py + 40 - Math.max(0, d.NA) * fs, COL.N, 'N_A', { lx: 6, ly: 0 }); }\n      arrow(Bx, py + 40, Bx, py + 40 - (d.tips ? d.W + d.w : d.NB) * fs, COL.N, 'N_B', { lx: 6, ly: 0 });\n      arrow(x0 + 2 * sc, py, x0 + 2 * sc, py + d.W * fs, COL.W, 'Mg', { lx: 6, ly: 0 });\n      if (!d.tips) arrow(px + 12, py - 30, px + 12, py - 30 + d.w * fs, COL.W, 'mg', { lx: 5, ly: 0 });\n      text(d.tips ? 'TIPS about B' : 'N_A = ' + fplain(d.NA) + ' N   N_B = ' + fplain(d.NB) + ' N', 12, 300, { font: '700 13px \"Space Grotesk\",sans-serif', col: d.tips ? '#c43a00' : '#111' });\n      text('tips once x > 3 + M/m = ' + fplain(d.xTip) + ' m', 12, 318, { font: '600 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n      tbars([['plank Mg·2', d.W * 2, '#555'], ['person mg·x', d.w * v.x, '#1546d6'], ['N_B·3', d.tips ? 0 : d.NB * 3, COL.N]]);\n      text('torques about A', 395, 130, { font: '600 10px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n      return;\n    }\n    panelTitle('BEAM HELD BY A CABLE', 10, 18);\n    const wx = 40, by = 210, sc = 150, ex = wx + d.L * sc, th = v.th * DEG, cy = by - d.L * sc * Math.tan(th);\n    ctx.fillStyle = '#bbb'; ctx.fillRect(wx - 20, 30, 20, 260);\n    ctx.fillStyle = '#c98a3c'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.fillRect(wx, by - 6, d.L * sc, 12); ctx.strokeRect(wx, by - 6, d.L * sc, 12);\n    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(wx, by, 5, 0, 7); ctx.fill();\n    const tc = Math.min((ex - wx) / Math.cos(th), (by - 32) / Math.sin(th)); ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ex, by); ctx.lineTo(ex - tc * Math.cos(th), by - tc * Math.sin(th)); ctx.stroke();\n    if (cy < 32) text('(cable anchor off the top)', wx + 4, 44, { font: '500 9px \"IBM Plex Mono\",monospace', col: '#888' });\n    const sx = wx + v.x * sc; ctx.strokeStyle = '#111'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx, by + 6); ctx.lineTo(sx, by + 30); ctx.stroke();\n    ctx.fillStyle = '#ff6a2b'; ctx.fillRect(sx - 26, by + 30, 52, 26); ctx.strokeRect(sx - 26, by + 30, 52, 26); text('EAT', sx, by + 48, { align: 'center', font: '700 12px \"Space Grotesk\",sans-serif', col: '#fff' });\n    const fs = 60 / Math.max(d.T, d.W + d.w, 1);\n    arrow(ex, by, ex - d.T * fs * Math.cos(th), by - d.T * fs * Math.sin(th), COL.T, 'T', { lx: -6, ly: -6, align: 'right' });\n    arrow(wx, by, wx + d.Hx * fs, by, COL.N, 'Hx', { lx: 2, ly: 12 }); if (Math.abs(d.Hy) > 0.5) arrow(wx, by, wx, by - d.Hy * fs, COL.N, 'Hy', { lx: 6, ly: 0 });\n    text('T = ' + fplain(d.T) + ' N   hinge ' + fplain(d.H) + ' N', 12, 300, { font: '700 13px \"Space Grotesk\",sans-serif' });\n    tbars([['beam Mg·L/2', d.W, '#555'], ['sign mg·x', d.w * v.x, '#ff6a2b'], ['cable T sinθ·L', d.T * Math.sin(th) * d.L, COL.T]]);\n    text('torques about the hinge', 395, 130, { font: '600 10px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n  }\n};\n\n\nS.mode = SIM.modes ? SIM.modes[0].id : 'one';\nsetup(); requestAnimationFrame(loop);\nwindow.APP = { select(name){ const m = (SIM.modes || []).find(m => m.label === name || m.id === name); if (m && m.id !== S.mode){ S.mode = m.id; S.anim = {}; setup(); } } };\naddEventListener('message', e => { const d = e.data; if (d && d.select) try { APP.select(d.select); } catch (er) {} });\n<\/script>\n<\/body><\/html>\n"},
"inertia":{ar:"1000 / 640",html:"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Rotational Inertia<\/title>\n<\!-- Rotational Inertia: original Holmes Sims, built from frame.html + inertia.js. g = 10 m/s². -->\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap\">\n<style>\nhtml,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:\"Space Grotesk\",system-ui,sans-serif;color:#111}\n#app{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0;padding:10px 14px 12px;box-sizing:border-box;\n  display:grid;grid-template-columns:600px 1fr;grid-template-rows:34px 330px 1fr;gap:10px 14px}\n#bar{grid-column:1/-1;display:flex;gap:16px;align-items:center;flex-wrap:nowrap;overflow:hidden}\n.seg{display:flex;align-items:center}\n.seg .lab{font:700 12px \"IBM Plex Mono\",monospace;margin-right:8px;text-transform:uppercase}\n.seg button{white-space:nowrap;font:700 14px \"Space Grotesk\",sans-serif;padding:6px 11px;border:2px solid #111;background:#fff;color:#111;cursor:pointer}\n.seg button+button{margin-left:-2px}\n.seg button[aria-pressed=\"true\"]{background:#111;color:#fff}\n.seg button:hover:not([aria-pressed=\"true\"]){background:#ffe2d3}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ff6a2b;outline-offset:2px;position:relative;z-index:1}\n#cv{border:2px solid #111;background:#fbfbfb;width:600px;height:330px;box-sizing:border-box;display:block}\n#work{border:2px solid #111;padding:8px 12px 10px;overflow:auto;font-size:14px;line-height:1.55;box-sizing:border-box}\n#work .wt{font:700 12px \"IBM Plex Mono\",monospace;text-transform:uppercase;margin:0 0 4px;display:flex;justify-content:space-between}\n#work .wt .hint{text-transform:none}\n#work h4{margin:9px 0 1px;font-size:13px;font-weight:700;color:#4a4a4a}\n#work h4:first-of-type{margin-top:2px}\n#work .eq{font-variant-numeric:tabular-nums}\n#work .n{font-family:\"IBM Plex Mono\",monospace;font-size:13px}\n#work b .n,#work .ans{font-weight:700}\n#work .note{font-size:12.5px;color:#4a4a4a;margin:2px 0 0}\n#work .ok{background:#e5f4ea;border-left:4px solid #1e7d45;padding:3px 8px;margin-top:4px}\n#work .bad{background:#fde7df;border-left:4px solid #c43a00;padding:3px 8px;margin-top:4px}\n.ivv{border-radius:2px;padding:0 2px;transition:background .25s}\n.ivv.gx{background:#ffe2d3}\n.ivv.hot{background:#ff6a2b;color:#fff}\n#ctl{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;align-content:start}\n.iv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:6px}\n.iv .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.iv .val{font:700 13px \"IBM Plex Mono\",monospace;white-space:nowrap}\n.iv input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:#111;height:22px}\n.iv input[type=radio]{accent-color:#ff6a2b;margin:0}\n#presets{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}\n#presets .lab{font:700 12px \"IBM Plex Mono\",monospace}\n#presets button{font:600 12.5px \"Space Grotesk\",sans-serif;padding:3px 8px;border:2px solid #111;background:#fff;cursor:pointer}\n#presets button:hover{background:#ffe2d3}\n#gcard{border:2px solid #111;padding:5px 8px 6px;display:flex;flex-direction:column;box-sizing:border-box;min-height:0}\n.ghead{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}\n.ghead select{font:600 13px \"Space Grotesk\",sans-serif;border:2px solid #111;padding:1px 4px;max-width:200px}\n#gv{width:340px;height:150px;flex:none;display:block;margin-top:3px}\n#dbl{font-size:12.5px;line-height:1.35;margin-top:2px}\n#dbl b{font-weight:700}\n.hint{font:500 11px \"IBM Plex Mono\",monospace;color:#4a4a4a}\n<\/style><\/head><body>\n<div id=\"app\">\n  <div id=\"bar\"><\/div>\n  <canvas id=\"cv\" width=\"1200\" height=\"660\" aria-label=\"Animation of the situation with force arrows\"><\/canvas>\n  <div id=\"work\" aria-live=\"polite\"><\/div>\n  <div id=\"ctl\"><\/div>\n  <div id=\"gcard\">\n    <div class=\"ghead\"><span>Graph<\/span><select id=\"dvsel\" aria-label=\"Quantity to graph\"><\/select><span>vs <b id=\"ivname\"><\/b><\/span><\/div>\n    <canvas id=\"gv\" width=\"680\" height=\"300\" aria-label=\"Graph of the chosen quantity against the chosen variable\"><\/canvas>\n    <div id=\"dbl\"><\/div>\n  <\/div>\n<\/div>\n<script>\n// ---------------- shared frame ----------------\nconst $ = id => document.getElementById(id);\nconst G10 = 10, PI = Math.PI, DEG = PI / 180;\nfunction fit(){ const s = Math.min(innerWidth / 1000, innerHeight / 640); $('app').style.transform = 'scale(' + s + ')'; }\naddEventListener('resize', fit); fit();\n\nfunction fnum(x){ const r = fnum0(x); return typeof r === 'string' ? r.replace(/^-/, '−') : r; }\nfunction fnum0(x){\n  if (x === null || x === undefined || !isFinite(x)) return '—';\n  const a = Math.abs(x);\n  if (a === 0) return '0';\n  if (a >= 1e5 || a < 1e-3){\n    const e = Math.floor(Math.log10(a)); let m = x / Math.pow(10, e);\n    let ms = m.toFixed(2); if (Math.abs(+ms) >= 10){ m /= 10; ms = m.toFixed(2); return ms + '×10<sup>' + (e + 1) + '<\/sup>'; }\n    return ms + '×10<sup>' + e + '<\/sup>';\n  }\n  if (a >= 1000) return String(Math.round(x));\n  return x.toPrecision(3);\n}\nfunction fplain(x){ return fnum(x).replace(/<sup>(.*?)<\\/sup>/g, (m, e) => '^' + e).replace('×10^', 'e'); }\nconst H = {\n  n: (x, u) => '<span class=\"n\">' + fnum(x) + (u ? '&nbsp;' + u : '') + '<\/span>',\n  iv: id => { const d = S.def[id]; const val = S.v[id]; const txt = (d.show ? d.show(val) : fnum(val) + (d.unit ? '&nbsp;' + d.unit : ''));\n              return '<span class=\"ivv n' + (S.gx === id ? ' gx' : '') + (S.hot === id ? ' hot' : '') + '\" data-iv=\"' + id + '\">' + txt + '<\/span>'; },\n  g: () => '<span class=\"n\">10&nbsp;m/s²<\/span>',\n  p: (x, u) => x < 0 ? '(' + H.n(x, u) + ')' : H.n(x, u)\n};\n\nconst S = { mode: null, opt: {}, v: {}, store: {}, def: {}, ivs: [], gx: null, dv: null, hot: null, t: 0, anim: {} };\n\nfunction bar(){\n  const b = $('bar'); b.innerHTML = '';\n  const group = (label, items, cur, onpick) => {\n    const g = document.createElement('div'); g.className = 'seg'; g.setAttribute('role', 'group');\n    if (label){ const l = document.createElement('span'); l.className = 'lab'; l.textContent = label; g.appendChild(l); }\n    items.forEach(([id, txt]) => { const bt = document.createElement('button'); bt.textContent = txt; bt.setAttribute('aria-pressed', String(id === cur)); bt.onclick = () => onpick(id); g.appendChild(bt); });\n    b.appendChild(g);\n  };\n  const tip = document.createElement('span'); tip.className = 'hint'; tip.style.marginLeft = 'auto'; tip.style.whiteSpace = 'nowrap'; tip.innerHTML = '● = the variable on the graph’s x-axis · drag any slider';\n  if (SIM.modes) group(null, SIM.modes.map(m => [m.id, m.label]), S.mode, id => { S.mode = id; S.anim = {}; setup(); });\n  (SIM.opts || []).filter(o => !o.modes || o.modes.includes(S.mode)).forEach(o => {\n    if (!(o.id in S.opt)) S.opt[o.id] = o.choices[0][0];\n    group(o.label, o.choices, S.opt[o.id], id => { S.opt[o.id] = id; S.anim = {}; setup(); });\n  });\n  b.appendChild(tip);\n  if (b.scrollWidth > b.clientWidth + 1) tip.remove();\n  if (b.scrollWidth > b.clientWidth + 1) b.querySelectorAll('.seg button').forEach(x => { x.style.fontSize = '13px'; x.style.padding = '6px 8px'; });\n}\n\nfunction setup(){\n  bar();\n  S.ivs = SIM.ivs(S.mode, S.opt); S.def = {}; S.v = {};\n  S.ivs.forEach(d => { S.def[d.id] = d; const k = S.mode + ':' + d.id; S.v[d.id] = (k in S.store) ? S.store[k] : d.val; });\n  if (!S.gx || !S.def[S.gx]) S.gx = S.ivs.find(d => d.graph) ? S.ivs.find(d => d.graph).id : S.ivs[1] ? S.ivs[1].id : S.ivs[0].id;\n  const c = $('ctl'); c.innerHTML = '';\n  S.ivs.forEach(d => {\n    const w = document.createElement('div'); w.className = 'iv';\n    w.innerHTML = '<input type=\"radio\" name=\"gx\" value=\"' + d.id + '\" aria-label=\"Graph against ' + d.label + '\" title=\"Put this on the graph’s x-axis\"' + (S.gx === d.id ? ' checked' : '') + '>' +\n      '<span class=\"nm\">' + d.label + ' <i>' + d.sym + '<\/i><\/span><span class=\"val\" id=\"val-' + d.id + '\"><\/span>' +\n      '<input type=\"range\" id=\"r-' + d.id + '\" min=\"' + d.min + '\" max=\"' + d.max + '\" step=\"' + d.step + '\" value=\"' + S.v[d.id] + '\" aria-label=\"' + d.label + '\">';\n    c.appendChild(w);\n    const r = w.querySelector('input[type=range]');\n    r.oninput = () => { S.v[d.id] = +r.value; S.store[S.mode + ':' + d.id] = +r.value; S.hot = d.id; clearTimeout(S.hotT); S.hotT = setTimeout(() => { S.hot = null; update(); }, 700); S.anim.reset = true; update(); };\n    w.querySelector('input[type=radio]').onchange = () => { S.gx = d.id; update(); };\n  });\n  if (SIM.presets){\n    const p = document.createElement('div'); p.id = 'presets'; p.innerHTML = '<span class=\"lab\">Try:<\/span>';\n    SIM.presets.forEach(ps => { const bt = document.createElement('button'); bt.textContent = ps.label; bt.onclick = () => { if (ps.mode && ps.mode !== S.mode){ S.mode = ps.mode; } Object.entries(ps.v).forEach(([k, val]) => S.store[(ps.mode || S.mode) + ':' + k] = val); S.anim = {}; setup(); }; p.appendChild(bt); });\n    c.appendChild(p);\n  }\n  const dvs = SIM.dvs(S.mode, S.opt), sel = $('dvsel');\n  if (!S.dv || !dvs.find(d => d.id === S.dv)) S.dv = dvs[0].id;\n  sel.innerHTML = dvs.map(d => '<option value=\"' + d.id + '\"' + (d.id === S.dv ? ' selected' : '') + '>' + d.name + '<\/option>').join('');\n  sel.onchange = () => { S.dv = sel.value; update(); };\n  update();\n}\n\nfunction calcWith(over){ const v = Object.assign({}, S.v, over || {}); return SIM.calc(v, S.mode, S.opt); }\n\nfunction update(){\n  S.ivs.forEach(d => { $('val-' + d.id).innerHTML = d.show ? d.show(S.v[d.id]) : fnum(S.v[d.id]) + (d.unit ? '&nbsp;' + d.unit : ''); });\n  S.d = calcWith();\n  $('work').innerHTML = '<div class=\"wt\"><span>Show the work<\/span><span class=\"hint\">' + (SIM.hint || 'g = 10 m/s²') + '<\/span><\/div>' + SIM.work(S.v, S.d, S.mode, S.opt);\n  document.querySelectorAll('input[name=gx]').forEach(r => r.checked = (r.value === S.gx));\n  graph();\n}\n\nfunction graph(){\n  const cv = $('gv'), g = cv.getContext('2d'), W = 340, Hh = 150; g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, W, Hh);\n  const dvs = SIM.dvs(S.mode, S.opt), dv = dvs.find(d => d.id === S.dv), ref = dv.vs ? dvs.find(d => d.id === dv.vs) : null;\n  const x = S.def[S.gx]; $('ivname').innerHTML = '<i>' + x.sym + '<\/i>' + (x.unit && !x.show ? ' (' + x.unit + ')' : '');\n  const N = 160, xs = [], ys = [], rs = [];\n  for (let i = 0; i <= N; i++){ const xv = x.min + (x.max - x.min) * i / N; const d = calcWith({ [S.gx]: xv }); xs.push(xv); ys.push(dv.f(d)); rs.push(ref ? ref.f(d) : null); }\n  const all = ys.concat(ref ? rs : []).filter(isFinite);\n  let ymin = Math.min(0, ...all), ymax = Math.max(...all, 0); if (ymax === ymin) ymax = ymin + 1; const pad = (ymax - ymin) * 0.08; ymax += pad; if (ymin < 0) ymin -= pad;\n  const L = 46, R = 8, T = 8, B = 22, X = v => L + (v - x.min) / (x.max - x.min) * (W - L - R), Y = v => T + (ymax - v) / (ymax - ymin) * (Hh - T - B);\n  g.strokeStyle = '#111'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(L, T); g.lineTo(L, Hh - B); g.lineTo(W - R, Hh - B); g.stroke();\n  if (ymin < 0){ g.strokeStyle = '#999'; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(W - R, Y(0)); g.stroke(); g.setLineDash([]);\n    if (dv.negNote){ g.fillStyle = 'rgba(196,58,0,0.08)'; g.fillRect(L, Y(0), W - R - L, Hh - B - Y(0)); g.fillStyle = '#c43a00'; g.font = '600 10px \"Space Grotesk\",sans-serif'; g.textAlign = 'left'; g.fillText(dv.negNote, L + 4, Hh - B - 4); } }\n  g.font = '500 10px \"IBM Plex Mono\",monospace'; g.fillStyle = '#4a4a4a'; g.textAlign = 'right';\n  g.fillText(fplain(ymax), L - 4, T + 8); g.fillText(fplain(ymin < 0 ? ymin : 0), L - 4, Hh - B); if (ymin < 0) g.fillText('0', L - 4, Y(0) + 3);\n  g.textAlign = 'center'; g.fillText(fplain(x.min), L, Hh - 8); g.fillText(fplain(x.max), W - R - 10, Hh - 8);\n  g.fillText((x.symText || x.id) + (x.unit ? ' (' + x.unit + ')' : ''), (L + W) / 2, Hh - 8);\n  g.save(); g.translate(10, (T + Hh - B) / 2); g.rotate(-PI / 2); g.textAlign = 'center'; g.fillText(dv.short + (dv.unit ? ' (' + dv.unit + ')' : ''), 0, 0); g.restore();\n  const line = (arr, col, dash) => { g.strokeStyle = col; g.lineWidth = 2.2; g.setLineDash(dash || []); g.beginPath(); let on = false; arr.forEach((y, i) => { if (!isFinite(y)){ on = false; return; } const px = X(xs[i]), py = Math.max(T - 4, Math.min(Hh - B + 4, Y(y))); on ? g.lineTo(px, py) : g.moveTo(px, py); on = true; }); g.stroke(); g.setLineDash([]); };\n  if (ref){ line(rs, '#4a4a4a', [5, 4]); g.fillStyle = '#4a4a4a'; g.textAlign = 'right'; g.font = '600 10px \"Space Grotesk\",sans-serif'; const lastY = rs.filter(isFinite).pop(); if (isFinite(lastY)) g.fillText(ref.short, W - R - 2, Math.max(T + 9, Y(lastY) - 4)); }\n  line(ys, '#1546d6');\n  const cx = S.v[S.gx], cy = dv.f(S.d);\n  if (isFinite(cy)){ g.strokeStyle = '#ff6a2b'; g.setLineDash([2, 3]); g.lineWidth = 1; g.beginPath(); g.moveTo(X(cx), Hh - B); g.lineTo(X(cx), Y(cy)); g.lineTo(L, Y(cy)); g.stroke(); g.setLineDash([]);\n    g.fillStyle = '#ff6a2b'; g.strokeStyle = '#111'; g.lineWidth = 1.5; g.beginPath(); g.arc(X(cx), Math.max(T, Math.min(Hh - B, Y(cy))), 4.5, 0, 7); g.fill(); g.stroke(); }\n  // doubling readout\n  const d2 = calcWith({ [S.gx]: cx * 2 }), y1 = dv.f(S.d), y2 = dv.f(d2);\n  let msg = '';\n  if (cx === 0 || Math.abs(y1) < 1e-12) msg = '<span class=\"hint\">Move off zero to see the ×2 test.<\/span>';\n  else if (!isFinite(y1) || !isFinite(y2)) msg = '<span class=\"hint\">The ×2 test doesn’t apply here (doubling takes it outside what this quantity covers).<\/span>';\n  else {\n    const k = y2 / y1;\n    if (k < 0){ $('dbl').innerHTML = 'If <b>' + x.sym + '<\/b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '<\/b> goes from ' + fnum(y1) + ' to ' + fnum(y2) + (dv.unit ? ' ' + dv.unit : '') + (dv.signOK ? ': it changes sign. ' + dv.signOK : ': it changes sign, so that can’t really happen.'); return; }\n    const tags = [[1, 'doesn’t depend on it'], [2, 'proportional'], [4, 'goes as the square'], [0.5, 'inversely proportional'], [0.25, 'inverse square'], [Math.SQRT2, 'goes as the square root'], [Math.SQRT1_2, 'goes as 1/√'], [8, 'goes as the cube'], [2 * Math.SQRT2, 'goes as the 3/2 power']];\n    const tag = tags.find(([v]) => Math.abs(k - v) < 0.004 * v);\n    msg = 'If <b>' + x.sym + '<\/b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '<\/b> becomes <b>×' + (Math.abs(k) >= 100 ? fnum(k) : k.toFixed(2)) + '<\/b>' + (tag && !dv.noTag ? ' — ' + tag[1] : '') + '.' + (dv.dblNote ? ' <span class=\"hint\">' + dv.dblNote + '<\/span>' : '');\n  }\n  $('dbl').innerHTML = msg;\n}\n\n// drawing helpers (canvas is drawn in 600×330 units)\nconst cv = $('cv'), ctx = cv.getContext('2d');\nfunction arrow(x1, y1, x2, y2, col, label, opts){\n  opts = opts || {}; const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy); if (len < 2) return;\n  const ux = dx / len, uy = dy / len, hw = opts.head || 9;\n  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = opts.w || 3.5; ctx.lineCap = 'round';\n  if (opts.dash) ctx.setLineDash(opts.dash);\n  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hw * 0.8, y2 - uy * hw * 0.8); ctx.stroke(); ctx.setLineDash([]);\n  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - ux * hw - uy * hw * 0.55, y2 - uy * hw + ux * hw * 0.55); ctx.lineTo(x2 - ux * hw + uy * hw * 0.55, y2 - uy * hw - ux * hw * 0.55); ctx.closePath(); ctx.fill();\n  if (label){ ctx.font = '700 13px \"Space Grotesk\",sans-serif'; ctx.textAlign = opts.align || 'left'; ctx.textBaseline = 'middle';\n    const lx = x2 + (opts.lx !== undefined ? opts.lx : (ux >= 0 ? 6 : -6)), ly = y2 + (opts.ly !== undefined ? opts.ly : (uy >= 0 ? 10 : -10));\n    if (opts.align === undefined) ctx.textAlign = ux >= -0.2 ? 'left' : 'right';\n    ctx.fillText(label, lx, ly); }\n  ctx.restore();\n}\nfunction text(s, x, y, o){ o = o || {}; ctx.save(); ctx.font = (o.font || '600 13px \"Space Grotesk\",sans-serif'); ctx.fillStyle = o.col || '#111'; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic'; ctx.fillText(s, x, y); ctx.restore(); }\nfunction panelTitle(s, x, y){ text(s, x, y, { font: '700 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); }\nconst COL = { F: '#c43a00', W: '#111', N: '#1e7d45', V: '#1546d6', T: '#7a3fb0', comp: '#8a8a8a' };\n\nlet last = 0;\nfunction loop(ts){ const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts; S.t += dt;\n  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, 600, 330);\n  SIM.draw(S.v, S.d, S.mode, S.opt, S.t, dt, S.anim); S.anim.reset = false;\n  requestAnimationFrame(loop); }\n\n// ---------------- this sim ----------------\n// Rotational Inertia: I = Σmr² for beads on a rod, and the standard shapes. Same torque → α = τ/I.\nconst SHAPES = [['hoop', 'Hoop', 1, 'MR²'], ['disk', 'Disk', 0.5, '½MR²'], ['shell', 'Hollow sphere', 2 / 3, '⅔MR²'], ['ball', 'Solid sphere', 0.4, '⅖MR²'], ['rodc', 'Rod (center)', 1 / 12, '1/12 ML²'], ['rode', 'Rod (end)', 1 / 3, '⅓ML²']];\nconst SIM = {\n  title: 'Rotational Inertia',\n  modes: [{ id: 'beads', label: 'Beads on a rod' }, { id: 'shapes', label: 'Shapes' }],\n  opts: [{ id: 'shape', label: 'Spin the', modes: ['shapes'], choices: SHAPES.map(s => [s[0], s[1]]) }],\n  ivs(mode){\n    if (mode === 'beads') return [\n      { id: 'm', sym: 'm', symText: 'm', label: 'Each bead', unit: 'kg', min: 0.1, max: 2, step: 0.05, val: 0.5 },\n      { id: 'r', sym: 'r', symText: 'r', label: 'Bead distance from the axle', unit: 'm', min: 0.05, max: 0.5, step: 0.01, val: 0.3, graph: true },\n      { id: 'M', sym: 'M', symText: 'M', label: 'Rod mass (1 m long)', unit: 'kg', min: 0, max: 2, step: 0.05, val: 0.4 },\n      { id: 'tau', sym: 'τ', symText: 'τ', label: 'Torque applied', unit: 'N·m', min: 0.1, max: 5, step: 0.1, val: 1 }];\n    return [\n      { id: 'M', sym: 'M', symText: 'M', label: 'Mass', unit: 'kg', min: 0.5, max: 5, step: 0.1, val: 2 },\n      { id: 'R', sym: 'R', symText: 'R or L', label: 'Radius (rods: length)', unit: 'm', min: 0.1, max: 1, step: 0.01, val: 0.3, graph: true },\n      { id: 'tau', sym: 'τ', symText: 'τ', label: 'Torque applied', unit: 'N·m', min: 0.1, max: 5, step: 0.1, val: 1 }];\n  },\n  presets: [{ label: 'Beads in close', mode: 'beads', v: { r: 0.05 } }, { label: 'Beads at the ends', mode: 'beads', v: { r: 0.5 } }, { label: 'Massless rod', mode: 'beads', v: { M: 0 } }],\n  calc(v, mode, opt){\n    if (mode === 'beads'){ const Ib = 2 * v.m * v.r * v.r, Ir = v.M / 12, I = Ib + Ir, al = v.tau / I; return { Ib, Ir, I, al, t3: 0.5 * al * 9 }; }\n    const s = SHAPES.find(x => x[0] === (opt.shape || 'hoop')), I = s[2] * v.M * v.R * v.R, al = v.tau / I;\n    return { s, I, al, all: SHAPES.map(x => [x[1], x[2] * v.M * v.R * v.R, x[3]]) };\n  },\n  dvs(){ return [\n    { id: 'I', name: 'Rotational inertia I', short: 'I', sym: 'I', unit: 'kg·m²', f: d => d.I },\n    { id: 'al', name: 'Angular acceleration α = τ/I', short: 'α', sym: 'α', unit: 'rad/s²', f: d => d.al }]; },\n  work(v, d, mode){\n    if (mode === 'beads') return '<h4>1 · Rotational inertia: I = Σmr²<\/h4><div class=\"eq\">Two beads: 2mr² = 2(' + H.iv('m') + ')(' + H.iv('r') + ')² = ' + H.n(d.Ib, 'kg·m²') + '<\/div>' +\n      '<div class=\"eq\">Rod about its center: (1/12)ML² = (1/12)(' + H.iv('M') + ')(1 m)² = ' + H.n(d.Ir, 'kg·m²') + '<\/div>' +\n      '<div class=\"eq\">Total I = <b>' + H.n(d.I, 'kg·m²') + '<\/b><\/div>' +\n      '<h4>2 · Newton’s 2nd law for rotation: τ = Iα<\/h4><div class=\"eq\">α = τ/I = ' + H.iv('tau') + ' / ' + H.n(d.I) + ' = <b>' + H.n(d.al, 'rad/s²') + '<\/b><\/div>' +\n      '<p class=\"note\">I depends on <b>where<\/b> the mass is, not just how much. Move the beads twice as far out: their part of I goes up ×4 (r²).<\/p>' +\n      '<p class=\"note\">Same idea as m in F = ma: bigger I, harder to change the spin.<\/p>';\n    return '<h4>1 · I depends on the shape: where the mass sits relative to the axis<\/h4><div class=\"eq\">' + d.s[1] + ': I = ' + d.s[3] + ' = ' + H.n(d.s[2]) + ' × (' + H.iv('M') + ')(' + H.iv('R') + ')² = <b>' + H.n(d.I, 'kg·m²') + '<\/b><\/div>' +\n      '<p class=\"note\">Hoop: all the mass at R → biggest (for the round shapes). Solid sphere: lots of mass near the center → smallest.<\/p>' +\n      '<h4>2 · Same torque, different shapes<\/h4><div class=\"eq\">α = τ/I = ' + H.iv('tau') + ' / ' + H.n(d.I) + ' = <b>' + H.n(d.al, 'rad/s²') + '<\/b><\/div>' +\n      '<h4>3 · A rod: same rod, different axis<\/h4><div class=\"eq\">About its center (1/12)ML², about one end (1/3)ML²: 4× bigger, because more of the mass is far from the axis.<\/div>' +\n      '<p class=\"note\">On the AP exam you’re given these formulas; the skill is comparing them and explaining why.<\/p>';\n  },\n  draw(v, d, mode, opt, t, dt, A){\n    if (A.t === undefined || A.reset) A.t = 0; A.t += dt; const tt = A.t % 3.5, q = Math.min(tt, 3), ang = 0.5 * d.al * q * q;\n    if (mode === 'beads'){\n      panelTitle('ROD WITH TWO BEADS (top view, starts from rest)', 10, 18);\n      const cx = 190, cy = 165, sc = 240;\n      ctx.save(); ctx.translate(cx, cy); ctx.rotate(-ang);\n      ctx.fillStyle = v.M > 0 ? '#9aa7b8' : '#ddd'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1; ctx.fillRect(-0.5 * sc, -4, sc, 8); ctx.strokeRect(-0.5 * sc, -4, sc, 8);\n      [-1, 1].forEach(sg => { const bs = 8 + 8 * Math.sqrt(v.m); ctx.fillStyle = '#ff6a2b'; ctx.beginPath(); ctx.arc(sg * v.r * sc, 0, bs, 0, 7); ctx.fill(); ctx.stroke(); });\n      ctx.restore(); ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(cx, cy, 8, 0, 7); ctx.fill();\n      text('after 3 s: ' + fplain(d.t3 / (2 * PI)) + ' rev', 12, 300, { font: '700 13px \"Space Grotesk\",sans-serif' });\n      text('I = ' + fplain(d.I) + ' kg·m²   α = ' + fplain(d.al) + ' rad/s²', 12, 318, { font: '600 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n      panelTitle('WHERE THE INERTIA COMES FROM', 395, 18);\n      const mx = Math.max(d.I, 1e-6), bar = (y, val, col, lab) => { const w = 85 * val / mx; ctx.fillStyle = col; ctx.fillRect(470, y, w, 14); text(lab, 465, y + 11, { align: 'right', font: '600 10px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); text(fplain(val), 474 + w, y + 11, { font: '600 10px \"IBM Plex Mono\",monospace' }); };\n      bar(45, d.Ib, '#ff6a2b', 'beads 2mr²'); bar(70, d.Ir, '#9aa7b8', 'rod ML²/12'); bar(95, d.I, '#111', 'total I');\n      return;\n    }\n    panelTitle('SAME TORQUE ON EACH SHAPE (same M and R)', 10, 18);\n    const all = d.all, amx = Math.max(...all.map(a => v.tau / a[1]));\n    all.forEach(([name, I, f], i) => { const col = i % 3, row = Math.floor(i / 3), cx = 70 + col * 120, cy = 90 + row * 120, sel = SHAPES[i][0] === (opt.shape || 'hoop'), a = 0.5 * (v.tau / I) * q * q, r = 34;\n      ctx.save(); ctx.translate(cx, cy); ctx.rotate(-a); ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5;\n      const id = SHAPES[i][0];\n      if (id === 'hoop'){ ctx.lineWidth = 6; ctx.strokeStyle = '#1546d6'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke(); }\n      else if (id === 'disk'){ ctx.fillStyle = '#1546d6'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); }\n      else if (id === 'shell'){ const g = ctx.createRadialGradient(0, 0, r * 0.6, 0, 0, r); g.addColorStop(0, '#eef'); g.addColorStop(1, '#1546d6'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); }\n      else if (id === 'ball'){ const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r); g.addColorStop(0, '#0c2a8a'); g.addColorStop(1, '#6f8ff0'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); }\n      else if (id === 'rodc'){ ctx.fillStyle = '#1546d6'; ctx.fillRect(-r, -4, 2 * r, 8); }\n      else { ctx.fillStyle = '#1546d6'; ctx.fillRect(0, -4, 2 * r, 8); }\n      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; if (id !== 'rodc' && id !== 'rode'){ ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r, 0); ctx.stroke(); }\n      ctx.restore(); ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, 7); ctx.fill();\n      if (sel){ ctx.strokeStyle = '#ff6a2b'; ctx.lineWidth = 3; ctx.strokeRect(cx - 55, cy - 50, 110, 110); }\n      text(name + '  ' + f, cx, cy + 50, { align: 'center', font: '700 10px \"Space Grotesk\",sans-serif' }); });\n    panelTitle('ANGULAR ACCELERATION α = τ/I', 395, 18);\n    all.forEach(([name, I], i) => { const y = 40 + i * 26, w = 70 * (v.tau / I) / amx; ctx.fillStyle = SHAPES[i][0] === (opt.shape || 'hoop') ? '#ff6a2b' : '#9aa7b8'; ctx.fillRect(490, y, w, 14); text(name, 485, y + 11, { align: 'right', font: '600 9px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); text(fplain(v.tau / I), 494 + w, y + 11, { font: '600 9px \"IBM Plex Mono\",monospace' }); });\n    text('biggest I → smallest α', 395, 210, { font: '600 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n  }\n};\n\n\nS.mode = SIM.modes ? SIM.modes[0].id : 'one';\nsetup(); requestAnimationFrame(loop);\nwindow.APP = { select(name){ const m = (SIM.modes || []).find(m => m.label === name || m.id === name); if (m && m.id !== S.mode){ S.mode = m.id; S.anim = {}; setup(); } } };\naddEventListener('message', e => { const d = e.data; if (d && d.select) try { APP.select(d.select); } catch (er) {} });\n<\/script>\n<\/body><\/html>\n"},
"mpulley":{ar:"1000 / 640",html:"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Massive Pulley<\/title>\n<\!-- Massive Pulley: original Holmes Sims, built from frame.html + mpulley.js. g = 10 m/s². -->\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap\">\n<style>\nhtml,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:\"Space Grotesk\",system-ui,sans-serif;color:#111}\n#app{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0;padding:10px 14px 12px;box-sizing:border-box;\n  display:grid;grid-template-columns:600px 1fr;grid-template-rows:34px 330px 1fr;gap:10px 14px}\n#bar{grid-column:1/-1;display:flex;gap:16px;align-items:center;flex-wrap:nowrap;overflow:hidden}\n.seg{display:flex;align-items:center}\n.seg .lab{font:700 12px \"IBM Plex Mono\",monospace;margin-right:8px;text-transform:uppercase}\n.seg button{white-space:nowrap;font:700 14px \"Space Grotesk\",sans-serif;padding:6px 11px;border:2px solid #111;background:#fff;color:#111;cursor:pointer}\n.seg button+button{margin-left:-2px}\n.seg button[aria-pressed=\"true\"]{background:#111;color:#fff}\n.seg button:hover:not([aria-pressed=\"true\"]){background:#ffe2d3}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ff6a2b;outline-offset:2px;position:relative;z-index:1}\n#cv{border:2px solid #111;background:#fbfbfb;width:600px;height:330px;box-sizing:border-box;display:block}\n#work{border:2px solid #111;padding:8px 12px 10px;overflow:auto;font-size:14px;line-height:1.55;box-sizing:border-box}\n#work .wt{font:700 12px \"IBM Plex Mono\",monospace;text-transform:uppercase;margin:0 0 4px;display:flex;justify-content:space-between}\n#work .wt .hint{text-transform:none}\n#work h4{margin:9px 0 1px;font-size:13px;font-weight:700;color:#4a4a4a}\n#work h4:first-of-type{margin-top:2px}\n#work .eq{font-variant-numeric:tabular-nums}\n#work .n{font-family:\"IBM Plex Mono\",monospace;font-size:13px}\n#work b .n,#work .ans{font-weight:700}\n#work .note{font-size:12.5px;color:#4a4a4a;margin:2px 0 0}\n#work .ok{background:#e5f4ea;border-left:4px solid #1e7d45;padding:3px 8px;margin-top:4px}\n#work .bad{background:#fde7df;border-left:4px solid #c43a00;padding:3px 8px;margin-top:4px}\n.ivv{border-radius:2px;padding:0 2px;transition:background .25s}\n.ivv.gx{background:#ffe2d3}\n.ivv.hot{background:#ff6a2b;color:#fff}\n#ctl{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;align-content:start}\n.iv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:6px}\n.iv .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.iv .val{font:700 13px \"IBM Plex Mono\",monospace;white-space:nowrap}\n.iv input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:#111;height:22px}\n.iv input[type=radio]{accent-color:#ff6a2b;margin:0}\n#presets{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}\n#presets .lab{font:700 12px \"IBM Plex Mono\",monospace}\n#presets button{font:600 12.5px \"Space Grotesk\",sans-serif;padding:3px 8px;border:2px solid #111;background:#fff;cursor:pointer}\n#presets button:hover{background:#ffe2d3}\n#gcard{border:2px solid #111;padding:5px 8px 6px;display:flex;flex-direction:column;box-sizing:border-box;min-height:0}\n.ghead{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}\n.ghead select{font:600 13px \"Space Grotesk\",sans-serif;border:2px solid #111;padding:1px 4px;max-width:200px}\n#gv{width:340px;height:150px;flex:none;display:block;margin-top:3px}\n#dbl{font-size:12.5px;line-height:1.35;margin-top:2px}\n#dbl b{font-weight:700}\n.hint{font:500 11px \"IBM Plex Mono\",monospace;color:#4a4a4a}\n<\/style><\/head><body>\n<div id=\"app\">\n  <div id=\"bar\"><\/div>\n  <canvas id=\"cv\" width=\"1200\" height=\"660\" aria-label=\"Animation of the situation with force arrows\"><\/canvas>\n  <div id=\"work\" aria-live=\"polite\"><\/div>\n  <div id=\"ctl\"><\/div>\n  <div id=\"gcard\">\n    <div class=\"ghead\"><span>Graph<\/span><select id=\"dvsel\" aria-label=\"Quantity to graph\"><\/select><span>vs <b id=\"ivname\"><\/b><\/span><\/div>\n    <canvas id=\"gv\" width=\"680\" height=\"300\" aria-label=\"Graph of the chosen quantity against the chosen variable\"><\/canvas>\n    <div id=\"dbl\"><\/div>\n  <\/div>\n<\/div>\n<script>\n// ---------------- shared frame ----------------\nconst $ = id => document.getElementById(id);\nconst G10 = 10, PI = Math.PI, DEG = PI / 180;\nfunction fit(){ const s = Math.min(innerWidth / 1000, innerHeight / 640); $('app').style.transform = 'scale(' + s + ')'; }\naddEventListener('resize', fit); fit();\n\nfunction fnum(x){ const r = fnum0(x); return typeof r === 'string' ? r.replace(/^-/, '−') : r; }\nfunction fnum0(x){\n  if (x === null || x === undefined || !isFinite(x)) return '—';\n  const a = Math.abs(x);\n  if (a === 0) return '0';\n  if (a >= 1e5 || a < 1e-3){\n    const e = Math.floor(Math.log10(a)); let m = x / Math.pow(10, e);\n    let ms = m.toFixed(2); if (Math.abs(+ms) >= 10){ m /= 10; ms = m.toFixed(2); return ms + '×10<sup>' + (e + 1) + '<\/sup>'; }\n    return ms + '×10<sup>' + e + '<\/sup>';\n  }\n  if (a >= 1000) return String(Math.round(x));\n  return x.toPrecision(3);\n}\nfunction fplain(x){ return fnum(x).replace(/<sup>(.*?)<\\/sup>/g, (m, e) => '^' + e).replace('×10^', 'e'); }\nconst H = {\n  n: (x, u) => '<span class=\"n\">' + fnum(x) + (u ? '&nbsp;' + u : '') + '<\/span>',\n  iv: id => { const d = S.def[id]; const val = S.v[id]; const txt = (d.show ? d.show(val) : fnum(val) + (d.unit ? '&nbsp;' + d.unit : ''));\n              return '<span class=\"ivv n' + (S.gx === id ? ' gx' : '') + (S.hot === id ? ' hot' : '') + '\" data-iv=\"' + id + '\">' + txt + '<\/span>'; },\n  g: () => '<span class=\"n\">10&nbsp;m/s²<\/span>',\n  p: (x, u) => x < 0 ? '(' + H.n(x, u) + ')' : H.n(x, u)\n};\n\nconst S = { mode: null, opt: {}, v: {}, store: {}, def: {}, ivs: [], gx: null, dv: null, hot: null, t: 0, anim: {} };\n\nfunction bar(){\n  const b = $('bar'); b.innerHTML = '';\n  const group = (label, items, cur, onpick) => {\n    const g = document.createElement('div'); g.className = 'seg'; g.setAttribute('role', 'group');\n    if (label){ const l = document.createElement('span'); l.className = 'lab'; l.textContent = label; g.appendChild(l); }\n    items.forEach(([id, txt]) => { const bt = document.createElement('button'); bt.textContent = txt; bt.setAttribute('aria-pressed', String(id === cur)); bt.onclick = () => onpick(id); g.appendChild(bt); });\n    b.appendChild(g);\n  };\n  const tip = document.createElement('span'); tip.className = 'hint'; tip.style.marginLeft = 'auto'; tip.style.whiteSpace = 'nowrap'; tip.innerHTML = '● = the variable on the graph’s x-axis · drag any slider';\n  if (SIM.modes) group(null, SIM.modes.map(m => [m.id, m.label]), S.mode, id => { S.mode = id; S.anim = {}; setup(); });\n  (SIM.opts || []).filter(o => !o.modes || o.modes.includes(S.mode)).forEach(o => {\n    if (!(o.id in S.opt)) S.opt[o.id] = o.choices[0][0];\n    group(o.label, o.choices, S.opt[o.id], id => { S.opt[o.id] = id; S.anim = {}; setup(); });\n  });\n  b.appendChild(tip);\n  if (b.scrollWidth > b.clientWidth + 1) tip.remove();\n  if (b.scrollWidth > b.clientWidth + 1) b.querySelectorAll('.seg button').forEach(x => { x.style.fontSize = '13px'; x.style.padding = '6px 8px'; });\n}\n\nfunction setup(){\n  bar();\n  S.ivs = SIM.ivs(S.mode, S.opt); S.def = {}; S.v = {};\n  S.ivs.forEach(d => { S.def[d.id] = d; const k = S.mode + ':' + d.id; S.v[d.id] = (k in S.store) ? S.store[k] : d.val; });\n  if (!S.gx || !S.def[S.gx]) S.gx = S.ivs.find(d => d.graph) ? S.ivs.find(d => d.graph).id : S.ivs[1] ? S.ivs[1].id : S.ivs[0].id;\n  const c = $('ctl'); c.innerHTML = '';\n  S.ivs.forEach(d => {\n    const w = document.createElement('div'); w.className = 'iv';\n    w.innerHTML = '<input type=\"radio\" name=\"gx\" value=\"' + d.id + '\" aria-label=\"Graph against ' + d.label + '\" title=\"Put this on the graph’s x-axis\"' + (S.gx === d.id ? ' checked' : '') + '>' +\n      '<span class=\"nm\">' + d.label + ' <i>' + d.sym + '<\/i><\/span><span class=\"val\" id=\"val-' + d.id + '\"><\/span>' +\n      '<input type=\"range\" id=\"r-' + d.id + '\" min=\"' + d.min + '\" max=\"' + d.max + '\" step=\"' + d.step + '\" value=\"' + S.v[d.id] + '\" aria-label=\"' + d.label + '\">';\n    c.appendChild(w);\n    const r = w.querySelector('input[type=range]');\n    r.oninput = () => { S.v[d.id] = +r.value; S.store[S.mode + ':' + d.id] = +r.value; S.hot = d.id; clearTimeout(S.hotT); S.hotT = setTimeout(() => { S.hot = null; update(); }, 700); S.anim.reset = true; update(); };\n    w.querySelector('input[type=radio]').onchange = () => { S.gx = d.id; update(); };\n  });\n  if (SIM.presets){\n    const p = document.createElement('div'); p.id = 'presets'; p.innerHTML = '<span class=\"lab\">Try:<\/span>';\n    SIM.presets.forEach(ps => { const bt = document.createElement('button'); bt.textContent = ps.label; bt.onclick = () => { if (ps.mode && ps.mode !== S.mode){ S.mode = ps.mode; } Object.entries(ps.v).forEach(([k, val]) => S.store[(ps.mode || S.mode) + ':' + k] = val); S.anim = {}; setup(); }; p.appendChild(bt); });\n    c.appendChild(p);\n  }\n  const dvs = SIM.dvs(S.mode, S.opt), sel = $('dvsel');\n  if (!S.dv || !dvs.find(d => d.id === S.dv)) S.dv = dvs[0].id;\n  sel.innerHTML = dvs.map(d => '<option value=\"' + d.id + '\"' + (d.id === S.dv ? ' selected' : '') + '>' + d.name + '<\/option>').join('');\n  sel.onchange = () => { S.dv = sel.value; update(); };\n  update();\n}\n\nfunction calcWith(over){ const v = Object.assign({}, S.v, over || {}); return SIM.calc(v, S.mode, S.opt); }\n\nfunction update(){\n  S.ivs.forEach(d => { $('val-' + d.id).innerHTML = d.show ? d.show(S.v[d.id]) : fnum(S.v[d.id]) + (d.unit ? '&nbsp;' + d.unit : ''); });\n  S.d = calcWith();\n  $('work').innerHTML = '<div class=\"wt\"><span>Show the work<\/span><span class=\"hint\">' + (SIM.hint || 'g = 10 m/s²') + '<\/span><\/div>' + SIM.work(S.v, S.d, S.mode, S.opt);\n  document.querySelectorAll('input[name=gx]').forEach(r => r.checked = (r.value === S.gx));\n  graph();\n}\n\nfunction graph(){\n  const cv = $('gv'), g = cv.getContext('2d'), W = 340, Hh = 150; g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, W, Hh);\n  const dvs = SIM.dvs(S.mode, S.opt), dv = dvs.find(d => d.id === S.dv), ref = dv.vs ? dvs.find(d => d.id === dv.vs) : null;\n  const x = S.def[S.gx]; $('ivname').innerHTML = '<i>' + x.sym + '<\/i>' + (x.unit && !x.show ? ' (' + x.unit + ')' : '');\n  const N = 160, xs = [], ys = [], rs = [];\n  for (let i = 0; i <= N; i++){ const xv = x.min + (x.max - x.min) * i / N; const d = calcWith({ [S.gx]: xv }); xs.push(xv); ys.push(dv.f(d)); rs.push(ref ? ref.f(d) : null); }\n  const all = ys.concat(ref ? rs : []).filter(isFinite);\n  let ymin = Math.min(0, ...all), ymax = Math.max(...all, 0); if (ymax === ymin) ymax = ymin + 1; const pad = (ymax - ymin) * 0.08; ymax += pad; if (ymin < 0) ymin -= pad;\n  const L = 46, R = 8, T = 8, B = 22, X = v => L + (v - x.min) / (x.max - x.min) * (W - L - R), Y = v => T + (ymax - v) / (ymax - ymin) * (Hh - T - B);\n  g.strokeStyle = '#111'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(L, T); g.lineTo(L, Hh - B); g.lineTo(W - R, Hh - B); g.stroke();\n  if (ymin < 0){ g.strokeStyle = '#999'; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(W - R, Y(0)); g.stroke(); g.setLineDash([]);\n    if (dv.negNote){ g.fillStyle = 'rgba(196,58,0,0.08)'; g.fillRect(L, Y(0), W - R - L, Hh - B - Y(0)); g.fillStyle = '#c43a00'; g.font = '600 10px \"Space Grotesk\",sans-serif'; g.textAlign = 'left'; g.fillText(dv.negNote, L + 4, Hh - B - 4); } }\n  g.font = '500 10px \"IBM Plex Mono\",monospace'; g.fillStyle = '#4a4a4a'; g.textAlign
