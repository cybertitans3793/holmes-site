0\" step=\"1\" value=\"12\"><\/label>\n      <label for=\"m\"><span>Mass of cart <b id=\"mo\"><\/b><\/span><input id=\"m\" type=\"range\" min=\"0.5\" max=\"8\" step=\"0.5\" value=\"2\"><\/label>\n      <label for=\"us\"><span>Static friction μ<sub>s<\/sub> <b id=\"uso\"><\/b><\/span><input id=\"us\" type=\"range\" min=\"0\" max=\"0.6\" step=\"0.05\" value=\"0.25\"><\/label>\n      <label for=\"uk\"><span>Kinetic friction μ<sub>k<\/sub> <b id=\"uko\"><\/b><\/span><input id=\"uk\" type=\"range\" min=\"0\" max=\"0.6\" step=\"0.05\" value=\"0.20\"><\/label>\n      <canvas id=\"vt\" width=\"560\" height=\"120\" aria-label=\"Velocity versus time graph\" style=\"grid-column:1/-1\"><\/canvas>\n    <\/div>\n    <div class=\"side\">\n      <div class=\"ro\" id=\"ro\"><\/div>\n      <div class=\"btns\"><button class=\"go\" id=\"go\">Run<\/button><button id=\"reset\">Reset<\/button><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<script>\nconst $=id=>document.getElementById(id), g=10, cv=$('cv'), ctx=cv.getContext('2d'), vc=$('vt'), vx=vc.getContext('2d');\nconst S={x:0,v:0,t:0,run:false,hist:[]};\nfunction fit(){ const s=Math.min(innerWidth/960, innerHeight/600); $('app').style.transform='scale('+s+')'; }\naddEventListener('resize',fit); fit();\nfunction P(){ const F=+$('f').value, m=+$('m').value, us=+$('us').value, uk=Math.min(+$('uk').value, us||+$('uk').value), N=m*g;\n  let fric, state;\n  if(S.v<1e-9){ if(F<=us*N){ fric=F; state='static'; } else { fric=uk*N; state='kinetic'; } }\n  else { fric=uk*N; state='kinetic'; }\n  let net=F-fric; if(S.v<1e-9 && state==='static') net=0;\n  return {F,m,us,uk,N,fric,state,net,a:net/m}; }\nfunction readout(){ const p=P();\n  $('fo').textContent=p.F+' N'; $('mo').textContent=p.m.toFixed(1)+' kg'; $('uso').textContent=(+$('us').value).toFixed(2); $('uko').textContent=(+$('uk').value).toFixed(2);\n  $('ro').innerHTML=`<div><span>weight mg  <\/span>${(p.m*g).toFixed(1)} N<\/div><div><span>friction   <\/span>${p.fric.toFixed(1)} N (${p.state})<\/div>`+\n    `<div><span>max static <\/span>${(p.us*p.N).toFixed(1)} N<\/div><div><span>F<sub>net<\/sub>      <\/span>${p.net.toFixed(1)} N<\/div>`+\n    `<div><span>a          <\/span>${p.a.toFixed(2)} m/s²<\/div><div><span>v          <\/span>${S.v.toFixed(2)} m/s<\/div><div><span>t          <\/span>${S.t.toFixed(1)} s<\/div>`; }\nfunction arrow(x1,y,x2,col,label,below){ if(Math.abs(x2-x1)<2) return; ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y); ctx.stroke();\n  const d=Math.sign(x2-x1); ctx.beginPath(); ctx.moveTo(x2+d*12,y); ctx.lineTo(x2-d*2,y-9); ctx.lineTo(x2-d*2,y+9); ctx.fill();\n  ctx.font='700 16px \"IBM Plex Mono\",monospace'; ctx.textAlign=d>0?'left':'right'; ctx.fillText(label,x1+d*4,below?y-14:y-14); ctx.textAlign='left'; }\nfunction draw(){ const p=P(), W=cv.width, H=cv.height; ctx.clearRect(0,0,W,H);\n  const sc=40, gy=190, X0=W*0.33, w=70+p.m*9;\n  ctx.fillStyle='#111'; ctx.fillRect(0,gy,W,5);\n  ctx.font='500 13px \"IBM Plex Mono\",monospace'; ctx.fillStyle='#4a4a4a'; ctx.textAlign='center';\n  for(let n=Math.floor(S.x-X0/sc)-1;n<=S.x+(W-X0)/sc+1;n++){ const xx=X0+(n-S.x)*sc; ctx.fillRect(xx-1,gy+5,2,n%5===0?16:9); if(n%5===0) ctx.fillText(n+' m',xx,gy+36); }\n  ctx.textAlign='left';\n  const h=44+p.m*4, x=X0-w/2, y=gy-h-16;\n  ctx.fillStyle='#ffe2d3'; ctx.strokeStyle='#111'; ctx.lineWidth=3; ctx.fillRect(x,y,w,h); ctx.strokeRect(x,y,w,h);\n  ctx.fillStyle='#111'; for(const wx of [x+16,x+w-16]){ ctx.beginPath(); ctx.arc(wx,gy-8,8,0,7); ctx.fill(); }\n  ctx.font='700 16px \"IBM Plex Mono\",monospace'; ctx.fillText(p.m.toFixed(1)+' kg',x+w/2-26,y+h/2+6);\n  const ym=y+h/2, k=7;\n  arrow(x+w,ym-6,x+w+p.F*k,'#1546d6','F = '+p.F+' N');\n  arrow(x-4,gy-30,x-4-p.fric*k,'#c43a00','f = '+p.fric.toFixed(1)+' N',true);\n  ctx.fillStyle='#111'; ctx.font='700 18px \"Space Grotesk\",sans-serif';\n  ctx.fillText('a = F'+'net / m = '+p.net.toFixed(1)+' N / '+p.m.toFixed(1)+' kg = '+p.a.toFixed(2)+' m/
