); });\n  S.d = calcWith();\n  $('work').innerHTML = '<div class=\"wt\"><span>Show the work<\/span><span class=\"hint\">' + (SIM.hint || 'g = 10 m/s²') + '<\/span><\/div>' + SIM.work(S.v, S.d, S.mode, S.opt);\n  document.querySelectorAll('input[name=gx]').forEach(r => r.checked = (r.value === S.gx));\n  graph();\n}\n\nfunction graph(){\n  const cv = $('gv'), g = cv.getContext('2d'), W = 340, Hh = 150; g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, W, Hh);\n  const dvs = SIM.dvs(S.mode, S.opt), dv = dvs.find(d => d.id === S.dv), ref = dv.vs ? dvs.find(d => d.id === dv.vs) : null;\n  const x = S.def[S.gx]; $('ivname').innerHTML = '<i>' + x.sym + '<\/i>' + (x.unit && !x.show ? ' (' + x.unit + ')' : '');\n  const N = 160, xs = [], ys = [], rs = [];\n  for (let i = 0; i <= N; i++){ const xv = x.min + (x.max - x.min) * i / N; const d = calcWith({ [S.gx]: xv }); xs.push(xv); ys.push(dv.f(d)); rs.push(ref ? ref.f(d) : null); }\n  const all = ys.concat(ref ? rs : []).filter(isFinite);\n  let ymin = Math.min(0, ...all), ymax = Math.max(...all, 0); if (ymax === ymin) ymax = ymin + 1; const pad = (ymax - ymin) * 0.08; ymax += pad; if (ymin < 0) ymin -= pad;\n  const L = 46, R = 8, T = 8, B = 22, X = v => L + (v - x.min) / (x.max - x.min) * (W - L - R), Y = v => T + (ymax - v) / (ymax - ymin) * (Hh - T - B);\n  g.strokeStyle = '#111'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(L, T); g.lineTo(L, Hh - B); g.lineTo(W - R, Hh - B); g.stroke();\n  if (ymin < 0){ g.strokeStyle = '#999'; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(W - R, Y(0)); g.stroke(); g.setLineDash([]);\n    if (dv.negNote){ g.fillStyle = 'rgba(196,58,0,0.08)'; g.fillRect(L, Y(0), W - R - L, Hh - B - Y(0)); g.fillStyle = '#c43a00'; g.font = '600 10px \"Space Grotesk\",sans-serif'; g.textAlign = 'left'; g.fillText(dv.negNote, L + 4, Hh - B - 4); } }\n  g.font = '500 10px \"IBM Plex Mono\",monospace'; g.fillStyle = '#4a4a4a'; g.textAlign = 'right';\n  g.fillText(fplain(ymax), L - 4, T + 8); g.fillText(fplain(ymin < 0 ? ymin : 0), L - 4, Hh - B); if (ymin < 0) g.fillText('0', L - 4, Y(0) + 3);\n  g.textAlign = 'center'; g.fillText(fplain(x.min), L, Hh - 8); g.fillText(fplain(x.max), W - R - 10, Hh - 8);\n  g.fillText((x.symText || x.id) + (x.unit ? ' (' + x.unit + ')' : ''), (L + W) / 2, Hh - 8);\n  g.save(); g.translate(10, (T + Hh - B) / 2); g.rotate(-PI / 2); g.textAlign = 'center'; g.fillText(dv.short + (dv.unit ? ' (' + dv.unit + ')' : ''), 0, 0); g.restore();\n  const line = (arr, col, dash) => { g.strokeStyle = col; g.lineWidth = 2.2; g.setLineDash(dash || []); g.beginPath(); let on = false; arr.forEach((y, i) => { if (!isFinite(y)){ on = false; return; } const px = X(xs[i]), py = Math.max(T - 4, Math.min(Hh - B + 4, Y(y))); on ? g.lineTo(px, py) : g.moveTo(px, py); on = true; }); g.stroke(); g.setLineDash([]); };\n  if (ref){ line(rs, '#4a4a4a', [5, 4]); g.fillStyle = '#4a4a4a'; g.textAlign = 'right'; g.font = '600 10px \"Space Grotesk\",sans-serif'; const lastY = rs.filter(isFinite).pop(); if (isFinite(lastY)) g.fillText(ref.short, W - R - 2, Math.max(T + 9, Y(lastY) - 4)); }\n  line(ys, '#1546d6');\n  const cx = S.v[S.gx], cy = dv.f(S.d);\n  if (isFinite(cy)){ g.strokeStyle = '#ff6a2b'; g.setLineDash([2, 3]); g.lineWidth = 1; g.beginPath(); g.moveTo(X(cx), Hh - B); g.lineTo(X(cx), Y(cy)); g.lineTo(L, Y(cy)); g.stroke(); g.setLineDash([]);\n    g.fillStyle = '#ff6a2b'; g.strokeStyle = '#111'; g.lineWidth = 1.5; g.beginPath(); g.arc(X(cx), Math.max(T, Math.min(Hh - B, Y(cy))), 4.5, 0, 7); g.fill(); g.stroke(); }\n  // doubling readout\n  const d2 = calcWith({ [S.gx]: cx * 2 }), y1 = dv.f(S.d), y2 = dv.f(d2);\n  let msg = '';\n  if (cx === 0 || Math.abs(y1) < 1e-12) msg = '<span class=\"hint\">Move off zero to see the ×2 test.<\/span>';\n  else if (!isFinite(y1) || !isFinite(y2)) msg = '<span class=\"hint\">The ×2 test doesn’t apply here (doubling takes it outside what this quantity covers).<\/span>';\n  else {\n    const k = y2 / y1;\n    if (k < 0){ $('dbl').innerHTML = 'If <b>' + x.sym + '<\/b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '<\/b> goes from ' + fnum(y1) + ' to ' + fnum(y2) + (dv.unit ? ' ' + dv.unit : '') + ': it changes sign, so that can’t really happen.'; return; }\n    const tags = [[1, 'doesn’t depend on it'], [2, 'proportional'], [4, 'goes as the square'], [0.5, 'inversely proportional'], [0.25, 'inverse square'], [Math.SQRT2, 'goes as the square root'], [Math.SQRT1_2, 'goes as 1/√'], [8, 'goes as the cube'], [2 * Math.SQRT2, 'goes as the 3/2 power']];\n    const tag = tags.find(([v]) => Math.abs(k - v) < 0.004 * v);\n    msg = 'If <b>' + x.sym + '<\/b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '<\/b> becomes <b>×' + (Math.abs(k) >= 100 ? fnum(k) : k.toFixed(2)) + '<\/b>' + (tag ? ' — ' + tag[1] : '') + '.' + (dv.dblNote ? ' <span class=\"hint\">' + dv.dblNote + '<\/span>' : '');\n  }\n  $('dbl').innerHTML = msg;\n}\n\n// drawing helpers (canvas is drawn in 600×330 units)\nconst cv = $('cv'), ctx = cv.getContext('2d');\nfunction arrow(x1, y1, x2, y2, col, label, opts){\n  opts = opts || {}; const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy); if (len < 2) return;\n  const ux = dx / len, uy = dy / len, hw = opts.head || 9;\n  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = opts.w || 3.5; ctx.lineCap = 'round';\n  if (opts.dash) ctx.setLineDash(opts.dash);\n  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hw * 0.8, y2 - uy * hw * 0.8); ctx.stroke(); ctx.setLineDash([]);\n  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - ux * hw - uy * hw * 0.55, y2 - uy * hw + ux * hw * 0.55); ctx.lineTo(x2 - ux * hw + uy * hw * 0.55, y2 - uy * hw - ux * hw * 0.55); ctx.closePath(); ctx.fill();\n  if (label){ ctx.font = '700 13px \"Space Grotesk\",sans-serif'; ctx.textAlign = opts.align || 'left'; ctx.textBaseline = 'middle';\n    const lx = x2 + (opts.lx !== undefined ? opts.lx : (ux >= 0 ? 6 : -6)), ly = y2 + (opts.ly !== undefined ? opts.ly : (uy >= 0 ? 10 : -10));\n    if (opts.align === undefined) ctx.textAlign = ux >= -0.2 ? 'left' : 'right';\n    ctx.fillText(label, lx, ly); }\n  ctx.restore();\n}\nfunction text(s, x, y, o){ o = o || {}; ctx.save(); ctx.font = (o.font || '600 13px \"Space Grotesk\",sans-serif'); ctx.fillStyle = o.col || '#111'; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic'; ctx.fillText(s, x, y); ctx.restore(); }\nfunction panelTitle(s, x, y){ text(s, x, y, { font: '700 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); }\nconst COL = { F: '#c43a00', W: '#111', N: '#1e7d45', V: '#1546d6', T: '#7a3fb0', comp: '#8a8a8a' };\n\nlet last = 0;\nfunction loop(ts){ const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts; S.t += dt;\n  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, 600, 330);\n  SIM.draw(S.v, S.d, S.mode, S.opt, S.t, dt, S.anim); S.anim.reset = false;\n  requestAnimationFrame(loop); }\n\n// ---------------- this sim ----------------\n// Pulleys: Atwood machine, block on a table pulled by a hanging mass, and a block and tackle.\nconst SIM = {\n  title: 'Pulleys',\n  modes: [{ id: 'atwood', label: 'Atwood machine' }, { id: 'table', label: 'Table + hanging mass' }, { id: 'tackle', label: 'Block and tackle' }],\n  ivs(mode){\n    if (mode === 'atwood') return [\n      { id: 'm1', sym: 'm<sub>1<\/sub>', symText: 'm1', label: 'Left mass', unit: 'kg', min: 0.1, max: 5, step: 0.1, val: 2 },\n      { id: 'm2', sym: 'm<sub>2<\/sub>', symText: 'm2', label: 'Right mass', unit: 'kg', min: 0.1, max: 5, step: 0.1, val: 1.5, graph: true }];\n    if (mode === 'table') return [\n      { id: 'm1', sym: 'm<sub>1<\/sub>', symText: 'm1', label: 'Block on table', unit: 'kg', min: 0.5, max: 5, step: 0.1, val: 2 },\n      { id: 'm2', sym: 'm<sub>2<\/sub>', symText: 'm2', label: 'Hanging mass', unit: 'kg', min: 0.1, max: 5, step: 0.1, val: 1, graph: true },\n      { id: 'mu', sym: 'μ<sub>k<\/sub>', symText: 'μk', label: 'Friction on table', unit: '', min: 0, max: 0.8, step: 0.05, val: 0.2, show: v => v.toFixed(2) }];\n    return [\n      { id: 'm', sym: 'm', symText: 'm', label: 'Load', unit: 'kg', min: 10, max: 200, step: 5, val: 60 },\n      { id: 'n', sym: 'n', symText: 'n', label: 'Rope segments holding the load', unit: '', min: 1, max: 6, step: 1, val: 2, graph: true, show: v => v.toFixed(0) }];\n  },\n  calc(v, mode){\n    if (mode === 'atwood'){ const M = v.m1 + v.m2, a = (v.m1 - v.m2) * G10 / M, T = 2 * v.m1 * v.m2 * G10 / M; return { a, T, M, W1: v.m1 * G10, W2: v.m2 * G10 }; }\n    if (mode === 'table'){ const M = v.m1 + v.m2, W2 = v.m2 * G10, f = v.mu * v.m1 * G10, moves = W2 > f, a = moves ? (W2 - f) / M : 0, T = moves ? v.m1 * a + f : W2; return { a, T, M, W2, f, moves, N: v.m1 * G10 }; }\n    const n = v.n, W = v.m * G10, T = W / n; return { n, W, T, F: T, ceil: (n + 1) * T };\n  },\n  dvs(mode){\n    if (mode === 'tackle') return [\n      { id: 'F', name: 'Tension T = your pull', short: 'T', sym: 'T', unit: 'N', f: d => d.T, vs: 'W' },\n      { id: 'ceil', name: 'Force on the ceiling', short: 'F_ceiling', sym: 'F<sub>ceiling<\/sub>', unit: 'N', f: d => d.ceil },\n      { id: 'W', name: 'Weight held up', short: 'W', sym: 'W', unit: 'N', f: d => d.W }];\n    return [\n      { id: 'a', name: 'Acceleration', short: 'a', sym: 'a', unit: 'm/s²', f: d => d.a },\n      { id: 'T', name: 'Tension', short: 'T', sym: 'T', unit: 'N', f: d => d.T }];\n  },\n  work(v, d, mode){\n    if (mode === 'atwood') return '<h4>1 · Whole system (both masses + string)<\/h4><div class=\"eq\">The tensions are internal and cancel. Net force = m<sub>1<\/sub>g − m<sub>2<\/sub>g, mass = m<sub>1<\/sub> + m<sub>2<\/sub><\/div>' +\n      '<div class=\"eq\">a = (m<sub>1<\/sub> − m<sub>2<\/sub>)g / (m<sub>1<\/sub> + m<sub>2<\/sub>) = (' + H.iv('m1') + ' − ' + H.iv('m2') + ')(' + H.g() + ') / ' + H.n(d.M, 'kg') + ' = <b>' + H.n(d.a, 'm/s²') + '<\/b><\/div>' +\n      '<p class=\"note\">Positive: the left mass goes down. The acceleration is always less than g.<\/p>' +\n      '<h4>2 · One mass at a time (to find T)<\/h4><div class=\"eq\">Left (down = +): m<sub>1<\/sub>g − T = m<sub>1<\/sub>a → T = m<sub>1<\/sub>(g − a) = (' + H.iv('m1') + ')(' + H.n(G10 - d.a) + ') = <b>' + H.n(d.T, 'N') + '<\/b><\/div>' +\n      '<div class=\"eq\">Right (up = +): T − m<sub>2<\/sub>g = m<sub>2<\/sub>a → T = ' + H.n(v.m2 * (G10 + d.a), 'N') + ' ✓<\/div>' +\n      '<h4>3 · Newton’s third law<\/h4><div class=\"eq\">The string pulls up on each mass with T = ' + H.n(d.T, 'N') + '; each mass pulls down on the string with the same T. T is between the two weights (' + H.n(d.W2, 'N') + ' and ' + H.n(d.W1, 'N') + ').<\/div>';\n    if (mode === 'table') return '<h4>1 · Forces along the motion<\/h4><div class=\"eq\">Hanging weight m<sub>2<\/sub>g = (' + H.iv('m2') + ')(' + H.g() + ') = ' + H.n(d.W2, 'N') + ' pulls the system; friction μ<sub>k<\/sub>m<sub>1<\/sub>g = (' + H.iv('mu') + ')(' + H.iv('m1') + ')(' + H.g() + ') = ' + H.n(d.f, 'N') + ' resists<\/div>' +\n      (d.moves ? '<h4>2 · Whole system<\/h4><div class=\"eq\">a = (m<sub>2<\/sub>g − μ<sub>k<\/sub>m<sub>1<\/sub>g)/(m<sub>1<\/sub> + m<sub>2<\/sub>) = (' + H.n(d.W2) + ' − ' + H.n(d.f) + ') / ' + H.n(d.M, 'kg') + ' = <b>' + H.n(d.a, 'm/s²') + '<\/b><\/div>' +\n        '<h4>3 · Block on the table alone<\/h4><div class=\"eq\">T − μ<sub>k<\/sub>m<sub>1<\/sub>g = m<sub>1<\/sub>a → T = m<sub>1<\/sub>a + f = (' + H.iv('m1') + ')(' + H.n(d.a) + ') + ' + H.n(d.f) + ' = <b>' + H.n(d.T, 'N') + '<\/b><\/div>' +\n        '<h4>4 · Hanging mass alone (check)<\/h4><div class=\"eq\">m<sub>2<\/sub>g − T = m<sub>2<\/sub>a → T = ' + H.n(v.m2 * (G10 - d.a), 'N') + ' ✓ (less than its weight, because it accelerates down)<\/div>'\n        : '<div class=\"bad\">The hanging weight is not more than the friction, so (treating μ as static too) nothing moves. T = m<sub>2<\/sub>g = ' + H.n(d.T, 'N') + '.<\/div>');\n    return '<h4>1 · Free-body diagram of the moving part (load' + (d.n > 1 ? ' + lower pulleys' : '') + ')<\/h4><div class=\"eq\">Cut every rope that touches it. ' + (d.n === 1 ? 'One rope segment pulls up' : H.iv('n') + ' rope segments pull up') + ', each with tension T. Its weight W pulls down.<\/div>' +\n      '<div class=\"eq\">W = mg = (' + H.iv('m') + ')(' + H.g() + ') = ' + H.n(d.W, 'N') + '<\/div>' +\n      '<p class=\"note\">Light pulleys: their mass is ignored.<\/p>' +\n      '<h4>2 · One rope, so one tension<\/h4><div class=\"eq\">With light, frictionless pulleys the tension is the same all along the rope, and it equals your pull: F = T.<\/div>' +\n      '<h4>3 · Newton’s 2nd law (held still or lifted at constant speed, so a = 0)<\/h4><div class=\"eq\">ΣF<sub>y<\/sub> = 0: &nbsp; nT − W = 0 → T = W/n = ' + H.n(d.W) + ' / ' + H.iv('n') + ' = <b>' + H.n(d.T, 'N') + '<\/b><\/div>' +\n      '<p class=\"note\">The weight is shared between the segments. Count only the segments attached to the moving part, not the one in your hand.<\/p>' +\n      '<h4>4 · Free-body diagram of the top pulleys (what the ceiling holds)<\/h4><div class=\"eq\">All ' + H.iv('n') + ' segments <i>plus<\/i> the end you pull down on hang from the top: F<sub>ceiling<\/sub> = (n + 1)T = (' + H.n(d.n + 1) + ')(' + H.n(d.T) + ') = <b>' + H.n(d.ceil, 'N') + '<\/b><\/div>' +\n      '<p class=\"note\">That’s more than the weight: you are pulling down on the rope, and the ceiling holds that too. (Rope pulled straight down.)<\/p>';\n  },\n  draw(v, d, mode, opt, t, dt, A){\n    if (A.t === undefined || A.reset) A.t = 0; A.t += dt; const cyc = 2.4, tt = A.t % cyc;\n    if (mode === 'atwood'){\n      panelTitle('ATWOOD MACHINE', 10, 18);\n      const px = 180, py = 50, R = 26, s = Math.max(-60, Math.min(60, 0.5 * d.a * tt * tt * 30));\n      ctx.fillStyle = '#111'; ctx.fillRect(px - 3, 22, 6, py - 22);\n      ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, py, R, 0, 7); ctx.stroke();\n      const y1 = 170 + s, y2 = 170 - s;\n      ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(px - R, py); ctx.lineTo(px - R, y1); ctx.moveTo(px + R, py); ctx.lineTo(px + R, y2); ctx.stroke();\n      const box = (x, y, m, lab) => { const s2 = 18 + 14 * Math.sqrt(m); ctx.fillStyle = '#ff6a2b'; ctx.strokeStyle = '#111'; ctx.fillRect(x - s2 / 2, y, s2, s2); ctx.strokeRect(x - s2 / 2, y, s2, s2); text(lab, x, y + s2 / 2 + 4, { align: 'center', font: '700 11px \"Space Grotesk\",sans-serif', col: '#fff' }); return s2; };\n      const s1 = box(px - R, y1, v.m1, 'm1'), s2 = box(px + R, y2, v.m2, 'm2');\n      const sc = 70 / Math.max(d.W1, d.W2);\n      arrow(px - R - 30, y1 + s1 / 2, px - R - 30, y1 + s1 / 2 - d.T * sc, COL.T, 'T', { lx: -6, ly: 0, align: 'right' }); arrow(px - R - 30, y1 + s1 / 2, px - R - 30, y1 + s1 / 2 + d.W1 * sc, COL.W, 'm1g', { lx: -6, ly: 0, align: 'right' });\n      arrow(px + R + 30, y2 + s2 / 2, px + R + 30, y2 + s2 / 2 - d.T * sc, COL.T, 'T', { lx: 6, ly: 0 }); arrow(px + R + 30, y2 + s2 / 2, px + R + 30, y2 + s2 / 2 + d.W2 * sc, COL.W, 'm2g', { lx: 6, ly: 0 });\n      text('a = ' + fplain(Math.abs(d.a)) + ' m/s² ' + (d.a > 0 ? '(left side goes down)' : d.a < 0 ? '(right side goes down)' : '(balanced)'), 200, 318, { font: '700 13px \"Space Grotesk\",sans-serif' });\n    } else if (mode === 'table'){\n      panelTitle('TABLE + HANGING MASS', 10, 18);\n      const tx = 30, ty = 140, edge = 280, s = d.moves ? Math.min(100, 0.5 * d.a * tt * tt * 30) : 0;\n      ctx.fillStyle = '#e8e8e8'; ctx.fillRect(tx, ty, edge - tx, 14); ctx.fillRect(tx + 10, ty + 14, 10, 170); ctx.fillRect(edge - 20, ty + 14, 10, 170);\n      ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(edge + 8, ty - 8, 12, 0, 7); ctx.stroke();\n      const bw = 36 + v.m1 * 8, bx = 110 + s; ctx.fillStyle = '#1546d6'; ctx.fillRect(bx, ty - 30, bw, 30); ctx.strokeStyle = '#111'; ctx.strokeRect(bx, ty - 30, bw, 30);\n      ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(bx + bw, ty - 15); ctx.lineTo(edge + 8, ty - 20); ctx.moveTo(edge + 20, ty - 8); ctx.lineTo(edge + 20, ty + 40 + s); ctx.stroke();\n      const hs = 18 + 14 * Math.sqrt(v.m2); ctx.fillStyle = '#ff6a2b'; ctx.fillRect(edge + 20 - hs / 2, ty + 40 + s, hs, hs); ctx.strokeRect(edge + 20 - hs / 2, ty + 40 + s, hs, hs);\n      const sc = 60 / Math.max(d.W2, d.N);\n      arrow(bx + bw / 2, ty - 15, bx + bw / 2 + d.T * sc, ty - 15, COL.T, 'T', { lx: 2, ly: -10 }); if (d.f > 0) arrow(bx + bw / 2, ty - 4, bx + bw / 2 - Math.min(d.f, d.T) * sc, ty - 4, COL.F, 'f', { lx: -4, ly: 8, align: 'right' });\n      text(d.moves ? 'a = ' + fplain(d.a) + ' m/s²' : 'stuck: m2g ≤ friction', 12, 318, { font: '700 13px \"Space Grotesk\",sans-serif', col: d.moves ? '#111' : '#c43a00' });\n    } else {\n      panelTitle('BLOCK AND TACKLE', 10, 18);\n      // Real pulleys: n supporting segments, joined by pulleys that alternate top (fixed) and bottom (moving),\n      // plus one top pulley that turns the free end down to the person.\n      const n = Math.round(v.n), r = 14, topY = 46, yT = topY + 22, lift = 40 * (tt / cyc), loadY = 222 - lift, yB = loadY - 32, cx = 170;\n      const xs = []; for (let i = 0; i <= n; i++) xs.push(cx - n * r + 2 * r * i);\n      const isTop = k => (n - 1 - k) % 2 === 0;           // pulley between segment k and k+1 (k = n−1 is the turning pulley)\n      const tops = [], bots = []; for (let k = 0; k < n; k++) (isTop(k) ? tops : bots).push(xs[k] + r);\n      const anchorTop = n % 2 === 0;\n      // ceiling\n      ctx.fillStyle = '#111'; ctx.fillRect(cx - n * r - 40, topY - 10, 2 * n * r + 80, 8);\n      for (let i = 0; i < 9; i++){ ctx.strokeStyle = '#111'; ctx.lineWidth = 1; ctx.beginPath(); const hx = cx - n * r - 36 + i * (2 * n * r + 72) / 8; ctx.moveTo(hx, topY - 10); ctx.lineTo(hx + 6, topY - 18); ctx.stroke(); }\n      // moving block frame (bar joining the bottom pulleys and the anchor) and hook to the load\n      const botXs = bots.slice(); if (!anchorTop && n > 1) botXs.push(xs[0]);\n      let hookX = xs[0];\n      ctx.strokeStyle = '#555'; ctx.lineWidth = 4;\n      if (botXs.length){ const lo = Math.min(...botXs), hi = Math.max(...botXs); hookX = (lo + hi) / 2;\n        ctx.beginPath(); ctx.moveTo(lo - 6, yB); ctx.lineTo(hi + 6, yB); ctx.stroke(); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(hookX, yB); ctx.lineTo(hookX, loadY); ctx.stroke(); }\n      // straps from the ceiling to each top pulley\n      ctx.strokeStyle = '#555'; ctx.lineWidth = 3; tops.forEach(x => { ctx.beginPath(); ctx.moveTo(x, topY - 2); ctx.lineTo(x, yT); ctx.stroke(); });\n      // wheels\n      const wheel = (x, y) => { ctx.fillStyle = '#d9d9d9'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, r - 1.5, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x, y, 2.5, 0, 7); ctx.fill(); };\n      tops.forEach(x => wheel(x, yT)); bots.forEach(x => wheel(x, yB));\n      // rope: vertical segments, arcs over/under pulleys, anchor, free end\n      ctx.strokeStyle = '#7a5a2a'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\n      for (let i = 0; i < n; i++){\n        const topEnd = (i > 0 && isTop(i - 1)) || isTop(i) ? yT : topY - 2;\n        const botEnd = (i > 0 && !isTop(i - 1)) || (!isTop(i)) ? yB : (n === 1 ? loadY : yB);\n        ctx.beginPath(); ctx.moveTo(xs[i], topEnd); ctx.lineTo(xs[i], botEnd); ctx.stroke();\n        // segment lines are highlighted: they each hold F\n        ctx.save(); ctx.strokeStyle = 'rgba(122,63,176,0.35)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(xs[i], (topEnd + botEnd) / 2 - 12); ctx.lineTo(xs[i], (topEnd + botEnd) / 2 + 12); ctx.stroke(); ctx.restore();\n      }\n      tops.forEach(x => { ctx.beginPath(); ctx.arc(x, yT, r, PI, 2 * PI); ctx.stroke(); });\n      bots.forEach(x => { ctx.beginPath(); ctx.arc(x, yB, r, 0, PI); ctx.stroke(); });\n      if (anchorTop){ ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(xs[0], topY - 2, 3, 0, 7); ctx.fill(); }\n      else if (n > 1){ ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(xs[0], yB, 3, 0, 7); ctx.fill(); }\n      // load\n      const bw = 34 + v.m * 0.06, bh = bw * 0.75; ctx.fillStyle = '#ff6a2b'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5;\n      ctx.fillRect(hookX - bw / 2, loadY, bw, bh); ctx.strokeRect(hookX - bw / 2, loadY, bw, bh);\n      text(fplain(v.m) + ' kg', hookX - bw / 2 - 6, loadY + bh / 2 + 4, { align: 'right', font: '700 11px \"IBM Plex Mono\",monospace' });\n      // free end, pulled down by the person\n      const fxp = xs[n], pull = lift * n, endY = 120 + Math.min(pull, 110);\n      ctx.strokeStyle = '#7a5a2a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(fxp, yT); ctx.lineTo(fxp, endY); ctx.stroke();\n      arrow(fxp, endY, fxp, endY + 15 + 40 * d.F / d.W, COL.T, 'F = T = ' + fplain(d.F) + ' N', { lx: 6, ly: 0 });\n      text(n + (n === 1 ? ' segment pulls' : ' segments pull') + ' up on the load (shaded)', 12, 300, { font: '700 13px \"Space Grotesk\",sans-serif' });\n      text('each has the same tension T = ' + fplain(d.T) + ' N', 12, 318, { font: '600 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n    }\n    // bar comparison on the right\n    if (mode === 'tackle'){\n      panelTitle('FREE-BODY DIAGRAM: MOVING PART', 390, 18);\n      const n = Math.round(d.n), bx = 480, by = 150, bw2 = 30 + 10 * n, sc = 100 / d.W;\n      ctx.fillStyle = '#ff6a2b'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.fillRect(bx - bw2 / 2, by - 15, bw2, 30); ctx.strokeRect(bx - bw2 / 2, by - 15, bw2, 30);\n      for (let i = 0; i < n; i++){ const x = bx - bw2 / 2 + bw2 * (i + 0.5) / n; arrow(x, by - 15, x, by - 15 - d.T * sc, COL.T, i === n - 1 ? 'T' : '', { w: 3, head: 7, lx: 5, ly: 0 }); }\n      arrow(bx, by + 15, bx, by + 15 + d.W * sc, COL.W, 'W = ' + fplain(d.W) + ' N', { w: 3.5, lx: 6, ly: -6 });\n      text((n === 1 ? '' : n) + 'T = W', 395, 300, { font: '700 15px \"Space Grotesk\",sans-serif' });\n      text('T = ' + fplain(d.W) + ' / ' + n + ' = ' + fplain(d.T) + ' N', 395, 318, { font: '600 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n    } else {\n      panelTitle('NEWTON’S THIRD LAW PAIRS', 390, 18);\n      text('String on mass ↑ T', 400, 60, { font: '600 12px \"Space Grotesk\",sans-serif' }); text('Mass on string ↓ T', 400, 78, { font: '600 12px \"Space Grotesk\",sans-serif' });\n      text('Earth on mass ↓ mg', 400, 110, { font: '600 12px \"Space Grotesk\",sans-serif' }); text('Mass on Earth ↑ mg', 400, 128, { font: '600 12px \"Space Grotesk\",sans-serif' });\n      text('T = ' + fplain(d.T) + ' N', 400, 180, { font: '700 20px \"IBM Plex Mono\",monospace' });\n      text('a = ' + fplain(Math.abs(d.a)) + ' m/s²', 400, 210, { font: '700 20px \"IBM Plex Mono\",monospace' });\n    }\n  }\n};\n\n\nS.mode = SIM.modes ? SIM.modes[0].id : 'one';\nsetup(); requestAnimationFrame(loop);\n<\/script>\n<\/body><\/html>\n"},
"truck":{ar:"1000 / 640",html:"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Box on a Truck<\/title>\n<\!-- Box on a Truck: original Holmes Sims, built from frame.html + truck.js. g = 10 m/s². -->\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap\">\n<style>\nhtml,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:\"Space Grotesk\",system-ui,sans-serif;color:#111}\n#app{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0;padding:10px 14px 12px;box-sizing:border-box;\n  display:grid;grid-template-columns:600px 1fr;grid-template-rows:34px 330px 1fr;gap:10px 14px}\n#bar{grid-column:1/-1;display:flex;gap:16px;align-items:center;flex-wrap:nowrap;overflow:hidden}\n.seg{display:flex;align-items:center}\n.seg .lab{font:700 12px \"IBM Plex Mono\",monospace;margin-right:8px;text-transform:uppercase}\n.seg button{white-space:nowrap;font:700 14px \"Space Grotesk\",sans-serif;padding:6px 11px;border:2px solid #111;background:#fff;color:#111;cursor:pointer}\n.seg button+button{margin-left:-2px}\n.seg button[aria-pressed=\"true\"]{background:#111;color:#fff}\n.seg button:hover:not([aria-pressed=\"true\"]){background:#ffe2d3}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ff6a2b;outline-offset:2px;position:relative;z-index:1}\n#cv{border:2px solid #111;background:#fbfbfb;width:600px;height:330px;box-sizing:border-box;display:block}\n#work{border:2px solid #111;padding:8px 12px 10px;overflow:auto;font-size:14px;line-height:1.55;box-sizing:border-box}\n#work .wt{font:700 12px \"IBM Plex Mono\",monospace;text-transform:uppercase;margin:0 0 4px;display:flex;justify-content:space-between}\n#work h4{margin:9px 0 1px;font-size:13px;font-weight:700;color:#4a4a4a}\n#work h4:first-of-type{margin-top:2px}\n#work .eq{font-variant-numeric:tabular-nums}\n#work .n{font-family:\"IBM Plex Mono\",monospace;font-size:13px}\n#work b .n,#work .ans{font-weight:700}\n#work .note{font-size:12.5px;color:#4a4a4a;margin:2px 0 0}\n#work .ok{background:#e5f4ea;border-left:4px solid #1e7d45;padding:3px 8px;margin-top:4px}\n#work .bad{background:#fde7df;border-left:4px solid #c43a00;padding:3px 8px;margin-top:4px}\n.ivv{border-radius:2px;padding:0 2px;transition:background .25s}\n.ivv.gx{background:#ffe2d3}\n.ivv.hot{background:#ff6a2b;color:#fff}\n#ctl{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;align-content:start}\n.iv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:6px}\n.iv .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.iv .val{font:700 13px \"IBM Plex Mono\",monospace;white-space:nowrap}\n.iv input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:#111;height:22px}\n.iv input[type=radio]{accent-color:#ff6a2b;margin:0}\n#presets{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}\n#presets .lab{font:700 12px \"IBM Plex Mono\",monospace}\n#presets button{font:600 12.5px \"Space Grotesk\",sans-serif;padding:3px 8px;border:2px solid #111;background:#fff;cursor:pointer}\n#presets button:hover{background:#ffe2d3}\n#gcard{border:2px solid #111;padding:5px 8px 6px;display:flex;flex-direction:column;box-sizing:border-box;min-height:0}\n.ghead{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}\n.ghead select{font:600 13px \"Space Grotesk\",sans-serif;border:2px solid #111;padding:1px 4px;max-width:200px}\n#gv{width:340px;height:150px;flex:none;display:block;margin-top:3px}\n#dbl{font-size:12.5px;line-height:1.35;margin-top:2px}\n#dbl b{font-weight:700}\n.hint{font:500 11px \"IBM Plex Mono\",monospace;color:#4a4a4a}\n<\/style><\/head><body>\n<div id=\"app\">\n  <div id=\"bar\"><\/div>\n  <canvas id=\"cv\" width=\"1200\" height=\"660\" aria-label=\"Animation of the situation with force arrows\"><\/canvas>\n  <div id=\"work\" aria-live=\"polite\"><\/div>\n  <div id=\"ctl\"><\/div>\n  <div id=\"gcard\">\n    <div class=\"ghead\"><span>Graph<\/span><select id=\"dvsel\" aria-label=\"Quantity to graph\"><\/select><span>vs <b id=\"ivname\"><\/b><\/span><\/div>\n    <canvas id=\"gv\" width=\"680\" height=\"300\" aria-label=\"Graph of the chosen quantity against the chosen variable\"><\/canvas>\n    <div id=\"dbl\"><\/div>\n  <\/div>\n<\/div>\n<script>\n// ---------------- shared frame ----------------\nconst $ = id => document.getElementById(id);\nconst G10 = 10, PI = Math.PI, DEG = PI / 180;\nfunction fit(){ const s = Math.min(innerWidth / 1000, innerHeight / 640); $('app').style.transform = 'scale(' + s + ')'; }\naddEventListener('resize', fit); fit();\n\nfunction fnum(x){ const r = fnum0(x); return typeof r === 'string' ? r.replace(/^-/, '−') : r; }\nfunction fnum0(x){\n  if (x === null || x === undefined || !isFinite(x)) return '—';\n  const a = Math.abs(x);\n  if (a === 0) return '0';\n  if (a >= 1e5 || a < 1e-3){\n    const e = Math.floor(Math.log10(a)); let m = x / Math.pow(10, e);\n    let ms = m.toFixed(2); if (Math.abs(+ms) >= 10){ m /= 10; ms = m.toFixed(2); return ms + '×10<sup>' + (e + 1) + '<\/sup>'; }\n    return ms + '×10<sup>' + e + '<\/sup>';\n  }\n  if (a >= 1000) return String(Math.round(x));\n  return x.toPrecision(3);\n}\nfunction fplain(x){ return fnum(x).replace(/<sup>(.*?)<\\/sup>/g, (m, e) => '^' + e).replace('×10^', 'e'); }\nconst H = {\n  n: (x, u) => '<span class=\"n\">' + fnum(x) + (u ? '&nbsp;' + u : '') + '<\/span>',\n  iv: id => { const d = S.def[id]; const val = S.v[id]; const txt = (d.show ? d.show(val) : fnum(val) + (d.unit ? '&nbsp;' + d.unit : ''));\n              return '<span class=\"ivv n' + (S.gx === id ? ' gx' : '') + (S.hot === id ? ' hot' : '') + '\" data-iv=\"' + id + '\">' + txt + '<\/span>'; },\n  g: () => '<span class=\"n\">10&nbsp;m/s²<\/span>',\n  p: (x, u) => x < 0 ? '(' + H.n(x, u) + ')' : H.n(x, u)\n};\n\nconst S = { mode: null, opt: {}, v: {}, store: {}, def: {}, ivs: [], gx: null, dv: null, hot: null, t: 0, anim: {} };\n\nfunction bar(){\n  const b = $('bar'); b.innerHTML = '';\n  const group = (label, items, cur, onpick) => {\n    const g = document.createElement('div'); g.className = 'seg'; g.setAttribute('role', 'group');\n    if (label){ const l = document.createElement('span'); l.className = 'lab'; l.textContent = label; g.appendChild(l); }\n    items.forEach(([id, txt]) => { const bt = document.createElement('button'); bt.textContent = txt; bt.setAttribute('aria-pressed', String(id === cur)); bt.onclick = () => onpick(id); g.appendChild(bt); });\n    b.appendChild(g);\n  };\n  const tip = document.createElement('span'); tip.className = 'hint'; tip.style.marginLeft = 'auto'; tip.style.whiteSpace = 'nowrap'; tip.innerHTML = '● = the variable on the graph’s x-axis · drag any slider';\n  if (SIM.modes) group(null, SIM.modes.map(m => [m.id, m.label]), S.mode, id => { S.mode = id; S.anim = {}; setup(); });\n  (SIM.opts || []).filter(o => !o.modes || o.modes.includes(S.mode)).forEach(o => {\n    if (!(o.id in S.opt)) S.opt[o.id] = o.choices[0][0];\n    group(o.label, o.choices, S.opt[o.id], id => { S.opt[o.id] = id; S.anim = {}; setup(); });\n  });\n  b.appendChild(tip);\n  if (b.scrollWidth > b.clientWidth + 1) tip.remove();\n  if (b.scrollWidth > b.clientWidth + 1) b.querySelectorAll('.seg button').forEach(x => { x.style.fontSize = '13px'; x.style.padding = '6px 8px'; });\n}\n\nfunction setup(){\n  bar();\n  S.ivs = SIM.ivs(S.mode, S.opt); S.def = {}; S.v = {};\n  S.ivs.forEach(d => { S.def[d.id] = d; const k = S.mode + ':' + d.id; S.v[d.id] = (k in S.store) ? S.store[k] : d.val; });\n  if (!S.gx || !S.def[S.gx]) S.gx = S.ivs.find(d => d.graph) ? S.ivs.find(d => d.graph).id : S.ivs[1] ? S.ivs[1].id : S.ivs[0].id;\n  const c = $('ctl'); c.innerHTML = '';\n  S.ivs.forEach(d => {\n    const w = document.createElement('div'); w.className = 'iv';\n    w.innerHTML = '<input type=\"radio\" name=\"gx\" value=\"' + d.id + '\" aria-label=\"Graph against ' + d.label + '\" title=\"Put this on the graph’s x-axis\"' + (S.gx === d.id ? ' checked' : '') + '>' +\n      '<span class=\"nm\">' + d.label + ' <i>' + d.sym + '<\/i><\/span><span class=\"val\" id=\"val-' + d.id + '\"><\/span>' +\n      '<input type=\"range\" id=\"r-' + d.id + '\" min=\"' + d.min + '\" max=\"' + d.max + '\" step=\"' + d.step + '\" value=\"' + S.v[d.id] + '\" aria-label=\"' + d.label + '\">';\n    c.appendChild(w);\n    const r = w.querySelector('input[type=range]');\n    r.oninput = () => { S.v[d.id] = +r.value; S.store[S.mode + ':' + d.id] = +r.value; S.hot = d.id; clearTimeout(S.hotT); S.hotT = setTimeout(() => { S.hot = null; update(); }, 700); S.anim.reset = true; update(); };\n    w.querySelector('input[type=radio]').onchange = () => { S.gx = d.id; update(); };\n  });\n  if (SIM.presets){\n    const p = document.createElement('div'); p.id = 'presets'; p.innerHTML = '<span class=\"lab\">Try:<\/span>';\n    SIM.presets.forEach(ps => { const bt = document.createElement('button'); bt.textContent = ps.label; bt.onclick = () => { if (ps.mode && ps.mode !== S.mode){ S.mode = ps.mode; } Object.entries(ps.v).forEach(([k, val]) => S.store[(ps.mode || S.mode) + ':' + k] = val); S.anim = {}; setup(); }; p.appendChild(bt); });\n    c.appendChild(p);\n  }\n  const dvs = SIM.dvs(S.mode, S.opt), sel = $('dvsel');\n  if (!S.dv || !dvs.find(d => d.id === S.dv)) S.dv = dvs[0].id;\n  sel.innerHTML = dvs.map(d => '<option value=\"' + d.id + '\"' + (d.id === S.dv ? ' selected' : '') + '>' + d.name + '<\/option>').join('');\n  sel.onchange = () => { S.dv = sel.value; update(); };\n  update();\n}\n\nfunction calcWith(over){ const v = Object.assign({}, S.v, over || {}); return SIM.calc(v, S.mode, S.opt); }\n\nfunction update(){\n  S.ivs.forEach(d => { $('val-' + d.id).innerHTML = d.show ? d.show(S.v[d.id]) : fnum(S.v[d.id]) + (d.unit ? '&nbsp;' + d.unit : ''); });\n  S.d = calcWith();\n  $('work').innerHTML = '<div class=\"wt\"><span>Show the work<\/span><span class=\"hint\">' + (SIM.hint || 'g = 10 m/s²') + '<\/span><\/div>' + SIM.work(S.v, S.d, S.mode, S.opt);\n  document.querySelectorAll('input[name=gx]').forEach(r => r.checked = (r.value === S.gx));\n  graph();\n}\n\nfunction graph(){\n  const cv = $('gv'), g = cv.getContext('2d'), W = 340, Hh = 150; g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, W, Hh);\n  const dvs = SIM.dvs(S.mode, S.opt), dv = dvs.find(d => d.id === S.dv), ref = dv.vs ? dvs.find(d => d.id === dv.vs) : null;\n  const x = S.def[S.gx]; $('ivname').innerHTML = '<i>' + x.sym + '<\/i>' + (x.unit && !x.show ? ' (' + x.unit + ')' : '');\n  const N = 160, xs = [], ys = [], rs = [];\n  for (let i = 0; i <= N; i++){ const xv = x.min + (x.max - x.min) * i / N; const d = calcWith({ [S.gx]: xv }); xs.push(xv); ys.push(dv.f(d)); rs.push(ref ? ref.f(d) : null); }\n  const all = ys.concat(ref ? rs : []).filter(isFinite);\n  let ymin = Math.min(0, ...all), ymax = Math.max(...all, 0); if (ymax === ymin) ymax = ymin + 1; const pad = (ymax - ymin) * 0.08; ymax += pad; if (ymin < 0) ymin -= pad;\n  const L = 46, R = 8, T = 8, B = 22, X = v => L + (v - x.min) / (x.max - x.min) * (W - L - R), Y = v => T + (ymax - v) / (ymax - ymin) * (Hh - T - B);\n  g.strokeStyle = '#111'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(L, T); g.lineTo(L, Hh - B); g.lineTo(W - R, Hh - B); g.stroke();\n  if (ymin < 0){ g.strokeStyle = '#999'; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(W - R, Y(0)); g.stroke(); g.setLineDash([]);\n    if (dv.negNote){ g.fillStyle = 'rgba(196,58,0,0.08)'; g.fillRect(L, Y(0), W - R - L, Hh - B - Y(0)); g.fillStyle = '#c43a00'; g.font = '600 10px \"Space Grotesk\",sans-serif'; g.textAlign = 'left'; g.fillText(dv.negNote, L + 4, Hh - B - 4); } }\n  g.font = '500 10px \"IBM Plex Mono\",monospace'; g.fillStyle = '#4a4a4a'; g.textAlign = 'right';\n  g.fillText(fplain(ymax), L - 4, T + 8); g.fillText(fplain(ymin < 0 ? ymin : 0), L - 4, Hh - B); if (ymin < 0) g.fillText('0', L - 4, Y(0) + 3);\n  g.textAlign = 'center'; g.fillText(fplain(x.min), L, Hh - 8); g.fillText(fplain(x.max), W - R - 10, Hh - 8);\n  g.fillText((x.symText || x.id) + (x.unit ? ' (' + x.unit + ')' : ''), (L + W) / 2, Hh - 8);\n  g.save(); g.translate(10, (T + Hh - B) / 2); g.rotate(-PI / 2); g.textAlign = 'center'; g.fillText(dv.short + (dv.unit ? ' (' + dv.unit + ')' : ''), 0, 0); g.restore();\n  const line = (arr, col, dash) => { g.strokeStyle = col; g.lineWidth = 2.2; g.setLineDash(dash || []); g.beginPath(); let on = false; arr.forEach((y, i) => { if (!isFinite(y)){ on = false; return; } const px = X(xs[i]), py = Math.max(T - 4, Math.min(Hh - B + 4, Y(y))); on ? g.lineTo(px, py) : g.moveTo(px, py); on = true; }); g.stroke(); g.setLineDash([]); };\n  if (ref){ line(rs, '#4a4a4a', [5, 4]); g.fillStyle = '#4a4a4a'; g.textAlign = 'right'; g.font = '600 10px \"Space Grotesk\",sans-serif'; const lastY = rs.filter(isFinite).pop(); if (isFinite(lastY)) g.fillText(ref.short, W - R - 2, Math.max(T + 9, Y(lastY) - 4)); }\n  line(ys, '#1546d6');\n  const cx = S.v[S.gx], cy = dv.f(S.d);\n  if (isFinite(cy)){ g.strokeStyle = '#ff6a2b'; g.setLineDash([2, 3]); g.lineWidth = 1; g.beginPath(); g.moveTo(X(cx), Hh - B); g.lineTo(X(cx), Y(cy)); g.lineTo(L, Y(cy)); g.stroke(); g.setLineDash([]);\n    g.fillStyle = '#ff6a2b'; g.strokeStyle = '#111'; g.lineWidth = 1.5; g.beginPath(); g.arc(X(cx), Math.max(T, Math.min(Hh - B, Y(cy))), 4.5, 0, 7); g.fill(); g.stroke(); }\n  // doubling readout\n  const d2 = calcWith({ [S.gx]: cx * 2 }), y1 = dv.f(S.d), y2 = dv.f(d2);\n  let msg = '';\n  if (cx === 0 || Math.abs(y1) < 1e-12) msg = '<span class=\"hint\">Move off zero to see the ×2 test.<\/span>';\n  else if (!isFinite(y1) || !isFinite(y2)) msg = '<span class=\"hint\">The ×2 test doesn’t apply here (doubling takes it outside what this quantity covers).<\/span>';\n  else {\n    const k = y2 / y1;\n    if (k < 0){ $('dbl').innerHTML = 'If <b>' + x.sym + '<\/b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '<\/b> goes from ' + fnum(y1) + ' to ' + fnum(y2) + (dv.unit ? ' ' + dv.unit : '') + ': it changes sign, so that can’t really happen.'; return; }\n    const tags = [[1, 'doesn’t depend on it'], [2, 'proportional'], [4, 'goes as the square'], [0.5, 'inversely proportional'], [0.25, 'inverse square'], [Math.SQRT2, 'goes as the square root'], [Math.SQRT1_2, 'goes as 1/√'], [8, 'goes as the cube'], [2 * Math.SQRT2, 'goes as the 3/2 power']];\n    const tag = tags.find(([v]) => Math.abs(k - v) < 0.004 * v);\n    msg = 'If <b>' + x.sym + '<\/b> doubles (' + fnum(cx) + ' → ' + fnum(2 * cx) + (x.unit ? ' ' + x.unit : '') + '), <b>' + dv.sym + '<\/b> becomes <b>×' + (Math.abs(k) >= 100 ? fnum(k) : k.toFixed(2)) + '<\/b>' + (tag ? ' — ' + tag[1] : '') + '.' + (dv.dblNote ? ' <span class=\"hint\">' + dv.dblNote + '<\/span>' : '');\n  }\n  $('dbl').innerHTML = msg;\n}\n\n// drawing helpers (canvas is drawn in 600×330 units)\nconst cv = $('cv'), ctx = cv.getContext('2d');\nfunction arrow(x1, y1, x2, y2, col, label, opts){\n  opts = opts || {}; const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy); if (len < 2) return;\n  const ux = dx / len, uy = dy / len, hw = opts.head || 9;\n  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = opts.w || 3.5; ctx.lineCap = 'round';\n  if (opts.dash) ctx.setLineDash(opts.dash);\n  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hw * 0.8, y2 - uy * hw * 0.8); ctx.stroke(); ctx.setLineDash([]);\n  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - ux * hw - uy * hw * 0.55, y2 - uy * hw + ux * hw * 0.55); ctx.lineTo(x2 - ux * hw + uy * hw * 0.55, y2 - uy * hw - ux * hw * 0.55); ctx.closePath(); ctx.fill();\n  if (label){ ctx.font = '700 13px \"Space Grotesk\",sans-serif'; ctx.textAlign = opts.align || 'left'; ctx.textBaseline = 'middle';\n    const lx = x2 + (opts.lx !== undefined ? opts.lx : (ux >= 0 ? 6 : -6)), ly = y2 + (opts.ly !== undefined ? opts.ly : (uy >= 0 ? 10 : -10));\n    if (opts.align === undefined) ctx.textAlign = ux >= -0.2 ? 'left' : 'right';\n    ctx.fillText(label, lx, ly); }\n  ctx.restore();\n}\nfunction text(s, x, y, o){ o = o || {}; ctx.save(); ctx.font = (o.font || '600 13px \"Space Grotesk\",sans-serif'); ctx.fillStyle = o.col || '#111'; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic'; ctx.fillText(s, x, y); ctx.restore(); }\nfunction panelTitle(s, x, y){ text(s, x, y, { font: '700 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); }\nconst COL = { F: '#c43a00', W: '#111', N: '#1e7d45', V: '#1546d6', T: '#7a3fb0', comp: '#8a8a8a' };\n\nlet last = 0;\nfunction loop(ts){ const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts; S.t += dt;\n  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, 600, 330);\n  SIM.draw(S.v, S.d, S.mode, S.opt, S.t, dt, S.anim); S.anim.reset = false;\n  requestAnimationFrame(loop); }\n\n// ---------------- this sim ----------------\n// Box on a Truck: static vs kinetic friction, and when you can (and can't) treat two objects as one system.\nconst SIM = {\n  title: 'Box on a Truck',\n  modes: [{ id: 'speed', label: 'Speeding up' }, { id: 'const', label: 'Constant speed' }, { id: 'brake', label: 'Braking' }],\n  ivs(mode){\n    const l = [];\n    if (mode === 'const') l.push({ id: 'v', sym: 'v', symText: 'v', label: 'Truck speed', unit: 'm/s', min: 0, max: 30, step: 0.5, val: 20, graph: true });\n    else l.push({ id: 'a', sym: 'a', symText: 'a', label: mode === 'brake' ? 'Truck’s braking (slowing) rate' : 'Truck’s acceleration', unit: 'm/s²', min: 0, max: 8, step: 0.1, val: 2, graph: true });\n    l.push({ id: 'm', sym: 'm', symText: 'm', label: 'Box mass', unit: 'kg', min: 5, max: 100, step: 1, val: 40 },\n      { id: 'mus', sym: 'μ<sub>s<\/sub>', symText: 'μs', label: 'Static friction', unit: '', min: 0, max: 1, step: 0.01, val: 0.4, show: v => v.toFixed(2) },\n      { id: 'muk', sym: 'μ<sub>k<\/sub>', symText: 'μk', label: 'Kinetic friction', unit: '', min: 0, max: 1, step: 0.01, val: 0.3, show: v => v.toFixed(2) },\n      { id: 'M', sym: 'M', symText: 'M', label: 'Truck mass', unit: 'kg', min: 1000, max: 4000, step: 50, val: 2000 });\n    return l;\n  },\n  presets: [{ label: 'Gentle', v: { a: 1 } }, { label: 'Just about to slip', v: { a: 4, mus: 0.4 } }, { label: 'Floor it', v: { a: 6 } }, { label: 'Icy bed', v: { mus: 0.1, muk: 0.05 } }],\n  calc(v, mode){\n    const at = mode === 'speed' ? v.a : mode === 'brake' ? -v.a : 0, dir = Math.sign(at);\n    const W = v.m * G10, N = W, fmax = v.mus * N, need = v.m * Math.abs(at), mukE = Math.min(v.muk, v.mus);\n    const sticks = need <= fmax + 1e-9;\n    let f, abox;\n    if (sticks){ f = v.m * at; abox = at; } else { f = dir * mukE * N; abox = f / v.m; }\n    const arel = abox - at, dEdge = 1.2, tSlide = sticks ? Infinity : Math.sqrt(2 * dEdge / Math.abs(arel));\n    const Froad = sticks ? (v.M + v.m) * at : v.M * at + f;\n    return { at, dir, W, N, fmax, need, f, abox, arel, sticks, tSlide, dEdge, Froad, amax: v.mus * G10, mukE, mukBad: v.muk > v.mus };\n  },\n  dvs(mode){\n    if (mode === 'const') return [\n      { id: 'f', name: 'Friction on the box', short: 'f', sym: 'f', unit: 'N', f: d => Math.abs(d.f), vs: 'fmax' },\n      { id: 'fmax', name: 'Max static friction μ_s mg', short: 'f_s,max', sym: 'f<sub>s,max<\/sub>', unit: 'N', f: d => d.fmax },\n      { id: 'N', name: 'Normal force on the box', short: 'N', sym: 'N', unit: 'N', f: d => d.N }];\n    return [\n      { id: 'f', name: 'Friction on the box', short: 'f', sym: 'f', unit: 'N', f: d => Math.abs(d.f), vs: 'fmax' },\n      { id: 'abox', name: 'Box’s acceleration (ground frame)', short: 'a_box', sym: 'a<sub>box<\/sub>', unit: 'm/s²', f: d => Math.abs(d.abox) },\n      { id: 'arel', name: 'Box slipping (relative to the truck)', short: 'a_rel', sym: 'a<sub>rel<\/sub>', unit: 'm/s²', f: d => Math.abs(d.arel) },\n      { id: 'Froad', name: 'Road force on the truck', short: 'F_road', sym: 'F<sub>road<\/sub>', unit: 'N', f: d => Math.abs(d.Froad) },\n      { id: 'fmax', name: 'Max static friction μ_s mg', short: 'f_s,max', sym: 'f<sub>s,max<\/sub>', unit: 'N', f: d => d.fmax }];\n  },\n  work(v, d, mode){\n    const fwd = mode === 'speed' ? 'forward' : 'backward', end = mode === 'speed' ? 'tailgate' : 'cab';\n    let h = '<h4>1 · Free-body diagram of the box<\/h4><div class=\"eq\">Weight mg down, normal force N up, and friction from the truck bed. Friction is the <b>only<\/b> horizontal force on the box.<\/div>' +\n      '<div class=\"eq\">Vertical: N = mg = (' + H.iv('m') + ')(' + H.g() + ') = ' + H.n(d.N, 'N') + '<\/div>';\n    if (mode === 'const') return h +\n      '<h4>2 · Constant velocity → a = 0 → ΣF = 0<\/h4><div class=\"eq\">The only horizontal force is friction, so f = <b>0 N<\/b>, whether the truck goes ' + H.iv('v') + ' or 0 m/s.<\/div>' +\n      '<p class=\"note\">Common mistake: “friction pushes the box forward to keep it moving.” Newton’s 1st law: nothing is needed to <i>keep<\/i> it moving at constant velocity.<\/p>' +\n      '<h4>3 · Whole system (truck + box)<\/h4><div class=\"eq\">ΣF = (M + m)(0) = 0. The road’s push forward on the tires just balances air resistance and rolling friction (ignored here).<\/div>' +\n      '<h4>4 · How far could the truck accelerate before the box slips?<\/h4><div class=\"eq\">a<sub>max<\/sub> = μ<sub>s<\/sub>g = (' + H.iv('mus') + ')(' + H.g() + ') = ' + H.n(d.amax, 'm/s²') + '. Try “Speeding up.”<\/div>';\n    h += '<h4>2 · Friction needed for the box to keep up with the truck<\/h4><div class=\"eq\">f = ma = (' + H.iv('m') + ')(' + H.iv('a') + ') = <b>' + H.n(d.need, 'N') + '<\/b>, pointing <b>' + fwd + '<\/b> (the same way the truck accelerates)<\/div>' +\n      '<h4>3 · The most static friction can give<\/h4><div class=\"eq\">f<sub>s,max<\/sub> = μ<sub>s<\/sub>N = (' + H.iv('mus') + ')(' + H.n(d.N, 'N') + ') = <b>' + H.n(d.fmax, 'N') + '<\/b><\/div>' +\n      '<h4>4 · Compare<\/h4>';\n    if (d.sticks) h += '<div class=\"eq\">' + H.n(d.need, 'N') + ' ≤ ' + H.n(d.fmax, 'N') + ' → static friction can do it. The box <b>moves with the truck<\/b>: a<sub>box<\/sub> = ' + H.n(Math.abs(d.at), 'm/s²') + ', f = ' + H.n(d.need, 'N') + ' (not μ<sub>s<\/sub>N!)<\/div>' +\n      '<p class=\"note\">Static friction is only as big as it needs to be. μ<sub>s<\/sub>N is the <i>limit<\/i>, not the value.<\/p>';\n    else h += '<div class=\"bad\">' + H.n(d.need, 'N') + ' > ' + H.n(d.fmax, 'N') + ' → static friction can’t keep up. The box <b>slides<\/b> toward the ' + end + '.<\/div>' +\n      '<div class=\"eq\">Now it’s kinetic: f<sub>k<\/sub> = μ<sub>k<\/sub>N = (' + H.iv('muk') + ')(' + H.n(d.N, 'N') + ') = ' + H.n(Math.abs(d.f), 'N') + '<\/div>' +\n      (d.mukBad ? '<p class=\"note\">μ<sub>k<\/sub> is set above μ<sub>s<\/sub>, which real surfaces don’t do. Using μ<sub>k<\/sub> = μ<sub>s<\/sub>.<\/p>' : '') +\n      '<div class=\"eq\">a<sub>box<\/sub> = f<sub>k<\/sub>/m = μ<sub>k<\/sub>g = <b>' + H.n(Math.abs(d.abox), 'm/s²') + '<\/b> ' + fwd + ' (ground frame): it still speeds ' + (mode === 'speed' ? 'up' : 'down') + ', just less than the truck<\/div>' +\n      '<div class=\"eq\">Relative to the truck: a<sub>rel<\/sub> = ' + H.n(Math.abs(d.at)) + ' − ' + H.n(Math.abs(d.abox)) + ' = ' + H.n(Math.abs(d.arel), 'm/s²') + ' toward the ' + end + '. It reaches it (' + H.n(d.dEdge, 'm') + ' away) after t = √(2d/a<sub>rel<\/sub>) = ' + H.n(d.tSlide, 's') + '<\/div>';\n    h += '<div class=\"eq\">Biggest acceleration with no slipping: a<sub>max<\/sub> = μ<sub>s<\/sub>mg/m = μ<sub>s<\/sub>g = ' + H.n(d.amax, 'm/s²') + ' (the mass cancels)<\/div>' +\n      '<h4>5 · The system: truck + box<\/h4>';\n    if (d.sticks) h += '<div class=\"eq\">Same acceleration, so treat them as one object. Friction between them is internal and cancels.<\/div>' +\n      '<div class=\"eq\">F<sub>road<\/sub> = (M + m)a = (' + H.iv('M') + ' + ' + H.iv('m') + ')(' + H.iv('a') + ') = <b>' + H.n(Math.abs(d.Froad), 'N') + '<\/b> ' + fwd + '<\/div>';\n    else h += '<div class=\"eq\">Different accelerations, so you <b>can’t<\/b> use (M + m)a. Do the truck by itself instead:<\/div>' +\n      '<div class=\"eq\">F<sub>road<\/sub> − f = Ma → F<sub>road<\/sub> = Ma + f = (' + H.iv('M') + ')(' + H.iv('a') + ') + ' + H.n(Math.abs(d.f)) + ' = <b>' + H.n(Math.abs(d.Froad), 'N') + '<\/b> ' + fwd + '<\/div>';\n    h += '<h4>6 · Newton’s third law<\/h4><div class=\"eq\">The bed pushes the box ' + fwd + ' with ' + H.n(Math.abs(d.f), 'N') + '; the box pushes the bed ' + (mode === 'speed' ? 'backward' : 'forward') + ' with ' + H.n(Math.abs(d.f), 'N') + '.<\/div>';\n    return h;\n  },\n  draw(v, d, mode, opt, t, dt, A){\n    panelTitle(mode === 'speed' ? 'TRUCK SPEEDING UP →' : mode === 'brake' ? 'TRUCK BRAKING (moving →)' : 'TRUCK AT CONSTANT SPEED →', 10, 18);\n    if (A.t === undefined || A.reset) A.t = 0; A.t += dt;\n    const px = 60, x0 = 40, bedL = 3, bedY = 196, roadY = 262, wr = 16;\n    const bs = 22 + 3 * Math.sqrt(v.m), hb = bs / 2 / px;            // box size (px) and half-size (m)\n    const T = d.sticks ? 4 : Math.min(d.tSlide, 6) + 2.2, tt = A.t % T;\n    const v0 = mode === 'speed' ? 2 : mode === 'brake' ? Math.max(12, v.a * T + 1) : v.v;\n    const xt = v0 * tt + 0.5 * d.at * tt * tt, vt = v0 + d.at * tt;  // truck position and speed (ground)\n    // box position relative to the bed centre (m)\n    const start = mode === 'brake' ? bedL / 2 - d.dEdge - hb : -bedL / 2 + d.dEdge + hb;\n    let xr = start, yOff = 0, rot = 0, off = false, hit = false;\n    if (!d.sticks){\n      const ts = Math.min(tt, d.tSlide); xr = start + 0.5 * d.arel * ts * ts;\n      if (tt > d.tSlide){\n        if (mode === 'brake'){ xr = bedL / 2 - hb; hit = true; }                     // against the cab\n        else { const u = tt - d.tSlide, vrel = d.arel * d.tSlide;      // off the back: no more friction, falls\n          xr = start + 0.5 * d.arel * d.tSlide * d.tSlide + vrel * u - 0.5 * d.at * u * u; yOff = Math.min(0.5 * G10 * u * u * px, roadY - bedY); rot = Math.min(u * 4, 1.2); off = true; }\n      }\n    }\n    // road with moving dashes\n    ctx.fillStyle = '#d6d6d6'; ctx.fillRect(0, roadY, 380, 26); ctx.fillStyle = '#fff';\n    const sp = 150, sh = ((xt * px) % sp + sp) % sp; for (let x = -sp; x < 420; x += sp) ctx.fillRect(x - sh, roadY + 11, 60, 4);\n    // truck\n    const bx0 = x0, bx1 = x0 + bedL * px, cab1 = bx1 + 70;\n    ctx.fillStyle = '#333'; ctx.fillRect(bx0, bedY + 14, cab1 - bx0, 14);\n    ctx.fillStyle = '#9aa7b8'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.fillRect(bx0, bedY, bx1 - bx0, 14); ctx.strokeRect(bx0, bedY, bx1 - bx0, 14);\n    ctx.fillStyle = '#1546d6'; ctx.beginPath(); ctx.moveTo(bx1, bedY + 14); ctx.lineTo(bx1, bedY - 60); ctx.lineTo(bx1 + 42, bedY - 60); ctx.lineTo(cab1, bedY - 22); ctx.lineTo(cab1, bedY + 14); ctx.closePath(); ctx.fill(); ctx.stroke();\n    ctx.fillStyle = '#cfe0ff'; ctx.beginPath(); ctx.moveTo(bx1 + 8, bedY - 52); ctx.lineTo(bx1 + 38, bedY - 52); ctx.lineTo(cab1 - 8, bedY - 24); ctx.lineTo(bx1 + 8, bedY - 24); ctx.closePath(); ctx.fill();\n    ctx.fillStyle = '#9aa7b8'; ctx.fillRect(bx1 - 4, bedY - 26, 4, 26);   // bed front wall\n    [bx0 + 40, bx1 - 40, cab1 - 30].forEach(wx => { ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(wx, roadY - wr, wr, 0, 7); ctx.fill(); ctx.fillStyle = '#bbb'; ctx.beginPath(); ctx.arc(wx, roadY - wr, 6, 0, 7); ctx.fill();\n      const an = xt / 0.4; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(wx, roadY - wr); ctx.lineTo(wx + 12 * Math.cos(an), roadY - wr + 12 * Math.sin(an)); ctx.stroke(); });\n    // box\n    const bcx = bx0 + bedL * px / 2 + xr * px, bcy = bedY - bs / 2 + yOff;\n    if (bcx > -60){ ctx.save(); ctx.translate(bcx, bcy); ctx.rotate(-rot); ctx.fillStyle = '#ff6a2b'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.fillRect(-bs / 2, -bs / 2, bs, bs); ctx.strokeRect(-bs / 2, -bs / 2, bs, bs); ctx.restore(); }\n    // arrows\n    if (d.at !== 0) arrow(cab1 - 40, bedY - 78, cab1 - 40 + d.at * 9, bedY - 78, COL.V, 'a_truck', { w: 3, lx: 0, ly: -12, align: 'center' });\n    if (!off && !hit && Math.abs(d.f) > 0.01){\n      const fl = 14 + 40 * Math.abs(d.f) / Math.max(d.fmax, d.need, 1);\n      arrow(bcx, bedY - 3, bcx + Math.sign(d.f) * fl, bedY - 3, COL.F, d.sticks ? 'f_s' : 'f_k', { w: 3, lx: Math.sign(d.f) * 4, ly: -9 });\n      if (Math.abs(d.abox) > 0.01) arrow(bcx, bcy - bs / 2 - 12, bcx + d.abox * 9, bcy - bs / 2 - 12, COL.V, 'a_box', { w: 2.5, lx: 0, ly: -11, align: 'center' });\n    }\n    const msg = mode === 'const' ? 'box rides along: no friction needed' : d.sticks ? 'box moves with the truck (static friction)' : mode === 'speed' ? 'box slides toward the tailgate (kinetic)' : 'box slides into the cab (kinetic)';\n    text(msg, 12, 300, { font: '700 13px \"Space Grotesk\",sans-serif', col: d.sticks ? '#1e7d45' : '#c43a00' });\n    text('truck v = ' + fplain(Math.max(0, vt)) + ' m/s' + (off ? '   box fell off the back!' : hit ? '   box hit the cab' : ''), 12, 318, { font: '600 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n    // right: free-body diagram of the box and the friction comparison\n    panelTitle('FORCES ON THE BOX', 395, 18);\n    const fx = 490, fy = 120, s = 26, sc = 55 / Math.max(d.W, d.fmax, d.need, 1);\n    ctx.fillStyle = '#ff6a2b'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.fillRect(fx - s / 2, fy - s / 2, s, s); ctx.strokeRect(fx - s / 2, fy - s / 2, s, s);\n    arrow(fx, fy, fx, fy + d.W * sc + s / 2, COL.W, 'mg', { lx: 6, ly: 0 });\n    arrow(fx, fy, fx, fy - d.N * sc - s / 2, COL.N, 'N', { lx: 6, ly: 0 });\n    if (Math.abs(d.f) > 0.01) arrow(fx + Math.sign(d.f) * s / 2, fy + s / 2, fx + Math.sign(d.f) * (s / 2 + Math.abs(d.f) * sc), fy + s / 2, COL.F, 'f', { lx: Math.sign(d.f) * 6, ly: 0 });\n    // bars: friction needed vs available\n    const by = 228, bmax = Math.max(d.fmax, d.need, 1), bw = 95;\n    const bar = (y, val, col, lab) => { ctx.fillStyle = col; ctx.fillRect(458, y, bw * val / bmax, 13); text(lab, 453, y + 10, { align: 'right', font: '600 10px \"IBM Plex Mono\",monospace', col: '#4a4a4a' }); text(fplain(val) + ' N', 462 + bw * val / bmax, y + 10, { font: '600 10px \"IBM Plex Mono\",monospace' }); };\n    bar(by, d.need, d.sticks ? '#1e7d45' : '#c43a00', 'needed ma');\n    bar(by + 20, d.fmax, '#8a8a8a', 'max μs·N');\n    if (!d.sticks) bar(by + 40, Math.abs(d.f), COL.F, 'kinetic μk·N');\n    text('F_road on truck: ' + fplain(Math.abs(d.Froad)) + ' N', 395, 318, { font: '600 11px \"IBM Plex Mono\",monospace', col: '#4a4a4a' });\n  }\n};\n\n\nS.mode = SIM.modes ? SIM.modes[0].id : 'one';\nsetup(); requestAnimationFrame(loop);\n<\/script>\n<\/body><\/html>\n"}
};
(function(){
  const $ = id => document.getElementById(id);
  const tabsEl = $('tabs'), frame = $('frame');
  let cur = -1, ifr = null, ifrSim = null;
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  if (REVIEW_URL && /^P1-/.test(UNIT.id)) {
    const u = REVIEW_URL + (REVIEW_URL.includes('?') ? '&' : '?') + 'unit=' + encodeURIComponent(UNIT.id);
    const rev = $('review'); rev.hidden = false; $('ropen').href = u;
    let loaded = false; const load = () => { if (loaded) return; loaded = true; $('rframe').innerHTML = '<iframe title="Practice questions" src="' + u + '"></iframe>'; };
    [$('cta'), $('plink')].forEach(a => { a.href = '#review'; a.removeAttribute('target'); a.addEventListener('click', e => { e.preventDefault(); load(); rev.scrollIntoView({ behavior: 'smooth' }); }); });
    if ('IntersectionObserver' in window) new IntersectionObserver((es, o) => { if (es.some(x => x.isIntersecting)) { load(); o.disconnect(); } }, { rootMargin: '200px' }).observe(rev);
    else load();
  }
  else { $('cta').hidden = true; $('plink').hidden = true; }
  UNIT.tabs.forEach((t, i) => {
    if (t.gapBefore) { const g = document.createElement('span'); g.className = 'gap'; g.setAttribute('aria-hidden','true'); tabsEl.appendChild(g); }
    const b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.setAttribute('role','tab'); b.id = 'tab-' + slug(t.name);
    b.innerHTML = (t.code ? '<span class="code">' + t.code + '</span>' : '') + t.name;
    b.onclick = () => show(i, true);
    tabsEl.appendChild(b);
  });
  function show(i, user) {
    const t = UNIT.tabs[i]; if (!t) return; cur = i;
    [...tabsEl.querySelectorAll('.tab')].forEach((b, j) => b.setAttribute('aria-selected', String(j === i)));
    $('simname').textContent = t.name;
    $('tasks').innerHTML = t.tasks.map(x => '<li>' + x + '</li>').join('');
    $('note').hidden = !t.note; $('note').innerHTML = t.note || '';
    const s = SIMS[t.sim];
    frame.style.aspectRatio = s.ar;
    if (ifrSim !== t.sim) {
      frame.innerHTML = '<div class="loading">Loading…</div>';
      ifr = document.createElement('iframe'); ifrSim = t.sim;
      ifr.title = t.name; ifr.setAttribute('allow', 'fullscreen'); ifr.setAttribute('allowfullscreen', '');
      ifr.addEventListener('load', () => { ifr.dataset.ready = '1'; const l = frame.querySelector('.loading'); if (l) l.remove(); select(); });
      ifr.srcdoc = s.html; frame.appendChild(ifr);
    } else select();
    if (user) { try { history.replaceState(null, '', '#' + slug(t.name)); } catch (e) {} }
  }
  function select() {
    const t = UNIT.tabs[cur];
    if (ifr && ifr.dataset.ready && t.select) ifr.contentWindow.postMessage({ select: t.select }, '*');
  }
  $('fs').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (frame.requestFullscreen) frame.requestFullscreen().catch(() => {});
  };
  if (!document.fullscreenEnabled) $('fs').hidden = true;
  document.addEventListener('fullscreenchange', () => { $('fs').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });
  const h = location.hash.slice(1); let start = UNIT.tabs.findIndex(t => slug(t.name) === h);
  show(start < 0 ? 0 : start, false);
  window.HOLMES = { show, unit: UNIT };
})();
